ine x1=\"90\" y1=\"180\" x2=\"90\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"140\" y1=\"180\" x2=\"140\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"190\" y1=\"180\" x2=\"190\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"240\" y1=\"180\" x2=\"240\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"290\" y1=\"180\" x2=\"290\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"340\" y1=\"180\" x2=\"340\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"390\" y1=\"180\" x2=\"390\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"440\" y1=\"180\" x2=\"440\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"180\" x2=\"440\" y2=\"180\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"130\" x2=\"440\" y2=\"130\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"80\" x2=\"440\" y2=\"80\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"30\" x2=\"440\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"25\" y1=\"180\" x2=\"450\" y2=\"180\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f6-m0)\"/>\n<line x1=\"40\" y1=\"195\" x2=\"40\" y2=\"20\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f6-m0)\"/>\n<text x=\"446\" y=\"198\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"48\" y=\"28\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"26\" y=\"196\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"40,180 140,180 140,80 40,80\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/>\n<text x=\"70\" y=\"130\" font-size=\"15\" fill=\"#2f6fb5\">S<\/text>\n<polygon points=\"240,180 340,180 440,80 340,80\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/>\n<text x=\"320\" y=\"130\" font-size=\"15\" fill=\"#d9772b\">S'<\/text>\n<polygon points=\"240,180 340,180 340,80 240,80\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n<line x1=\"340\" y1=\"67.5\" x2=\"435\" y2=\"67.5\" stroke=\"#c2410c\" stroke-width=\"1.4\" marker-end=\"url(#M9-f6-m1)\"/>\n<text x=\"350\" y=\"59\" font-size=\"12\" fill=\"#c2410c\">y=2 的點右移 2<\/text>\n\n<\/svg><figcaption>圖 M9-7　正方形 S 經 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{bmatrix}<\/span> 推移成平行四邊形 S'：底與高不變，面積不變（右圖平移至旁邊以便比較）<\/figcaption><\/figure>\n<ul>\n<li>行列式為 <span class=\"m\">1<\/span>：<span class=\"box\">面積不變、方向不變<\/span>，但長度、角度改變。<\/li>\n<li>沿 <span class=\"m\">x<\/span> 軸方向的推移把水平線 <span class=\"m\">y=c<\/span> 映成自身（整條平移 <span class=\"m\">kc<\/span>），把鉛直線映成斜線。<\/li>\n<li>反變換為 <span class=\"m\">\\begin{bmatrix}1 &amp; -k\\\\ 0 &amp; 1\\end{bmatrix}<\/span>；<span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}^n=\\begin{bmatrix}1 &amp; nk\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li>\n<\/ul>\n<div class=\"warn\"><p>推移矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span> 是「沿 <span class=\"m\">x<\/span> 軸方向」：<span class=\"m\">k<\/span> 在第一列，改變的是 <span class=\"m\">x<\/span> 坐標。<em>與沿 <span class=\"m\">y<\/span> 軸方向的 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ k &amp; 1\\end{bmatrix}<\/span> 混淆<\/em>是常見錯誤；以 <span class=\"m\">(0,1)<\/span> 的像判斷最快。<\/p><\/div>\n<h4>2. 投影（正射影）<\/h4>\n<p>把每一點 <span class=\"m\">P<\/span> 映到它在過原點直線 <span class=\"m\">L<\/span> 上的正射影 <span class=\"m\">Q<\/span>（<span class=\"m\">\\overline{PQ}\\perp L<\/span>）的變換，稱為<strong>投影到 <span class=\"m\">L<\/span><\/strong>。設 <span class=\"m\">L<\/span> 的單位方向向量 <span class=\"m\">\\vec{u}=(\\cos\\theta,\\sin\\theta)<\/span>，由第三冊 A 正射影公式 <span class=\"m\">Q=(\\vec{u}\\cdot\\overrightarrow{OP})\\vec{u}<\/span>：<\/p>\n<div class=\"mb\">Q=(x\\cos\\theta+y\\sin\\theta)(\\cos\\theta,\\sin\\theta)=(x\\cos^2\\theta+y\\sin\\theta\\cos\\theta,\\ x\\sin\\theta\\cos\\theta+y\\sin^2\\theta)<\/div>\n<div class=\"formula\" data-t=\"投影到過原點直線\"><div class=\"mb\">P_\\theta=\\begin{bmatrix}\\cos^2\\theta &amp; \\sin\\theta\\cos\\theta\\\\ \\sin\\theta\\cos\\theta &amp; \\sin^2\\theta\\end{bmatrix},\\qquad L\\text{ 方向 }(p,q):\\ P=\\dfrac{1}{p^2+q^2}\\begin{bmatrix}p^2 &amp; pq\\\\ pq &amp; q^2\\end{bmatrix}<\/div><p>特例：投影到 <span class=\"m\">x<\/span> 軸 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>；投影到 <span class=\"m\">y<\/span> 軸 <span class=\"m\">\\begin{bmatrix}0 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/p><\/div>\n<div class=\"key\"><p><strong>投影的性質<\/strong><\/p><ol>\n<li><span class=\"m\">\\det P_\\theta=\\cos^2\\theta\\sin^2\\theta-\\sin^2\\theta\\cos^2\\theta=0<\/span>：平面被壓成直線 <span class=\"m\">L<\/span>，<span class=\"circle\">沒有反變換<\/span>。<\/li>\n<li><span class=\"m\">P^2=P<\/span>：投影兩次與投影一次相同。<\/li>\n<li>與 <span class=\"m\">L<\/span> 垂直的直線上每一點都映到同一點（多對一）。<\/li>\n<li><span class=\"box\"><span class=\"m\">M_\\theta=2P_\\theta-I<\/span><\/span>：鏡射點 <span class=\"m\">P'<\/span> 滿足 <span class=\"m\">Q<\/span> 為 <span class=\"m\">\\overline{PP'}<\/span> 中點，故 <span class=\"m\">P'=2Q-P<\/span>。<\/li>\n<\/ol><\/div>\n<p>性質 4 可由倍角公式驗證：<span class=\"m\">2\\cos^2\\theta-1=\\cos2\\theta<\/span>，<span class=\"m\">2\\sin\\theta\\cos\\theta=\\sin2\\theta<\/span>，<span class=\"m\">2\\sin^2\\theta-1=-\\cos2\\theta<\/span>。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 380 280\" width=\"380\"><defs><marker id=\"M9-f7-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f7-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><marker id=\"M9-f7-m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><marker id=\"M9-f7-m3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#d9772b\"/><\/marker><\/defs>\n<line x1=\"60\" y1=\"240\" x2=\"60\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"102\" y1=\"240\" x2=\"102\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"144\" y1=\"240\" x2=\"144\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"186\" y1=\"240\" x2=\"186\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"228\" y1=\"240\" x2=\"228\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"270\" y1=\"240\" x2=\"270\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"312\" y1=\"240\" x2=\"312\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"354\" y1=\"240\" x2=\"354\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"240\" x2=\"354\" y2=\"240\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"198\" x2=\"354\" y2=\"198\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"156\" x2=\"354\" y2=\"156\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"114\" x2=\"354\" y2=\"114\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"72\" x2=\"354\" y2=\"72\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"39\" y1=\"240\" x2=\"375\" y2=\"240\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f7-m0)\"/>\n<line x1=\"60\" y1=\"261\" x2=\"60\" y2=\"17.4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f7-m0)\"/>\n<text x=\"371\" y=\"258\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"68\" y=\"25.4\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"46\" y=\"256\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"43.2\" y1=\"248.4\" x2=\"345.6\" y2=\"97.2\" stroke=\"#7a5cc2\" stroke-width=\"1.6\"/>\n<text x=\"267.2\" y=\"91.4\" font-size=\"13\" fill=\"#7a5cc2\">L：x − 2y = 0<\/text>\n<line x1=\"60\" y1=\"240\" x2=\"186\" y2=\"72\" stroke=\"#2f6fb5\" stroke-width=\"1.8\" marker-end=\"url(#M9-f7-m1)\"/>\n<line x1=\"60\" y1=\"240\" x2=\"228\" y2=\"156\" stroke=\"#2e8b57\" stroke-width=\"2.2\" marker-end=\"url(#M9-f7-m2)\"/>\n<line x1=\"60\" y1=\"240\" x2=\"270\" y2=\"240\" stroke=\"#d9772b\" stroke-width=\"1.8\" marker-end=\"url(#M9-f7-m3)\"/>\n<line x1=\"186\" y1=\"72\" x2=\"270\" y2=\"240\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"186\" cy=\"72\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"192\" y=\"66\" font-size=\"14\" fill=\"#2f6fb5\">P(3,4)<\/text>\n<circle cx=\"228\" cy=\"156\" r=\"3.2\" fill=\"#2e8b57\"/>\n<text x=\"236\" y=\"152\" font-size=\"14\" fill=\"#2e8b57\">Q(4,2)<\/text>\n<circle cx=\"270\" cy=\"240\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"262\" y=\"258\" font-size=\"14\" fill=\"#d9772b\">P'(5,0)<\/text>\n<polyline points=\"214.9,162.6 208.3,149.4 221.4,142.9\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.1\"/>\n<\/svg><figcaption>圖 M9-8　P(3,4) 投影到 L：x − 2y = 0 得 Q(4,2)，對 L 鏡射得 P'(5,0)；Q 為 PP' 中點（數據同例題 7）<\/figcaption><\/figure>\n<div class=\"exam\"><p>學測常見陷阱：「投影矩陣的行列式為 0」與「投影把直線映成直線」並列，後者<em>不一定成立<\/em>（與 <span class=\"m\">L<\/span> 垂直的直線被映成一點）。<\/p><\/div>\n<div class=\"note\"><p>五種基本變換的行列式：伸縮 <span class=\"m\">hk<\/span>、鏡射 <span class=\"m\">-1<\/span>、旋轉 <span class=\"m\">1<\/span>、推移 <span class=\"m\">1<\/span>、投影 <span class=\"m\">0<\/span>。<\/p><\/div>\n<table class=\"t\"><thead><tr><th>變換<\/th><th>矩陣<\/th><th>det<\/th><th>保長度<\/th><th>保面積<\/th><th>可逆<\/th><\/tr><\/thead><tbody>\n<tr><td>伸縮<\/td><td><span class=\"m\">\\begin{bmatrix}h &amp; 0\\\\ 0 &amp; k\\end{bmatrix}<\/span><\/td><td><span class=\"m\">hk<\/span><\/td><td>否（<span class=\"m\">h=k=1<\/span> 除外）<\/td><td><span class=\"m\">hk=1<\/span> 時<\/td><td>是<\/td><\/tr>\n<tr><td>鏡射<\/td><td><span class=\"m\">\\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix}<\/span><\/td><td><span class=\"m\">-1<\/span><\/td><td>是<\/td><td>是<\/td><td>是（自身）<\/td><\/tr>\n<tr><td>旋轉<\/td><td><span class=\"m\">\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix}<\/span><\/td><td><span class=\"m\">1<\/span><\/td><td>是<\/td><td>是<\/td><td>是（<span class=\"m\">R_{-\\theta}<\/span>）<\/td><\/tr>\n<tr><td>推移<\/td><td><span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span><\/td><td><span class=\"m\">1<\/span><\/td><td>否<\/td><td>是<\/td><td>是<\/td><\/tr>\n<tr><td>投影<\/td><td><span class=\"m\">\\begin{bmatrix}\\cos^2\\theta &amp; \\sin\\theta\\cos\\theta\\\\ \\sin\\theta\\cos\\theta &amp; \\sin^2\\theta\\end{bmatrix}<\/span><\/td><td><span class=\"m\">0<\/span><\/td><td>否<\/td><td>否<\/td><td>否<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"tip\"><p>深究　正交矩陣（進階）<\/p><p>保持長度的線性變換只有旋轉與鏡射兩類。其矩陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A^{T}A=I<\/span>，稱為<strong>正交矩陣<\/strong>：兩行都是單位向量且互相垂直。設第一行為 <span class=\"m\">(\\cos\\theta,\\sin\\theta)<\/span>，與之垂直的單位向量只有 <span class=\"m\">\\pm(-\\sin\\theta,\\cos\\theta)<\/span>：取正號得 <span class=\"m\">R_\\theta<\/span>（<span class=\"m\">\\det=1<\/span>），取負號得 <span class=\"m\">M_{\\theta/2}<\/span>（<span class=\"m\">\\det=-1<\/span>）。<\/p><\/div>","sims":[["lt",{"presets":["shear","proj"],"preset":"shear","title":"推移與投影"}]],"qs":["M9-05","M9-07","M9-22"]},{"t":"五、合成變換與矩陣乘法","h":"<h4>1. 合成的矩陣<\/h4>\n<p>先作 <span class=\"m\">T_1<\/span>（矩陣 <span class=\"m\">A<\/span>），再作 <span class=\"m\">T_2<\/span>（矩陣 <span class=\"m\">B<\/span>）：<\/p>\n<div class=\"mb\">P\\ \\xrightarrow{\\ A\\ }\\ AP\\ \\xrightarrow{\\ B\\ }\\ B(AP)=(BA)P<\/div>\n<div class=\"formula\" data-t=\"合成變換\"><div class=\"mb\">\\text{先 }A\\text{ 後 }B\\ \\Longleftrightarrow\\ BA<\/div><p>合成變換的矩陣是兩矩陣的乘積，<span class=\"circle\">後作用的寫在左邊<\/span>。三次合成「先 <span class=\"m\">A<\/span>、再 <span class=\"m\">B<\/span>、再 <span class=\"m\">C<\/span>」的矩陣為 <span class=\"m\">CBA<\/span>。<\/p><\/div>\n<div class=\"mnem\"><p>矩陣離點越近越先做：<span class=\"m\">CBA\\,P<\/span> 由右往左讀<\/p><\/div>\n<div class=\"warn\"><p>矩陣乘法不具交換律，「先旋轉再鏡射」與「先鏡射再旋轉」一般不同（見例題 8）。<em>寫成 <span class=\"m\">AB<\/span><\/em> 是最常見的錯誤；只有在兩者可交換時（如兩個旋轉、兩個對角矩陣）才不影響答案。<\/p><\/div>\n<h4>2. 常用合成結果<\/h4>\n<div class=\"key\"><ol>\n<li>兩旋轉：<span class=\"m\">R_\\beta R_\\alpha=R_{\\alpha+\\beta}<\/span>。<\/li>\n<li>兩鏡射：<span class=\"box\"><span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}<\/span><\/span>（先對 <span class=\"m\">L_\\alpha<\/span>、後對 <span class=\"m\">L_\\beta<\/span>），為旋轉，角度是兩鏡射軸夾角的兩倍。<\/li>\n<li>鏡射與旋轉：<span class=\"m\">M_\\alpha R_\\varphi=M_{\\alpha-\\varphi/2}<\/span>、<span class=\"m\">R_\\varphi M_\\alpha=M_{\\alpha+\\varphi/2}<\/span>，結果仍是鏡射。<\/li>\n<li>三次鏡射：<span class=\"m\">M_\\gamma M_\\beta M_\\alpha=M_{\\gamma-\\beta+\\alpha}<\/span>；特別地 <span class=\"m\">M_\\beta M_\\alpha M_\\beta=M_{2\\beta-\\alpha}<\/span>（把軸 <span class=\"m\">L_\\alpha<\/span> 對 <span class=\"m\">L_\\beta<\/span> 鏡射）。<\/li>\n<li>以行列式檢驗：鏡射個數為奇數時 <span class=\"m\">\\det=-1<\/span>，為偶數時 <span class=\"m\">\\det=1<\/span>。<\/li>\n<\/ol><\/div>\n<p>性質 2 的證明：<\/p>\n<div class=\"mb\">\\begin{aligned}M_\\beta M_\\alpha&amp;=\\begin{bmatrix}\\cos2\\beta &amp; \\sin2\\beta\\\\ \\sin2\\beta &amp; -\\cos2\\beta\\end{bmatrix}\\begin{bmatrix}\\cos2\\alpha &amp; \\sin2\\alpha\\\\ \\sin2\\alpha &amp; -\\cos2\\alpha\\end{bmatrix}\\\\ &amp;=\\begin{bmatrix}\\cos2\\beta\\cos2\\alpha+\\sin2\\beta\\sin2\\alpha &amp; \\cos2\\beta\\sin2\\alpha-\\sin2\\beta\\cos2\\alpha\\\\ \\sin2\\beta\\cos2\\alpha-\\cos2\\beta\\sin2\\alpha &amp; \\sin2\\beta\\sin2\\alpha+\\cos2\\beta\\cos2\\alpha\\end{bmatrix}=\\begin{bmatrix}\\cos2(\\beta-\\alpha) &amp; -\\sin2(\\beta-\\alpha)\\\\ \\sin2(\\beta-\\alpha) &amp; \\cos2(\\beta-\\alpha)\\end{bmatrix}\\end{aligned}<\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 300\" width=\"420\"><defs><marker id=\"M9-f8-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f8-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs>\n<line x1=\"30\" y1=\"260\" x2=\"402\" y2=\"260\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f8-m0)\"/>\n<line x1=\"90\" y1=\"278\" x2=\"90\" y2=\"8\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f8-m0)\"/>\n<text x=\"398\" y=\"278\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"98\" y=\"16\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"76\" y=\"276\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"90\" y1=\"260\" x2=\"379.8\" y2=\"182.4\" stroke=\"#7a5cc2\" stroke-width=\"1.6\"/>\n<text x=\"373.8\" y=\"174.4\" font-size=\"14\" fill=\"#7a5cc2\">L₁<\/text>\n<line x1=\"90\" y1=\"260\" x2=\"259.7\" y2=\"57.8\" stroke=\"#2e8b57\" stroke-width=\"1.6\"/>\n<text x=\"265.7\" y=\"61.8\" font-size=\"14\" fill=\"#2e8b57\">L₂<\/text>\n<line x1=\"90\" y1=\"260\" x2=\"299.9\" y2=\"252.7\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<line x1=\"90\" y1=\"260\" x2=\"275.4\" y2=\"161.4\" stroke=\"#7a5cc2\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n<line x1=\"90\" y1=\"260\" x2=\"154.9\" y2=\"60.3\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<line x1=\"299.9\" y1=\"252.7\" x2=\"275.4\" y2=\"161.4\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>\n<line x1=\"275.4\" y1=\"161.4\" x2=\"154.9\" y2=\"60.3\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"299.9\" cy=\"252.7\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"305.9\" y=\"264.7\" font-size=\"14\" fill=\"#2f6fb5\">P<\/text>\n<circle cx=\"275.4\" cy=\"161.4\" r=\"3.2\" fill=\"#7a5cc2\"/>\n<text x=\"283.4\" y=\"165.4\" font-size=\"14\" fill=\"#7a5cc2\">P₁<\/text>\n<circle cx=\"154.9\" cy=\"60.3\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"132.9\" y=\"56.3\" font-size=\"14\" fill=\"#d9772b\">P₂<\/text>\n<path d=\"M162,257.5 A72,72 0 0 0 112.2,191.5\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.4\" marker-end=\"url(#M9-f8-m1)\"/>\n<text x=\"87.8\" y=\"209.9\" font-size=\"13\" fill=\"#c2410c\">2(β−α)<\/text>\n<path d=\"M234,260 A144,144 0 0 0 229.1,222.7\" fill=\"none\" stroke=\"#7a5cc2\" stroke-width=\"1.4\"/>\n<text x=\"237\" y=\"245\" font-size=\"14\" fill=\"#7a5cc2\" font-style=\"italic\">α<\/text>\n<path d=\"M258,260 A168,168 0 0 0 198,131.3\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1\"/>\n<text x=\"233.1\" y=\"152.9\" font-size=\"14\" fill=\"#2e8b57\" font-style=\"italic\">β<\/text>\n<\/svg><figcaption>圖 M9-9　P 先對 L₁（傾斜角 α）鏡射得 P₁，再對 L₂（傾斜角 β）鏡射得 P₂；∠POP₂ = 2(β − α)（示意圖）<\/figcaption><\/figure>\n<div class=\"note\"><p><span class=\"m\">M_\\alpha M_\\beta=R_{2(\\alpha-\\beta)}=R_{-2(\\beta-\\alpha)}<\/span>：交換順序，旋轉方向相反。<\/p><\/div>\n<div class=\"exam\"><p>學測混合題常給「先對 <span class=\"m\">x<\/span> 軸鏡射、再旋轉 <span class=\"m\">\\theta<\/span>」等兩步驟，要求判斷合成後是哪一種變換。判斷順序：先算行列式（<span class=\"m\">1<\/span> 或 <span class=\"m\">-1<\/span>）決定是旋轉或鏡射，再由矩陣元素讀出角度或軸。<\/p><\/div>\n<h4>3. 以合成拆解複雜變換<\/h4>\n<p>任意過原點直線的鏡射可拆成「轉到 <span class=\"m\">x<\/span> 軸、對 <span class=\"m\">x<\/span> 軸鏡射、轉回去」：<\/p>\n<div class=\"mb\">M_\\theta=R_\\theta\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}R_{-\\theta}<\/div>\n<p>同理，沿傾斜角 <span class=\"m\">\\theta<\/span> 方向伸縮 <span class=\"m\">k<\/span> 倍（垂直方向不變）的矩陣為 <span class=\"m\">R_\\theta\\begin{bmatrix}k &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}R_{-\\theta}<\/span>。這種「換到方便的方向計算、再換回來」的寫法 <span class=\"m\">QDQ^{-1}<\/span> 即大學線性代數的<strong>相似<\/strong>與<strong>對角化<\/strong>（進階）。<\/p>\n<div class=\"tip\"><p>深究　每個可逆線性變換都是基本變換的合成（進階）<\/p><p>二階可逆方陣可經列運算化成 <span class=\"m\">I<\/span>，而每一種列運算對應一個基本矩陣：兩列互換＝對 <span class=\"m\">y=x<\/span> 鏡射，某列乘 <span class=\"m\">k<\/span>＝單方向伸縮（<span class=\"m\">k&lt;0<\/span> 時再加鏡射），某列加上另一列的倍數＝推移。因此任何可逆二階方陣都可寫成伸縮、鏡射、推移的合成。例如<\/p><div class=\"mb\">\\begin{bmatrix}2 &amp; 1\\\\ 4 &amp; 5\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; \\frac12\\\\ 0 &amp; 1\\end{bmatrix}<\/div><p>右式依序表示：沿 <span class=\"m\">x<\/span> 軸方向推移 <span class=\"m\">\\frac12<\/span>、伸縮 <span class=\"m\">(2,3)<\/span>、沿 <span class=\"m\">y<\/span> 軸方向推移 <span class=\"m\">2<\/span>（由右往左作用）。<\/p><\/div>"},{"t":"六、面積比與方向：行列式的幾何意義","h":"<h4>1. 面積比定理<\/h4>\n<div class=\"formula\" data-t=\"面積比\"><div class=\"mb\">\\dfrac{\\text{像的面積}}{\\text{原圖形面積}}=|\\det A|=|ad-bc|<\/div><p>對任意有面積的圖形都成立（多邊形、圓、橢圓等），與圖形的形狀、位置無關。<\/p><\/div>\n<p><strong>證明<\/strong>（三角形與平行四邊形）　設平行四邊形以 <span class=\"m\">\\vec{u}=(u_1,u_2)<\/span>、<span class=\"m\">\\vec{v}=(v_1,v_2)<\/span> 為鄰邊，由第三冊 A，其面積為 <span class=\"m\">\\left|\\begin{vmatrix}u_1 &amp; v_1\\\\ u_2 &amp; v_2\\end{vmatrix}\\right|<\/span>。經 <span class=\"m\">A<\/span> 後鄰邊變成 <span class=\"m\">A\\vec{u}<\/span>、<span class=\"m\">A\\vec{v}<\/span>，故新面積為<\/p>\n<div class=\"mb\">\\left|\\det\\big[\\,A\\vec{u}\\ \\ A\\vec{v}\\,\\big]\\right|=\\left|\\det\\left(A\\begin{bmatrix}u_1 &amp; v_1\\\\ u_2 &amp; v_2\\end{bmatrix}\\right)\\right|=|\\det A|\\cdot\\left|\\begin{vmatrix}u_1 &amp; v_1\\\\ u_2 &amp; v_2\\end{vmatrix}\\right|<\/div>\n<p>其中用到 <span class=\"box\"><span class=\"m\">\\det(AB)=\\det A\\cdot\\det B<\/span><\/span>。二階的情形直接展開即可驗證：<\/p>\n<div class=\"mb\">\\det\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}=(ap+br)(cq+ds)-(aq+bs)(cp+dr)=(ad-bc)(ps-qr)<\/div>\n<p>三角形是平行四邊形的一半，面積比相同。任意多邊形可分割成三角形，故面積比皆為 <span class=\"m\">|\\det A|<\/span>。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 560 250\" width=\"560\"><defs><marker id=\"M9-f9-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"44\" y1=\"190\" x2=\"204\" y2=\"190\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f9-m0)\"/>\n<line x1=\"60\" y1=\"206\" x2=\"60\" y2=\"46\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f9-m0)\"/>\n<text x=\"200\" y=\"208\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"68\" y=\"54\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"46\" y=\"206\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"60\" y1=\"190\" x2=\"60\" y2=\"110\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"100\" y1=\"190\" x2=\"100\" y2=\"110\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"140\" y1=\"190\" x2=\"140\" y2=\"110\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"180\" y1=\"190\" x2=\"180\" y2=\"110\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"190\" x2=\"180\" y2=\"190\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"150\" x2=\"180\" y2=\"150\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"110\" x2=\"180\" y2=\"110\" stroke=\"#2f6fb5\" stroke-width=\"1\"/>\n<polygon points=\"60,190 180,190 180,110 60,110\" fill=\"#cfe3f8\" fill-opacity=\"0.5\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<text x=\"108\" y=\"98\" font-size=\"13\" fill=\"#2f6fb5\">6 格<\/text>\n<line x1=\"215\" y1=\"110\" x2=\"275\" y2=\"110\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M9-f9-m0)\"/>\n<text x=\"240\" y=\"100\" font-size=\"17\" fill=\"#1f2a44\">A<\/text>\n<line x1=\"288\" y1=\"200\" x2=\"616\" y2=\"200\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f9-m0)\"/>\n<line x1=\"360\" y1=\"216\" x2=\"360\" y2=\"4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f9-m0)\"/>\n<text x=\"612\" y=\"218\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"368\" y=\"12\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"346\" y=\"216\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"360\" y1=\"200\" x2=\"280\" y2=\"120\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"440\" y1=\"160\" x2=\"360\" y2=\"80\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"520\" y1=\"120\" x2=\"440\" y2=\"40\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"600\" y1=\"80\" x2=\"520\" y2=\"0\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"360\" y1=\"200\" x2=\"600\" y2=\"80\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"320\" y1=\"160\" x2=\"560\" y2=\"40\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<line x1=\"280\" y1=\"120\" x2=\"520\" y2=\"0\" stroke=\"#d9772b\" stroke-width=\"1\"/>\n<polygon points=\"360,200 600,80 520,0 280,120\" fill=\"#fbdcbd\" fill-opacity=\"0.5\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<text x=\"506\" y=\"160\" font-size=\"13\" fill=\"#d9772b\">每格面積 3<\/text>\n<\/svg><figcaption>圖 M9-10　<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=3<\/span>：每個單位格映成面積 3 的平行四邊形格<\/figcaption><\/figure>\n<div class=\"tip\"><p>深究　曲線圍成的區域（進階）<\/p><p>以邊長 <span class=\"m\">\\varepsilon<\/span> 的小正方形網格覆蓋區域，每一小正方形的像是面積 <span class=\"m\">|\\det A|\\varepsilon^2<\/span> 的小平行四邊形（圖 M9-10）。<span class=\"m\">\\varepsilon\\to0<\/span> 時，區域面積為小正方形總面積的極限，故像的面積仍為原面積的 <span class=\"m\">|\\det A|<\/span> 倍。大學微積分的變數變換公式中，雅可比行列式 <span class=\"m\">|\\det J|<\/span> 就是局部的面積比。<\/p><p>應用：橢圓 <span class=\"m\">\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1<\/span> 是單位圓經 <span class=\"m\">\\begin{bmatrix}a &amp; 0\\\\ 0 &amp; b\\end{bmatrix}<\/span> 的像，故面積為 <span class=\"m\">ab\\cdot\\pi\\cdot1^2=\\pi ab<\/span>。<\/p><\/div>\n<h4>2. 行列式的正負：方向<\/h4>\n<p>三角形 <span class=\"m\">ABC<\/span> 的頂點依 <span class=\"m\">A\\to B\\to C<\/span> 為逆時針排列時，<span class=\"m\">\\begin{vmatrix}x_B-x_A &amp; x_C-x_A\\\\ y_B-y_A &amp; y_C-y_A\\end{vmatrix}&gt;0<\/span>（有向面積為正）；順時針時為負。<\/p>\n<div class=\"key\"><ul>\n<li><span class=\"m\">\\det A&gt;0<\/span>：<strong>保持方向<\/strong>，逆時針排列的頂點的像仍為逆時針（旋轉、推移、伸縮）。<\/li>\n<li><span class=\"m\">\\det A&lt;0<\/span>：<strong>反轉方向<\/strong>，像的頂點變成順時針（鏡射，或鏡射與其他變換的合成）。<span class=\"hand\">det &lt; 0 一定含奇數次「翻面」<\/span><\/li>\n<li><span class=\"m\">\\det A=0<\/span>：圖形被壓扁，面積為 0。<\/li>\n<\/ul><\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 300\" width=\"400\"><defs><marker id=\"M9-f10-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f10-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<line x1=\"40\" y1=\"270\" x2=\"40\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"64\" y1=\"270\" x2=\"64\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"88\" y1=\"270\" x2=\"88\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"112\" y1=\"270\" x2=\"112\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"136\" y1=\"270\" x2=\"136\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"160\" y1=\"270\" x2=\"160\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"184\" y1=\"270\" x2=\"184\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"208\" y1=\"270\" x2=\"208\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"232\" y1=\"270\" x2=\"232\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"256\" y1=\"270\" x2=\"256\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"280\" y1=\"270\" x2=\"280\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"304\" y1=\"270\" x2=\"304\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"328\" y1=\"270\" x2=\"328\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"352\" y1=\"270\" x2=\"352\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"270\" x2=\"352\" y2=\"270\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"246\" x2=\"352\" y2=\"246\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"222\" x2=\"352\" y2=\"222\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"198\" x2=\"352\" y2=\"198\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"174\" x2=\"352\" y2=\"174\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"150\" x2=\"352\" y2=\"150\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"126\" x2=\"352\" y2=\"126\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"102\" x2=\"352\" y2=\"102\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"78\" x2=\"352\" y2=\"78\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"54\" x2=\"352\" y2=\"54\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"30\" x2=\"352\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"6\" x2=\"352\" y2=\"6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"28\" y1=\"270\" x2=\"371.2\" y2=\"270\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f10-m0)\"/>\n<line x1=\"40\" y1=\"282\" x2=\"40\" y2=\"-1.2\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f10-m0)\"/>\n<text x=\"367.2\" y=\"288\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"48\" y=\"6.8\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"26\" y=\"286\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"160\" y1=\"267\" x2=\"160\" y2=\"273\" stroke=\"#1f2a44\"/>\n<text x=\"160\" y=\"286\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"middle\">5<\/text>\n<line x1=\"280\" y1=\"267\" x2=\"280\" y2=\"273\" stroke=\"#1f2a44\"/>\n<text x=\"280\" y=\"286\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"middle\">10<\/text>\n<line x1=\"37\" y1=\"150\" x2=\"43\" y2=\"150\" stroke=\"#1f2a44\"/>\n<text x=\"34\" y=\"154\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"end\">5<\/text>\n<line x1=\"37\" y1=\"30\" x2=\"43\" y2=\"30\" stroke=\"#1f2a44\"/>\n<text x=\"34\" y=\"34\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"end\">10<\/text>\n<polygon points=\"64,270 112,246 88,174\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/>\n<polygon points=\"64,198 160,30 280,30\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/>\n<circle cx=\"64\" cy=\"270\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"66\" y=\"286\" font-size=\"13\" fill=\"#2f6fb5\">A<\/text>\n<circle cx=\"112\" cy=\"246\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"118\" y=\"252\" font-size=\"13\" fill=\"#2f6fb5\">B<\/text>\n<circle cx=\"88\" cy=\"174\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"74\" y=\"170\" font-size=\"13\" fill=\"#2f6fb5\">C<\/text>\n<circle cx=\"64\" cy=\"198\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"44\" y=\"202\" font-size=\"13\" fill=\"#d9772b\">A'<\/text>\n<circle cx=\"160\" cy=\"30\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"136\" y=\"24\" font-size=\"13\" fill=\"#d9772b\">B'<\/text>\n<circle cx=\"280\" cy=\"30\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"286\" y=\"24\" font-size=\"13\" fill=\"#d9772b\">C'<\/text>\n<path d=\"M70,235.8 A19.2,19.2 0 1 0 70,222.6\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\" marker-end=\"url(#M9-f10-m1)\"/>\n<text x=\"203.2\" y=\"145.2\" font-size=\"13\" fill=\"#d9772b\">順時針<\/text>\n<text x=\"116.8\" y=\"207.6\" font-size=\"13\" fill=\"#2f6fb5\">逆時針<\/text>\n<\/svg><figcaption>圖 M9-11　<span class=\"m\">\\det A=-5&lt;0<\/span>：三角形 ABC 逆時針，像 A'B'C' 為順時針，面積放大 5 倍（例題 10）<\/figcaption><\/figure>\n<h4>3. 行列式為 0：退化的變換<\/h4>\n<p>若 <span class=\"m\">\\det A=0<\/span> 且 <span class=\"m\">A\\ne O<\/span>，則 <span class=\"m\">A<\/span> 的兩行平行，整個平面的像是一條<strong>過原點的直線<\/strong>（兩行所在的直線）；被映到原點的點也形成一條過原點的直線。若 <span class=\"m\">A=O<\/span>，整個平面映成原點。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 280\" width=\"420\"><defs><marker id=\"M9-f11-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"30\" y1=\"275\" x2=\"30\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"75\" y1=\"275\" x2=\"75\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"120\" y1=\"275\" x2=\"120\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"165\" y1=\"275\" x2=\"165\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"210\" y1=\"275\" x2=\"210\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"255\" y1=\"275\" x2=\"255\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"300\" y1=\"275\" x2=\"300\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"345\" y1=\"275\" x2=\"345\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"390\" y1=\"275\" x2=\"390\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"275\" x2=\"390\" y2=\"275\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"230\" x2=\"390\" y2=\"230\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"185\" x2=\"390\" y2=\"185\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"140\" x2=\"390\" y2=\"140\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"95\" x2=\"390\" y2=\"95\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"50\" x2=\"390\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"5\" x2=\"390\" y2=\"5\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"7.5\" y1=\"140\" x2=\"412.5\" y2=\"140\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f11-m0)\"/>\n<line x1=\"210\" y1=\"275\" x2=\"210\" y2=\"5\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f11-m0)\"/>\n<text x=\"408.5\" y=\"158\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"218\" y=\"13\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"196\" y=\"156\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"84\" y1=\"266\" x2=\"336\" y2=\"14\" stroke=\"#2e8b57\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n<text x=\"34.5\" y=\"239\" font-size=\"12\" fill=\"#2e8b57\">y = x 上的點都映到 O<\/text>\n<line x1=\"144.8\" y1=\"9.5\" x2=\"275.2\" y2=\"270.5\" stroke=\"#d9772b\" stroke-width=\"2.4\"/>\n<text x=\"283.2\" y=\"276.5\" font-size=\"13\" fill=\"#d9772b\">像：y = −2x<\/text>\n<polygon points=\"210,140 255,140 255,95 210,95\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<circle cx=\"255\" cy=\"230\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"263\" y=\"234\" font-size=\"12\" fill=\"#d9772b\">(1,−2)<\/text>\n<circle cx=\"165\" cy=\"50\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"115\" y=\"54\" font-size=\"12\" fill=\"#d9772b\">(−1,2)<\/text>\n<\/svg><figcaption>圖 M9-12　<span class=\"m\">A=\\begin{bmatrix}1 &amp; -1\\\\ -2 &amp; 2\\end{bmatrix}<\/span>：單位正方形被壓成線段，全平面的像為直線 y = −2x，直線 y = x 上各點都映到原點<\/figcaption><\/figure>\n<p>上例中，<span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}=(x-y)\\begin{bmatrix}1\\\\ -2\\end{bmatrix}<\/span>：像都在 <span class=\"m\">y=-2x<\/span> 上；<span class=\"m\">x-y=c<\/span> 上所有點映到同一點 <span class=\"m\">(c,-2c)<\/span>。<\/p>\n<div class=\"exam\"><p>學測常問「<span class=\"m\">A<\/span> 把整個平面映成什麼」或「哪些點的像是原點」。前者看矩陣的<strong>行<\/strong>（像的方向），後者解 <span class=\"m\">A\\vec{x}=\\vec{0}<\/span>，看矩陣的<strong>列<\/strong>（各列與 <span class=\"m\">\\vec{x}<\/span> 垂直）。<em>兩條直線互相混淆<\/em>是主要失分點。<\/p><\/div>\n<div class=\"warn\"><p>面積比用 <span class=\"m\">|\\det A|<\/span>，<em>不是 <span class=\"m\">\\det A<\/span><\/em>；面積不會是負數。<span class=\"m\">\\det A<\/span> 的正負只用來判斷方向。<\/p><\/div>\n<div class=\"tip\"><p>深究　合成與行列式<\/p><p>先 <span class=\"m\">A<\/span> 後 <span class=\"m\">B<\/span> 的面積比為 <span class=\"m\">|\\det B|\\cdot|\\det A|=|\\det(BA)|<\/span>，與 <span class=\"m\">\\det(BA)=\\det B\\det A<\/span> 一致。因此 <span class=\"m\">\\det(AB)=\\det(BA)<\/span>，即使 <span class=\"m\">AB\\ne BA<\/span>。又 <span class=\"m\">\\det(A^n)=(\\det A)^n<\/span>，<span class=\"m\">\\det(A^{-1})=\\dfrac{1}{\\det A}<\/span>，<span class=\"m\">\\det(kA)=k^2\\det A<\/span>（二階）。<\/p><\/div>","sims":[["lt",{"presets":["scale","refx","shear","proj","rot"],"preset":"scale","title":"面積比與方向"}]],"qs":["M9-08","M9-04","M9-15"]},{"t":"七、反變換與圖形的像","h":"<h4>1. 反變換<\/h4>\n<div class=\"formula\" data-t=\"反變換\"><div class=\"mb\">\\det A\\ne0\\iff T\\text{ 可逆},\\qquad T^{-1}\\text{ 的矩陣為 }A^{-1}=\\dfrac{1}{ad-bc}\\begin{bmatrix}d &amp; -b\\\\ -c &amp; a\\end{bmatrix}<\/div><p>反變換把每個像送回原像：<span class=\"m\">P=A^{-1}P'<\/span>。<span class=\"m\">\\det A=0<\/span> 時多個點有相同的像，無法還原。<\/p><\/div>\n<table class=\"t\"><thead><tr><th>變換<\/th><th>反變換<\/th><th>反方陣<\/th><\/tr><\/thead><tbody>\n<tr><td>伸縮 <span class=\"m\">(h,k)<\/span><\/td><td>伸縮 <span class=\"m\">(\\frac1h,\\frac1k)<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}\\frac1h &amp; 0\\\\ 0 &amp; \\frac1k\\end{bmatrix}<\/span><\/td><\/tr>\n<tr><td>鏡射 <span class=\"m\">M_\\theta<\/span><\/td><td>同一鏡射<\/td><td><span class=\"m\">M_\\theta<\/span><\/td><\/tr>\n<tr><td>旋轉 <span class=\"m\">\\theta<\/span><\/td><td>旋轉 <span class=\"m\">-\\theta<\/span><\/td><td><span class=\"m\">R_{-\\theta}<\/span><\/td><\/tr>\n<tr><td>推移 <span class=\"m\">k<\/span><\/td><td>推移 <span class=\"m\">-k<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}1 &amp; -k\\\\ 0 &amp; 1\\end{bmatrix}<\/span><\/td><\/tr>\n<tr><td>先 <span class=\"m\">A<\/span> 後 <span class=\"m\">B<\/span><\/td><td>先 <span class=\"m\">B^{-1}<\/span> 後 <span class=\"m\">A^{-1}<\/span><\/td><td><span class=\"m\">(BA)^{-1}=A^{-1}B^{-1}<\/span><\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"note\"><p>還原合成變換時，最後作的那一步要最先撤銷，所以順序顛倒。<\/p><\/div>\n<h4>2. 圖形的像的方程式<\/h4>\n<p>設圖形 <span class=\"m\">\\Gamma:\\ f(x,y)=0<\/span>，求其經 <span class=\"m\">A<\/span>（可逆）後的像 <span class=\"m\">\\Gamma'<\/span>。<\/p>\n<ol class=\"steps\">\n<li>設 <span class=\"m\">(x',y')<\/span> 為像上任一點，則其原像 <span class=\"m\">\\begin{bmatrix}x\\\\ y\\end{bmatrix}=A^{-1}\\begin{bmatrix}x'\\\\ y'\\end{bmatrix}<\/span> 在 <span class=\"m\">\\Gamma<\/span> 上。<\/li>\n<li>以 <span class=\"m\">x',y'<\/span> 表示 <span class=\"m\">x,y<\/span>，代入 <span class=\"m\">f(x,y)=0<\/span>。<\/li>\n<li>整理後把 <span class=\"m\">x',y'<\/span> 改寫回 <span class=\"m\">x,y<\/span>，即為 <span class=\"m\">\\Gamma'<\/span> 的方程式。<\/li>\n<\/ol>\n<div class=\"formula\" data-t=\"像與原像的代入方向\"><div class=\"mb\">\\text{求像：}\\ (x,y)=A^{-1}(x',y')\\ \\text{代入原圖形}\\qquad\\text{求原像：}\\ (x',y')=A(x,y)\\ \\text{代入像的方程式}<\/div><p>兩者方向相反。求原像不需要 <span class=\"m\">A<\/span> 可逆。<\/p><\/div>\n<p>直線的像也可用「兩點定直線」：在直線上取兩點，分別求像，再寫出過兩像點的直線。此法不必求反方陣，但須確認兩像點不重合。<\/p>\n<div class=\"exam\"><p>學測考法：給直線或圓，求經伸縮、旋轉後的方程式；或給像的方程式，求原圖形。<em>代入方向弄反<\/em>時，所得方程式恰為經 <span class=\"m\">A^{-1}<\/span> 變換的像，數字常在誘答選項中。<\/p><\/div>\n<div class=\"warn\"><p>課綱不直接處理含 <span class=\"m\">xy<\/span> 項的二元二次方程式。圓經一般矩陣變換後會得到含 <span class=\"m\">xy<\/span> 項的方程式（斜放的橢圓），此類題目只問面積或特定點，不要求整理方程式。<\/p><\/div>","qs":["M9-23"]},{"t":"八、深究：不變直線、特徵值與對角化（進階）","h":"<div class=\"tip\"><p>深究　不變方向與特徵值（進階）<\/p>\n<p>若非零向量 <span class=\"m\">\\vec{v}<\/span> 滿足 <span class=\"m\">A\\vec{v}=\\lambda\\vec{v}<\/span>，則過原點、方向為 <span class=\"m\">\\vec{v}<\/span> 的直線被 <span class=\"m\">A<\/span> 映成自身，且直線上每一點伸縮 <span class=\"m\">\\lambda<\/span> 倍。<span class=\"m\">\\lambda<\/span> 稱為 <span class=\"m\">A<\/span> 的<strong>特徵值<\/strong>，<span class=\"m\">\\vec{v}<\/span> 稱為<strong>特徵向量<\/strong>。<\/p>\n<p><span class=\"m\">(A-\\lambda I)\\vec{v}=\\vec{0}<\/span> 有非零解的條件為 <span class=\"m\">\\det(A-\\lambda I)=0<\/span>：<\/p>\n<div class=\"mb\">\\begin{vmatrix}a-\\lambda &amp; b\\\\ c &amp; d-\\lambda\\end{vmatrix}=0\\iff\\lambda^2-(a+d)\\lambda+(ad-bc)=0<\/div>\n<p>示例：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span>（圖 M9-1），<span class=\"m\">\\lambda^2-4\\lambda+3=0<\/span>，<span class=\"m\">\\lambda=1,3<\/span>。<span class=\"m\">\\lambda=3<\/span> 時 <span class=\"m\">\\vec{v}=(1,1)<\/span>；<span class=\"m\">\\lambda=1<\/span> 時 <span class=\"m\">\\vec{v}=(1,-1)<\/span>。幾何意義：沿 <span class=\"m\">y=x<\/span> 方向伸縮 3 倍，沿 <span class=\"m\">y=-x<\/span> 方向不變。兩特徵值之積 <span class=\"m\">3=\\det A<\/span>，正是面積比。<\/p>\n<ul>\n<li>旋轉 <span class=\"m\">R_\\theta<\/span>（<span class=\"m\">\\theta\\ne0^\\circ,180^\\circ<\/span>）沒有實數特徵值：沒有任何過原點的直線保持不動。<\/li>\n<li>鏡射 <span class=\"m\">M_\\theta<\/span>：特徵值 <span class=\"m\">1<\/span>（軸 <span class=\"m\">L<\/span> 上的點不動）與 <span class=\"m\">-1<\/span>（垂直於 <span class=\"m\">L<\/span> 的方向反向）。<\/li>\n<li>投影 <span class=\"m\">P_\\theta<\/span>：特徵值 <span class=\"m\">1<\/span>（<span class=\"m\">L<\/span> 方向）與 <span class=\"m\">0<\/span>（垂直方向被壓扁）。<\/li>\n<li>推移 <span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span>（<span class=\"m\">k\\ne0<\/span>）：只有特徵值 <span class=\"m\">1<\/span>，只有 <span class=\"m\">x<\/span> 軸方向不變。<\/li>\n<\/ul><\/div>\n<div class=\"tip\"><p>深究　特徵值、對角化與 <span class=\"m\">A^n<\/span> 的幾何意義（進階）<\/p>\n<p>凱萊–哈密頓定理 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span> 的敘述、證明與「降次求 <span class=\"m\">A^n<\/span>」見 M8 四、方陣的乘冪。與上述特徵方程式比較：此定理即「<span class=\"m\">A<\/span> 滿足自己的特徵方程式」；兩特徵值之和為跡 <span class=\"m\">a+d<\/span>，之積為 <span class=\"m\">\\det A<\/span>（面積比）。<\/p>\n<p>以不變直線求 <span class=\"m\">A^n<\/span>：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span> 沿 <span class=\"m\">y=x<\/span> 方向伸縮 3 倍、沿 <span class=\"m\">y=-x<\/span> 方向不變，作用 <span class=\"m\">n<\/span> 次即兩方向分別乘 <span class=\"m\">3^n<\/span> 與 <span class=\"m\">1<\/span>。以 <span class=\"m\">(1,1)<\/span>、<span class=\"m\">(1,-1)<\/span> 為基底分解，<\/p>\n<div class=\"mb\">A^n=\\dfrac{3^n}{2}\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}+\\dfrac{1}{2}\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 1\\end{bmatrix}=\\dfrac12\\begin{bmatrix}3^n+1 &amp; 3^n-1\\\\ 3^n-1 &amp; 3^n+1\\end{bmatrix}<\/div>\n<p>兩個矩陣分別是投影到 <span class=\"m\">y=x<\/span> 與投影到 <span class=\"m\">y=-x<\/span>，即 <span class=\"m\">A=3P_1+1\\cdot P_2<\/span>，為大學線性代數「譜分解」的二階特例。<\/p>\n<p><strong>對角化<\/strong>：令 <span class=\"m\">Q=\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; -1\\end{bmatrix}<\/span>（兩行為特徵向量），則 <span class=\"m\">A=Q\\begin{bmatrix}3 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}Q^{-1}<\/span>，<span class=\"m\">A^n=Q\\begin{bmatrix}3^n &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}Q^{-1}<\/span>。幾何意義：先換到兩條不變直線的方向、在各方向上單純伸縮、再換回原坐標，與五、3 的 <span class=\"m\">R_\\theta DR_{-\\theta}<\/span> 寫法相同。所得結果與 M8 以凱萊–哈密頓定理降次所得 <span class=\"m\">A^n=\\dfrac{3^n-1}{2}A+\\dfrac{3-3^n}{2}I<\/span> 一致。M10 轉移矩陣求長期分布用的是同一個方法。<\/p><\/div>\n<div class=\"tip\"><p>深究　一般線性變換的幾何結構（進階）<\/p><p>任何二階方陣 <span class=\"m\">A<\/span> 都可寫成 <span class=\"m\">A=R_\\alpha\\begin{bmatrix}s_1 &amp; 0\\\\ 0 &amp; s_2\\end{bmatrix}R_\\beta<\/span>（必要時把其中一個旋轉換成鏡射），稱為奇異值分解；<span class=\"m\">s_1,s_2\\ge0<\/span>。幾何意義：單位圓經 <span class=\"m\">A<\/span> 變成半軸長 <span class=\"m\">s_1,s_2<\/span> 的橢圓（可能斜放），面積比 <span class=\"m\">s_1s_2=|\\det A|<\/span>。數學甲 G-12甲-1 以旋轉把橢圓標準式轉成斜放的橢圓，即此結構的應用。<\/p><\/div>","qs":["M9-35","M9-25"]},{"t":"九、題型整理與第三冊 A 對照","h":"<h4>1. 由矩陣判讀變換<\/h4>\n<div class=\"note\"><p>先算 <span class=\"m\">\\det A<\/span>，再看矩陣的形狀，最後用兩個單位點的像確認。<\/p><\/div>\n<ol class=\"steps\">\n<li><span class=\"m\">\\det A=0<\/span>：退化變換。若 <span class=\"m\">A\\ne O<\/span>，又滿足 <span class=\"m\">A^2=A<\/span> 且 <span class=\"m\">A<\/span> 對稱，為投影；否則為「投影後再伸縮或旋轉」之類的合成。<\/li>\n<li><span class=\"m\">A=\\begin{bmatrix}h &amp; 0\\\\ 0 &amp; k\\end{bmatrix}<\/span>：伸縮（<span class=\"m\">h<\/span> 或 <span class=\"m\">k<\/span> 為負時含對坐標軸的鏡射）。<\/li>\n<li><span class=\"m\">A=\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span> 或 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ k &amp; 1\\end{bmatrix}<\/span>：推移。<\/li>\n<li><span class=\"m\">A=\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}<\/span>：<span class=\"m\">a^2+b^2=1<\/span> 為旋轉；否則為旋轉伸縮 <span class=\"m\">rR_\\theta<\/span>。<\/li>\n<li><span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ b &amp; -a\\end{bmatrix}<\/span> 且 <span class=\"m\">a^2+b^2=1<\/span>：鏡射，軸的方向由 <span class=\"m\">\\cos2\\theta=a<\/span>、<span class=\"m\">\\sin2\\theta=b<\/span> 決定，或直接解 <span class=\"m\">A\\vec{v}=\\vec{v}<\/span>。<\/li>\n<li>其他：寫成基本變換的合成，或求不變直線（八、深究）。<\/li>\n<\/ol>\n<h4>2. 題型與解題步驟<\/h4>\n<table class=\"t\"><thead><tr><th>題型<\/th><th>解題步驟<\/th><th>檢查重點<\/th><\/tr><\/thead><tbody>\n<tr><td>由兩點的像求矩陣<\/td><td>排成 <span class=\"m\">AB=C<\/span>，<span class=\"m\">A=CB^{-1}<\/span>；或先求 <span class=\"m\">(1,0)<\/span>、<span class=\"m\">(0,1)<\/span> 的像<\/td><td>右乘反方陣；兩點不可平行<\/td><\/tr>\n<tr><td>對 <span class=\"m\">y=mx<\/span> 的對稱點<\/td><td>鏡射公式；或投影 <span class=\"m\">Q<\/span> 後 <span class=\"m\">2Q-P<\/span><\/td><td>中點在 <span class=\"m\">L<\/span> 上、連線垂直 <span class=\"m\">L<\/span><\/td><\/tr>\n<tr><td>旋轉後的坐標<\/td><td><span class=\"m\">R_\\theta P<\/span>；中心非原點用 <span class=\"m\">C+R_\\theta(P-C)<\/span><\/td><td>逆時針為正；長度不變<\/td><\/tr>\n<tr><td>求 <span class=\"m\">A^n<\/span><\/td><td>寫成 <span class=\"m\">rR_\\theta<\/span>；或找週期 <span class=\"m\">A^k=I<\/span>；或凱萊–哈密頓定理降次（見 M8）<\/td><td>同界角；<span class=\"m\">r^n<\/span> 不可漏<\/td><\/tr>\n<tr><td>合成變換<\/td><td>後作用者寫左邊；鏡射個數判斷 <span class=\"m\">\\det<\/span> 正負<\/td><td>順序不可交換<\/td><\/tr>\n<tr><td>面積與方向<\/td><td>面積乘 <span class=\"m\">|\\det A|<\/span>；<span class=\"m\">\\det A<\/span> 的正負判斷繞行方向<\/td><td>多次變換時行列式相乘<\/td><\/tr>\n<tr><td>圖形的像<\/td><td><span class=\"m\">(x,y)=A^{-1}(x',y')<\/span> 代入原方程式<\/td><td>代入方向；直線可用兩點法驗算<\/td><\/tr>\n<tr><td>圖形的原像<\/td><td><span class=\"m\">(x',y')=A(x,y)<\/span> 代入像的方程式<\/td><td>不需 <span class=\"m\">A<\/span> 可逆<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"exam\"><p>學測多選題常把五種基本變換的性質混在選項中：行列式、是否保長度、是否可逆、反變換是什麼、平方是否為 <span class=\"m\">I<\/span>（鏡射與旋轉 <span class=\"m\">180^\\circ<\/span> 的平方為 <span class=\"m\">I<\/span>；投影的平方為自身）。上表與四、投影一節的整理表應能默寫。<\/p><\/div>\n<h4>3. 與第三冊 A 平面向量的對照<\/h4>\n<p>線性變換的計算都建立在第三冊 A 的平面向量上。<span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}=x\\begin{bmatrix}a\\\\ c\\end{bmatrix}+y\\begin{bmatrix}b\\\\ d\\end{bmatrix}<\/span>：像是兩個行向量的<strong>線性組合<\/strong>，係數就是原來的坐標（圖 M9-13）。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 560 240\" width=\"560\"><defs><marker id=\"M9-f18-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f18-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><marker id=\"M9-f18-m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><\/defs>\n<line x1=\"50\" y1=\"200\" x2=\"50\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"90\" y1=\"200\" x2=\"90\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"130\" y1=\"200\" x2=\"130\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"170\" y1=\"200\" x2=\"170\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"200\" x2=\"170\" y2=\"200\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"160\" x2=\"170\" y2=\"160\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"120\" x2=\"170\" y2=\"120\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"80\" x2=\"170\" y2=\"80\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"40\" x2=\"170\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"38\" y1=\"200\" x2=\"190\" y2=\"200\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f18-m0)\"/>\n<line x1=\"50\" y1=\"212\" x2=\"50\" y2=\"28\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f18-m0)\"/>\n<text x=\"186\" y=\"218\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"58\" y=\"36\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"36\" y=\"216\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"50\" y1=\"200\" x2=\"90\" y2=\"200\" stroke=\"#c2410c\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m1)\"/>\n<line x1=\"90\" y1=\"200\" x2=\"130\" y2=\"200\" stroke=\"#c2410c\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m1)\"/>\n<line x1=\"130\" y1=\"200\" x2=\"130\" y2=\"160\" stroke=\"#2e8b57\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m2)\"/>\n<line x1=\"50\" y1=\"200\" x2=\"130\" y2=\"160\" stroke=\"#2f6fb5\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"130\" cy=\"160\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"136\" y=\"154\" font-size=\"13\" fill=\"#2f6fb5\">P(2,1)<\/text>\n<text x=\"64\" y=\"216\" font-size=\"13\" fill=\"#c2410c\">e₁<\/text>\n<text x=\"136\" y=\"184\" font-size=\"13\" fill=\"#2e8b57\">e₂<\/text>\n<line x1=\"215\" y1=\"120\" x2=\"275\" y2=\"120\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M9-f18-m0)\"/>\n<text x=\"245\" y=\"110\" font-size=\"17\" fill=\"#1f2a44\">A<\/text>\n<line x1=\"308\" y1=\"210\" x2=\"548\" y2=\"210\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f18-m0)\"/>\n<line x1=\"380\" y1=\"222\" x2=\"380\" y2=\"34\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f18-m0)\"/>\n<text x=\"544\" y=\"228\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"388\" y=\"42\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"366\" y=\"226\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"380\" y1=\"210\" x2=\"460\" y2=\"170\" stroke=\"#c2410c\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m1)\"/>\n<line x1=\"460\" y1=\"170\" x2=\"540\" y2=\"130\" stroke=\"#c2410c\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m1)\"/>\n<line x1=\"540\" y1=\"130\" x2=\"500\" y2=\"90\" stroke=\"#2e8b57\" stroke-width=\"2.2\" marker-end=\"url(#M9-f18-m2)\"/>\n<line x1=\"380\" y1=\"210\" x2=\"500\" y2=\"90\" stroke=\"#2f6fb5\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"500\" cy=\"90\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"506\" y=\"84\" font-size=\"13\" fill=\"#2f6fb5\">P'(3,3)<\/text>\n<text x=\"424\" y=\"206\" font-size=\"13\" fill=\"#c2410c\">A e₁<\/text>\n<text x=\"528\" y=\"114\" font-size=\"13\" fill=\"#2e8b57\">A e₂<\/text>\n<\/svg><figcaption>圖 M9-13　<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>：<span class=\"m\">P=2\\vec{e_1}+\\vec{e_2}<\/span>，其像 <span class=\"m\">P'=2A\\vec{e_1}+A\\vec{e_2}=2(2,1)+(-1,1)=(3,3)<\/span><\/figcaption><\/figure>\n<table class=\"t\"><thead><tr><th>第三冊 A（平面向量、二元一次方程組）<\/th><th>本單元（線性變換）<\/th><\/tr><\/thead><tbody>\n<tr><td>線性組合 <span class=\"m\">x\\vec{a}+y\\vec{b}<\/span><\/td><td><span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/span>，<span class=\"m\">\\vec{a},\\vec{b}<\/span> 為 <span class=\"m\">A<\/span> 的兩行<\/td><\/tr>\n<tr><td>以 <span class=\"m\">\\vec{a},\\vec{b}<\/span> 為鄰邊的平行四邊形面積 <span class=\"m\">|\\det[\\vec{a}\\ \\vec{b}]|<\/span><\/td><td>單位正方形的像的面積，面積比 <span class=\"m\">|\\det A|<\/span><\/td><\/tr>\n<tr><td><span class=\"m\">\\vec{a}\\nparallel\\vec{b}<\/span> 時任一向量可唯一表成線性組合<\/td><td><span class=\"m\">\\det A\\ne0<\/span> 時每一點恰有一個原像（反變換存在）<\/td><\/tr>\n<tr><td>二元一次方程組恰有一解 <span class=\"m\">\\iff\\Delta\\ne0<\/span>（克拉瑪公式）<\/td><td><span class=\"m\">A\\vec{x}=\\vec{b}<\/span> 求原像，<span class=\"m\">\\vec{x}=A^{-1}\\vec{b}<\/span><\/td><\/tr>\n<tr><td>正射影 <span class=\"m\">\\dfrac{\\vec{a}\\cdot\\vec{b}}{|\\vec{b}|^2}\\vec{b}<\/span><\/td><td>投影矩陣 <span class=\"m\">\\dfrac{1}{p^2+q^2}\\begin{bmatrix}p^2 &amp; pq\\\\ pq &amp; q^2\\end{bmatrix}<\/span><\/td><\/tr>\n<tr><td>內積 <span class=\"m\">\\vec{a}\\cdot\\vec{b}=|\\vec{a}||\\vec{b}|\\cos\\theta<\/span><\/td><td>旋轉、鏡射保持內積（長度與夾角不變）<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"tip\"><p>深究　「線性」與方程組的解的結構（進階）<\/p><p>原像問題 <span class=\"m\">A\\vec{x}=\\vec{b}<\/span> 就是二元一次方程組。<span class=\"m\">\\det A=0<\/span> 時，若 <span class=\"m\">\\vec{b}<\/span> 在像所成的直線上則有無限多解，且所有解為「一個特解＋被映到原點的直線」，即 <span class=\"m\">\\vec{x}=\\vec{x}_0+t\\vec{v}<\/span>（<span class=\"m\">A\\vec{v}=\\vec{0}<\/span>）；若 <span class=\"m\">\\vec{b}<\/span> 不在該直線上則無解。這與第三冊 A 二元一次方程組「無限多解／無解」的幾何意義（兩直線重合／平行）一致，M7 三元一次聯立方程式中解的結構也相同。<\/p><\/div>"},{"t":"例題精解","h":"<div class=\"example\"><p><strong>例題 1　由坐標規則求矩陣、像與原像<\/strong>　線性變換 <span class=\"m\">T(x,y)=(2x-y,\\ x+3y)<\/span>。(1) 寫出 <span class=\"m\">T<\/span> 的矩陣 <span class=\"m\">A<\/span>；(2) 求點 <span class=\"m\">P(1,2)<\/span> 的像；(3) 求像為 <span class=\"m\">(3,5)<\/span> 的點。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li>係數依列填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 1 &amp; 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">A\\begin{bmatrix}1\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-2\\\\ 1+6\\end{bmatrix}=\\begin{bmatrix}0\\\\ 7\\end{bmatrix}<\/span>，像為 <span class=\"m\">(0,7)<\/span>。<\/li>\n<li>解 <span class=\"m\">\\begin{cases}2x-y=3\\\\ x+3y=5\\end{cases}<\/span>：<span class=\"m\">\\det A=7\\ne0<\/span>，<span class=\"m\">A^{-1}=\\dfrac17\\begin{bmatrix}3 &amp; 1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^{-1}\\begin{bmatrix}3\\\\ 5\\end{bmatrix}=\\dfrac17\\begin{bmatrix}14\\\\ 7\\end{bmatrix}=\\begin{bmatrix}2\\\\ 1\\end{bmatrix}<\/span>，所求點為 <span class=\"m\">(2,1)<\/span>。<\/li>\n<\/ol><p>陷阱：<span class=\"m\">x'=2x-y<\/span> 的係數是矩陣的<strong>第一列<\/strong>；<em>把係數直著填入<\/em>會得到轉置矩陣 <span class=\"m\">A^{T}<\/span>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 2　由兩點的像求矩陣<\/strong>　線性變換 <span class=\"m\">T<\/span> 把 <span class=\"m\">(1,1)<\/span> 映到 <span class=\"m\">(3,1)<\/span>、把 <span class=\"m\">(1,-1)<\/span> 映到 <span class=\"m\">(1,5)<\/span>。求 <span class=\"m\">T<\/span> 的矩陣與 <span class=\"m\">T(4,2)<\/span>。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">(1,0)=\\frac12[(1,1)+(1,-1)]<\/span>，故 <span class=\"m\">T(1,0)=\\frac12[(3,1)+(1,5)]=(2,3)<\/span>。<\/li>\n<li><span class=\"m\">(0,1)=\\frac12[(1,1)-(1,-1)]<\/span>，故 <span class=\"m\">T(0,1)=\\frac12[(3,1)-(1,5)]=(1,-2)<\/span>。<\/li>\n<li>兩行依序填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>；<span class=\"m\">T(4,2)=(8+2,\\ 12-4)=(10,8)<\/span>。<\/li>\n<\/ol>\n<p>另解：<span class=\"m\">A\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; -1\\end{bmatrix}=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}\\cdot\\dfrac{1}{-2}\\begin{bmatrix}-1 &amp; -1\\\\ -1 &amp; 1\\end{bmatrix}=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>。求 <span class=\"m\">T(4,2)<\/span> 也可不求矩陣：<span class=\"m\">(4,2)=3(1,1)+(1,-1)<\/span>，<span class=\"m\">T(4,2)=3(3,1)+(1,5)=(10,8)<\/span>。<\/p>\n<p>陷阱：<span class=\"m\">A=CB^{-1}<\/span>，<em>寫成 <span class=\"m\">B^{-1}C<\/span><\/em> 會得到錯誤矩陣。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 3　伸縮與圓的像<\/strong>　圓 <span class=\"m\">C:\\ x^2+y^2=4<\/span> 經矩陣 <span class=\"m\">\\begin{bmatrix}3 &amp; 0\\\\ 0 &amp; \\frac12\\end{bmatrix}<\/span> 變換，求像的方程式與所圍面積。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li>設像上一點 <span class=\"m\">(x',y')<\/span>，原像 <span class=\"m\">x=\\dfrac{x'}{3},\\ y=2y'<\/span>。<\/li>\n<li>代入：<span class=\"m\">\\dfrac{x'^2}{9}+4y'^2=4<\/span>，即 <span class=\"m\">\\dfrac{x^2}{36}+y^2=1<\/span>（圖 M9-2）。<\/li>\n<li>面積比 <span class=\"m\">|\\det|=3\\cdot\\frac12=\\frac32<\/span>，像的面積 <span class=\"m\">4\\pi\\cdot\\frac32=6\\pi<\/span>；與 <span class=\"m\">\\pi ab=\\pi\\cdot6\\cdot1<\/span> 一致。<\/li>\n<\/ol><p>陷阱：<em>把 <span class=\"m\">x'=3x,\\ y'=\\frac12y<\/span> 直接代入<\/em> <span class=\"m\">x^2+y^2=4<\/span> 得 <span class=\"m\">9x^2+\\frac14y^2=4<\/span>，那是原像的方程式。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 4　對 y = 2x 鏡射<\/strong>　求對直線 <span class=\"m\">L:\\ y=2x<\/span> 鏡射的矩陣，並求 <span class=\"m\">P(5,0)<\/span> 的對稱點。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">m=2<\/span>：<span class=\"m\">M=\\dfrac{1}{5}\\begin{bmatrix}1-4 &amp; 4\\\\ 4 &amp; 4-1\\end{bmatrix}=\\dfrac15\\begin{bmatrix}-3 &amp; 4\\\\ 4 &amp; 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">M\\begin{bmatrix}5\\\\ 0\\end{bmatrix}=\\begin{bmatrix}-3\\\\ 4\\end{bmatrix}<\/span>，對稱點 <span class=\"m\">(-3,4)<\/span>。<\/li>\n<li>驗算：中點 <span class=\"m\">(1,2)<\/span> 在 <span class=\"m\">L<\/span> 上；<span class=\"m\">(-3,4)-(5,0)=(-8,4)<\/span> 與方向 <span class=\"m\">(1,2)<\/span> 內積 <span class=\"m\">0<\/span>。<\/li>\n<\/ol>\n<p>另解（投影）：<span class=\"m\">P<\/span> 在 <span class=\"m\">L<\/span> 上的投影 <span class=\"m\">Q=\\dfrac{(5,0)\\cdot(1,2)}{5}(1,2)=(1,2)<\/span>，對稱點 <span class=\"m\">2Q-P=(-3,4)<\/span>。<\/p>\n<p>另解（倍角）：<span class=\"m\">\\tan\\theta=2<\/span>，<span class=\"m\">\\cos2\\theta=\\dfrac{1-4}{1+4}=-\\dfrac35<\/span>，<span class=\"m\">\\sin2\\theta=\\dfrac{4}{5}<\/span>，代入 <span class=\"m\">M_\\theta<\/span> 相同。<\/p>\n<p>陷阱：公式中 <span class=\"m\">m<\/span> 是斜率；直線寫成 <span class=\"m\">2x-y=0<\/span> 時<em>誤取 <span class=\"m\">m=-2<\/span><\/em> 會得到對 <span class=\"m\">y=-2x<\/span> 的鏡射。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 5　以旋轉求正三角形頂點<\/strong>　<span class=\"m\">O<\/span> 為原點，<span class=\"m\">A(4,2)<\/span>。求所有點 <span class=\"m\">B<\/span> 使 <span class=\"m\">\\triangle OAB<\/span> 為正三角形。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">B<\/span> 是 <span class=\"m\">A<\/span> 繞 <span class=\"m\">O<\/span> 旋轉 <span class=\"m\">\\pm60^\\circ<\/span> 的像。<\/li>\n<li><span class=\"m\">R_{60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-\\sqrt3\\\\ 2\\sqrt3+1\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">R_{-60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2+\\sqrt3\\\\ 1-2\\sqrt3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">B_1(2-\\sqrt3,\\ 1+2\\sqrt3)<\/span> 或 <span class=\"m\">B_2(2+\\sqrt3,\\ 1-2\\sqrt3)<\/span>（圖 M9-14）。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 300\" width=\"400\"><defs><marker id=\"M9-f13-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f13-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<line x1=\"86\" y1=\"286\" x2=\"86\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"118\" y1=\"286\" x2=\"118\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"150\" y1=\"286\" x2=\"150\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"182\" y1=\"286\" x2=\"182\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"214\" y1=\"286\" x2=\"214\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"246\" y1=\"286\" x2=\"246\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"278\" y1=\"286\" x2=\"278\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"310\" y1=\"286\" x2=\"310\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"342\" y1=\"286\" x2=\"342\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"374\" y1=\"286\" x2=\"374\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"286\" x2=\"374\" y2=\"286\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"254\" x2=\"374\" y2=\"254\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"222\" x2=\"374\" y2=\"222\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"190\" x2=\"374\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"158\" x2=\"374\" y2=\"158\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"126\" x2=\"374\" y2=\"126\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"94\" x2=\"374\" y2=\"94\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"62\" x2=\"374\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"190\" x2=\"380.4\" y2=\"190\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f13-m0)\"/>\n<line x1=\"150\" y1=\"298.8\" x2=\"150\" y2=\"20.4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f13-m0)\"/>\n<text x=\"376.4\" y=\"208\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"158\" y=\"28.4\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"136\" y=\"206\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"150,190 278,126 158.6,47.1\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<polygon points=\"150,190 278,126 269.4,268.9\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<circle cx=\"278\" cy=\"126\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"286\" y=\"126\" font-size=\"14\" fill=\"#1f2a44\">A(4,2)<\/text>\n<circle cx=\"158.6\" cy=\"47.1\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"134.6\" y=\"43.1\" font-size=\"14\" fill=\"#2f6fb5\">B₁<\/text>\n<circle cx=\"269.4\" cy=\"268.9\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"277.4\" y=\"280.9\" font-size=\"14\" fill=\"#d9772b\">B₂<\/text>\n<path d=\"M181.5,174.3 A35.2,35.2 0 0 0 152.1,154.9\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\" marker-end=\"url(#M9-f13-m1)\"/>\n<text x=\"126.4\" y=\"148.4\" font-size=\"12\" fill=\"#2f6fb5\">60°<\/text>\n<path d=\"M187.4,214.7 A44.8,44.8 0 0 0 190.1,170\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<text x=\"202\" y=\"206\" font-size=\"12\" fill=\"#d9772b\">−60°<\/text>\n<\/svg><figcaption>圖 M9-14　A 繞原點旋轉 ±60° 得到兩個正三角形的第三頂點<\/figcaption><\/figure>\n<p>另解（複數）：<span class=\"m\">(4+2i)\\left(\\frac12\\pm\\frac{\\sqrt3}{2}i\\right)<\/span>，展開得相同結果。<\/p>\n<p>陷阱：題目未指定方向時有兩解，<em>只寫逆時針一解<\/em>會漏答。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 6　推移的判定與面積<\/strong>　沿 <span class=\"m\">x<\/span> 軸方向的推移 <span class=\"m\">T<\/span> 把 <span class=\"m\">(1,2)<\/span> 映到 <span class=\"m\">(7,2)<\/span>。(1) 求 <span class=\"m\">T<\/span> 的矩陣；(2) 求以 <span class=\"m\">O<\/span>、<span class=\"m\">(2,0)<\/span>、<span class=\"m\">(0,3)<\/span> 為頂點的三角形經 <span class=\"m\">T<\/span> 後的頂點與面積。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li>設矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">1+2k=7<\/span>，<span class=\"m\">k=3<\/span>。<\/li>\n<li><span class=\"m\">(2,0)\\mapsto(2,0)<\/span>，<span class=\"m\">(0,3)\\mapsto(9,3)<\/span>，像為 <span class=\"m\">O<\/span>、<span class=\"m\">(2,0)<\/span>、<span class=\"m\">(9,3)<\/span>。<\/li>\n<li>面積：原為 <span class=\"m\">\\frac12\\cdot2\\cdot3=3<\/span>；像為 <span class=\"m\">\\frac12\\left|\\begin{vmatrix}2 &amp; 9\\\\ 0 &amp; 3\\end{vmatrix}\\right|=3<\/span>，與 <span class=\"m\">\\det=1<\/span> 一致（底 2、高 3 皆不變）。<\/li>\n<\/ol><p>陷阱：推移不改變面積，但<em>邊長與角度都改變<\/em>：原三角形為直角三角形，像不是。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 7　投影矩陣<\/strong>　求投影到直線 <span class=\"m\">L:\\ x-2y=0<\/span> 的矩陣 <span class=\"m\">P<\/span>，並求 <span class=\"m\">(3,4)<\/span> 的像；說明哪些點的像為 <span class=\"m\">(4,2)<\/span>。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">L<\/span> 的方向 <span class=\"m\">(2,1)<\/span>：<span class=\"m\">P=\\dfrac15\\begin{bmatrix}4 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">P\\begin{bmatrix}3\\\\ 4\\end{bmatrix}=\\dfrac15\\begin{bmatrix}20\\\\ 10\\end{bmatrix}=\\begin{bmatrix}4\\\\ 2\\end{bmatrix}<\/span>（圖 M9-8）。<\/li>\n<li>像為 <span class=\"m\">(4,2)<\/span> 的點：<span class=\"m\">\\dfrac{2x+y}{5}(2,1)=(4,2)<\/span>，即 <span class=\"m\">2x+y=10<\/span>，是過 <span class=\"m\">(4,2)<\/span> 且垂直 <span class=\"m\">L<\/span> 的直線。<\/li>\n<\/ol><p>補充：<span class=\"m\">2P-I=\\dfrac15\\begin{bmatrix}3 &amp; 4\\\\ 4 &amp; -3\\end{bmatrix}<\/span> 為對 <span class=\"m\">L<\/span> 的鏡射，<span class=\"m\">(3,4)\\mapsto(5,0)<\/span>。<\/p><p>陷阱：<span class=\"m\">L:\\ x-2y=0<\/span> 的法向量是 <span class=\"m\">(1,-2)<\/span>，方向向量是 <span class=\"m\">(2,1)<\/span>；<em>以法向量代入投影公式<\/em>得到的是投影到垂直線的矩陣。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 8　合成順序<\/strong>　<span class=\"m\">R<\/span> 為逆時針旋轉 <span class=\"m\">90^\\circ<\/span>，<span class=\"m\">M<\/span> 為對 <span class=\"m\">y=x<\/span> 鏡射。分別求「先 <span class=\"m\">M<\/span> 後 <span class=\"m\">R<\/span>」與「先 <span class=\"m\">R<\/span> 後 <span class=\"m\">M<\/span>」的矩陣，並說明其幾何意義。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">R=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。<\/li>\n<li>先 <span class=\"m\">M<\/span> 後 <span class=\"m\">R<\/span>：<span class=\"m\">RM=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，對 <span class=\"m\">y<\/span> 軸鏡射。<\/li>\n<li>先 <span class=\"m\">R<\/span> 後 <span class=\"m\">M<\/span>：<span class=\"m\">MR=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，對 <span class=\"m\">x<\/span> 軸鏡射。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 280\" width=\"420\"><defs><marker id=\"M9-f17-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"50\" y1=\"260\" x2=\"50\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"90\" y1=\"260\" x2=\"90\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"130\" y1=\"260\" x2=\"130\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"170\" y1=\"260\" x2=\"170\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"210\" y1=\"260\" x2=\"210\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"250\" y1=\"260\" x2=\"250\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"290\" y1=\"260\" x2=\"290\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"330\" y1=\"260\" x2=\"330\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"370\" y1=\"260\" x2=\"370\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"260\" x2=\"370\" y2=\"260\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"220\" x2=\"370\" y2=\"220\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"140\" x2=\"370\" y2=\"140\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"100\" x2=\"370\" y2=\"100\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"60\" x2=\"370\" y2=\"60\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"20\" x2=\"370\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"26\" y1=\"140\" x2=\"394\" y2=\"140\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f17-m0)\"/>\n<line x1=\"210\" y1=\"276\" x2=\"210\" y2=\"4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f17-m0)\"/>\n<text x=\"390\" y=\"158\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"218\" y=\"12\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"196\" y=\"156\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"250,120 330,120 250,80\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/>\n<text x=\"270\" y=\"110\" font-size=\"14\" fill=\"#2f6fb5\">F<\/text>\n<polygon points=\"170,120 90,120 170,80\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/>\n<text x=\"54\" y=\"64\" font-size=\"13\" fill=\"#d9772b\">RM(F)：對 y 軸<\/text>\n<polygon points=\"250,160 330,160 250,200\" fill=\"#c9ebd7\" stroke=\"#2e8b57\" stroke-width=\"2\"/>\n<text x=\"250\" y=\"232\" font-size=\"13\" fill=\"#2e8b57\">MR(F)：對 x 軸<\/text>\n<line x1=\"82\" y1=\"268\" x2=\"338\" y2=\"12\" stroke=\"#7a5cc2\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n<text x=\"332\" y=\"34\" font-size=\"13\" fill=\"#7a5cc2\">y = x<\/text>\n<\/svg><figcaption>圖 M9-15　三角形 F 經 RM 變成對 y 軸的鏡射像，經 MR 變成對 x 軸的鏡射像<\/figcaption><\/figure><p>另解（公式）：<span class=\"m\">R_\\varphi M_\\alpha=M_{\\alpha+\\varphi/2}=M_{45^\\circ+45^\\circ}=M_{90^\\circ}<\/span>（<span class=\"m\">y<\/span> 軸）；<span class=\"m\">M_\\alpha R_\\varphi=M_{\\alpha-\\varphi/2}=M_{0^\\circ}<\/span>（<span class=\"m\">x<\/span> 軸）。<\/p><p>陷阱：兩結果都是鏡射（<span class=\"m\">\\det=-1<\/span>），但軸不同，<em>合成順序不可任意交換<\/em>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 9　旋轉伸縮的乘冪<\/strong>　<span class=\"m\">A=\\begin{bmatrix}1 &amp; -\\sqrt3\\\\ \\sqrt3 &amp; 1\\end{bmatrix}<\/span>。求 <span class=\"m\">A^6<\/span>、<span class=\"m\">A^{10}<\/span>，以及 <span class=\"m\">(1,0)<\/span> 經 <span class=\"m\">A^{10}<\/span> 的像。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">A=2\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}=2R_{60^\\circ}<\/span>。<\/li>\n<li><span class=\"m\">A^6=2^6R_{360^\\circ}=64I<\/span>。<\/li>\n<li><span class=\"m\">A^{10}=2^{10}R_{600^\\circ}=1024R_{240^\\circ}=1024\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; -\\frac12\\end{bmatrix}=\\begin{bmatrix}-512 &amp; 512\\sqrt3\\\\ -512\\sqrt3 &amp; -512\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">(1,0)<\/span> 的像為第一行 <span class=\"m\">(-512,-512\\sqrt3)<\/span>。<\/li>\n<\/ol><p>另解：<span class=\"m\">A^{10}=A^6A^4=64A^4<\/span>，<span class=\"m\">A^4=16R_{240^\\circ}<\/span>，結果相同。<\/p><p>陷阱：<span class=\"m\">R_{240^\\circ}<\/span> 的右上角為 <span class=\"m\">-\\sin240^\\circ=+\\frac{\\sqrt3}{2}<\/span>，<em>符號易錯<\/em>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 10　面積比與方向<\/strong>　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 3 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">\\triangle ABC<\/span> 的頂點為 <span class=\"m\">A(1,0)<\/span>、<span class=\"m\">B(3,1)<\/span>、<span class=\"m\">C(2,4)<\/span>。求像 <span class=\"m\">\\triangle A'B'C'<\/span> 的頂點、面積，並判斷 <span class=\"m\">A'\\to B'\\to C'<\/span> 的繞行方向。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">A'(1,3)<\/span>、<span class=\"m\">B'(5,10)<\/span>、<span class=\"m\">C'(10,10)<\/span>。<\/li>\n<li>原面積：<span class=\"m\">\\overrightarrow{AB}=(2,1)<\/span>、<span class=\"m\">\\overrightarrow{AC}=(1,4)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}2 &amp; 1\\\\ 1 &amp; 4\\end{vmatrix}=\\frac72&gt;0<\/span>，逆時針。<\/li>\n<li><span class=\"m\">\\det A=1-6=-5<\/span>，像的面積 <span class=\"m\">\\frac72\\cdot5=\\frac{35}{2}<\/span>，且方向反轉為順時針。<\/li>\n<li>驗算：<span class=\"m\">\\overrightarrow{A'B'}=(4,7)<\/span>、<span class=\"m\">\\overrightarrow{A'C'}=(9,7)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}4 &amp; 9\\\\ 7 &amp; 7\\end{vmatrix}=-\\frac{35}{2}<\/span>，負號表示順時針（圖 M9-11）。<\/li>\n<\/ol><p>陷阱：面積比取 <span class=\"m\">|\\det A|=5<\/span>，<em>不可寫成 <span class=\"m\">-5<\/span> 倍<\/em>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 11　直線的像<\/strong>　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。求直線 <span class=\"m\">L:\\ x+y=3<\/span> 經 <span class=\"m\">A<\/span> 的像。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">\\det A=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li>\n<li>原像 <span class=\"m\">x=x'-y'<\/span>，<span class=\"m\">y=-x'+2y'<\/span>。<\/li>\n<li>代入 <span class=\"m\">x+y=3<\/span>：<span class=\"m\">(x'-y')+(-x'+2y')=y'=3<\/span>，像為直線 <span class=\"m\">y=3<\/span>。<\/li>\n<\/ol>\n<p>另解（兩點）：<span class=\"m\">L<\/span> 上取 <span class=\"m\">(3,0)\\mapsto(6,3)<\/span>、<span class=\"m\">(0,3)\\mapsto(3,3)<\/span>，過兩點的直線為 <span class=\"m\">y=3<\/span>。<\/p>\n<p>陷阱：<em>以 <span class=\"m\">x'=2x+y,\\ y'=x+y<\/span> 代入<\/em>得不到像；此法只能用於求原像。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 12　由不動直線判讀變換<\/strong>　線性變換 <span class=\"m\">T<\/span> 使直線 <span class=\"m\">y=x<\/span> 上每一點都不動，且 <span class=\"m\">T(1,0)=(3,-2)<\/span>。(1) 求 <span class=\"m\">T<\/span> 的矩陣 <span class=\"m\">A<\/span>；(2) 求 <span class=\"m\">T(1,-1)<\/span>，並說明 <span class=\"m\">T<\/span> 的幾何意義；(3) 單位圓經 <span class=\"m\">T<\/span> 後所圍面積。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">T(1,1)=(1,1)<\/span>，<span class=\"m\">T(0,1)=T(1,1)-T(1,0)=(-2,3)<\/span>，<span class=\"m\">A=\\begin{bmatrix}3 &amp; -2\\\\ -2 &amp; 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">T(1,-1)=(3+2,\\ -2-3)=(5,-5)=5(1,-1)<\/span>。<\/li>\n<li>意義：沿 <span class=\"m\">y=x<\/span> 方向不變，沿 <span class=\"m\">y=-x<\/span> 方向伸長為 5 倍（圖 M9-16）。<\/li>\n<li>面積比 <span class=\"m\">\\det A=9-4=5<\/span>，像所圍面積 <span class=\"m\">5\\pi<\/span>；也可由半軸長 <span class=\"m\">1<\/span> 與 <span class=\"m\">5<\/span> 得 <span class=\"m\">\\pi\\cdot1\\cdot5<\/span>。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 330\" width=\"420\"><defs><marker id=\"M9-f12-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f12-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><marker id=\"M9-f12-m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#7a5cc2\"/><\/marker><\/defs>\n<line x1=\"20\" y1=\"165\" x2=\"400\" y2=\"165\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f12-m0)\"/>\n<line x1=\"210\" y1=\"324.6\" x2=\"210\" y2=\"5.4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f12-m0)\"/>\n<text x=\"396\" y=\"183\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n
