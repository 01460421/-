ox{\\phantom{0}}\\,\\fbox{\\phantom{0}}<\/span> 人。","opts":[],"type":"fill","ans":[],"key":"答案：800","sol":"<span class=\"m\">p=\\frac14<\/span>、<span class=\"m\">q=\\frac12<\/span>，<span class=\"m\">s=\\left(\\frac{1/2}{3/4},\\frac{1/4}{3/4}\\right)=\\left(\\frac23,\\frac13\\right)<\/span>，<span class=\"m\">1200\\times\\frac23=800<\/span>。","steps":[]},{"id":"M10-27","unit":"M10","set":"分級測驗","level":"進階題","src":"","ctx":"<p><strong>第 25–27 題為題組<\/strong><\/p>\n<p>某校有 1200 名學生，每天午餐只在「學餐」或「外食」中擇一。統計顯示：今天在學餐用餐者，明天仍在學餐的機率為 <span class=\"m\">\\frac34<\/span>；今天外食者，明天改在學餐的機率為 <span class=\"m\">\\frac12<\/span>（圖 M10-11）。每位學生各自依此機率選擇，第 1 天（週一）有 600 人在學餐用餐。狀態依「學餐、外食」排序。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 180\" width=\"400\"><defs><marker id=\"M10-m\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-mr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs><circle cx=\"132\" cy=\"90\" r=\"30\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/><text x=\"132\" y=\"95.6\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1f2a44\">學餐<\/text><circle cx=\"268\" cy=\"90\" r=\"30\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/><text x=\"268\" y=\"95.6\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1f2a44\">外食<\/text><path d=\"M157.7,74.6 Q200,49.2 240.6,73.5\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-m)\"/><text x=\"199.6\" y=\"52.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">1/4<\/text><path d=\"M242.3,105.4 Q200,130.8 159.4,106.5\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-m)\"/><text x=\"200.4\" y=\"137.3\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">1/2<\/text><path d=\"M105.5,104.1 C66.6,148.9 66.6,31.1 103.7,75\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-m)\"/><text x=\"42\" y=\"94.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">3/4<\/text><path d=\"M294.5,75.9 C333.4,31.1 333.4,148.9 296.3,105\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-m)\"/><text x=\"358\" y=\"94.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">1/2<\/text><\/svg><figcaption>圖 M10-11　第 25–27 題的轉移圖<\/figcaption><\/figure>","pre":"","stem":"以 <span class=\"m\">c_n<\/span> 表示第 <span class=\"m\">n<\/span> 天在學餐用餐的預期人數（<span class=\"m\">c_1=600<\/span>）。下列敘述哪些正確？（多選）","opts":[{"k":"A","h":"<span class=\"m\">c_2=700<\/span>"},{"k":"B","h":"<span class=\"m\">c_3=787.5<\/span>"},{"k":"C","h":"<span class=\"m\">\\langle c_n\\rangle<\/span> 為遞增數列，且每一項都小於 800"},{"k":"D","h":"若改為第 1 天 1200 人全在學餐，則 <span class=\"m\">c_n<\/span> 仍趨近 800"},{"k":"E","h":"學餐與外食的預期人數之差逐日加倍"}],"type":"multi","ans":["B","C","D"],"key":"(B)(C)(D)","sol":"<span class=\"m\">\\lambda=1-\\frac14-\\frac12=\\frac14<\/span>，<span class=\"m\">c_n=800+(600-800)\\left(\\frac14\\right)^{n-1}=800-200\\left(\\frac14\\right)^{n-1}<\/span>。(A) <span class=\"m\">c_2=\\frac34\\times 600+\\frac12\\times 600=750<\/span>。(B) <span class=\"m\">c_3=800-12.5=787.5<\/span>。(C) 差 <span class=\"m\">200\\left(\\frac14\\right)^{n-1}<\/span> 遞減且恆正。(D) <span class=\"m\">c_n=800+400\\left(\\frac14\\right)^{n-1}\\to 800<\/span>（1200、900、825……）。(E) 差為 <span class=\"m\">2c_n-1200<\/span>：0、300、375……，非加倍。","steps":["先判斷 (A)：<span class=\"m\">c_2=\\frac34\\times 600+\\frac12\\times 600=750<\/span>。","先判斷 (B)：<span class=\"m\">c_3=800-12.5=787.5<\/span>。"],"hk":"hint"},{"id":"M10-28","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"（選填）某二階轉移矩陣 <span class=\"m\">A<\/span> 未知。觀察得 <span class=\"m\">x_0=\\left(\\frac12,\\frac12\\right)<\/span>，<span class=\"m\">x_1<\/span> 的第一分量為 0.6，<span class=\"m\">x_2<\/span> 的第一分量為 0.66。則長期處於狀態 1 的機率為 <span class=\"m\">\\dfrac{\\fbox{\\phantom{0}}}{\\fbox{\\phantom{0}}}<\/span>。","opts":[],"type":"fill","ans":[],"key":"答案：3/4","sol":"設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>。由 <span class=\"m\">x_1<\/span>：<span class=\"m\">\\frac12(1-p)+\\frac12q=0.6<\/span>，<span class=\"m\">q-p=0.2<\/span>。由 <span class=\"m\">x_2=Ax_1=A(0.6,0.4)<\/span>：<span class=\"m\">0.6(1-p)+0.4q=0.66<\/span>，<span class=\"m\">0.4q-0.6p=0.06<\/span>。代入 <span class=\"m\">q=p+0.2<\/span>：<span class=\"m\">-0.2p+0.08=0.06<\/span>，<span class=\"m\">p=0.1<\/span>、<span class=\"m\">q=0.3<\/span>。長期狀態 1 的機率 <span class=\"m\">\\frac{0.3}{0.4}=\\frac34<\/span>。另解：由一般式 <span class=\"m\">a_1-\\alpha=\\lambda(a_0-\\alpha)<\/span>、<span class=\"m\">a_2-\\alpha=\\lambda(a_1-\\alpha)<\/span>，得 <span class=\"m\">(0.6-\\alpha)^2=(0.5-\\alpha)(0.66-\\alpha)<\/span>，<span class=\"m\">0.36-1.2\\alpha=0.33-1.16\\alpha<\/span>，<span class=\"m\">\\alpha=0.75<\/span>。","steps":["設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>。","由 <span class=\"m\">x_1<\/span>：<span class=\"m\">\\frac12(1-p)+\\frac12q=0.6<\/span>，<span class=\"m\">q-p=0.2<\/span>。","由 <span class=\"m\">x_2=Ax_1=A(0.6,0.4)<\/span>：<span class=\"m\">0.6(1-p)+0.4q=0.66<\/span>，<span class=\"m\">0.4q-0.6p=0.06<\/span>。"],"hk":"hint"},{"id":"M10-29","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"某影音平臺的會員每月只有「訂閱」與「退訂」兩種狀態。訂閱者下月退訂的機率為 0.3；退訂者不再回來（圖 M10-12）。狀態依「退訂、訂閱」排序，轉移矩陣為 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 0.3\\\\ 0 &amp; 0.7\\end{bmatrix}<\/span>。下列敘述哪些正確？（多選）\n<figure class=\"fig\"><svg viewBox=\"0 0 380 180\" width=\"380\"><defs><marker id=\"M10-o\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-or\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\" m\">x_n\\to(1,0)<\/span> 仍收斂。(E) 第 1、2 個月續訂、第 3 個月退訂：<span class=\"m\">0.7\\times 0.7\\times 0.3=0.147<\/span>。","steps":["先判斷 (A)：錯（行和不為 1）。","先判斷 (B)：<span class=\"m\">p+q=0.3&gt;0<\/span>，唯一穩定狀態 <span class=\"m\">(1,0)<\/span>。"],"hk":"hint"},{"id":"M10-30","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"某人每天只有「運動」「休息」兩種狀態。今天運動，明天運動的機率為 0.1；今天休息，明天運動的機率為 0.6。狀態依「運動、休息」排序，第 0 天運動，<span class=\"m\">a_n<\/span> 表示第 <span class=\"m\">n<\/span> 天運動的機率。下列敘述哪些正確？（多選）","opts":[{"k":"A","h":"<span class=\"m\">x_1=(0.9,0.1)<\/span>"},{"k":"B","h":"<span class=\"m\">a_n<\/span> 在 0.4 的上下兩側交替出現"},{"k":"C","h":"<span class=\"m\">|a_{n+1}-0.4|=\\frac12|a_n-0.4|<\/span>"},{"k":"D","h":"<span class=\"m\">a_2=0.55<\/span>"},{"k":"E","h":"<span class=\"m\">\\langle a_n\\rangle<\/span> 單調遞減趨近 0.4"}],"type":"multi","ans":["B","C","D"],"key":"(B)(C)(D)","sol":"<span class=\"m\">A=\\begin{bmatrix}0.1 &amp; 0.6\\\\ 0.9 &amp; 0.4\\end{bmatrix}<\/span>，<span class=\"m\">p=0.9<\/span>、<span class=\"m\">q=0.6<\/span>，<span class=\"m\">\\alpha=\\frac{0.6}{1.5}=0.4<\/span>，<span class=\"m\">\\lambda=-0.5<\/span>，<span class=\"m\">a_n=0.4+0.6(-0.5)^n<\/span>。(A) <span class=\"m\">x_1<\/span> 為第 1 行 <span class=\"m\">(0.1,0.9)<\/span>。(B)(C) <span class=\"m\">a_n-0.4<\/span> 每期乘 <span class=\"m\">-0.5<\/span>，變號且絕對值減半。(D) <span class=\"m\">0.4+0.6\\times 0.25=0.55<\/span>。(E) <span class=\"m\">a_n<\/span>：1、0.1、0.55、0.325……，非單調。","steps":["先判斷 (A)：<span class=\"m\">x_1<\/span> 為第 1 行 <span class=\"m\">(0.1,0.9)<\/span>。(B)","先判斷 (C)：<span class=\"m\">a_n-0.4<\/span> 每期乘 <span class=\"m\">-0.5<\/span>，變號且絕對值減半。"],"hk":"hint"},{"id":"M10-31","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"三狀態的轉移矩陣為 <span class=\"m\">A=\\begin{bmatrix}0.9 &amp; 0.1 &amp; 0.1\\\\ 0.05 &amp; 0.8 &amp; 0.1\\\\ 0.05 &amp; 0.1 &amp; 0.8\\end{bmatrix}<\/span>（圖 M10-13）。下列敘述哪些正確？（多選）\n<figure class=\"fig\"><svg viewBox=\"0 0 480 390\" width=\"360\"><defs><marker id=\ roke-width=\"1.6\" marker-end=\"url(#M10-n)\"/><text x=\"300\" y=\"49.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.9<\/text><circle cx=\"129.1\" cy=\"289\" r=\"30\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/><text x=\"129.1\" y=\"294.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1f2a44\">2<\/text><path d=\"M113.3,314.4 C102,372.7 43.1,270.7 97.2,290.1\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-n)\"/><text x=\"51.2\" y=\"338.6\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.8<\/text><circle cx=\"350.9\" cy=\"289\" r=\"30\" fill=\"#c9ebd7\" stroke=\"#2e8b57\" stroke-width=\"2\"/><text x=\"350.9\" y=\"294.3\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1f2a44\">3<\/text><path d=\"M380.8,290 C436.9,270.7 378,372.7 367.8,316.1\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-n)\"/><text x=\"428.8\" y=\"338.6\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.8<\/text><\/svg><figcaption>圖 M10-13　第 31 題的轉移圖<\/figcaption><\/figure>","opts":[{"k":"A","h":"穩定狀態為 <span class=\"m\">\\left(\\frac13,\\frac13,\\frac13\\right)<\/span>"},{"k":"B","h":"穩定狀態為 <span class=\"m\">\\left(\\frac12,\\frac14,\\frac14\\right)<\/span>"},{"k":"C","h":"由狀態 1 出發，兩期後在狀態 1 的機率為 0.81"},{"k":"D","h":"處於穩定狀態時，每期由狀態 1 流出的機率總量等於流入狀態 1 的機率總量"},{"k":"E","h":"<span class=\"m\">A^2<\/span> 的每一行和皆為 1"}],"type":"multi","ans":["B","D","E"],"key":"(B)(D)(E)","sol":"設 <span class=\"m\">s=(a,b,c)<\/span>：第一式 <span class=\"m\">-0.1a+0.1b+0.1c=0<\/span> 得 <span class=\"m\">a=b+c<\/span>，配合 <span class=\"m\">a+b+c=1<\/span> 得 <span class=\"m\">a=\\frac12<\/span>；第二式 <span class=\"m\">0.05a-0.2b+0.1c=0<\/span>，代入 <span class=\"m\">c=\\frac12-b<\/span>：<span class=\"m\">0.025-0.2b+0.05-0.1b=0<\/span>，<span class=\"m\">b=\\frac14<\/span>、<span class=\"m\">c=\\frac14<\/span>。(A) 錯、(B) 對。(C) <span class=\"m\">(A^2)_{11}=0.81+0.1\\times 0.05+0.1\\times 0.05=0.82<\/span>。(D) 流出 <span class=\"m\">0.1\\times\\frac12=0.05<\/span>，流入 <span class=\"m\">0.1\\times\\frac14+0.1\\times\\frac14=0.05<\/span>。(E) 轉移矩陣的乘冪仍為轉移矩陣。","steps":["先判斷 (C)：<span class=\"m\">(A^2)_{11}=0.81+0.1\\times 0.05+0.1\\times 0.05=0.82<\/span>。","先判斷 (D)：流出 <span class=\"m\">0.1\\times\\frac12=0.05<\/span>，流入 <span class=\"m\">0.1\\times\\frac14+0.1\\times\\frac14=0.05<\/span>。"],"hk":"hint"},{"id":"M10-32","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>（<span class=\"m\">0\\le p,q\\le 1<\/span>）為可逆的轉移矩陣。證明：<span class=\"m\">A^{-1}<\/span> 為轉移矩陣若且唯若 <span class=\"m\">A=I<\/span> 或 <span class=\"m\">A=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。","opts":[],"type":"open","ans":[],"key":"參考答案：<span class=\"m\">\\det A=1-p-q\\ne 0<\/span>，記 <span class=\"m\">\\lambda=1-p-q<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{\\lambda}\\begin{bmatrix}1-q &amp; -q\\\\ -p &amp; 1-p\\end{bmatrix}<\/span>。由 <span class=\"m\">uA=u<\/span> 得 <span class=\"m\">u=uA^{-1}<\/span>，行和恆為 1，故 <span class=\"m\">A^{-1}<\/span> 為轉移矩陣 <span class=\"m\">\\iff<\/span> 各元非負。(i) 若 <span class=\"m\">\\lambda&gt;0<\/span>：須 <span class=\"m\">-q\\ge 0<\/span>、<span class=\"m\">-p\\ge 0<\/span>，得 <span class=\"m\">p=q=0<\/span>，<span class=\"m\">A=I<\/span>。(ii) 若 <span class=\"m\">\\lambda&lt;0<\/span>：須 <span class=\"m\">1-q\\le 0<\/span>、<span class=\"m\">1-p\\le 0<\/span>，得 <span class=\"m\">p=q=1<\/span>，<span class=\"m\">A=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；此時 <span class=\"m\">-p/\\lambda=-q/\\lambda=1\\ge 0<\/span> 亦合。反之，<span class=\"m\">I^{-1}=I<\/span>、互換矩陣的反方陣為其本身，皆為轉移矩陣。","sol":"評分要點：寫出 <span class=\"m\">A^{-1}<\/span>（1 分）；說明行和自動為 1（1 分）；依 <span class=\"m\">\\lambda<\/span> 正負分兩種情形討論非負條件（2 分）；說明反向成立（1 分）。","steps":[]},{"id":"M10-33","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>，<span class=\"m\">0&lt;p+q&lt;2<\/span>，<span class=\"m\">x_n=(a_n,1-a_n)<\/span>，<span class=\"m\">x_{n+1}=Ax_n<\/span>。(1) 求 <span class=\"m\">a_n<\/span> 以 <span class=\"m\">a_0<\/span>、<span class=\"m\">p<\/span>、<span class=\"m\">q<\/span>、<span class=\"m\">n<\/span> 表示的式子；(2) 證明 <span class=\"m\">\\displaystyle\\lim_{n\\to\\infty}a_n=\\frac{q}{p+q}<\/span>，且與 <span class=\"m\">a_0<\/span> 無關。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) <span class=\"m\">a_{n+1}=(1-p)a_n+q(1-a_n)=\\lambda a_n+q<\/span>，<span class=\"m\">\\lambda=1-p-q<\/span>。令 <span class=\"m\">\\alpha=\\frac{q}{p+q}<\/span>，則 <span class=\"m\">\\alpha=\\lambda\\alpha+q<\/span>，相減得 <span class=\"m\">a_{n+1}-\\alpha=\\lambda(a_n-\\alpha)<\/span>，故 <span class=\"m\">a_n=\\dfrac{q}{p+q}+(1-p-q)^n\\left(a_0-\\dfrac{q}{p+q}\\right)<\/span>。(2) 由 <span class=\"m\">0&lt;p+q&lt;2<\/span> 得 <span class=\"m\">-1&lt;\\lambda&lt;1<\/span>，<span class=\"m\">\\lambda^n\\to 0<\/span>；<span class=\"m\">a_0-\\alpha<\/span> 為定值，故 <span class=\"m\">a_n\\to\\alpha=\\frac{q}{p+q}<\/span>，與 <span class=\"m\">a_0<\/span> 無關。","sol":"評分要點：遞迴式正確（1 分）；找出 <span class=\"m\">\\alpha<\/span> 並化為等比（1 分）；一般式正確（1 分）；由 <span class=\"m\">|\\lambda|&lt;1<\/span> 推得極限並指出與 <span class=\"m\">a_0<\/span> 無關（1 分）。","steps":[]},{"id":"M10-34","unit":"M10","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"欲設計一個二階轉移矩陣 <span class=\"m\">A<\/span>，使其穩定狀態為 <span class=\"m\">(0.7,0.3)<\/span>，且對任意 <span class=\"m\">x_0<\/span>，<span class=\"m\">x_n<\/span> 與穩定狀態第一分量之差每期恰好減半且不變號。(1) 求 <span class=\"m\">A<\/span>，並說明理由；(2) 若 <span class=\"m\">x_0=(0,1)<\/span>，問至少經過幾期，<span class=\"m\">x_n<\/span> 的第一分量與 0.7 之差小於 0.01？","opts":[],"type":"open","ans":[],"key":"參考答案：(1) 設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>。由 <span class=\"m\">a_n-\\alpha=\\lambda^n(a_0-\\alpha)<\/span>，「每期減半且不變號」即 <span class=\"m\">\\lambda=1-p-q=\\frac12<\/span>，<span class=\"m\">p+q=\\frac12<\/span>；穩定狀態第一分量 <span class=\"m\">\\frac{q}{p+q}=0.7<\/span>，<span class=\"m\">q=0.35<\/span>、<span class=\"m\">p=0.15<\/span>。<span class=\"m\">A=\\begin{bmatrix}0.85 &amp; 0.35\\\\ 0.15 &amp; 0.65\\end{bmatrix}<\/span>，元素皆在 <span class=\"m\">[0,1]<\/span>，且唯一。(2) <span class=\"m\">a_n=0.7+(0.5)^n(0-0.7)=0.7-0.7(0.5)^n<\/span>。<span class=\"m\">0.7(0.5)^n&lt;0.01\\iff 2^n&gt;70<\/span>，<span class=\"m\">2^6=64<\/span>、<span class=\"m\">2^7=128<\/span>，至少 7 期（<span class=\"m\">a_7\\approx 0.6945<\/span>）。","sol":"評分要點：說明 <span class=\"m\">\\lambda=\\frac12<\/span> 的理由（1 分）；解出 <span class=\"m\">p<\/span>、<span class=\"m\">q<\/span> 並驗證合於轉移矩陣（1 分）；一般式（1 分）；正確求出 7（1 分）。","steps":[]},{"id":"M10-K01","unit":"M10","set":"歷屆學測精選","level":"","src":"精選 1　103 學測數學 選填 G（T3-19）","ctx":"","pre":"<p>以下選自歷屆學科能力測驗數學考科中與本單元相關的試題，題目照原卷謄錄，詳解為本書撰寫。完整分類與題型分析見下冊「歷屆學測試題」（括號內為下冊題號）。<\/p>","stem":"已知 <span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span> 是一個轉移矩陣，並且其行列式（值）為 <span class=\"m\">\\dfrac58<\/span>。則 <span class=\"m\">a+d=\\dfrac{\\fbox{30}\\,\\fbox{31}}{\\fbox{32}}<\/span>。（化為最簡分數）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">\\dfrac{13}{8}<\/span>","sol":"\n<ol class=\"steps\"><li>轉移矩陣的元素皆非負，且每一行和為 1：<span class=\"m\">a+c=1<\/span>、<span class=\"m\">b+d=1<\/span>，即 <span class=\"m\">c=1-a<\/span>、<span class=\"m\">b=1-d<\/span>。<\/li>\n<li><span class=\"m\">ad-bc=ad-(1-d)(1-a)=ad-(1-a-d+ad)=a+d-1<\/span>。<\/li>\n<li><span class=\"m\">a+d-1=\\frac58<\/span>，<span class=\"m\">a+d=\\frac{13}{8}<\/span>。<\/li><\/ol>\n<p><strong>補充<\/strong>　若採「每一列和為 1」的約定（<span class=\"m\">b=1-a<\/span>、<span class=\"m\">c=1-d<\/span>），<span class=\"m\">ad-bc=ad-(1-a)(1-d)=a+d-1<\/span>，結果相同；兩種約定互為轉置，而 <span class=\"m\">\\det A^{T}=\\det A<\/span>。<\/p>\n<div class=\"formula\" data-t=\"二階轉移矩陣\"><div class=\"mb\">A=\\begin{bmatrix}a &amp; 1-d\\\\ 1-a &amp; d\\end{bmatrix}:\\quad \\det A=a+d-1,\\qquad -1\\le\\det A\\le 1<\/div><p>另一個特徵值為 <span class=\"m\">a+d-1<\/span>（一個特徵值恆為 1），所以 <span class=\"m\">|a+d-1|&lt;1<\/span> 時 <span class=\"m\">A^n<\/span> 收斂到穩定狀態（進階）。<\/p><\/div>\n<p><strong>考點<\/strong>：轉移矩陣的定義、二階行列式　<strong>對應<\/strong>：M10、M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>忘了轉移矩陣的元素有「和為 1」的限制，以為四個未知數只有一個條件而無法求。<\/p>","steps":["轉移矩陣的元素皆非負，且每一行和為 1：<span class=\"m\">a+c=1<\/span>、<span class=\"m\">b+d=1<\/span>，即 <span class=\"m\">c=1-a<\/span>、<span class=\"m\">b=1-d<\/span>。","<span class=\"m\">ad-bc=ad-(1-d)(1-a)=ad-(1-a-d+ad)=a+d-1<\/span>。","<span class=\"m\">a+d-1=\\frac58<\/span>，<span class=\"m\">a+d=\\frac{13}{8}<\/span>。"]},{"id":"M10-K02","unit":"M10","set":"歷屆學測精選","level":"","src":"精選 2　104 學測數學 選填 G（T3-18）","ctx":"","pre":"","stem":"某一公司，有 A、B、C 三個營業據點，開始時各有 36 位營業員，為了讓營業員了解各據點業務狀況，所以進行兩次調動。每次調動都是：<br>將當時 A 據點營業員中的 1/6 調到 B 據點、1/6 調到 C 據點；<br>將當時 B 據點營業員中的 1/6 調到 A 據點、1/3 調到 C 據點；<br>將當時 C 據點營業員中的 1/6 調到 A 據點、1/6 調到 B 據點。<br>則兩次的調動後，C 據點有 <span class=\"m\">\\fbox{27}\\,\\fbox{28}<\/span> 位營業員。","opts":[],"type":"open","ans":[],"key":"44","sol":"\n<ol class=\"steps\"><li>A 留下 <span class=\"m\">1-\\frac16-\\frac16=\\frac23<\/span>，B 留下 <span class=\"m\">1-\\frac16-\\frac13=\\frac12<\/span>，C 留下 <span class=\"m\">\\frac23<\/span>。以 <span class=\"m\">X_n=\\begin{bmatrix}A_n\\\\ B_n\\\\ C_n\\end{bmatrix}<\/span> 表第 <span class=\"m\">n<\/span> 次調動後的人數，<span class=\"m\">X_{n+1}=MX_n<\/span>，<div class=\"mb\">M=\\begin{bmatrix}\\frac23 &amp; \\frac16 &amp; \\frac16\\\\ \\frac16 &amp; \\frac12 &amp; \\frac16\\\\ \\frac16 &amp; \\frac13 &amp; \\frac23\\end{bmatrix}<\/div>第 <span class=\"m\">j<\/span> 行是第 <span class=\"m\">j<\/span> 個據點人員的去向，每一行和為 1。<\/li>\n<li>第一次：<span class=\"m\">X_1=M\\begin{bmatrix}36\\\\ 36\\\\ 36\\end{bmatrix}=\\begin{bmatrix}24+6+6\\\\ 6+18+6\\\\ 6+12+24\\end{bmatrix}=\\begin{bmatrix}36\\\\ 30\\\\ 42\\end{bmatrix}<\/span>。<\/li>\n<li>第二次：<span class=\"m\">C_2=\\frac16\\cdot36+\\frac13\\cdot30+\\frac23\\cdot42=6+10+28=44<\/span>。（同理 <span class=\"m\">A_2=36<\/span>、<span class=\"m\">B_2=28<\/span>，總數 108 不變。）<\/li><\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 300\" width=\"420\">\n<defs><marker id=\"M10-T3-ar3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<circle cx=\"110\" cy=\"80\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"104\" y=\"86\" font-size=\"17\">A<\/text>\n<circle cx=\"330\" cy=\"80\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"324\" y=\"86\" font-size=\"17\">B<\/text>\n<circle cx=\"220\" cy=\"230\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"214\" y=\"236\" font-size=\"17\">C<\/text>\n<path d=\"M 132,68 Q 220,28 306,68\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"212\" y=\"40\" font-size=\"14\">1/6<\/text>\n<path d=\"M 307,93 Q 220,128 133,93\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"212\" y=\"128\" font-size=\"14\">1/6<\/text>\n<path d=\"M 92,97 Q 110,200 196,234\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"94\" y=\"196\" font-size=\"14\">1/6<\/text>\n<path d=\"M 204,212 Q 160,150 126,100\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"166\" y=\"160\" font-size=\"14\">1/6<\/text>\n<path d=\"M 348,97 Q 330,200 244,234\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"326\" y=\"196\" font-size=\"14\" fill=\"#c2410c\">1/3<\/text>\n<path d=\"M 236,212 Q 280,150 314,100\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"258\" y=\"160\" font-size=\"14\">1/6<\/text>\n<path d=\"M 88,70 C 40,40 40,120 88,92\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"22\" y=\"86\" font-size=\"14\" fill=\"#2e8b57\">2/3<\/text>\n<path d=\"M 352,70 C 400,40 400,120 352,92\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"398\" y=\"86\" font-size=\"14\" fill=\"#2e8b57\">1/2<\/text>\n<path d=\"M 206,250 C 180,295 260,295 234,250\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#M10-T3-ar3)\"/><text x=\"262\" y=\"288\" font-size=\"14\" fill=\"#2e8b57\">2/3<\/text>\n<\/svg><figcaption>圖 T3-3　每次調動的轉移圖：箭頭上的數為「當時人數」的比例，每個據點流出比例（含留下）總和為 1<\/figcaption><\/figure>\n<p><strong>考點<\/strong>：轉移矩陣的建立、<span class=\"m\">X_{n+1}=MX_n<\/span>　<strong>對應<\/strong>：M10<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>第二次調動仍以 36 人計算調出人數。每次調動依「當時」人數按比例分配，必須先算出第一次調動後的人數。<\/p>","steps":["A 留下 <span class=\"m\">1-\\frac16-\\frac16=\\frac23<\/span>，B 留下 <span class=\"m\">1-\\frac16-\\frac13=\\frac12<\/span>，C 留下 <span class=\"m\">\\frac23<\/span>。以 <span class=\"m\">X_n=\\begin{bmatrix}A_n\\\\ B_n\\\\ C_n\\end{bmatrix}<\/span> 表第 <span class=\"m\">n<\/span> 次調動後的人數，<span class=\"m\">X_{n+1}=MX_n<\/span>，<div class=\"mb\">M=\\begin{bmatrix}\\frac23 &amp; \\frac16 &amp; \\frac16\\\\ \\frac16 &amp; \\frac12 &amp; \\frac16\\\\ \\frac16 &amp; \\frac13 &amp; \\frac23\\end{bmatrix}<\/div>第 <span class=\"m\">j<\/span> 行是第 <span class=\"m\">j<\/span> 個據點人員的去向，每一行和為 1。","第一次：<span class=\"m\">X_1=M\\begin{bmatrix}36\\\\ 36\\\\ 36\\end{bmatrix}=\\begin{bmatrix}24+6+6\\\\ 6+18+6\\\\ 6+12+24\\end{bmatrix}=\\begin{bmatrix}36\\\\ 30\\\\ 42\\end{bmatrix}<\/span>。","第二次：<span class=\"m\">C_2=\\frac16\\cdot36+\\frac13\\cdot30+\\frac23\\cdot42=6+10+28=44<\/span>。（同理 <span class=\"m\">A_2=36<\/span>、<span class=\"m\">B_2=28<\/span>，總數 108 不變。）"]}],"examples":[{"title":"例題 1　由轉移圖寫轉移矩陣","q":"<p>依圖 M10-1，狀態依「晴、雨」排序。(1) 寫出轉移矩陣 <span class=\"m\">A<\/span>；(2) 今天晴，求明天各狀態的機率。<\/p>","steps":["第 1 行為「從晴」：到晴 0.6、到雨 0.4；第 2 行為「從雨」：到晴 0.3、到雨 0.7。<span class=\"m\">A=\\begin{bmatrix}0.6 &amp; 0.3\\\\ 0.4 &amp; 0.7\\end{bmatrix}<\/span>，兩行和皆為 1。","<span class=\"m\">x_0=(1,0)<\/span>，<span class=\"m\">x_1=Ax_0=(0.6,0.4)<\/span>，即 <span class=\"m\">A<\/span> 的第 1 行。"],"after":"<p>陷阱：把「晴→雨 0.4」寫在第 1 列第 2 行，得到 <span class=\"m\">\\begin{bmatrix}0.6 &amp; 0.4\\\\ 0.3 &amp; 0.7\\end{bmatrix}<\/span>，是列和為 1 的另一種約定，與 <span class=\"m\">x_{n+1}=Ax_n<\/span> 不相容。<\/p>","sol":"<ol class=\"steps\">\n<li>第 1 行為「從晴」：到晴 0.6、到雨 0.4；第 2 行為「從雨」：到晴 0.3、到雨 0.7。<span class=\"m\">A=\\begin{bmatrix}0.6 &amp; 0.3\\\\ 0.4 &amp; 0.7\\end{bmatrix}<\/span>，兩行和皆為 1。<\/li>\n<li><span class=\"m\">x_0=(1,0)<\/span>，<span class=\"m\">x_1=Ax_0=(0.6,0.4)<\/span>，即 <span class=\"m\">A<\/span> 的第 1 行。<\/li>\n<\/ol>\n<p>陷阱：把「晴→雨 0.4」寫在第 1 列第 2 行，得到 <span class=\"m\">\\begin{bmatrix}0.6 &amp; 0.4\\\\ 0.3 &amp; 0.7\\end{bmatrix}<\/span>，是列和為 1 的另一種約定，與 <span class=\"m\">x_{n+1}=Ax_n<\/span> 不相容。<\/p>"},{"title":"例題 2　由文字敘述求下一期市占","q":"<p>甲、乙兩品牌手機，使用者換機時：原用甲者有 75% 仍選甲，原用乙者有 25% 改選甲。目前甲的市占為 40%，其餘為乙。假設每人每期換機一次，求下一期與再下一期甲的市占。<\/p>","steps":["甲→甲 0.75、甲→乙 0.25；乙→甲 0.25、乙→乙 0.75。<span class=\"m\">A=\\begin{bmatrix}0.75 &amp; 0.25\\\\ 0.25 &amp; 0.75\\end{bmatrix}<\/span>。","<span class=\"m\">x_1=A\\begin{bmatrix}0.4\\\\ 0.6\\end{bmatrix}=\\begin{bmatrix}0.3+0.15\\\\ 0.1+0.45\\end{bmatrix}=\\begin{bmatrix}0.45\\\\ 0.55\\end{bmatrix}<\/span>，下一期 45%。","<span class=\"m\">x_2=Ax_1=(0.3375+0.1375,\\ 0.1125+0.4125)=(0.475,0.525)<\/span>，再下一期 47.5%。"],"after":"<p>陷阱：「原用乙者有 25% 改選甲」給的是 <span class=\"m\">a_{12}<\/span>，不是 <span class=\"m\">a_{21}<\/span>；乙→乙須以 <span class=\"m\">1-0.25<\/span> 補出。<\/p>","sol":"<ol class=\"steps\">\n<li>甲→甲 0.75、甲→乙 0.25；乙→甲 0.25、乙→乙 0.75。<span class=\"m\">A=\\begin{bmatrix}0.75 &amp; 0.25\\\\ 0.25 &amp; 0.75\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">x_1=A\\begin{bmatrix}0.4\\\\ 0.6\\end{bmatrix}=\\begin{bmatrix}0.3+0.15\\\\ 0.1+0.45\\end{bmatrix}=\\begin{bmatrix}0.45\\\\ 0.55\\end{bmatrix}<\/span>，下一期 45%。<\/li>\n<li><span class=\"m\">x_2=Ax_1=(0.3375+0.1375,\\ 0.1125+0.4125)=(0.475,0.525)<\/span>，再下一期 47.5%。<\/li>\n<\/ol>\n<p>陷阱：「原用乙者有 25% 改選甲」給的是 <span class=\"m\">a_{12}<\/span>，不是 <span class=\"m\">a_{21}<\/span>；乙→乙須以 <span class=\"m\">1-0.25<\/span> 補出。<\/p>"},{"title":"例題 3　兩期後的機率：樹狀圖與矩陣","q":"<p>沿用例題 1，今天晴，求後天雨的機率。<\/p>","steps":["樹狀圖（圖 M10-4）：晴→晴→雨 <span class=\"m\">0.6\\times 0.4=0.24<\/span>；晴→雨→雨 <span class=\"m\">0.4\\times 0.7=0.28<\/span>。","兩路徑互斥，相加得 <span class=\"m\">0.52<\/span>。"],"after":"<p><strong>另解<\/strong>　<span class=\"m\">x_2=A^2x_0<\/span>，即 <span class=\"m\">A^2<\/span> 的第 1 行。<span class=\"m\">A^2=\\begin{bmatrix}0.48 &amp; 0.39\\\\ 0.52 &amp; 0.61\\end{bmatrix}<\/span>，<span class=\"m\">(A^2)_{21}=0.52<\/span>。<\/p>\n<p>陷阱：只算「晴→雨→雨」一條路徑（0.28），或誤取 <span class=\"m\">(A^2)_{12}=0.39<\/span>（那是「今天雨，後天晴」）。<\/p>","sol":"<ol class=\"steps\">\n<li>樹狀圖（圖 M10-4）：晴→晴→雨 <span class=\"m\">0.6\\times 0.4=0.24<\/span>；晴→雨→雨 <span class=\"m\">0.4\\times 0.7=0.28<\/span>。<\/li>\n<li>兩路徑互斥，相加得 <span class=\"m\">0.52<\/span>。<\/li>\n<\/ol>\n<p><strong>另解<\/strong>　<span class=\"m\">x_2=A^2x_0<\/span>，即 <span class=\"m\">A^2<\/span> 的第 1 行。<span class=\"m\">A^2=\\begin{bmatrix}0.48 &amp; 0.39\\\\ 0.52 &amp; 0.61\\end{bmatrix}<\/span>，<span class=\"m\">(A^2)_{21}=0.52<\/span>。<\/p>\n<p>陷阱：只算「晴→雨→雨」一條路徑（0.28），或誤取 <span class=\"m\">(A^2)_{12}=0.39<\/span>（那是「今天雨，後天晴」）。<\/p>"},{"title":"例題 4　三期轉移機率","q":"<p>沿用例題 1，今天雨，求三天後晴的機率。<\/p>","steps":["所求為 <span class=\"m\">(A^3)_{12}<\/span>：由狀態 2（雨）出發，三期後在狀態 1（晴）。","只需 <span class=\"m\">A^3<\/span> 的第 2 行：<span class=\"m\">A^3e_2=A(A^2e_2)=A\\begin{bmatrix}0.39\\\\ 0.61\\end{bmatrix}=\\begin{bmatrix}0.234+0.183\\\\ 0.156+0.427\\end{bmatrix}=\\begin{bmatrix}0.417\\\\ 0.583\\end{bmatrix}<\/span>。","三天後晴的機率為 <span class=\"m\">0.417<\/span>。"],"after":"<p>陷阱：計算整個 <span class=\"m\">A^3<\/span> 費時；只問一個起點時，以向量逐期相乘即可。<\/p>","sol":"<ol class=\"steps\">\n<li>所求為 <span class=\"m\">(A^3)_{12}<\/span>：由狀態 2（雨）出發，三期後在狀態 1（晴）。<\/li>\n<li>只需 <span class=\"m\">A^3<\/span> 的第 2 行：<span class=\"m\">A^3e_2=A(A^2e_2)=A\\begin{bmatrix}0.39\\\\ 0.61\\end{bmatrix}=\\begin{bmatrix}0.234+0.183\\\\ 0.156+0.427\\end{bmatrix}=\\begin{bmatrix}0.417\\\\ 0.583\\end{bmatrix}<\/span>。<\/li>\n<li>三天後晴的機率為 <span class=\"m\">0.417<\/span>。<\/li>\n<\/ol>\n<p>陷阱：計算整個 <span class=\"m\">A^3<\/span> 費時；只問一個起點時，以向量逐期相乘即可。<\/p>"},{"title":"例題 5　人數型：人口遷移","q":"<p>某地區都市人口 70 萬、鄉村人口 20 萬。每年都市人口有 5% 遷往鄉村，鄉村人口有 10% 遷往都市，總人口不變。求一年後、兩年後的都市人口，以及長期的都市人口。<\/p>","steps":["<span class=\"m\">A=\\begin{bmatrix}0.95 &amp; 0.1\\\\ 0.05 &amp; 0.9\\end{bmatrix}<\/span>，<span class=\"m\">x_0=(70,20)<\/span>（萬人）。","<span class=\"m\">x_1=(66.5+2,\\ 3.5+18)=(68.5,\\ 21.5)<\/span>（圖 M10-3）。","<span class=\"m\">x_2=(0.95\\times 68.5+0.1\\times 21.5,\\ \\cdots)=(67.225,\\ 22.775)<\/span>。","穩定狀態：<span class=\"m\">p=0.05<\/span>、<span class=\"m\">q=0.1<\/span>，<span class=\"m\">s=\\left(\\frac{0.1}{0.15},\\frac{0.05}{0.15}\\right)=\\left(\\frac23,\\frac13\\right)<\/span>；長期都市人口 <span class=\"m\">90\\times\\frac23=60<\/span> 萬。"],"after":"<p>陷阱：兩年後的人數不能用「70 萬乘 <span class=\"m\">0.95^2<\/span>」，須計入每年由鄉村遷入的人口。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">A=\\begin{bmatrix}0.95 &amp; 0.1\\\\ 0.05 &amp; 0.9\\end{bmatrix}<\/span>，<span class=\"m\">x_0=(70,20)<\/span>（萬人）。<\/li>\n<li><span class=\"m\">x_1=(66.5+2,\\ 3.5+18)=(68.5,\\ 21.5)<\/span>（圖 M10-3）。<\/li>\n<li><span class=\"m\">x_2=(0.95\\times 68.5+0.1\\times 21.5,\\ \\cdots)=(67.225,\\ 22.775)<\/span>。<\/li>\n<li>穩定狀態：<span class=\"m\">p=0.05<\/span>、<span class=\"m\">q=0.1<\/span>，<span class=\"m\">s=\\left(\\frac{0.1}{0.15},\\frac{0.05}{0.15}\\right)=\\left(\\frac23,\\frac13\\right)<\/span>；長期都市人口 <span class=\"m\">90\\times\\frac23=60<\/span> 萬。<\/li>\n<\/ol>\n<p>陷阱：兩年後的人數不能用「70 萬乘 <span class=\"m\">0.95^2<\/span>」，須計入每年由鄉村遷入的人口。<\/p>"},{"title":"例題 6　求穩定狀態","q":"<p>求例題 1 中 <span class=\"m\">A<\/span> 的穩定狀態，並說明其意義。<\/p>","steps":["設 <span class=\"m\">s=(a,b)<\/span>，<span class=\"m\">(A-I)s=0<\/span>：<span class=\"m\">\\begin{cases}-0.4a+0.3b=0\\\\ 0.4a-0.3b=0\\end{cases}<\/span>，兩式相同。","由 <span class=\"m\">0.4a=0.3b<\/span> 與 <span class=\"m\">a+b=1<\/span>，得 <span class=\"m\">a=\\frac37<\/span>、<span class=\"m\">b=\\frac47<\/span>。","驗算：<span class=\"m\">0.6\\cdot\\frac37+0.3\\cdot\\frac47=\\frac{1.8+1.2}{7}=\\frac37<\/span>。","意義：不論今天天氣如何，很久以後某天為晴的機率趨近 <span class=\"m\">\\frac37<\/span>；長期約 <span class=\"m\">\\frac37<\/span> 的日子為晴天。"],"after":"<p><strong>另解<\/strong>　流出等於流入：<span class=\"m\">0.4a=0.3b<\/span>，<span class=\"m\">a:b=3:4<\/span>。<\/p>\n<p>陷阱：解出 <span class=\"m\">a:b=3:4<\/span> 後誤答 <span class=\"m\">(3,4)<\/span>，未化為機率向量。<\/p>","sol":"<ol class=\"steps\">\n<li>設 <span class=\"m\">s=(a,b)<\/span>，<span class=\"m\">(A-I)s=0<\/span>：<span class=\"m\">\\begin{cases}-0.4a+0.3b=0\\\\ 0.4a-0.3b=0\\end{cases}<\/span>，兩式相同。<\/li>\n<li>由 <span class=\"m\">0.4a=0.3b<\/span> 與 <span class=\"m\">a+b=1<\/span>，得 <span class=\"m\">a=\\frac37<\/span>、<span class=\"m\">b=\\frac47<\/span>。<\/li>\n<li>驗算：<span class=\"m\">0.6\\cdot\\frac37+0.3\\cdot\\frac47=\\frac{1.8+1.2}{7}=\\frac37<\/span>。<\/li>\n<li>意義：不論今天天氣如何，很久以後某天為晴的機率趨近 <span class=\"m\">\\frac37<\/span>；長期約 <span class=\"m\">\\frac37<\/span> 的日子為晴天。<\/li>\n<\/ol>\n<p><strong>另解<\/strong>　流出等於流入：<span class=\"m\">0.4a=0.3b<\/span>，<span class=\"m\">a:b=3:4<\/span>。<\/p>\n<p>陷阱：解出 <span class=\"m\">a:b=3:4<\/span> 後誤答 <span class=\"m\">(3,4)<\/span>，未化為機率向量。<\/p>"},{"title":"例題 7　由穩定狀態反求參數","q":"<p>轉移矩陣 <span class=\"m\">A=\\begin{bmatrix}a &amp; 0.2\\\\ 1-a &amp; 0.8\\end{bmatrix}<\/span>（<span class=\"m\">0\\le a\\le 1<\/span>）的穩定狀態為 <span class=\"m\">\\left(\\frac25,\\frac35\\right)<\/span>，求 <span class=\"m\">a<\/span>。<\/p>","steps":["由第一式 <span class=\"m\">a\\cdot\\frac25+0.2\\cdot\\frac35=\\frac25<\/span>。","<span class=\"m\">\\frac{2a}{5}=\\frac25-\\frac{3}{25}=\\frac{7}{25}<\/span>，得 <span class=\"m\">a=0.7<\/span>。","驗算第二式：<span class=\"m\">0.3\\cdot\\frac25+0.8\\cdot\\frac35=0.12+0.48=0.6<\/span>。"],"after":"<p><strong>另解<\/strong>　流出等於流入：<span class=\"m\">(1-a)\\cdot\\frac25=0.2\\cdot\\frac35<\/span>，<span class=\"m\">1-a=0.3<\/span>。<\/p>\n<p>陷阱：把穩定狀態誤記為 <span class=\"m\">\\left(\\frac{p}{p+q},\\frac{q}{p+q}\\right)<\/span>，會得到錯誤的 <span class=\"m\">a<\/span>。<\/p>","sol":"<ol class=\"steps\">\n<li>由第一式 <span class=\"m\">a\\cdot\\frac25+0.2\\cdot\\frac35=\\frac25<\/span>。<\/li>\n<li><span class=\"m\">\\frac{2a}{5}=\\frac25-\\frac{3}{25}=\\frac{7}{25}<\/span>，得 <span class=\"m\">a=0.7<\/span>。<\/li>\n<li>驗算第二式：<span class=\"m\">0.3\\cdot\\frac25+0.8\\cdot\\frac35=0.12+0.48=0.6<\/span>。<\/li>\n<\/ol>\n<p><strong>另解<\/strong>　流出等於流入：<span class=\"m\">(1-a)\\cdot\\frac25=0.2\\cdot\\frac35<\/span>，<span class=\"m\">1-a=0.3<\/span>。<\/p>\n<p>陷阱：把穩定狀態誤記為 <span class=\"m\">\\left(\\frac{p}{p+q},\\frac{q}{p+q}\\right)<\/span>，會得到錯誤的 <span class=\"m\">a<\/span>。<\/p>"},{"title":"例題 8　n 期後的一般式","q":"<p><span class=\"m\">A=\\begin{bmatrix}0.8 &amp; 0.4\\\\ 0.2 &amp; 0.6\\end{bmatrix}<\/span>，<span class=\"m\">x_0=(0,1)<\/span>，求 <span class=\"m\">x_n<\/span> 與 <span class=\"m\">\\displaystyle\\lim_{n\\to\\infty}x_n<\/span>。<\/p>","steps":["<span class=\"m\">p=0.2<\/span>、<span class=\"m\">q=0.4<\/span>，<span class=\"m\">\\lambda=1-0.6=0.4<\/span>，<span class=\"m\">\\alpha=\\frac{0.4}{0.6}=\\frac23<\/span>。","設 <span class=\"m\">x_n=(a_n,1-a_n)<\/span>：<span class=\"m\">a_{n+1}=0.8a_n+0.4(1-a_n)=0.4a_n+0.4<\/span>。","<span class=\"m\">a_{n+1}-\\frac23=0.4\\left(a_n-\\frac23\\right)<\/span>，<span class=\"m\">a_n=\\frac23-\\frac23(0.4)^n<\/span>。","<span class=\"m\">x_n=\\left(\\frac23-\\frac23(0.4)^n,\\ \\frac13+\\frac23(0.4)^n\\right)\\to\\left(\\frac23,\\frac13\\right)<\/span>。"],"after":"<p>驗算：<span class=\"m\">n=1<\/span> 得 <span class=\"m\">a_1=0.4<\/span>，與 <span class=\"m\">Ax_0=(0.4,0.6)<\/span> 相符；<span class=\"m\">n=2<\/span> 得 <span class=\"m\">a_2=0.56<\/span>（圖 M10-5a）。<\/p>\n<p><strong>另解<\/strong>　套公式 <span class=\"m\">a_n=\\alpha+\\lambda^n(a_0-\\alpha)=\\frac23+(0.4)^n\\left(0-\\frac23\\right)<\/span>。<\/p>\n<p>陷阱：公比寫成 <span class=\"m\">0.8<\/span>（對角元）。公比是 <span class=\"m\">\\lambda=1-p-q=\\det A<\/span>。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">p=0.2<\/span>、<span class=\"m\">q=0.4<\/span>，<span class=\"m\">\\lambda=1-0.6=0.4<\/span>，<span class=\"m\">\\alpha=\\frac{0.4}{0.6}=\\frac23<\/span>。<\/li>\n<li>設 <span class=\"m\">x_n=(a_n,1-a_n)<\/span>：<span class=\"m\">a_{n+1}=0.8a_n+0.4(1-a_n)=0.4a_n+0.4<\/span>。<\/li>\n<li><span class=\"m\">a_{n+1}-\\frac23=0.4\\left(a_n-\\frac23\\right)<\/span>，<span class=\"m\">a_n=\\frac23-\\frac23(0.4)^n<\/span>。<\/li>\n<li><span class=\"m\">x_n=\\left(\\frac23-\\frac23(0.4)^n,\\ \\frac13+\\frac23(0.4)^n\\right)\\to\\left(\\frac23,\\frac13\\right)<\/span>。<\/li>\n<\/ol>\n<p>驗算：<span class=\"m\">n=1<\/span> 得 <span class=\"m\">a_1=0.4<\/span>，與 <span class=\"m\">Ax_0=(0.4,0.6)<\/span> 相符；<span class=\"m\">n=2<\/span> 得 <span class=\"m\">a_2=0.56<\/span>（圖 M10-5a）。<\/p>\n<p><strong>另解<\/strong>　套公式 <span class=\"m\">a_n=\\alpha+\\lambda^n(a_0-\\alpha)=\\frac23+(0.4)^n\\left(0-\\frac23\\right)<\/span>。<\/p>\n<p>陷阱：公比寫成 <span class=\"m\">0.8<\/span>（對角元）。公比是 <span class=\"m\">\\lambda=1-p-q=\\det A<\/span>。<\/p>"},{"title":"例題 9　n 次方與極限矩陣","q":"<p>沿用例題 8 的 <span class=\"m\">A<\/span>，求 <span class=\"m\">A^n<\/span> 與 <span class=\"m\">\\displaystyle\\lim_{n\\to\\infty}A^n<\/span>，並說明長期分布與初始狀態無關。<\/p>","steps":["由分解法，<span class=\"m\">p+q=0.6<\/span>：<span class=\"m\">A^n=\\dfrac{1}{0.6}\\begin{bmatrix}0.4 &amp; 0.4\\\\ 0.2 &amp; 0.2\\end{bmatrix}+\\dfrac{(0.4)^n}{0.6}\\begin{bmatrix}0.2 &amp; -0.4\\\\ -0.2 &amp; 0.4\\end{bmatrix}<\/span>","整理：<div class=\"mb\">A^n=\\begin{bmatrix}\\dfrac23+\\dfrac13(0.4)^n &amp; \\dfrac23-\\dfrac23(0.4)^n\\\\[2mm] \\dfrac13-\\dfrac13(0.4)^n &amp; \\dfrac13+\\dfrac23(0.4)^n\\end{bmatrix}<\/div>驗算 <span class=\"m\">n=3<\/span>：<span class=\"m\">(A^3)_{11}=\\frac23+\\frac{0.064}{3}=\\frac{86}{125}<\/span>，與直接相乘相同。","<span class=\"m\">(0.4)^n\\to 0<\/span>，<span class=\"m\">A^n\\to\\begin{bmatrix}\\dfrac23 &amp; \\dfrac23\\\\[1mm] \\dfrac13 &amp; \\dfrac13\\end{bmatrix}<\/span>。","對任意 <span class=\"m\">x_0=(c,1-c)<\/span>，<span class=\"m\">\\lim A^nx_0=\\left(\\frac23c+\\frac23(1-c),\\ \\frac13c+\\frac13(1-c)\\right)=\\left(\\frac23,\\frac13\\right)<\/span>，與 <span class=\"m\">c<\/span> 無關。"],"after":"<p>陷阱：極限矩陣兩行相同、兩列不同；誤寫成 <span class=\"m\">\\begin{bmatrix}\\frac23 &amp; \\frac13\\\\ \\frac23 &amp; \\frac13\\end{bmatrix}<\/span> 是列和為 1 約定的寫法。<\/p>","sol":"<ol class=\"steps\">\n<li>由分解法，<span class=\"m\">p+q=0.6<\/span>：<span class=\"m\">A^n=\\dfrac{1}{0.6}\\begin{bmatrix}0.4 &amp; 0.4\\\\ 0.2 &amp; 0.2\\end{bmatrix}+\\dfrac{(0.4)^n}{0.6}\\begin{bmatrix}0.2 &amp; -0.4\\\\ -0.2 &amp; 0.4\\end{bmatrix}<\/span><\/li>\n<li>整理：<div class=\"mb\">A^n=\\begin{bmatrix}\\dfrac23+\\dfrac13(0.4)^n &amp; \\dfrac23-\\dfrac23(0.4)^n\\\\[2mm] \\dfrac13-\\dfrac13(0.4)^n &amp; \\dfrac13+\\dfrac23(0.4)^n\\end{bmatrix}<\/div>驗算 <span class=\"m\">n=3<\/span>：<span class=\"m\">(A^3)_{11}=\\frac23+\\frac{0.064}{3}=\\frac{86}{125}<\/span>，與直接相乘相同。<\/li>\n<li><span class=\"m\">(0.4)^n\\to 0<\/span>，<span class=\"m\">A^n\\to\\begin{bmatrix}\\dfrac23 &amp; \\dfrac23\\\\[1mm] \\dfrac13 &amp; \\dfrac13\\end{bmatrix}<\/span>。<\/li>\n<li>對任意 <span class=\"m\">x_0=(c,1-c)<\/span>，<span class=\"m\">\\lim A^nx_0=\\left(\\frac23c+\\frac23(1-c),\\ \\frac13c+\\frac13(1-c)\\right)=\\left(\\frac23,\\frac13\\right)<\/span>，與 <span class=\"m\">c<\/span> 無關。<\/li>\n<\/ol>\n<p>陷阱：極限矩陣兩行相同、兩列不同；誤寫成 <span class=\"m\">\\begin{bmatrix}\\frac23 &amp; \\frac13\\\\ \\frac23 &amp; \\frac13\\end{bmatrix}<\/span> 是列和為 1 約定的寫法。<\/p>"},{"title":"例題 10　反推前一期","q":"<p><span class=\"m\">A=\\begin{bmatrix}0.9 &amp; 0.4\\\\ 0.1 &amp; 0.6\\end{bmatrix}<\/span>，已知 <span class=\"m\">x_1=(0.78,0.22)<\/span>，求 <span class=\"m\">x_0<\/span>，並判斷 <span class=\"m\">A^{-1}<\/span> 是否為轉移矩陣。<\/p>","steps":["設 <span class=\"m\">x_0=(c,1-c)<\/span>，第一分量 <span class=\"m\">0.9c+0.4(1-c)=0.4+0.5c=0.78<\/span>，<span class=\"m\">c=0.76<\/span>，<span class=\"m\">x_0=(0.76,0.24)<\/span>。","<span class=\"m\">\\det A=0.54-0.04=0.5<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{0.5}\\begin{bmatrix}0.6 &amp; -0.4\\\\ -0.1 &amp; 0.9\\end{bmatrix}=\\begin{bmatrix}1.2 &amp; -0.8\\\\ -0.2 &amp; 1.8\\end{bmatrix}<\/span>。","<span class=\"m\">A^{-1}<\/span> 每行和為 1，但含負元，不是轉移矩陣。"],"after":"<p><strong>另解<\/strong>　<span class=\"m\">x_0=A^{-1}x_1=(1.2\\times 0.78-0.8\\times 0.22,\\ -0.2\\times 0.78+1.8\\times 0.22)=(0.76,\\ 0.24)<\/span>。<\/p>\n<p>陷阱：以為「反方陣表示時間倒流的轉移」而把 <span class=\"m\">A^{-1}<\/span> 當作轉移矩陣。<\/p>","sol":"<ol class=\"steps\">\n<li>設 <span class=\"m\">x_0=(c,1-c)<\/span>，第一分量 <span class=\"m\">0.9c+0.4(1-c)=0.4+0.5c=0.78<\/span>，<span class=\"m\">c=0.76<\/span>，<span class=\"m\">x_0=(0.76,0.24)<\/span>。<\/li>\n<li><span class=\"m\">\\det A=0.54-0.04=0.5<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{0.5}\\begin{bmatrix}0.6 &amp; -0.4\\\\ -0.1 &amp; 0.9\\end{bmatrix}=\\begin{bmatrix}1.2 &amp; -0.8\\\\ -0.2 &amp; 1.8\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">A^{-1}<\/span> 每行和為 1，但含負元，不是轉移矩陣。<\/li>\n<\/ol>\n<p><strong>另解<\/strong>　<span class=\"m\">x_0=A^{-1}x_1=(1.2\\times 0.78-0.8\\times 0.22,\\ -0.2\\times 0.78+1.8\\times 0.22)=(0.76,\\ 0.24)<\/span>。<\/p>\n<p>陷阱：以為「反方陣表示時間倒流的轉移」而把 <span class=\"m\">A^{-1}<\/span> 當作轉移矩陣。<\/p>"},{"title":"例題 11　判斷長期行為","q":"<p>對下列轉移矩陣，判斷是否正則，並描述 <span class=\"m\">x_n<\/span> 的長期行為：<span class=\"m\">B=\\begin{bmatrix}1 &amp; 0.4\\\\ 0 &amp; 0.6\\end{bmatrix}<\/span>，<span class=\"m\">C=\\begin{bmatrix}0 &amp; 0.25\\\\ 1 &amp; 0.75\\end{bmatrix}<\/span>，<span class=\"m\">D=\\begin{bmatrix}0.5 &amp; 1\\\\ 0.5 &amp; 0\\end{bmatrix}<\/span>。<\/p>","steps":["<span class=\"m\">B<\/span>：<span class=\"m\">p=0<\/span>、<span class=\"m\">q=0.4<\/span>，狀態 1 為吸收狀態；<span class=\"m\">B^n<\/span> 的 (2,1) 元恆為 0，不是正則。<span class=\"m\">\\lambda=0.6<\/span>，<span class=\"m\">x_n\\to(1,0)<\/span>。","<span class=\"m\">C<\/span>：<span class=\"m\">p=1<\/span>、<span class=\"m\">q=0.25<\/span>。<span class=\"m\">C^2=\\begin{bmatrix}0.25 &amp; 0.1875\\\\ 0.75 &amp; 0.8125\\end{bmatrix}<\/span> 各元皆正，<span class=\"m\">C<\/span> 正則。<span class=\"m\">\\lambda=-0.25<\/span>，<span class=\"m\">x_n<\/span> 擺盪趨近 <span class=\"m\">s=\\left(\\frac{0.25}{1.25},\\frac{1}{1.25}\\right)=(0.2,0.8)<\/span>。","<span class=\"m\">D<\/span>：<span class=\"m\">p=0.5<\/span>、<span class=\"m\">q=1<\/span>。<span class=\"m\">D^2=\\begin{bmatrix}0.75 &amp; 0.5\\\\ 0.25 &amp; 0.5\\end{bmatrix}<\/span> 各元皆正，正則。<span class=\"m\">\\lambda=-0.5<\/span>，<span class=\"m\">x_n<\/span> 擺盪趨近 <span class=\"m\">\\left(\\frac23,\\frac13\\right)<\/span>。"],"after":"<p>陷阱：(1) 看到 0 就判定不正則；(2) 以為不正則就不收斂。<span class=\"m\">B<\/span> 不正則但仍收斂，只是極限 <span class=\"m\">(1,0)<\/span> 有 0 分量。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">B<\/span>：<span class=\"m\">p=0<\/span>、<span class=\"m\">q=0.4<\/span>，狀態 1 為吸收狀態；<span class=\"m\">B^n<\/span> 的 (2,1) 元恆為 0，不是正則。<span class=\"m\">\\lambda=0.6<\/span>，<span class=\"m\">x_n\\to(1,0)<\/span>。<\/li>\n<li><span class=\"m\">C<\/span>：<span class=\"m\">p=1<\/span>、<span class=\"m\">q=0.25<\/span>。<span class=\"m\">C^2=\\begin{bmatrix}0.25 &amp; 0.1875\\\\ 0.75 &amp; 0.8125\\end{bmatrix}<\/span> 各元皆正，<span class=\"m\">C<\/span> 正則。<span class=\"m\">\\lambda=-0.25<\/span>，<span class=\"m\">x_n<\/span> 擺盪趨近 <span class=\"m\">s=\\left(\\frac{0.25}{1.25},\\frac{1}{1.25}\\right)=(0.2,0.8)<\/span>。<\/li>\n<li><span class=\"m\">D<\/span>：<span class=\"m\">p=0.5<\/span>、<span class=\"m\">q=1<\/span>。<span class=\"m\">D^2=\\begin{bmatrix}0.75 &amp; 0.5\\\\ 0.25 &amp; 0.5\\end{bmatrix}<\/span> 各元皆正，正則。<span class=\"m\">\\lambda=-0.5<\/span>，<span class=\"m\">x_n<\/span> 擺盪趨近 <span class=\"m\">\\left(\\frac23,\\frac13\\right)<\/span>。<\/li>\n<\/ol>\n<p>陷阱：(1) 看到 0 就判定不正則；(2) 以為不正則就不收斂。<span class=\"m\">B<\/span> 不正則但仍收斂，只是極限 <span class=\"m\">(1,0)<\/span> 有 0 分量。<\/p>"},{"title":"例題 12　三階轉移矩陣（進階）","q":"<p>某市分北、中、南三區，每年人口遷移比例如圖 M10-8，總人口 1200 萬且不變。(1) 寫出轉移矩陣；(2) 求長期各區人口；(3) 若今年北、中、南為 600、300、300 萬，求明年各區人口。<\/p>","steps":["<span class=\"m\">A=\\begin{bmatrix}0.8 &amp; 0.1 &amp; 0.1\\\\ 0.1 &amp; 0.8 &amp; 0.2\\\\ 0.1 &amp; 0.1 &amp; 0.7\\end{bmatrix}<\/span>，三行和皆為 1。","設 <span class=\"m\">s=(a,b,c)<\/span>：<span class=\"m\">\\begin{cases}-0.2a+0.1b+0.1c=0\\\\ 0.1a-0.2b+0.2c=0\\\\ a+b+c=1\\end{cases}<\/span>","第一式 <span class=\"m\">\\times 10<\/span>：<span class=\"m\">b+c=2a<\/span>，代入第三式得 <span class=\"m\">3a=1<\/span>，<span class=\"m\">a=\\frac13<\/span>。","第二式 <span class=\"m\">\\times 10<\/span>：<span class=\"m\">a-2b+2c=0<\/span>，又 <span class=\"m\">b+c=\\frac23<\/span>，解得 <span class=\"m\">b=\\frac{5}{12}<\/span>、<span class=\"m\">c=\\frac14<\/span>。","長期人口：北 400 萬、中 500 萬、南 300 萬。","明年：<span class=\"m\">A(600,300,300)=(480+30+30,\\ 60+240+60,\\ 60+30+210)=(540,360,300)<\/span> 萬。"],"after":"<p>驗算：<span class=\"m\">A(400,500,300)=(320+50+30,\\ 40+400+60,\\ 40+50+210)=(400,500,300)<\/span>。<\/p>\n<p>陷阱：只解 <span class=\"m\">(A-I)s=0<\/span> 的三式而不加總和條件，解為 <span class=\"m\">t(4,5,3)<\/span> 形式的無限多組，無法定值。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">A=\\begin{bmatrix}0.8 &amp; 0.1 &amp; 0.1\\\\ 0.1 &amp; 0.8 &amp; 0.2\\\\ 0.1 &amp; 0.1 &amp; 0.7\\end{bmatrix}<\/span>，三行和皆為 1。<\/li>\n<li>設 <span class=\"m\">s=(a,b,c)<\/span>：<span class=\"m\">\\begin{cases}-0.2a+0.1b+0.1c=0\\\\ 0.1a-0.2b+0.2c=0\\\\ a+b+c=1\\end{cases}<\/span><\/li>\n<li>第一式 <span class=\"m\">\\times 10<\/span>：<span class=\"m\">b+c=2a<\/span>，代入第三式得 <span class=\"m\">3a=1<\/span>，<span class=\"m\">a=\\frac13<\/span>。<\/li>\n<li>第二式 <span class=\"m\">\\times 10<\/span>：<span class=\"m\">a-2b+2c=0<\/span>，又 <span class=\"m\">b+c=\\frac23<\/span>，解得 <span class=\"m\">b=\\frac{5}{12}<\/span>、<span class=\"m\">c=\\frac14<\/span>。<\/li>\n<li>長期人口：北 400 萬、中 500 萬、南 300 萬。<\/li>\n<li>明年：<span class=\"m\">A(600,300,300)=(480+30+30,\\ 60+240+60,\\ 60+30+210)=(540,360,300)<\/span> 萬。<\/li>\n<\/ol>\n<p>驗算：<span class=\"m\">A(400,500,300)=(320+50+30,\\ 40+400+60,\\ 40+50+210)=(400,500,300)<\/span>。<\/p>\n<p>陷阱：只解 <span class=\"m\">(A-I)s=0<\/span> 的三式而不加總和條件，解為 <span class=\"m\">t(4,5,3)<\/span> 形式的無限多組，無法定值。<\/p>"},{"title":"例題 13　至少經過幾期（挑戰）","q":"<p>甲、乙兩家電信公司，每月甲的用戶有 8% 轉到乙，乙的用戶有 12% 轉到甲。目前甲的市占為 10%。問至少經過幾個月，甲的市占會超過 59%？（<span class=\"m\">\\log 2\\approx 0.3010<\/span>）<\/p>","steps":["<span class=\"m\">p=0.08<\/span>、<span class=\"m\">q=0.12<\/span>，<span class=\"m\">\\lambda=0.8<\/span>，<span class=\"m\">\\alpha=\\frac{0.12}{0.2}=0.6<\/span>。","<span class=\"m\">a_n=0.6+(0.8)^n(0.1-0.6)=0.6-0.5(0.8)^n<\/span>。","<span class=\"m\">a_n&gt;0.59\\iff 0.5(0.8)^n&lt;0.01\\iff (0.8)^n&lt;0.02<\/span>。","取對數：<span class=\"m\">n\\log 0.8&lt;\\log 0.02<\/span>；<span class=\"m\">\\log 0.8=3\\log 2-1\\approx -0.0970<\/span>，<span class=\"m\">\\log 0.02=\\log 2-2\\approx -1.6990<\/span>。","<span class=\"m\">n&gt;\\dfrac{1.6990}{0.0970}\\approx 17.5<\/span>，至少 18 個月。"],"after":"<p>驗算：<span class=\"m\">a_{17}\\approx 0.5887<\/span>，<span class=\"m\">a_{18}\\approx 0.5910<\/span>。<\/p>\n<p>陷阱：除以負數 <span class=\"m\">\\log 0.8<\/span> 時忘記不等號變向；或把 <span class=\"m\">a_n<\/span> 寫成 <span class=\"m\">0.6(1-0.8^n)<\/span>，漏掉初始市占 0.1。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">p=0.08<\/span>、<span class=\"m\">q=0.12<\/span>，<span class=\"m\">\\lambda=0.8<\/span>，<span class=\"m\">\\alpha=\\frac{0.12}{0.2}=0.6<\/span>。<\/li>\n<li><span class=\"m\">a_n=0.6+(0.8)^n(0.1-0.6)=0.6-0.5(0.8)^n<\/span>。<\/li>\n<li><span class=\"m\">a_n&gt;0.59\\iff 0.5(0.8)^n&lt;0.01\\iff (0.8)^n&lt;0.02<\/span>。<\/li>\n<li>取對數：<span class=\"m\">n\\log 0.8&lt;\\log 0.02<\/span>；<span class=\"m\">\\log 0.8=3\\log 2-1\\approx -0.0970<\/span>，<span class=\"m\">\\log 0.02=\\log 2-2\\approx -1.6990<\/span>。<\/li>\n<li><span class=\"m\">n&gt;\\dfrac{1.6990}{0.0970}\\approx 17.5<\/span>，至少 18 個月。<\/li>\n<\/ol>\n<p>驗算：<span class=\"m\">a_{17}\\approx 0.5887<\/span>，<span class=\"m\">a_{18}\\approx 0.5910<\/span>。<\/p>\n<p>陷阱：除以負數 <span class=\"m\">\\log 0.8<\/span> 時忘記不等號變向；或把 <span class=\"m\">a_n<\/span> 寫成 <span class=\"m\">0.6(1-0.8^n)<\/span>，漏掉初始市占 0.1。<\/p>"},{"title":"例題 14　由兩期轉移矩陣反求原矩陣（挑戰）","q":"<p>二階轉移矩陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A^2=\\begin{bmatrix}0.7 &amp; 0.45\\\\ 0.3 &amp; 0.55\\end{bmatrix}<\/span>，求所有可能的 <span class=\"m\">A<\/span>。<\/p>","steps":["設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>。<span class=\"m\">A^2=S+\\lambda^2R<\/span>，其穩定狀態與 <span class=\"m\">A<\/span> 相同，且 <span class=\"m\">\\det(A^2)=\\lambda^2<\/span>。","<span class=\"m\">\\lambda^2=\\det(A^2)=0.385-0.135=0.25<\/span>，<span class=\"m\">\\lambda=\\pm 0.5<\/span>。","<span class=\"m\">A^2<\/span> 的穩定狀態第一分量 <span class=\"m\">\\frac{0.45}{0.3+0.45}=0.6<\/span>，故 <span class=\"m\">\\frac{q}{p+q}=0.6<\/span>。","<span class=\"m\">\\lambda=0.5<\/span>：<span class=\"m\">p+q=0.5<\/span>，<span class=\"m\">q=0.3<\/span>、<span class=\"m\">p=0.2<\/span>，<span class=\"m\">A=\\begin{bmatrix}0.8 &amp; 0.3\\\\ 0.2 &amp; 0.7\\end{bmatrix}<\/span>。","<span class=\"m\">\\lambda=-0.5<\/span>：<span class=\"m\">p+q=1.5<\/span>，<span class=\"m\">q=0.9<\/span>、<span class=\"m\">p=0.6<\/span>，<span class=\"m\">A=\\begin{bmatrix}0.4 &amp; 0.9\\\\ 0.6 &amp; 0.1\\end{bmatrix}<\/span>。","兩者平方皆為所給矩陣，元素皆在 <span class=\"m\">[0,1]<\/span>，皆合。"],"after":"<p><strong>另解<\/strong>　直接比較：<span class=\"m\">(A^2)_{21}=p(1-p)+p(1-q)=p(2-p-q)=0.3<\/span>，<span class=\"m\">(A^2)_{12}=q(2-p-q)=0.45<\/span>。相除得 <span class=\"m\">q=1.5p<\/span>，代回 <span class=\"m\">p(2-2.5p)=0.3<\/span>，即 <span class=\"m\">25p^2-20p+3=0<\/span>，<span class=\"m\">p=0.2<\/span> 或 <span class=\"m\">0.6<\/span>。<\/p>\n<p>陷阱：只取 <span class=\"m\">\\lambda=0.5<\/span> 而漏掉負值；或以為「開平方根」只有一個轉移矩陣。<\/p>","sol":"<ol class=\"steps\">\n<li>設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>。<span class=\"m\">A^2=S+\\lambda^2R<\/span>，其穩定狀態與 <span class=\"m\">A<\/span> 相同，且 <span class=\"m\">\\det(A^2)=\\lambda^2<\/span>。<\/li>\n<li><span class=\"m\">\\lambda^2=\\det(A^2)=0.385-0.135=0.25<\/span>，<span class=\"m\">\\lambda=\\pm 0.5<\/span>。<\/li>\n<li><span class=\"m\">A^2<\/span> 的穩定狀態第一分量 <span class=\"m\">\\frac{0.45}{0.3+0.45}=0.6<\/span>，故 <span class=\"m\">\\frac{q}{p+q}=0.6<\/span>。<\/li>\n<li><span class=\"m\">\\lambda=0.5<\/span>：<span class=\"m\">p+q=0.5<\/span>，<span class=\"m\">q=0.3<\/span>、<span class=\"m\">p=0.2<\/span>，<span class=\"m\">A=\\begin{bmatrix}0.8 &amp; 0.3\\\\ 0.2 &amp; 0.7\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">\\lambda=-0.5<\/span>：<span class=\"m\">p+q=1.5<\/span>，<span class=\"m\">q=0.9<\/span>、<span class=\"m\">p=0.6<\/span>，<span class=\"m\">A=\\begin{bmatrix}0.4 &amp; 0.9\\\\ 0.6 &amp; 0.1\\end{bmatrix}<\/span>。<\/li>\n<li>兩者平方皆為所給矩陣，元素皆在 <span class=\"m\">[0,1]<\/span>，皆合。<\/li>\n<\/ol>\n<p><strong>另解<\/strong>　直接比較：<span class=\"m\">(A^2)_{21}=p(1-p)+p(1-q)=p(2-p-q)=0.3<\/span>，<span class=\"m\">(A^2)_{12}=q(2-p-q)=0.45<\/span>。相除得 <span class=\"m\">q=1.5p<\/span>，代回 <span class=\"m\">p(2-2.5p)=0.3<\/span>，即 <span class=\"m\">25p^2-20p+3=0<\/span>，<span class=\"m\">p=0.2<\/span> 或 <span class=\"m\">0.6<\/span>。<\/p>\n<p>陷阱：只取 <span class=\"m\">\\lambda=0.5<\/span> 而漏掉負值；或以為「開平方根」只有一個轉移矩陣。<\/p>"}],"mis":[{"bad":"轉移矩陣的每一列和為 1。","good":"高中通行約定 <span class=\"m\">x_{n+1}=Ax_n<\/span>，<strong>每一行<\/strong>和為 1；列和為 1 是另一種約定（<span class=\"m\">\\pi_{n+1}=\\pi_nP<\/span>）。"},{"bad":"元素有 0 或 1 的方陣不能當轉移矩陣。","good":"只要元素非負、每行和為 1 即可；0 表示不可能轉移，1 表示必然轉移。"},{"bad":"每行和為 1 的方陣都是轉移矩陣。","good":"還須每一元非負；如 <span class=\"m\">A^{-1}<\/span> 行和為 1 但常含負元。"},{"bad":"<span class=\"m\">A^2<\/span> 的元素是 <span class=\"m\">A<\/span> 的對應元素平方。","good":"<span class=\"m\">(A^2)_{ij}=\\sum_k a_{ik}a_{kj}<\/span>，對所有中間狀態求和，對應樹狀圖各路徑相加。"},{"bad":"達到穩定狀態後，個體就不再改變狀態。","good":"個體照常移動；穩定的是各狀態的比例，流出量等於流入量。"},{"bad":"解 <span class=\"m\">(A-I)s=0<\/span> 就得到穩定狀態。","good":"此方程組有無限多解，須加上「分量總和為 1」（人數型為總人數）。"},{"bad":"有穩定狀態，<span class=\"m\">x_n<\/span> 就一定收斂到它。","good":"互換矩陣 <span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span> 有穩定狀態 <span class=\"m\">\\left(\\frac12,\\frac12\\right)<\/span>，但由 <span class=\"m\">(1,0)<\/span> 出發時兩期一循環。"},{"bad":"長期分布取決於初始分布。","good":"正則時長期分布與初始分布無關。二階時只要 <span class=\"m\">0&lt;p+q&lt;2<\/span>（含吸收型）即是如此；例外只有 <span class=\"m\">A=I<\/span>（永遠等於初始）與互換矩陣（不收斂）。"},{"bad":"<span class=\"m\">x_n<\/span> 一定單調趨近穩定狀態。","good":"<span class=\"m\">\\lambda=1-p-q&lt;0<\/span> 時，<span class=\"m\">x_n<\/span> 在穩定狀態兩側交替擺盪。"},{"bad":"不是正則的轉移矩陣，<span class=\"m\">x_n<\/span> 必不收斂。","good":"吸收型 <span class=\"m\">\\begin{bmatrix}1 &amp; q\\\\ 0 &amp; 1-q\\end{bmatrix}<\/span>（<span class=\"m\">0&lt;q\\le 1<\/span>）不是正則，<span class=\"m\">x_n<\/span> 仍收斂到 <span class=\"m\">(1,0)<\/span>。"},{"bad":"反方陣 <span class=\"m\">A^{-1}<\/span> 是「倒退一期」的轉移矩陣。","good":"<span class=\"m\">A^{-1}<\/span> 只是由 <span class=\"m\">x_{n+1}<\/span> 解 <span class=\"m\">x_n<\/span> 的計算工具，一般含負元；<span class=\"m\">p+q=1<\/span> 時 <span class=\"m\">A<\/span> 甚至不可逆。"}],"check":["能依「行從列到」由轉移圖或文字敘述寫出轉移矩陣，並檢查元素非負、每行和為 1。","能說明行和為 1 的約定（<span class=\"m\">x_{n+1}=Ax_n<\/span>）與列和為 1 約定的差別與換算。","能以 <span class=\"m\">x_n=A^nx_0<\/span> 求 <span class=\"m\">n<\/span> 期後的分布，並以樹狀圖互驗。","能說明 <span class=\"m\">(A^n)_{ij}<\/span> 的意義，並只取所需的行計算。","能處理人數型題目，說明總數不變的原因。","能寫出二階一般式 <span class=\"m\">a_n=\\alpha+\\lambda^n(a_0-\\alpha)<\/span>，並由 <span class=\"m\">\\lambda<\/span> 的正負判斷單調或擺盪。","能以 <span class=\"m\">(A-I)s=0<\/span> 加總和條件求穩定狀態，並用「流出等於流入」快速檢驗。","能判斷二階轉移矩陣的長期行為，指出 <span class=\"m\">I<\/span> 與互換矩陣兩種例外。","能分辨正則、吸收型，並說明不正則未必不收斂。","能說明 <span class=\"m\">A^{-1}<\/span> 不是轉移矩陣的原因。","能解三階轉移矩陣的穩定狀態（進階）。"]},"T3":{"id":"T3","title":"歷屆學測試題：矩陣","subject":"數學","src":"收錄範圍：102–115 學年度學科能力測驗數學考科（111 學年度起為數學 A 考科）、110 學年度數學 A 試辦考試、數學 A 考科參考試卷中，與矩陣運算、反方陣、平面上的線性變換、轉移矩陣相關的試題，共 19 題（含題組 2 組，計 6 題）。原題照錄；答案與詳解為本書撰寫。100、101 學年度試卷依當時課程未考矩陣；三元一次聯立方程組與增廣矩陣的高斯消去法試題收在 T2。","secs":[{"t":"導言","h":"<p class=\"src\">收錄範圍：102–115 學年度學科能力測驗數學考科（111 學年度起為數學 A 考科）、110 學年度數學 A 試辦考試、數學 A 考科參考試卷中，與矩陣運算、反方陣、平面上的線性變換、轉移矩陣相關的試題，共 19 題（含題組 2 組，計 6 題）。原題照錄；答案與詳解為本書撰寫。100、101 學年度試卷依當時課程未考矩陣；三元一次聯立方程組與增廣矩陣的高斯消去法試題收在 T2。<\/p>"},{"t":"題型分析","h":"<table class=\"t\"><thead><tr><th>年度<\/th><th>題號<\/th><th>題型<\/th><th>主題<\/th><th>對應單元<\/th><th>難度<\/th><\/tr><\/thead><tbody>\n<tr><td>115 數A<\/td><td>第 5 題<\/td><td>單選<\/td><td>三階方陣與行向量：解 <span class=\"m\">A\\vec{v}=\\vec{b}<\/span><\/td><td>M8<\/td><td>中偏難<\/td><\/tr>\n<tr><td>115 數A<\/td><td>第 8 題<\/td><td>多選<\/td><td>二階方陣乘冪的元素遞迴<\/td><td>M8<\/td><td>中<\/td><\/tr>\n<tr><td>114 數A<\/td><td>第 18–20 題<\/td><td>混合（題組）<\/td><td>旋轉矩陣 <span class=\"m\">A^2=B^3<\/span>、點的旋轉、平行線交點<\/td><td>M9<\/td><td>中<\/td><\/tr>\n<tr><td>113 數A<\/td><td>第 12 題<\/td><td>多選<\/td><td>推移型變換下三角形的像、不動點、面積<\/td><td>M9<\/td><td>中<\/td><\/tr>\n<tr><td>112 數A<\/td><td>第 11 題<\/td><td>多選<\/td><td>旋轉 <span class=\"m\">\\pm 90^\\circ<\/span> 與鏡射矩陣的乘積<\/td><td>M9<\/td><td>中<\/td><\/tr>\n<tr><td>110 數學<\/td><td>第 1 題<\/td><td>單選<\/td><td>上三角方陣的乘冪<\/td><td>M8<\/td><td>易<\/td><\/tr>\n<tr><td>110 試辦<\/td><td>第 18–20 題<\/td><td>混合（題組）<\/td><td>旋轉伸縮型變換：點與直線的像、長度比<\/td><td>M9<\/td><td>中<\/td><\/tr>\n<tr><td>參考試卷<\/td><td>第 6 題<\/td><td>單選<\/td><td>直線經線性變換後的斜率<\/td><td>M9<\/td><td>易<\/td><\/tr>\n<tr><td>109 數學<\/td><td>第 4 題<\/td><td>單選<\/td><td>反方陣與矩陣多項式<\/td><td>M8<\/td><td>易<\/td><\/tr>\n<tr><td>108 數學<\/td><td>選填 A<\/td><td>選填<\/td><td>矩陣乘法化為聯立方程式<\/td><td>M8<\/td><td>易<\/td><\/tr>\n<tr><td>107 數學<\/td><td>選填 F<\/td><td>選填<\/td><td>矩陣乘法求未知元素<\/td><td>M8<\/td><td>中<\/td><\/tr>\n<tr><td>105 數學<\/td><td>選填 A<\/td><td>選填<\/td><td>元素為 0 或 1 的矩陣計數<\/td><td>M8<\/td><td>易<\/td><\/tr>\n<tr><td>104 數學<\/td><td>選填 G<\/td><td>選填<\/td><td>三據點人員調動（三階轉移）<\/td><td>M10<\/td><td>中<\/td><\/tr>\n<tr><td>103 數學<\/td><td>選填 G<\/td><td>選填<\/td><td>轉移矩陣的行列式與對角線和<\/td><td>M10<\/td><td>中<\/td><\/tr>\n<tr><td>102 數學<\/td><td>第 7 題<\/td><td>多選<\/td><td>二階方陣乘冪與數列<\/td><td>M8<\/td><td>易<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"exam\"><p><strong>命題趨勢與準備要點<\/strong><\/p>\n<p>1. <strong>線性變換是 108 課綱數 A 的主力<\/strong>：112、113、114 學年度與試辦考試、參考試卷都有線性變換題，且兩度以混合題題組出現（試辦、114）。旋轉、鏡射、伸縮、推移的矩陣要能直接寫出，並能說明「合成＝矩陣相乘、先作用者寫在右邊」。<\/p>\n<p>2. <strong>矩陣乘冪<\/strong>反覆出現（102、110、115）：先算 <span class=\"m\">A^2<\/span>、<span class=\"m\">A^3<\/span> 找規律，或用 <span class=\"m\">A^2=(a+d)A-(ad-bc)I<\/span> 降次；選項常要求判斷遞迴式、等差等比。<\/p>\n<p>3. <strong>矩陣等式拆成聯立方程式<\/strong>（107、108、115）：只取與所求有關的列與行，避免整個乘開；三階題要能看出「已知向量的線性組合」。<\/p>\n<p>4. <strong>行列式的幾何意義<\/strong>：面積比＝<span class=\"m\">|\\det T|<\/span>、<span class=\"m\">\\det T\\ne 0<\/span> 時有反變換（113 第 12 題），長度比為定值（試辦第 20 題）是非選擇題常見的說明題。<\/p>\n<p>5. 轉移矩陣在本書收錄的試卷中只見於舊制（103、104），數 A 尚未單獨命題；但「每期按比例重新分配」的情境可直接寫成矩陣乘法，練熟 <span class=\"m\">X_{n+1}=AX_n<\/span> 與行和為 1 的性質即可。<\/p><\/div>"},{"t":"一、矩陣的運算與乘冪","h":"<p class=\"qlink\" data-q=\"T3-01\">本節有 8 題練習（T3-01～T3-08），到「練習」分頁作答。<\/p>"},{"t":"二、平面上的線性變換","h":"<p class=\"qlink\" data-q=\"T3-09\">本節有 9 題練習（T3-09～T3-17），到「練習」分頁作答。<\/p>"},{"t":"三、轉移矩陣","h":"<p class=\"qlink\" data-q=\"T3-18\">本節有 2 題練習（T3-18～T3-19），到「練習」分頁作答。<\/p>"},{"t":"本章重點回顧","h":"<div class=\"formula\" data-t=\"二階反方陣\"><div class=\"mb\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix},\\ ad-bc\\ne0\\ \\Rightarrow\\ A^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d &amp; -b\\\\ -c &amp; a\\end{bmatrix}<\/div><p><span class=\"m\">ad-bc=0<\/span> 時 <span class=\"m\">A<\/span> 沒有反方陣，<span class=\"m\">A\\vec{x}=\\vec{b}<\/span> 無解或無窮多解（T3-01）。<\/p><\/div>\n<div class=\"formula\" data-t=\"常用變換矩陣\"><div class=\"mb\">\\underbrace{\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix}}_{\\text{旋轉 }\\theta}\\quad \\underbrace{\\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix}}_{\\text{對傾斜角 }\\theta\\text{ 的直線鏡射}}\\quad \\underbrace{\\begin{bmatrix}h &amp; 0\\\\ 0 &amp; k\\end{bmatrix}}_{\\text{伸縮}}\\quad \\underbrace{\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}}_{\\text{水平推移}}<\/div><p>合成：先 <span class=\"m\">S<\/span> 後 <span class=\"m\">T<\/span> 的矩陣是 <span class=\"m\">TS<\/span>。面積比＝<span class=\"m\">|\\det T|<\/span>；<span class=\"m\">\\det T&lt;0<\/span> 表示圖形翻面（例如鏡射）。<\/p><\/div>\n<div class=\"formula\" data-t=\"乘冪與遞迴\"><div class=\"mb\">A^2-(a+d)A+(ad-bc)I=O\\ \\Rightarrow\\ A^{n+2}=(a+d)A^{n+1}-(ad-bc)A^n<\/div><p>上三角方陣的乘冪仍為上三角，對角元素各自乘冪（T3-03、T3-08）。<\/p><\/div>\n<div class=\"key\"><p><strong>易錯點整理<\/strong><\/p>\n<ul><li>矩陣乘法不具交換律：<span class=\"m\">(I+A+A^{-1})A<\/span> 是右乘；<span class=\"m\">AC<\/span> 表示<span class=\"circle\">先 C 後 A<\/span>。<\/li>\n<li>矩陣乘 <span class=\"m\">\\begin{bmatrix}1\\\\ 0\\end{bmatrix}<\/span>、<span class=\"m\">\\begin{bmatrix}0\\\\ 1\\end{bmatrix}<\/span> 分別取出第一行、第二行；一個二階線性變換由這兩個像完全決定。<\/li>\n<li>直線的像：變換方向向量，不是法向量（T3-17）；「直線上所有點」用參數式（T3-15）。<\/li>\n<li>不動點、可逆性、面積比各有判斷式：<span class=\"m\">T\\vec{x}=\\vec{x}<\/span>、<span class=\"m\">\\det T\\ne0<\/span>、<span class=\"m\">|\\det T|<\/span>（T3-12）。<\/li>\n<li>轉移矩陣：元素非負、每行和為 1（全書約定），<span class=\"m\">X_{n+1}=AX_n<\/span> 每期都用當期的狀態（T3-18）。<\/li>\n<li>夾角取 <span class=\"m\">0^\\circ<\/span> 到 <span class=\"m\">180^\\circ<\/span>，與方向角區分（T3-10）。<\/li><\/ul><\/div>"}],"questions":[{"id":"T3-01","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"115 學測數A 第 5 題","ctx":"","pre":"","stem":"已知實數三階方陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>，<span class=\"m\">A\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>，<span class=\"m\">A\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}=\\begin{bmatrix}0\\\\ 0\\\\ 0\\end{bmatrix}<\/span>。試問有多少個行向量 <span class=\"m\">\\vec{v}=\\begin{bmatrix}v_1\\\\ v_2\\\\ v_3\\end{bmatrix}<\/span> 滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 且 <span class=\"m\">\\vec{v}<\/span> 垂直於行向量 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span>？","opts":[{"k":"1","h":"1 個"},{"k":"2","h":"2 個"},{"k":"3","h":"3 個"},{"k":"4","h":"0 個"},{"k":"5","h":"無窮多個"}],"type":"single","ans":["5"],"key":"(5)","sol":"\n<ol class=\"steps\"><li>令 <span class=\"m\">\\vec{u}_1=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_2=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}<\/span>。題設即 <span class=\"m\">A\\vec{u}_1=\\vec{u}_2<\/span>、<span class=\"m\">A\\vec{u}_2=\\vec{u}_1<\/span>、<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span>。<span class=\"hand\">A 把 u₁、u₂ 互換<\/span><\/li>\n<li>目標向量 <span class=\"m\">\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}=\\vec{u}_1+\\vec{u}_2<\/span>，而 <span class=\"m\">A(\\vec{u}_1+\\vec{u}_2)=\\vec{u}_2+\\vec{u}_1<\/span>，故 <span class=\"m\">\\vec{v}_0=\\vec{u}_1+\\vec{u}_2=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 是一組解。<\/li>\n<li>又 <span class=\"m\">A(\\vec{v}_0+t\\vec{u}_3)=A\\vec{v}_0+tA\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>，所以 <span class=\"m\">\\vec{v}=\\begin{bmatrix}1+t\\\\ 0\\\\ 1-t\\end{bmatrix}<\/span>（<span class=\"m\">t<\/span> 為任意實數）都滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>。由於 <span class=\"m\">\\begin{vmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{vmatrix}=2\\ne 0<\/span>，<span class=\"m\">\\vec{u}_1,\\vec{u}_2,\\vec{u}_3<\/span> 線性獨立，解恰為這一族。<\/li>\n<li>這些 <span class=\"m\">\\vec{v}<\/span> 的第二分量都是 0，與 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span> 的內積皆為 0，全部滿足垂直條件，故有<strong>無窮多個<\/strong>。<\/li><\/ol>\n<p><strong>另解<\/strong>　由 <span class=\"m\">A\\begin{bmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{bmatrix}=\\begin{bmatrix}0 &amp; 1 &amp; 0\\\\ -1 &amp; 1 &amp; 0\\\\ 1 &amp; 0 &amp; 0\\end{bmatrix}<\/span> 右乘反方陣，得 <span class=\"m\">A=\\begin{bmatrix}\\frac12 &amp; -\\frac12 &amp; \\frac12\\\\ 0 &amp; -1 &amp; 0\\\\ \\frac12 &amp; \\frac12 &amp; \\frac12\\end{bmatrix}<\/span>。<span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 化為 <span class=\"m\">v_1-v_2+v_3=2<\/span>、<span class=\"m\">-v_2=0<\/span>、<span class=\"m\">v_1+v_2+v_3=2<\/span>，即 <span class=\"m\">v_2=0<\/span>、<span class=\"m\">v_1+v_3=2<\/span>，有無窮多解，且都滿足 <span class=\"m\">v_2=0<\/span>。<\/p>\n<p><strong>考點<\/strong>：矩陣乘法的線性性質 <span class=\"m\">A(s\\vec{x}+t\\vec{y})=sA\\vec{x}+tA\\vec{y}<\/span>、不可逆方陣的方程組解集　<strong>對應<\/strong>：M8、M7<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>「方陣乘向量等於已知向量，解唯一」。<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span> 且 <span class=\"m\">\\vec{u}_3\\ne\\vec{0}<\/span>，表示 <span class=\"m\">\\det A=0<\/span>，<span class=\"m\">A<\/span> 沒有反方陣；有解時必為無窮多解。<\/p>","steps":["令 <span class=\"m\">\\vec{u}_1=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_2=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}<\/span>。題設即 <span class=\"m\">A\\vec{u}_1=\\vec{u}_2<\/span>、<span class=\"m\">A\\vec{u}_2=\\vec{u}_1<\/span>、<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span>。<span class=\"hand\">A 把 u₁、u₂ 互換<\/span>","目標向量 <span class=\"m\">\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}=\\vec{u}_1+\\vec{u}_2<\/span>，而 <span class=\"m\">A(\\vec{u}_1+\\vec{u}_2)=\\vec{u}_2+\\vec{u}_1<\/span>，故 <span class=\"m\">\\vec{v}_0=\\vec{u}_1+\\vec{u}_2=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 是一組解。","又 <span class=\"m\">A(\\vec{v}_0+t\\vec{u}_3)=A\\vec{v}_0+tA\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>，所以 <span class=\"m\">\\vec{v}=\\begin{bmatrix}1+t\\\\ 0\\\\ 1-t\\end{bmatrix}<\/span>（<span class=\"m\">t<\/span> 為任意實數）都滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>。由於 <span class=\"m\">\\begin{vmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{vmatrix}=2\\ne 0<\/span>，<span class=\"m\">\\vec{u}_1,\\vec{u}_2,\\vec{u}_3<\/span> 線性獨立，解恰為這一族。","這些 <span class=\"m\">\\vec{v}<\/span> 的第二分量都是 0，與 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span> 的內積皆為 0，全部滿足垂直條件，故有<strong>無窮多個<\/strong>。"]},{"id":"T3-02","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"115 學測數A 第 8 題","ctx":"","pre":"","stem":"已知 <span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，且對所有正整數 <span class=\"m\">n\\ge 2<\/span>，令 <span class=\"m\">A^n=\\begin{bmatrix}a_n &amp; b_n\\\\ c_n &amp; d_n\\end{bmatrix}<\/span>。試選出正確的選項。","opts":[{"k":"1","h":"<span class=\"m\">b_2&lt;c_2<\/span>"},{"k":"2","h":"<span class=\"m\">A^2=2A+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>"},{"k":"3","h":"<span class=\"m\">c_{n+2}=c_{n+1}+2c_n<\/span>"},{"k":"4","h":"<span class=\"m\">\\begin{bmatrix}a_n &amp; b_n\\\\ c_n &amp; d_n\\end{bmatrix}\\begin{bmatrix}0\\\\ 1\\end{bmatrix}=\\begin{bmatrix}b_{n+1}\\\\ d_{n+1}\\end{bmatrix}<\/span>"},{"k":"5","h":"<span class=\"m\">d_{2n}-a_{2n}=(d_n)^2-(a_n)^2<\/span>"}],"type":"multi","ans":["2","5"],"key":"(2)(5)","sol":"\n<ol class=\"steps\"><li>先算 <span class=\"m\">A^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}12 &amp; 5\\\\ 5 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^4=\\begin{bmatrix}29 &amp; 12\\\\ 12 &amp; 5\\end{bmatrix}<\/span>。<\/li>\n<li>(1) <span class=\"m\">b_2=c_2=2<\/span>，錯誤。（<span class=\"m\">A<\/span> 對稱，<span class=\"m\">A^n<\/span> 也對稱，恆有 <span class=\"m\">b_n=c_n<\/span>。）<\/li>\n<li>(2) <span class=\"m\">2A+I=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}=A^2<\/span>，正確。這正是 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span>：<span class=\"m\">a+d=2<\/span>、<span class=\"m\">ad-bc=-1<\/span>。<\/li>\n<li>(3) 由 (2) 兩邊乘 <span class=\"m\">A^n<\/span>：<span class=\"m\">A^{n+2}=2A^{n+1}+A^n<\/span>，比較左下元素得 <span class=\"m\">c_{n+2}=2c_{n+1}+c_n<\/span>。反例 <span class=\"m\">n=2<\/span>：<span class=\"m\">c_4=12<\/span>，而 <span class=\"m\">c_3+2c_2=5+4=9<\/span>，錯誤。<\/li>\n<li>(4) 左邊是 <span class=\"m\">A^n<\/span> 的第二行 <span class=\"m\">\\begin{bmatrix}b_n\\\\ d_n\\end{bmatrix}<\/span>。而 <span class=\"m\">A^{n+1}=A^nA<\/span> 的第二行是 <span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}a_n\\\\ c_n\\end{bmatrix}<\/span>，即 <span class=\"m\">b_{n+1}=a_n<\/span>。<span class=\"m\">n=2<\/span> 時 <span class=\"m\">b_3=5\\ne b_2=2<\/span>，錯誤。<span class=\"hand\">乘 [0,1]ᵀ 是取第二行<\/span><\/li>\n<li>(5) <span class=\"m\">A^{2n}=A^nA^n<\/span>，所以 <span class=\"m\">a_{2n}=a_n^2+b_nc_n<\/span>、<span class=\"m\">d_{2n}=c_nb_n+d_n^2<\/span>，相減得 <span class=\"m\">d_{2n}-a_{2n}=d_n^2-a_n^2<\/span>，正確。<\/li><\/ol>\n<div class=\"formula\" data-t=\"二階方陣的降次公式\"><div class=\"mb\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\ \\Rightarrow\\ A^2-(a+d)A+(ad-bc)I=O<\/div><p>兩邊乘 <span class=\"m\">A^n<\/span> 得乘冪的二階遞迴：<span class=\"m\">A^{n+2}=(a+d)A^{n+1}-(ad-bc)A^n<\/span>，每個元素都滿足同一遞迴。<\/p><\/div>\n<p><strong>考點<\/strong>：矩陣乘冪、乘法的列行意義、遞迴關係　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>(3) 把係數看反，誤以為 <span class=\"m\">A^2=A+2I<\/span>。係數由 <span class=\"m\">a+d<\/span> 與 <span class=\"m\">ad-bc<\/span> 決定，代 <span class=\"m\">n=2<\/span> 驗算一次即可排除。<\/p>","steps":["先算 <span class=\"m\">A^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}12 &amp; 5\\\\ 5 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^4=\\begin{bmatrix}29 &amp; 12\\\\ 12 &amp; 5\\end{bmatrix}<\/span>。","(1) <span class=\"m\">b_2=c_2=2<\/span>，錯誤。（<span class=\"m\">A<\/span> 對稱，<span class=\"m\">A^n<\/span> 也對稱，恆有 <span class=\"m\">b_n=c_n<\/span>。）","(2) <span class=\"m\">2A+I=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}=A^2<\/span>，正確。這正是 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span>：<span class=\"m\">a+d=2<\/span>、<span class=\"m\">ad-bc=-1<\/span>。","(3) 由 (2) 兩邊乘 <span class=\"m\">A^n<\/span>：<span class=\"m\">A^{n+2}=2A^{n+1}+A^n<\/span>，比較左下元素得 <span class=\"m\">c_{n+2}=2c_{n+1}+c_n<\/span>。反例 <span class=\"m\">n=2<\/span>：<span class=\"m\">c_4=12<\/span>，而 <span class=\"m\">c_3+2c_2=5+4=9<\/span>，錯誤。","(4) 左邊是 <span class=\"m\">A^n<\/span> 的第二行 <span class=\"m\">\\begin{bmatrix}b_n\\\\ d_n\\end{bmatrix}<\/span>。而 <span class=\"m\">A^{n+1}=A^nA<\/span> 的第二行是 <span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}a_n\\\\ c_n\\end{bmatrix}<\/span>，即 <span class=\"m\">b_{n+1}=a_n<\/span>。<span class=\"m\">n=2<\/span> 時 <span class=\"m\">b_3=5\\ne b_2=2<\/span>，錯誤。<span class=\"hand\">乘 [0,1]ᵀ 是取第二行<\/span>","(5) <span class=\"m\">A^{2n}=A^nA^n<\/span>，所以 <span class=\"m\">a_{2n}=a_n^2+b_nc_n<\/span>、<span class=\"m\">d_{2n}=c_nb_n+d_n^2<\/span>，相減得 <span class=\"m\">d_{2n}-a_{2n}=d_n^2-a_n^2<\/span>，正確。"]},{"id":"T3-03","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"110 學測數學 第 1 題","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}<\/span>。若 <span class=\"m\">A^4=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，則 <span class=\"m\">a+b+c+d<\/span> 之值為下列哪一個選項？","opts":[{"k":"1","h":"158"},{"k":"2","h":"162"},{"k":"3","h":"166"},{"k":"4","h":"170"},{"k":"5","h":"174"}],"type":"single","ans":["2"],"key":"(2)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">A^4=(A^2)^2=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}=\\begin{bmatrix}1 &amp; 80\\\\ 0 &amp; 81\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">a+b+c+d=1+80+0+81=162<\/span>。<\/li><\/ol>\n<p><strong>補充<\/strong>　上三角方陣的乘冪仍是上三角，對角線元素各自乘冪。本題可歸納 <span class=\"m\">A^n=\\begin{bmatrix}1 &amp; 3^n-1\\\\ 0 &amp; 3^n\\end{bmatrix}<\/span>（由 <span class=\"m\">A^{n+1}=A^nA<\/span> 驗證：右上元素 <span class=\"m\">2+3(3^n-1)=3^{n+1}-1<\/span>）。<\/p>\n<p><strong>考點<\/strong>：矩陣乘法、乘冪　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把乘冪當成逐元素乘冪，寫成 <span class=\"m\">\\begin{bmatrix}1 &amp; 16\\\\ 0 &amp; 81\\end{bmatrix}<\/span>，得 98（不在選項中，但同型選填題會失分）。<\/p>","steps":["<span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}<\/span>。","<span class=\"m\">A^4=(A^2)^2=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}=\\begin{bmatrix}1 &amp; 80\\\\ 0 &amp; 81\\end{bmatrix}<\/span>。","<span class=\"m\">a+b+c+d=1+80+0+81=162<\/span>。"]},{"id":"T3-04","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"109 學測數學 第 4 題","ctx":"","pre":"","stem":"令 <span class=\"m\">I=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">B=I+A+A^{-1}<\/span>，試選出代表 <span class=\"m\">BA<\/span> 的選項。","opts":[{"k":"1","h":"<span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>"},{"k":"2","h":"<span class=\"m\">\\begin{bmatrix}6 &amp; 0\\\\ 0 &amp; 6\\end{bmatrix}<\/span>"},{"k":"3","h":"<span class=\"m\">\\begin{bmatrix}4 &amp; -1\\\\ -3 &amp; 1\\end{bmatrix}<\/span>"},{"k":"4","h":"<span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}<\/span>"},{"k":"5","h":"<span class=\"m\">\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>"}],"type":"single","ans":["5"],"key":"(5)","sol":"\n<ol class=\"steps\"><li>分配律：<span class=\"m\">BA=(I+A+A^{-1})A=A+A^2+I<\/span>。<span class=\"hand\">A⁻¹A＝I，不必求 A⁻¹<\/span><\/li>\n<li><span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}=\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}+\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　<span class=\"m\">a+d=5<\/span>、<span class=\"m\">\\det A=4-3=1<\/span>，故 <span class=\"m\">A^2-5A+I=O<\/span>，<span class=\"m\">A^2+I=5A<\/span>，<span class=\"m\">BA=A+5A=6A=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。<\/p>\n<p><strong>考點<\/strong>：反方陣的定義 <span class=\"m\">A^{-1}A=I<\/span>、矩陣乘法分配律　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>選項 (3) 是 <span class=\"m\">A^{-1}<\/span> 本身，(4) 是 <span class=\"m\">A<\/span>，都是算到一半就停的誘答。乘法分配時要注意左右：<span class=\"m\">(I+A+A^{-1})A<\/span> 是每一項<em>右乘<\/em> <span class=\"m\">A<\/span>。<\/p>","steps":["分配律：<span class=\"m\">BA=(I+A+A^{-1})A=A+A^2+I<\/span>。<span class=\"hand\">A⁻¹A＝I，不必求 A⁻¹<\/span>","<span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}=\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}<\/span>。","<span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}+\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。"]},{"id":"T3-05","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"108 學測數學 選填 A","ctx":"","pre":"","stem":"設 <span class=\"m\">x,y<\/span> 為實數，且滿足 <span class=\"m\">\\begin{bmatrix}3 &amp; -1 &amp; 3\\\\ 2 &amp; 4 &amp; -1\\end{bmatrix}\\begin{bmatrix}x\\\\ y\\\\ 1\\end{bmatrix}=\\begin{bmatrix}6\\\\ -6\\end{bmatrix}<\/span>，則 <span class=\"m\">x+3y=<\/span> <span class=\"m\">\\fbox{14}\\,\\fbox{15}<\/span>。","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">-4<\/span>（<span class=\"m\">\\fbox{14}<\/span> 為「－」，<span class=\"m\">\\fbox{15}<\/span> 為 4）","sol":"\n<ol class=\"steps\"><li>乘開：<span class=\"m\">\\begin{cases}3x-y+3=6\\\\ 2x+4y-1=-6\\end{cases}<\/span>，即 <span class=\"m\">\\begin{cases}3x-y=3\\\\ 2x+4y=-5\\end{cases}<\/span>。<\/li>\n<li>由第一式 <span class=\"m\">y=3x-3<\/span>，代入第二式：<span class=\"m\">2x+12x-12=-5<\/span>，<span class=\"m\">x=\\frac12<\/span>，<span class=\"m\">y=-\\frac32<\/span>。<\/li>\n<li><span class=\"m\">x+3y=\\frac12-\\frac92=-4<\/span>。<\/li><\/ol>\n<p><strong>考點<\/strong>：<span class=\"m\">2\\times3<\/span> 矩陣乘 <span class=\"m\">3\\times1<\/span> 矩陣的定義（列乘行）　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>忘了第三個分量 1 也要乘上第三行的 3 與 <span class=\"m\">-1<\/span>，寫成 <span class=\"m\">3x-y=6<\/span>、<span class=\"m\">2x+4y=-6<\/span>，得 <span class=\"m\">x+3y=-\\frac{30}{7}<\/span>。<\/p>","steps":["乘開：<span class=\"m\">\\begin{cases}3x-y+3=6\\\\ 2x+4y-1=-6\\end{cases}<\/span>，即 <span class=\"m\">\\begin{cases}3x-y=3\\\\ 2x+4y=-5\\end{cases}<\/span>。","由第一式 <span class=\"m\">y=3x-3<\/span>，代入第二式：<span class=\"m\">2x+12x-12=-5<\/span>，<span class=\"m\">x=\\frac12<\/span>，<span class=\"m\">y=-\\frac32<\/span>。","<span class=\"m\">x+3y=\\frac12-\\frac92=-4<\/span>。"]},{"id":"T3-06","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"107 學測數學 選填 F","ctx":"","pre":"","stem":"設 <span class=\"m\">a,b,c,d,e,x,y,z<\/span> 皆為實數，考慮矩陣相乘：<span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\\\ 1 &amp; 2\\end{bmatrix}\\begin{bmatrix}-3 &amp; 5 &amp; 7\\\\ -4 &amp; 6 &amp; e\\end{bmatrix}=\\begin{bmatrix}3 &amp; x &amp; 7\\\\ 0 &amp; y &amp; 7\\\\ -11 &amp; z &amp; 23\\end{bmatrix}<\/span>，則 <span class=\"m\">y=\\dfrac{\\fbox{25}}{\\fbox{26}}<\/span>。（化成最簡分數）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">y=\\dfrac72<\/span>","sol":"\n<ol class=\"steps\"><li><span class=\"m\">y<\/span> 是第二列乘第二行：<span class=\"m\">y=5c+6d<\/span>，要先求 <span class=\"m\">c,d<\/span>。<\/li>\n<li>第二列的其他兩個元素：<span class=\"m\">-3c-4d=0<\/span>、<span class=\"m\">7c+ed=7<\/span>，其中 <span class=\"m\">e<\/span> 未知。<span class=\"hand\">先由第三列求 e<\/span><\/li>\n<li>第三列乘第三行：<span class=\"m\">1\\cdot7+2e=23<\/span>，得 <span class=\"m\">e=8<\/span>。（第三列乘第一行 <span class=\"m\">-3-8=-11<\/span> 與題設相符。）<\/li>\n<li>解 <span class=\"m\">\\begin{cases}-3c-4d=0\\\\ 7c+8d=7\\end{cases}<\/span>：第一式乘 2 加第二式得 <span class=\"m\">c=7<\/span>，<span class=\"m\">d=-\\frac{21}{4}<\/span>。<\/li>\n<li><span class=\"m\">y=5\\cdot7+6\\cdot\\left(-\\frac{21}{4}\\right)=35-\\frac{63}{2}=\\frac72<\/span>。<\/li><\/ol>\n<p><strong>考點<\/strong>：矩陣乘積第 <span class=\"m\">i<\/span> 列第 <span class=\"m\">j<\/span> 行的元素＝左矩陣第 <span class=\"m\">i<\/span> 列與右矩陣第 <span class=\"m\">j<\/span> 行的內積　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>只看第二列就想解 <span class=\"m\">c,d<\/span>，卡在未知數 <span class=\"m\">e<\/span>。條件分散在不同列時，先找「只含一個未知數」的元素。<\/p>","steps":["<span class=\"m\">y<\/span> 是第二列乘第二行：<span class=\"m\">y=5c+6d<\/span>，要先求 <span class=\"m\">c,d<\/span>。","第二列的其他兩個元素：<span class=\"m\">-3c-4d=0<\/span>、<span class=\"m\">7c+ed=7<\/span>，其中 <span class=\"m\">e<\/span> 未知。<span class=\"hand\">先由第三列求 e<\/span>","第三列乘第三行：<span class=\"m\">1\\cdot7+2e=23<\/span>，得 <span class=\"m\">e=8<\/span>。（第三列乘第一行 <span class=\"m\">-3-8=-11<\/span> 與題設相符。）","解 <span class=\"m\">\\begin{cases}-3c-4d=0\\\\ 7c+8d=7\\end{cases}<\/span>：第一式乘 2 加第二式得 <span class=\"m\">c=7<\/span>，<span class=\"m\">d=-\\frac{21}{4}<\/span>。","<span class=\"m\">y=5\\cdot7+6\\cdot\\left(-\\frac{21}{4}\\right)=35-\\frac{63}{2}=\\frac72<\/span>。"]},{"id":"T3-07","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"105 學測數學 選填 A","ctx":"","pre":"","stem":"考慮每個元（或稱元素）只能是 0 或 1 的 <span class=\"m\">2\\times3<\/span> 階矩陣，且它的第一列與第二列不相同且各列的元素不能全為零，這樣的矩陣共有 <span class=\"m\">\\fbox{14}\\,\\fbox{15}<\/span> 個。","opts":[],"type":"open","ans":[],"key":"42","sol":"\n<ol class=\"steps\"><li>每一列是三個元素都取 0 或 1 的有序組，共 <span class=\"m\">2^3=8<\/span> 種；扣掉全為零的一種，每列有 7 種選法。<\/li>\n<li>第一列 7 種；第二列不能與第一列相同，6 種。<\/li>\n<li>共 <span class=\"m\">7\\times6=42<\/span> 個。<\/li><\/ol>\n<p><strong>考點<\/strong>：矩陣的列（橫列）與行（直行）、乘法原理　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把「列」看成直行，改用三行各兩個元素計算。臺灣用語中<span class=\"circle\">列是橫的、行是直的<\/span>，<span class=\"m\">2\\times3<\/span> 階矩陣有 2 列 3 行。<\/p>","steps":["每一列是三個元素都取 0 或 1 的有序組，共 <span class=\"m\">2^3=8<\/span> 種；扣掉全為零的一種，每列有 7 種選法。","第一列 7 種；第二列不能與第一列相同，6 種。","共 <span class=\"m\">7\\times6=42<\/span> 個。"]},{"id":"T3-08","unit":"T3","set":"一、矩陣的運算與乘冪","level":"","src":"102 學測數學 第 7 題","ctx":"","pre":"","stem":"設 <span class=\"m\">n<\/span> 為正整數，符號 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}^n<\/span> 代表矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}<\/span> 自乘 <span class=\"m\">n<\/span> 次。令 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}^n=\\begin{bmatrix}a_n &amp; b_n\\\\ c_n &amp; d_n\\end{bmatrix}<\/span>，請選出正確的選項。","opts":[{"k":"1","h":"<span class=\"m\">a_2=1<\/span>"},{"k":"2","h":"<span class=\"m\">a_1,a_2,a_3<\/span> 為等比數列"},{"k":"3","h":"<span class=\"m\">d_1,d_2,d_3<\/span> 為等比數列"},{"k":"4","h":"<span class=\"m\">b_1,b_2,b_3<\/span> 為等差數列"},{"k":"5","h":"<span class=\"m\">c_1,c_2,c_3<\/span> 為等差數列"}],"type":"multi","ans":["1","2","3","5"],"key":"(1)(2)(3)(5)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">M=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">M^2=\\begin{bmatrix}1 &amp; 3\\\\ 0 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">M^3=M^2M=\\begin{bmatrix}1 &amp; 7\\\\ 0 &amp; 8\\end{bmatrix}<\/span>。一般地 <span class=\"m\">M^n=\\begin{bmatrix}1 &amp; 2^n-1\\\\ 0 &amp; 2^n\\end{bmatrix}<\/span>。<\/li>\n<li>(1) <span class=\"m\">a_2=1<\/span>，正確。<\/li>\n<li>(2) <span class=\"m\">1,1,1<\/span> 是公比為 1 的等比數列，正確。<span class=\"hand\">常數數列既等差也等比（非零時）<\/span><\/li>\n<li>(3) <span class=\"m\">2,4,8<\/span>，公比 2，正確。<\/li>\n<li>(4) <span class=\"m\">1,3,7<\/span>，差為 2、4，不是等差，錯誤。<\/li>\n<li>(5) <span class=\"m\">0,0,0<\/span> 是公差為 0 的等差數列，正確。<\/li><\/ol>\n<p><strong>考點<\/strong>：上三角方陣乘冪、等差與等比的定義　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>認為常數數列「不算」等比或等差而漏選 (2)(5)。另注意 <span class=\"m\">0,0,0<\/span> 是等差數列，但<em>不是<\/em>等比數列（等比數列各項不為 0）。<\/p>","steps":["<span class=\"m\">M=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">M^2=\\begin{bmatrix}1 &amp; 3\\\\ 0 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">M^3=M^2M=\\begin{bmatrix}1 &amp; 7\\\\ 0 &amp; 8\\end{bmatrix}<\/span>。一般地 <span class=\"m\">M^n=\\begin{bmatrix}1 &amp; 2^n-1\\\\ 0 &amp; 2^n\\end{bmatrix}<\/span>。","(1) <span class=\"m\">a_2=1<\/span>，正確。","(2) <span class=\"m\">1,1,1<\/span> 是公比為 1 的等比數列，正確。<span class=\"hand\">常數數列既等差也等比（非零時）<\/span>","(3) <span class=\"m\">2,4,8<\/span>，公比 2，正確。","(4) <span class=\"m\">1,3,7<\/span>，差為 2、4，不是等差，錯誤。","(5) <span class=\"m\">0,0,0<\/span> 是公差為 0 的等差數列，正確。"]},{"id":"T3-09","unit":"T3","set":"二、平面上的線性變換","level":"","src":"114 學測數A 第 18 題","ctx":"<p><strong>第 9–11 題為題組（114 學測數A 第 18–20 題）<\/strong><\/p>\n<p>已知 <span class=\"m\">A=\\begin{bmatrix}a_1 &amp; a_2\\\\ a_3 &amp; a_4\\end{bmatrix}<\/span>、<span class=\"m\">B=\\begin{bmatrix}b_1 &amp; b_2\\\\ b_3 &amp; b_4\\end{bmatrix}<\/span> 皆為坐標平面上以原點 <span class=\"m\">O<\/span> 為中心，逆時針旋轉一銳角的旋轉矩陣，且滿足 <span class=\"m\">A^2=B^3=\\begin{bmatrix}0 &amp; c\\\\ 1 &amp; d\\end{bmatrix}<\/span>，其中 <span class=\"m\">c,d<\/span> 為實數。設點 <span class=\"m\">P(1,1)<\/span> 經 <span class=\"m\">A^3<\/span> 變換後為點 <span class=\"m\">Q<\/span>，且點 <span class=\"m\">Q<\/span> 經 <span class=\"m\">B^4<\/span> 變換後為點 <span class=\"m\">R<\/span>。根據上述，試回答下列問題。<\/p>","pre":"","stem":"試問 <span class=\"m\">c<\/span> 之值為何？（單選題，3 分）","opts":[{"k":"1","h":"0"},{"k":"2","h":"<span class=\"m\">-1<\/span>"},{"k":"3","h":"1"},{"k":"4","h":"<span class=\"m\">-\\dfrac12<\/span>"},{"k":"5","h":"<span class=\"m\">\\dfrac12<\/span>"}],"type":"single","ans":["2"],"key":"(2)","sol":"\n<ol class=\"steps\"><li>旋轉的合成仍是旋轉（角度相加），所以 <span class=\"m\">A^2<\/span> 是旋轉矩陣，可寫成 <span class=\"m\">\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix}<\/span>。<\/li>\n<li>比較 <span class=\"m\">\\begin{bmatrix}0 &amp; c\\\\ 1 &amp; d\\end{bmatrix}<\/span>：<span class=\"m\">\\cos\\theta=0<\/span>、<span class=\"m\">\\sin\\theta=1<\/span>，故 <span class=\"m\">c=-\\sin\\theta=-1<\/span>、<span class=\"m\">d=\\cos\\theta=0<\/span>。<span class=\"m\">A^2=B^3<\/span> 是逆時針旋轉 <span class=\"m\">90^\\circ<\/span>。<\/li><\/ol>\n<div class=\"formula\" data-t=\"旋轉矩陣\"><div class=\"mb\">R_\\theta=\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix},\\qquad R_\\alpha R_\\beta=R_{\\alpha+\\beta},\\qquad (R_\\theta)^n=R_{n\\theta}<\/div><p><span class=\"m\">\\theta<\/span> 為逆時針旋轉角；<span class=\"m\">\\det R_\\theta=1<\/span>，旋轉保持長度與面積。<\/p><\/div>\n<p><strong>考點<\/strong>：旋轉矩陣的形式　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把旋轉矩陣右上角記成 <span class=\"m\">+\\sin\\theta<\/span>，誤選 (3)。<\/p>","steps":["旋轉的合成仍是旋轉（角度相加），所以 <span class=\"m\">A^2<\/span> 是旋轉矩陣，可寫成 <span class=\"m\">\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix}<\/span>。","比較 <span class=\"m\">\\begin{bmatrix}0 &amp; c\\\\ 1 &amp; d\\end{bmatrix}<\/span>：<span class=\"m\">\\cos\\theta=0<\/span>、<span class=\"m\">\\sin\\theta=1<\/span>，故 <span class=\"m\">c=-\\sin\\theta=-1<\/span>、<span class=\"m\">d=\\cos\\theta=0<\/span>。<span class=\"m\">A^2=B^3<\/span> 是逆時針旋轉 <span class=\"m\">90^\\circ<\/span>。"]},{"id":"T3-10","unit":"T3","set":"二、平面上的線性變換","level":"","src":"114 學測數A 第 19 題","ctx":"<p><strong>第 9–11 題為題組（114 學測數A 第 18–20 題）<\/strong><\/p>\n<p>已知 <span class=\"m\">A=\\begin{bmatrix}a_1 &amp; a_2\\\\ a_3 &amp; a_4\\end
