width=\"1.8\"/>\n<polygon points=\"150,190 278,126 269.4,268.9\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<circle cx=\"278\" cy=\"126\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"286\" y=\"126\" font-size=\"14\" fill=\"#1f2a44\">A(4,2)<\/text>\n<circle cx=\"158.6\" cy=\"47.1\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"134.6\" y=\"43.1\" font-size=\"14\" fill=\"#2f6fb5\">B₁<\/text>\n<circle cx=\"269.4\" cy=\"268.9\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"277.4\" y=\"280.9\" font-size=\"14\" fill=\"#d9772b\">B₂<\/text>\n<path d=\"M181.5,174.3 A35.2,35.2 0 0 0 152.1,154.9\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\" marker-end=\"url(#M9-f13-m1)\"/>\n<text x=\"126.4\" y=\"148.4\" font-size=\"12\" fill=\"#2f6fb5\">60°<\/text>\n<path d=\"M187.4,214.7 A44.8,44.8 0 0 0 190.1,170\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<text x=\"202\" y=\"206\" font-size=\"12\" fill=\"#d9772b\">−60°<\/text>\n<\/svg><figcaption>圖 M9-14　A 繞原點旋轉 ±60° 得到兩個正三角形的第三頂點<\/figcaption><\/figure>\n<p>另解（複數）：<span class=\"m\">(4+2i)\\left(\\frac12\\pm\\frac{\\sqrt3}{2}i\\right)<\/span>，展開得相同結果。<\/p>\n<p>陷阱：題目未指定方向時有兩解，<em>只寫逆時針一解<\/em>會漏答。<\/p>"},{"title":"例題 6　推移的判定與面積","q":"<p>沿 <span class=\"m\">x<\/span> 軸方向的推移 <span class=\"m\">T<\/span> 把 <span class=\"m\">(1,2)<\/span> 映到 <span class=\"m\">(7,2)<\/span>。(1) 求 <span class=\"m\">T<\/span> 的矩陣；(2) 求以 <span class=\"m\">O<\/span>、<span class=\"m\">(2,0)<\/span>、<span class=\"m\">(0,3)<\/span> 為頂點的三角形經 <span class=\"m\">T<\/span> 後的頂點與面積。<\/p>","steps":["設矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">1+2k=7<\/span>，<span class=\"m\">k=3<\/span>。","<span class=\"m\">(2,0)\\mapsto(2,0)<\/span>，<span class=\"m\">(0,3)\\mapsto(9,3)<\/span>，像為 <span class=\"m\">O<\/span>、<span class=\"m\">(2,0)<\/span>、<span class=\"m\">(9,3)<\/span>。","面積：原為 <span class=\"m\">\\frac12\\cdot2\\cdot3=3<\/span>；像為 <span class=\"m\">\\frac12\\left|\\begin{vmatrix}2 &amp; 9\\\\ 0 &amp; 3\\end{vmatrix}\\right|=3<\/span>，與 <span class=\"m\">\\det=1<\/span> 一致（底 2、高 3 皆不變）。"],"after":"<p>陷阱：推移不改變面積，但<em>邊長與角度都改變<\/em>：原三角形為直角三角形，像不是。<\/p>","sol":"<ol class=\"steps\">\n<li>設矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">1+2k=7<\/span>，<span class=\"m\">k=3<\/span>。<\/li>\n<li><span class=\"m\">(2,0)\\mapsto(2,0)<\/span>，<span class=\"m\">(0,3)\\mapsto(9,3)<\/span>，像為 <span class=\"m\">O<\/span>、<span class=\"m\">(2,0)<\/span>、<span class=\"m\">(9,3)<\/span>。<\/li>\n<li>面積：原為 <span class=\"m\">\\frac12\\cdot2\\cdot3=3<\/span>；像為 <span class=\"m\">\\frac12\\left|\\begin{vmatrix}2 &amp; 9\\\\ 0 &amp; 3\\end{vmatrix}\\right|=3<\/span>，與 <span class=\"m\">\\det=1<\/span> 一致（底 2、高 3 皆不變）。<\/li>\n<\/ol><p>陷阱：推移不改變面積，但<em>邊長與角度都改變<\/em>：原三角形為直角三角形，像不是。<\/p>"},{"title":"例題 7　投影矩陣","q":"<p>求投影到直線 <span class=\"m\">L:\\ x-2y=0<\/span> 的矩陣 <span class=\"m\">P<\/span>，並求 <span class=\"m\">(3,4)<\/span> 的像；說明哪些點的像為 <span class=\"m\">(4,2)<\/span>。<\/p>","steps":["<span class=\"m\">L<\/span> 的方向 <span class=\"m\">(2,1)<\/span>：<span class=\"m\">P=\\dfrac15\\begin{bmatrix}4 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。","<span class=\"m\">P\\begin{bmatrix}3\\\\ 4\\end{bmatrix}=\\dfrac15\\begin{bmatrix}20\\\\ 10\\end{bmatrix}=\\begin{bmatrix}4\\\\ 2\\end{bmatrix}<\/span>（圖 M9-8）。","像為 <span class=\"m\">(4,2)<\/span> 的點：<span class=\"m\">\\dfrac{2x+y}{5}(2,1)=(4,2)<\/span>，即 <span class=\"m\">2x+y=10<\/span>，是過 <span class=\"m\">(4,2)<\/span> 且垂直 <span class=\"m\">L<\/span> 的直線。"],"after":"<p>補充：<span class=\"m\">2P-I=\\dfrac15\\begin{bmatrix}3 &amp; 4\\\\ 4 &amp; -3\\end{bmatrix}<\/span> 為對 <span class=\"m\">L<\/span> 的鏡射，<span class=\"m\">(3,4)\\mapsto(5,0)<\/span>。<\/p><p>陷阱：<span class=\"m\">L:\\ x-2y=0<\/span> 的法向量是 <span class=\"m\">(1,-2)<\/span>，方向向量是 <span class=\"m\">(2,1)<\/span>；<em>以法向量代入投影公式<\/em>得到的是投影到垂直線的矩陣。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">L<\/span> 的方向 <span class=\"m\">(2,1)<\/span>：<span class=\"m\">P=\\dfrac15\\begin{bmatrix}4 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">P\\begin{bmatrix}3\\\\ 4\\end{bmatrix}=\\dfrac15\\begin{bmatrix}20\\\\ 10\\end{bmatrix}=\\begin{bmatrix}4\\\\ 2\\end{bmatrix}<\/span>（圖 M9-8）。<\/li>\n<li>像為 <span class=\"m\">(4,2)<\/span> 的點：<span class=\"m\">\\dfrac{2x+y}{5}(2,1)=(4,2)<\/span>，即 <span class=\"m\">2x+y=10<\/span>，是過 <span class=\"m\">(4,2)<\/span> 且垂直 <span class=\"m\">L<\/span> 的直線。<\/li>\n<\/ol><p>補充：<span class=\"m\">2P-I=\\dfrac15\\begin{bmatrix}3 &amp; 4\\\\ 4 &amp; -3\\end{bmatrix}<\/span> 為對 <span class=\"m\">L<\/span> 的鏡射，<span class=\"m\">(3,4)\\mapsto(5,0)<\/span>。<\/p><p>陷阱：<span class=\"m\">L:\\ x-2y=0<\/span> 的法向量是 <span class=\"m\">(1,-2)<\/span>，方向向量是 <span class=\"m\">(2,1)<\/span>；<em>以法向量代入投影公式<\/em>得到的是投影到垂直線的矩陣。<\/p>"},{"title":"例題 8　合成順序","q":"<p><span class=\"m\">R<\/span> 為逆時針旋轉 <span class=\"m\">90^\\circ<\/span>，<span class=\"m\">M<\/span> 為對 <span class=\"m\">y=x<\/span> 鏡射。分別求「先 <span class=\"m\">M<\/span> 後 <span class=\"m\">R<\/span>」與「先 <span class=\"m\">R<\/span> 後 <span class=\"m\">M<\/span>」的矩陣，並說明其幾何意義。<\/p>","steps":["<span class=\"m\">R=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。","先 <span class=\"m\">M<\/span> 後 <span class=\"m\">R<\/span>：<span class=\"m\">RM=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，對 <span class=\"m\">y<\/span> 軸鏡射。","先 <span class=\"m\">R<\/span> 後 <span class=\"m\">M<\/span>：<span class=\"m\">MR=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，對 <span class=\"m\">x<\/span> 軸鏡射。"],"after":"<figure class=\"fig\"><svg viewBox=\"0 0 420 280\" width=\"420\"><defs><marker id=\"M9-f17-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"50\" y1=\"260\" ^\\circ}<\/span>，結果相同。<\/p><p>陷阱：<span class=\"m\">R_{240^\\circ}<\/span> 的右上角為 <span class=\"m\">-\\sin240^\\circ=+\\frac{\\sqrt3}{2}<\/span>，<em>符號易錯<\/em>。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">A=2\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}=2R_{60^\\circ}<\/span>。<\/li>\n<li><span class=\"m\">A^6=2^6R_{360^\\circ}=64I<\/span>。<\/li>\n<li><span class=\"m\">A^{10}=2^{10}R_{600^\\circ}=1024R_{240^\\circ}=1024\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; -\\frac12\\end{bmatrix}=\\begin{bmatrix}-512 &amp; 512\\sqrt3\\\\ -512\\sqrt3 &amp; -512\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">(1,0)<\/span> 的像為第一行 <span class=\"m\">(-512,-512\\sqrt3)<\/span>。<\/li>\n<\/ol><p>另解：<span class=\"m\">A^{10}=A^6A^4=64A^4<\/span>，<span class=\"m\">A^4=16R_{240^\\circ}<\/span>，結果相同。<\/p><p>陷阱：<span class=\"m\">R_{240^\\circ}<\/span> 的右上角為 <span class=\"m\">-\\sin240^\\circ=+\\frac{\\sqrt3}{2}<\/span>，<em>符號易錯<\/em>。<\/p>"},{"title":"例題 10　面積比與方向","q":"<p><span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 3 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">\\triangle ABC<\/span> 的頂點為 <span class=\"m\">A(1,0)<\/span>、<span class=\"m\">B(3,1)<\/span>、<span class=\"m\">C(2,4)<\/span>。求像 <span class=\"m\">\\triangle A'B'C'<\/span> 的頂點、面積，並判斷 <span class=\"m\">A'\\to B'\\to C'<\/span> 的繞行方向。<\/p>","steps":["<span class=\"m\">A'(1,3)<\/span>、<span class=\"m\">B'(5,10)<\/span>、<span class=\"m\">C'(10,10)<\/span>。","原面積：<span class=\"m\">\\overrightarrow{AB}=(2,1)<\/span>、<span class=\"m\">\\overrightarrow{AC}=(1,4)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}2 &amp; 1\\\\ 1 &amp; 4\\end{vmatrix}=\\frac72&gt;0<\/span>，逆時針。","<span class=\"m\">\\det A=1-6=-5<\/span>，像的面積 <span class=\"m\">\\frac72\\cdot5=\\frac{35}{2}<\/span>，且方向反轉為順時針。","驗算：<span class=\"m\">\\overrightarrow{A'B'}=(4,7)<\/span>、<span class=\"m\">\\overrightarrow{A'C'}=(9,7)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}4 &amp; 9\\\\ 7 &amp; 7\\end{vmatrix}=-\\frac{35}{2}<\/span>，負號表示順時針（圖 M9-11）。"],"after":"<p>陷阱：面積比取 <span class=\"m\">|\\det A|=5<\/span>，<em>不可寫成 <span class=\"m\">-5<\/span> 倍<\/em>。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">A'(1,3)<\/span>、<span class=\"m\">B'(5,10)<\/span>、<span class=\"m\">C'(10,10)<\/span>。<\/li>\n<li>原面積：<span class=\"m\">\\overrightarrow{AB}=(2,1)<\/span>、<span class=\"m\">\\overrightarrow{AC}=(1,4)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}2 &amp; 1\\\\ 1 &amp; 4\\end{vmatrix}=\\frac72&gt;0<\/span>，逆時針。<\/li>\n<li><span class=\"m\">\\det A=1-6=-5<\/span>，像的面積 <span class=\"m\">\\frac72\\cdot5=\\frac{35}{2}<\/span>，且方向反轉為順時針。<\/li>\n<li>驗算：<span class=\"m\">\\overrightarrow{A'B'}=(4,7)<\/span>、<span class=\"m\">\\overrightarrow{A'C'}=(9,7)<\/span>，<span class=\"m\">\\frac12\\begin{vmatrix}4 &amp; 9\\\\ 7 &amp; 7\\end{vmatrix}=-\\frac{35}{2}<\/span>，負號表示順時針（圖 M9-11）。<\/li>\n<\/ol><p>陷阱：面積比取 <span class=\"m\">|\\det A|=5<\/span>，<em>不可寫成 <span class=\"m\">-5<\/span> 倍<\/em>。<\/p>"},{"title":"例題 11　直線的像","q":"<p><span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。求直線 <span class=\"m\">L:\\ x+y=3<\/span> 經 <span class=\"m\">A<\/span> 的像。<\/p>","steps":["<span class=\"m\">\\det A=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。","原像 <span class=\"m\">x=x'-y'<\/span>，<span class=\"m\">y=-x'+2y'<\/span>。","代入 <span class=\"m\">x+y=3<\/span>：<span class=\"m\">(x'-y')+(-x'+2y')=y'=3<\/span>，像為直線 <span class=\"m\">y=3<\/span>。"],"after":"<p>另解（兩點）：<span class=\"m\">L<\/span> 上取 <span class=\"m\">(3,0)\\mapsto(6,3)<\/span>、<span class=\"m\">(0,3)\\mapsto(3,3)<\/span>，過兩點的直線為 <span class=\"m\">y=3<\/span>。<\/p>\n<p>陷阱：<em>以 <span class=\"m\">x'=2x+y,\\ y'=x+y<\/span> 代入<\/em>得不到像；此法只能用於求原像。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">\\det A=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li>\n<li>原像 <span class=\"m\">x=x'-y'<\/span>，<span class=\"m\">y=-x'+2y'<\/span>。<\/li>\n<li>代入 <span class=\"m\">x+y=3<\/span>：<span class=\"m\">(x'-y')+(-x'+2y')=y'=3<\/span>，像為直線 <span class=\"m\">y=3<\/span>。<\/li>\n<\/ol>\n<p>另解（兩點）：<span class=\"m\">L<\/span> 上取 <span class=\"m\">(3,0)\\mapsto(6,3)<\/span>、<span class=\"m\">(0,3)\\mapsto(3,3)<\/span>，過兩點的直線為 <span class=\"m\">y=3<\/span>。<\/p>\n<p>陷阱：<em>以 <span class=\"m\">x'=2x+y,\\ y'=x+y<\/span> 代入<\/em>得不到像；此法只能用於求原像。<\/p>"},{"title":"例題 12　由不動直線判讀變換","q":"<p>線性變換 <span class=\"m\">T<\/span> 使直線 <span class=\"m\">y=x<\/span> 上每一點都不動，且 <span class=\"m\">T(1,0)=(3,-2)<\/span>。(1) 求 <span class=\"m\">T<\/span> 的矩陣 <span class=\"m\">A<\/span>；(2) 求 <span class=\"m\">T(1,-1)<\/span>，並說明 <span class=\"m\">T<\/span> 的幾何意義；(3) 單位圓經 <span class=\"m\">T<\/span> 後所圍面積。<\/p>","steps":["<span class=\"m\">T(1,1)=(1,1)<\/span>，<span class=\"m\">T(0,1)=T(1,1)-T(1,0)=(-2,3)<\/span>，<span class=\"m\">A=\\begin{bmatrix}3 &amp; -2\\\\ -2 &amp; 3\\end{bmatrix}<\/span>。","<span class=\"m\">T(1,-1)=(3+2,\\ -2-3)=(5,-5)=5(1,-1)<\/span>。","意義：沿 <span class=\"m\">y=x<\/span> 方向不變，沿 <span class=\"m\">y=-x<\/span> 方向伸長為 5 倍（圖 M9-16）。","面積比 <span class=\"m\">\\det A=9-4=5<\/span>，像所圍面積 <span class=\"m\">5\\pi<\/span>；也可由半軸長 <span class=\"m\">1<\/span> 與 <span class=\"m\">5<\/span> 得 <span class=\"m\">\\pi\\cdot1\\cdot5<\/span>。"],"after":"<figure class=\"fig\"><svg viewBox=\"0 0 420 330\" width=\"420\"><defs><marker id=\"M9-f12-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f12-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><marker id=\"M9-f12-m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,1 xt>\n<text x=\"240.9\" y=\"134.1\" font-size=\"13\" fill=\"#2e8b57\">長 1<\/text>\n<\/svg><figcaption>圖 M9-16　單位圓經 <span class=\"m\">A=\\begin{bmatrix}3 &amp; -2\\\\ -2 &amp; 3\\end{bmatrix}<\/span> 變成沿 y = −x 方向拉長的橢圓<\/figcaption><\/figure>\n<p>另解：<span class=\"m\">A=R_{45^\\circ}\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 5\\end{bmatrix}R_{-45^\\circ}<\/span>，可直接相乘驗證。<\/p>\n<p>陷阱：像的橢圓方程式含 <span class=\"m\">xy<\/span> 項，<em>不必整理<\/em>，面積由行列式求得。<\/p>"},{"title":"例題 13　兩鏡射的合成","q":"<p>先對 <span class=\"m\">y=x<\/span> 鏡射，再對 <span class=\"m\">y=\\sqrt3x<\/span> 鏡射。(1) 求合成變換的矩陣；(2) 求最小正整數 <span class=\"m\">n<\/span>，使連續作此合成變換 <span class=\"m\">n<\/span> 次後每一點都回到原處。<\/p>","steps":["<span class=\"m\">M_{45^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M_{60^\\circ}=\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}<\/span>。","<span class=\"m\">M_{60^\\circ}M_{45^\\circ}=\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; -\\frac12\\\\ \\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}=R_{30^\\circ}<\/span>。","<span class=\"m\">R_{30^\\circ}^n=R_{30^\\circ n}=I<\/span> 的最小正整數 <span class=\"m\">n=12<\/span>。"],"after":"<p>另解：<span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}=R_{2(60^\\circ-45^\\circ)}=R_{30^\\circ}<\/span>，不必乘矩陣。<\/p><p>陷阱：<em>順序相反時為 <span class=\"m\">R_{-30^\\circ}<\/span><\/em>，本小題答案相同，但若問某一點的像則不同。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">M_{45^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M_{60^\\circ}=\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">M_{60^\\circ}M_{45^\\circ}=\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; -\\frac12\\\\ \\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}=R_{30^\\circ}<\/span>。<\/li>\n<li><span class=\"m\">R_{30^\\circ}^n=R_{30^\\circ n}=I<\/span> 的最小正整數 <span class=\"m\">n=12<\/span>。<\/li>\n<\/ol><p>另解：<span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}=R_{2(60^\\circ-45^\\circ)}=R_{30^\\circ}<\/span>，不必乘矩陣。<\/p><p>陷阱：<em>順序相反時為 <span class=\"m\">R_{-30^\\circ}<\/span><\/em>，本小題答案相同，但若問某一點的像則不同。<\/p>"},{"title":"例題 14　點列與面積和（挑戰）","q":"<p><span class=\"m\">A=\\begin{bmatrix}1 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">P_0=(1,0)<\/span>，<span class=\"m\">P_{k+1}=AP_k<\/span>。(1) 求 <span class=\"m\">P_8<\/span>；(2) 求 <span class=\"m\">\\triangle OP_kP_{k+1}<\/span>（<span class=\"m\">k=0,1,\\dots,7<\/span>）的面積和。<\/p>","steps":["<span class=\"m\">A=\\sqrt2R_{45^\\circ}<\/span>，<span class=\"m\">P_8=A^8P_0=16R_{360^\\circ}P_0=(16,0)<\/span>。","<span class=\"m\">\\overline{OP_k}=(\\sqrt2)^k<\/span>，<span class=\"m\">\\angle P_kOP_{k+1}=45^\\circ<\/span>。","<span class=\"m\">[\\triangle OP_kP_{k+1}]=\\frac12(\\sqrt2)^k(\\sqrt2)^{k+1}\\sin45^\\circ=\\frac12\\cdot2^k\\sqrt2\\cdot\\frac{\\sqrt2}{2}=2^{k-1}<\/span>。","面積和 <span class=\"m\">\\sum_{k=0}^{7}2^{k-1}=\\frac12(2^8-1)=\\frac{255}{2}<\/span>。"],"after":"<figure class=\"fig\"><svg viewBox=\"0 0 360 290\" width=\"360\"><defs><marker id=\"M9-f14-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"70\" y1=\"94\" x2=\"310\" y2=\"94\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<line x1=\"200\" y1=\"278\" x2=\"200\" y2=\"16\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<text x=\"306\" y=\"112\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"208\" y=\"24\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"186\" y=\"110\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"280\" y1=\"91\" x2=\"280\" y2=\"97\" stroke=\"#1f2a44\"/>\n<text x=\"280\" y=\"110\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"middle\">4<\/text>\n<line x1=\"197\" y1=\"254\" x2=\"203\" y2=\"254\" stroke=\"#1f2a44\"/>\n<text x=\"194\" y=\"258\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"end\">-8<\/text>\n<polygon points=\"200,94 220,94 220,74\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 220,74 200,54\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 200,54 160,54\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 160,54 120,94\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,94 120,174\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,174 200,254\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<circle cx=\"220\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"224\" y=\"108\" font-size=\"13\" fill=\"#1f2a44\">P₀<\/text>\n<circle cx=\"220\" cy=\"74\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"226\" y=\"70\" font-size=\"13\" fill=\"#1f2a44\">P₁<\/text>\n<circle cx=\"200\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"206\" y=\"48\" font-size=\"13\" fill=\"#1f2a44\">P₂<\/text>\n<circle cx=\"160\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"134\" y=\"50\" font-size=\"13\" fill=\"#1f2a44\">P₃<\/text>\n<circle cx=\"120\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"88\" font-size=\"13\" fill=\"#1f2a44\">P₄<\/text>\n<circle cx=\"120\" cy=\"174\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"188\" font-size=\"13\" fill=\"#1f2a44\">P₅<\/text>\n<circle cx=\"200\" cy=\"254\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"208\" y=\"258\" font-size=\"13\" fill=\"#1f2a44\">P₆<\/text>\n<\/svg><figcaption>圖 M9-17　點列 P₀ 到 P₆ 繞原點逆時針旋轉並以 √2 倍外擴<\/figcaption><\/figure>\n<p>另解（行列式）：<span class=\"m\">[\\triangle OP_0P_1]=\\frac12\\begin{vmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{vmatrix}=\\frac12<\/span>；<span class=\"m\">\\triangle OP_{k+1}P_{k+2}<\/span> 是 <span class=\"m\">\\triangle OP_kP_{k+1}<\/span> 經 <span class=\"m\">A<\/span> 的像，面積比 <span class=\"m\">\\det A=2<\/span>，故面積成公比 2 的等比數列。<\/p>\n<p>陷阱：<span class=\"m\">k<\/span> 從 0 到 7 共 8 項，<em>項數算錯<\/em>會得 <span class=\"m\">\\frac{127}{2}<\/span> 或 <span class=\"m\">\\frac{511}{2}<\/span>。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">A=\\sqrt2R_{45^\\circ}<\/span>，<span class=\"m\">P_8=A^8P_0=16R_{360^\\circ}P_0=(16,0)<\/span>。<\/li>\n<li><span class=\"m\">\\overline{OP_k}=(\\sqrt2)^k<\/span>，<span class=\"m\">\\angle P_kOP_{k+1}=45^\\circ<\/span>。<\/li>\n<li><span class=\"m\">[\\triangle OP_kP_{k+1}]=\\frac12(\\sqrt2)^k(\\sqrt2)^{k+1}\\sin45^\\circ=\\frac12\\cdot2^k\\sqrt2\\cdot\\frac{\\sqrt2}{2}=2^{k-1}<\/span>。<\/li>\n<li>面積和 <span class=\"m\">\\sum_{k=0}^{7}2^{k-1}=\\frac12(2^8-1)=\\frac{255}{2}<\/span>。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 360 290\" width=\"360\"><defs><marker id=\"M9-f14-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"70\" y1=\"94\" x2=\"310\" y2=\"94\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<line x1=\"200\" y1=\"278\" x2=\"200\" y2=\"16\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<text x=\"306\" y=\"112\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"208\" y=\"24\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"186\" y=\"110\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"280\" y1=\"91\" x2=\"280\" y2=\"97\" stroke=\"#1f2a44\"/>\n<text x=\"280\" y=\"110\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"middle\">4<\/text>\n<line x1=\"197\" y1=\"254\" x2=\"203\" y2=\"254\" stroke=\"#1f2a44\"/>\n<text x=\"194\" y=\"258\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"end\">-8<\/text>\n<polygon points=\"200,94 220,94 220,74\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 220,74 200,54\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 200,54 160,54\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 160,54 120,94\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,94 120,174\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,174 200,254\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<circle cx=\"220\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"224\" y=\"108\" font-size=\"13\" fill=\"#1f2a44\">P₀<\/text>\n<circle cx=\"220\" cy=\"74\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"226\" y=\"70\" font-size=\"13\" fill=\"#1f2a44\">P₁<\/text>\n<circle cx=\"200\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"206\" y=\"48\" font-size=\"13\" fill=\"#1f2a44\">P₂<\/text>\n<circle cx=\"160\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"134\" y=\"50\" font-size=\"13\" fill=\"#1f2a44\">P₃<\/text>\n<circle cx=\"120\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"88\" font-size=\"13\" fill=\"#1f2a44\">P₄<\/text>\n<circle cx=\"120\" cy=\"174\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"188\" font-size=\"13\" fill=\"#1f2a44\">P₅<\/text>\n<circle cx=\"200\" cy=\"254\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"208\" y=\"258\" font-size=\"13\" fill=\"#1f2a44\">P₆<\/text>\n<\/svg><figcaption>圖 M9-17　點列 P₀ 到 P₆ 繞原點逆時針旋轉並以 √2 倍外擴<\/figcaption><\/figure>\n<p>另解（行列式）：<span class=\"m\">[\\triangle OP_0P_1]=\\frac12\\begin{vmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{vmatrix}=\\frac12<\/span>；<span class=\"m\">\\triangle OP_{k+1}P_{k+2}<\/span> 是 <span class=\"m\">\\triangle OP_kP_{k+1}<\/span> 經 <span class=\"m\">A<\/span> 的像，面積比 <span class=\"m\">\\det A=2<\/span>，故面積成公比 2 的等比數列。<\/p>\n<p>陷阱：<span class=\"m\">k<\/span> 從 0 到 7 共 8 項，<em>項數算錯<\/em>會得 <span class=\"m\">\\frac{127}{2}<\/span> 或 <span class=\"m\">\\frac{511}{2}<\/span>。<\/p>"}],"mis":[{"bad":"平移 <span class=\"m\">(x,y)\\mapsto(x+1,y-2)<\/span> 是線性變換。","good":"線性變換必把原點映到原點；平移不是線性變換，無法以二階方陣表示。"},{"bad":"<span class=\"m\">T(1,0)=(a,c)<\/span>、<span class=\"m\">T(0,1)=(b,d)<\/span>，所以矩陣是 <span class=\"m\">\\begin{bmatrix}a &amp; c\\\\ b &amp; d\\end{bmatrix}<\/span>。","good":"單位點的像直著填成<strong>行<\/strong>：<span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>。"},{"bad":"先作 <span class=\"m\">A<\/span> 再作 <span class=\"m\">B<\/span>，合成矩陣為 <span class=\"m\">AB<\/span>。","good":"合成矩陣為 <span class=\"m\">BA<\/span>，後作用的矩陣寫在左邊。"},{"bad":"經 <span class=\"m\">A<\/span> 變換後面積變為 <span class=\"m\">\\det A<\/span> 倍。","good":"面積變為 <span class=\"m\">|\\det A|<\/span> 倍；<span class=\"m\">\\det A<\/span> 的正負表示方向是否反轉。"},{"bad":"對原點對稱是一種鏡射，行列式為 <span class=\"m\">-1<\/span>。","good":"對原點對稱＝旋轉 <span class=\"m\">180^\\circ<\/span>，矩陣 <span class=\"m\">-I<\/span>，行列式為 <span class=\"m\">1<\/span>，方向不變。"},{"bad":"求圓 <span class=\"m\">x^2+y^2=1<\/span> 經 <span class=\"m\">\\begin{bmatrix}3 &amp; 0\\\\ 0 &amp; 2\\end{bmatrix}<\/span> 的像，把 <span class=\"m\">x'=3x,\\ y'=2y<\/span> 代入得 <span class=\"m\">9x^2+4y^2=1<\/span>。","good":"以 <span class=\"m\">x=\\frac{x'}{3},\\ y=\\frac{y'}{2}<\/span> 代入原式，像為 <span class=\"m\">\\frac{x^2}{9}+\\frac{y^2}{4}=1<\/span>。"},{"bad":"線性變換把直線映成直線，把正方形映成正方形。","good":"直線的像為直線或一點（<span class=\"m\">\\det A=0<\/span> 時可能退化）；正方形的像一般是平行四邊形。"},{"bad":"<span class=\"m\">\\begin{bmatrix}1 &amp; -\\sqrt3\\\\ \\sqrt3 &amp; 1\\end{bmatrix}<\/span> 是旋轉 <span class=\"m\">60^\\circ<\/span> 的矩陣。","good":"它等於 <span class=\"m\">2R_{60^\\circ}<\/span>，是旋轉 <span class=\"m\">60^\\circ<\/span> 再伸縮 2 倍；行列式為 4。"},{"bad":"兩個鏡射的合成仍是鏡射。","good":"兩個鏡射的合成是旋轉（行列式 <span class=\"m\">(-1)(-1)=1<\/span>），旋轉角為兩軸夾角的兩倍。"},{"bad":"投影到直線 <span class=\"m\">L<\/span> 的反變換是「從 <span class=\"m\">L<\/span> 拉回原處」。","good":"投影的行列式為 0，與 <span class=\"m\">L<\/span> 垂直的整條直線都映到同一點，沒有反變換。"},{"bad":"旋轉中心為 <span class=\"m\">C(1,1)<\/span> 的旋轉 <span class=\"m\">90^\\circ<\/span>，矩陣仍為 <span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，直接乘上點坐標即可。","good":"須寫成 <span class=\"m\">P'=C+R_{90^\\circ}(P-C)<\/span>；中心不在原點的旋轉不是線性變換。"}],"check":["能由坐標規則或兩個單位點的像寫出變換矩陣，並說明「行＝單位點的像」。","能由兩個不平行向量的像求矩陣（<span class=\"m\">A=CB^{-1}<\/span> 或線性組合）。","能寫出伸縮、對 <span class=\"m\">x<\/span> 軸、<span class=\"m\">y<\/span> 軸、<span class=\"m\">y=\\pm x<\/span> 及 <span class=\"m\">y=mx<\/span> 鏡射、旋轉 <span class=\"m\">\\theta<\/span>、推移、投影的矩陣，並推導鏡射與旋轉公式。","能辨認 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}=rR_\\theta<\/span>，並求其乘冪。","能寫出合成變換的矩陣（後作用者在左），並判斷兩鏡射、鏡射與旋轉的合成結果。","能用 <span class=\"m\">|\\det A|<\/span> 求面積比，用 <span class=\"m\">\\det A<\/span> 的正負判斷方向，說明 <span class=\"m\">\\det A=0<\/span> 時的退化情形。","能求反變換，並以正確的代入方向求直線、圓的像與原像。","（進階）能求不變直線（特徵向量），並以特徵向量分解（對角化）或凱萊–哈密頓定理（M8）求 <span class=\"m\">A^n<\/span>。"]},"M10":{"id":"M10","title":"轉移矩陣","subject":"數學","src":"","secs":[{"t":"導言","h":"<p>本單元處理有限個狀態、逐期轉移的機率模型：轉移圖、轉移矩陣、狀態向量、<span class=\"m\">n<\/span> 期後的分布、穩定狀態與長期行為。以二階為主，三階列為進階。<\/p>"},{"t":"課綱對照與考點","h":"<table class=\"t\"><thead><tr><th>課綱代碼<\/th><th>學習內容<\/th><th>本單元小節<\/th><th>學測常見考法<\/th><\/tr><\/thead><tbody>\n<tr><td>F-11A-3<\/td><td>矩陣的應用：二階轉移方陣<\/td><td>一～六<\/td><td>由情境寫出轉移矩陣；求下一期、兩期後的分布；求穩定狀態<\/td><\/tr>\n<tr><td>F-11A-3（延伸）<\/td><td>三階轉移矩陣、吸收狀態<\/td><td>七（進階）<\/td><td>以穩定狀態方程組或兩期計算出現，不考一般理論<\/td><\/tr>\n<tr><td>A-11A-3<\/td><td>矩陣乘法、方陣乘冪（M8）<\/td><td>三、四<\/td><td><span class=\"m\">A^2<\/span> 元素的意義；<span class=\"m\">A^n<\/span> 的一般式與極限<\/td><\/tr>\n<tr><td>A-11A-2<\/td><td>聯立方程組（M7）<\/td><td>五<\/td><td>穩定狀態：齊次方程組加「總和為 1」<\/td><\/tr>\n<tr><td>D-11A-2<\/td><td>條件機率（M11）<\/td><td>一、三<\/td><td>轉移機率即條件機率；樹狀圖與矩陣兩法互驗<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"key\"><p><strong>先備<\/strong>：矩陣乘法與乘冪（M8）；二階方陣作為線性變換（M9）；遞迴數列 <span class=\"m\">a_{n+1}=ra_n+d<\/span> 的解法（高一數列）；常用對數（第三冊）。轉移機率屬條件機率，此處只用其直觀意義，定義見 M11。<\/p><\/div>"},{"t":"一、馬可夫過程與轉移圖","h":"<div class=\"note\"><p>「期」可以是一天、一個月、一年、一次購買。<\/p><p>題目沒寫「每期機率不變」時，學測一律視為不變。<\/p><\/div>\n<div class=\"key\">\n<p><strong>定義<\/strong>　某系統在每一期恰處於有限個<strong>狀態<\/strong>之一，並隨時間逐期改變。若「下一期處於狀態 <span class=\"m\">i<\/span>」的機率<span class=\"circle\">只取決於本期狀態<\/span> <span class=\"m\">j<\/span>，與更早的歷史無關，且此機率不隨期數改變，則稱此過程為（時間齊次的）<strong>馬可夫過程<\/strong>，又稱馬可夫鏈。<\/p>\n<p><strong>轉移機率<\/strong>　本期在狀態 <span class=\"m\">j<\/span>、下一期在狀態 <span class=\"m\">i<\/span> 的條件機率，記為 <span class=\"m\">a_{ij}<\/span>：<\/p>\n<div class=\"mb\">a_{ij}=P(\\text{下一期在 } i\\mid \\text{本期在 } j)<\/div>\n<\/div>\n<ul>\n<li><strong>馬可夫性質<\/strong>（無記憶性）：已知本期狀態後，過去如何到達本期，對下一期沒有影響。<\/li>\n<li><strong>時間齊次<\/strong>：每一期使用同一組轉移機率；若第 1 期與第 2 期的轉移機率不同，則需兩個不同的矩陣。<\/li>\n<li><strong>轉移圖<\/strong>：以圓圈表示狀態，有向箭頭由本期狀態指向下一期狀態，箭頭旁標轉移機率；指回自身的箭頭（自迴圈）表示停留。<\/li>\n<\/ul>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 200\" width=\"420\"><defs><marker id=\"M10-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs><circle cx=\"138.6\" cy=\"100\" r=\"30\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/><text x=\"138.6\" y=\"105.6\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1f2a44\">晴<\/text><circle cx=\"281.4\" cy=\"100\" r=\"30\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/><text x=\"281.4\" y=\"105.6\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1f2a44\">雨<\/text><path d=\"M164.3,84.6 Q210,57.2 254,83.5\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-a)\"/><text x=\"209.6\" y=\"61.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">0.4<\/text><path d=\"M255.7,115.4 Q210,142.8 166,116.5\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-a)\"/><text x=\"210.4\" y=\"148.3\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">0.3<\/text><path d=\"M112.1,114.1 C73.2,158.9 73.2,41.1 110.3,85\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-a)\"/><text x=\"48.6\" y=\"104.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">0.6<\/text><path d=\"M307.9,85.9 C346.8,41.1 346.8,158.9 309.7,115\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M10-a)\"/><text x=\"371.4\" y=\"104.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">0.7<\/text><\/svg><figcaption>圖 M10-1　晴雨兩狀態的轉移圖（箭頭由「本期」指向「下一期」）<\/figcaption><\/figure>\n<p>圖 M10-1 中，由「晴」出發的兩個箭頭機率為 0.6 與 0.4，由「雨」出發的為 0.3 與 0.7。<span class=\"box\">由同一狀態出發的所有箭頭，機率和為 1<\/span>；指向同一狀態的箭頭機率和則無此限制。<span class=\"hand\">出去的加起來才是 1<\/span><\/p>\n<div class=\"warn\"><p>注意：轉移機率是<em>以本期狀態為條件<\/em>的機率。「明天下雨的機率」與「今天晴時明天下雨的機率」不同：前者要把今天晴、今天雨兩種情形加權合計。<\/p><\/div>\n<div class=\"exam\"><p>學測多以文字敘述給出轉移機率，如「今天晴，明天仍晴的機率為 0.6；今天雨，明天轉晴的機率為 0.3」。須自行補上「晴轉雨 0.4」「雨仍雨 0.7」等未寫出的機率（由出發和為 1 推得），再寫成矩陣。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　馬可夫與鏈的起源<\/strong><\/p>\n<p>俄國數學家馬可夫（A. A. Markov，1856–1922）於 1906 年發表研究「相依隨機變數」的論文，把大數法則推廣到前後相依的情形，此類過程後稱馬可夫鏈。1913 年 1 月，他在聖彼得堡帝國科學院報告對普希金詩體小說《葉甫蓋尼·奧涅金》前 20000 個字母的分析：把字母分成母音、子音兩個狀態，統計相鄰字母「母音後接母音」「子音後接母音」等的頻率，發現母音與子音有明顯交替的傾向。這是馬可夫鏈的第一個實際資料應用。<\/p><\/div>\n\n<div class=\"tip\"><p><strong>深究　不具無記憶性時：擴充狀態<\/strong>（進階）<\/p>\n<p>若明天的天氣取決於「今天與昨天」兩天，則以「晴、雨」為狀態不合馬可夫性質。改以相鄰兩天為一個狀態：「晴晴、晴雨、雨晴、雨雨」（前為昨天、後為今天），每期往後移一天。例如狀態「晴雨」的下一期只可能是「雨晴」或「雨雨」，其餘兩個轉移機率為 0。<\/p>\n<ul>\n<li>擴充後狀態數由 2 變為 4，轉移矩陣為四階，每行至多兩個非零元。<\/li>\n<li>新過程合乎馬可夫性質，前述所有方法（<span class=\"m\">x_n=A^nx_0<\/span>、穩定狀態）照樣適用。<\/li>\n<li>學測不考此類擴充，但題目若出現「連續兩天」「前兩次」等條件，即已不屬二階轉移矩陣的情境，宜改用樹狀圖逐步計算。<\/li>\n<\/ul><\/div>","qs":["M10-07","M10-25","M10-26"]},{"t":"二、轉移矩陣的定義與兩種約定","h":"<div class=\"key\">\n<p><strong>定義<\/strong>　具有 <span class=\"m\">k<\/span> 個狀態的馬可夫過程，把轉移機率 <span class=\"m\">a_{ij}<\/span> 排成 <span class=\"m\">k<\/span> 階方陣 <span class=\"m\">A=[a_{ij}]<\/span>，稱為<strong>轉移矩陣<\/strong>（又稱轉移方陣）。國內高中通行的約定為：<\/p>\n<ul>\n<li>第 <span class=\"m\">j<\/span> <strong>行<\/strong>（column）代表「本期在狀態 <span class=\"m\">j<\/span>」，第 <span class=\"m\">i<\/span> <strong>列<\/strong>（row）代表「下一期在狀態 <span class=\"m\">i<\/span>」。<\/li>\n<li>條件一：每一元 <span class=\"m\">a_{ij}\\ge 0<\/span>。<\/li>\n<li>條件二：<span class=\"circle\">每一行的和為 1<\/span>，即 <span class=\"m\">a_{1j}+a_{2j}+\\cdots+a_{kj}=1<\/span>。<\/li>\n<\/ul>\n<p>合乎條件一、二的方陣，都可作為某個馬可夫過程的轉移矩陣。<\/p>\n<\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 190\" width=\"440\"><defs><marker id=\"M10-b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-br\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs><text x=\"150\" y=\"40\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2f6fb5\">從晴<\/text><text x=\"230\" y=\"40\" font-size=\"14\" text-anchor=\"middle\" fill=\"#d9772b\">從雨<\/text><text x=\"150\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2a44\">（本期狀態＝行）<\/text><polyline points=\"118,52 108,52 108,148 118,148\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"2\"/><polyline points=\"262,52 272,52 272,148 262,148\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"2\"/><rect x=\"125\" y=\"56\" width=\"50\" height=\"88\" rx=\"6\" fill=\"#cfe3f8\" opacity=\"0.6\"/><rect x=\"205\" y=\"56\" width=\"50\" height=\"88\" rx=\"6\" fill=\"#fbdcbd\" opacity=\"0.6\"/><text x=\"150\" y=\"88\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1f2a44\">0.6<\/text><text x=\"230\" y=\"88\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1f2a44\">0.3<\/text><text x=\"150\" y=\"128\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1f2a44\">0.4<\/text><text x=\"230\" y=\"128\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1f2a44\">0.7<\/text><text x=\"70\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1f2a44\">到晴<\/text><text x=\"70\" y=\"128\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1f2a44\">到雨<\/text><text x=\"70\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2a44\">（下一期＝列）<\/text><text x=\"150\" y=\"175\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">和＝1<\/text><text x=\"230\" y=\"175\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c2410c\">和＝1<\/text><line x1=\"256\" y1=\"80\" x2=\"296\" y2=\"98\" stroke=\"#c2410c\" stroke-width=\"1.2\" marker-end=\"url(#M10-br)\"/><text x=\"300\" y=\"112\" font-size=\"14\" fill=\"#1f2a44\">a<tspan baseline-shift=\"sub\" font-size=\"11\">12<\/tspan>＝0.3：<\/text><text x=\"300\" y=\"132\" font-size=\"14\" fill=\"#1f2a44\">由雨（第 2 行）<\/text><text x=\"300\" y=\"152\" font-size=\"14\" fill=\"#1f2a44\">轉到晴（第 1 列）<\/text><\/svg><figcaption>圖 M10-2　轉移矩陣元素的位置與意義：行為「從」，列為「到」<\/figcaption><\/figure>\n<div class=\"formula\" data-t=\"二階轉移矩陣的一般式\"><div class=\"mb\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}，\\quad 0\\le p\\le 1，\\ 0\\le q\\le 1<\/div><p><span class=\"m\">p<\/span>：由狀態 1 轉到狀態 2 的機率　<span class=\"m\">q<\/span>：由狀態 2 轉到狀態 1 的機率　對角元：停留的機率<\/p><\/div>\n<p>以圖 M10-1 為例，狀態依「晴、雨」排序，<span class=\"m\">p=0.4<\/span>（晴轉雨）、<span class=\"m\">q=0.3<\/span>（雨轉晴）：<\/p>\n<div class=\"mb\">A=\\begin{bmatrix}0.6 &amp; 0.3\\\\ 0.4 &amp; 0.7\\end{bmatrix}<\/div>\n<p><strong>機率向量<\/strong>　各分量非負且總和為 1 的行向量稱為機率向量。第 <span class=\"m\">n<\/span> 期處於各狀態的機率排成的機率向量稱為第 <span class=\"m\">n<\/span> 期的<strong>狀態向量<\/strong>，記為 <span class=\"m\">x_n<\/span>；<span class=\"m\">x_0<\/span> 稱為初始狀態。為節省版面，行內把二階行向量 <span class=\"m\">\\begin{bmatrix}a\\\\ b\\end{bmatrix}<\/span> 簡記為 <span class=\"m\">(a,b)<\/span>，計算時一律當作行向量。<\/p>\n\n<h4>兩種約定的對照<\/h4>\n<p>國內高中教材通行「行和為 1」；大學機率課程與多數英文教材則採「列和為 1」，兩者互為轉置。<\/p>\n<table class=\"t\"><thead><tr><th>項目<\/th><th>高中通行（行和為 1）<\/th><th>另一種約定（列和為 1）<\/th><\/tr><\/thead><tbody>\n<tr><td>元素意義<\/td><td><span class=\"m\">a_{ij}<\/span>：由 <span class=\"m\">j<\/span> 到 <span class=\"m\">i<\/span><\/td><td><span class=\"m\">p_{ij}<\/span>：由 <span class=\"m\">i<\/span> 到 <span class=\"m\">j<\/span><\/td><\/tr>\n<tr><td>限制<\/td><td>每一行和為 1<\/td><td>每一列和為 1<\/td><\/tr>\n<tr><td>狀態向量<\/td><td>行向量 <span class=\"m\">x_n<\/span><\/td><td>列向量 <span class=\"m\">\\pi_n<\/span><\/td><\/tr>\n<tr><td>遞推式<\/td><td><span class=\"m\">x_{n+1}=Ax_n<\/span>（矩陣在左）<\/td><td><span class=\"m\">\\pi_{n+1}=\\pi_nP<\/span>（矩陣在右）<\/td><\/tr>\n<tr><td>穩定狀態<\/td><td><span class=\"m\">As=s<\/span><\/td><td><span class=\"m\">\\pi P=\\pi<\/span><\/td><\/tr>\n<tr><td>關係<\/td><td colspan=\"2\"><span class=\"m\">P=A^{T}<\/span>（轉置，進階）；兩者描述同一過程，答案相同<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"warn\"><p>注意：題目若給的方陣<em>列和為 1、行和不為 1<\/em>，表示採另一種約定；須先轉置，或改用 <span class=\"m\">\\pi_{n+1}=\\pi_nP<\/span> 計算，不可直接以 <span class=\"m\">Ax_n<\/span> 相乘。<\/p><\/div>\n<div class=\"mnem\"><p>行是「從」、列是「到」，每行加起來等於 1。<\/p><\/div>\n<div class=\"key\"><p><strong>示例<\/strong>　某城市通勤族只用捷運、公車、機車三種方式。調查得：本月搭捷運者，下月仍搭捷運 85%、改搭公車 10%；本月搭公車者，下月改搭捷運 20%、仍搭公車 70%；本月騎機車者，下月改搭捷運 15%、改搭公車 5%。狀態依「捷運、公車、機車」排序。<\/p>\n<ol class=\"steps\">\n<li>第 1 行（從捷運）：0.85、0.10，機車 <span class=\"m\">1-0.85-0.10=0.05<\/span>。<\/li>\n<li>第 2 行（從公車）：0.20、0.70，機車 <span class=\"m\">0.10<\/span>。<\/li>\n<li>第 3 行（從機車）：0.15、0.05，機車 <span class=\"m\">0.80<\/span>。<\/li>\n<\/ol>\n<div class=\"mb\">A=\\begin{bmatrix}0.85 &amp; 0.20 &amp; 0.15\\\\ 0.10 &amp; 0.70 &amp; 0.05\\\\ 0.05 &amp; 0.10 &amp; 0.80\\end{bmatrix}<\/div>\n<p>注意：敘述中「仍搭」「改搭」混用，且每一行都少給一個機率，須以行和為 1 補出；各列和（1.2、0.85、0.95）不必為 1。<\/p><\/div>\n\n<h4>轉移矩陣的基本性質<\/h4>\n<div class=\"key\">\n<p>設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 為同階轉移矩陣，<span class=\"m\">u=\\begin{bmatrix}1 &amp; 1 &amp; \\cdots &amp; 1\\end{bmatrix}<\/span> 為各元皆 1 的列矩陣。<\/p>\n<ol>\n<li>行和為 1 等價於 <span class=\"m\">uA=u<\/span>。<\/li>\n<li>若 <span class=\"m\">x<\/span> 為機率向量，則 <span class=\"m\">Ax<\/span> 也是機率向量。<\/li>\n<li><span class=\"m\">AB<\/span> 也是轉移矩陣；特別地，<span class=\"box\"><span class=\"m\">A^n<\/span> 是轉移矩陣<\/span>。<\/li>\n<li><span class=\"m\">\\det(A-I)=0<\/span>，即方程組 <span class=\"m\">(A-I)x=0<\/span> 必有非零解。<\/li>\n<\/ol>\n<\/div>\n<div class=\"key\"><p><strong>與 M8、M9 的對照<\/strong><\/p>\n<table class=\"t\"><thead><tr><th>矩陣概念<\/th><th>在轉移矩陣中的意義<\/th><\/tr><\/thead><tbody>\n<tr><td>矩陣乘向量 <span class=\"m\">Ax<\/span><\/td><td>經過一期後的分布<\/td><\/tr>\n<tr><td>乘冪 <span class=\"m\">A^n<\/span><\/td><td><span class=\"m\">n<\/span> 期轉移機率<\/td><\/tr>\n<tr><td>行列式 <span class=\"m\">\\det A<\/span><\/td><td>二階時等於 <span class=\"m\">\\lambda=1-p-q<\/span>，決定收斂快慢與是否擺盪<\/td><\/tr>\n<tr><td>反方陣 <span class=\"m\">A^{-1}<\/span><\/td><td>由後一期反推前一期，本身一般不是轉移矩陣<\/td><\/tr>\n<tr><td>線性變換（M9）<\/td><td>把線段 <span class=\"m\">x+y=1<\/span>（<span class=\"m\">x,y\\ge 0<\/span>）映到自身；<span class=\"m\">|\\lambda|&lt;1<\/span> 時朝穩定狀態收縮<\/td><\/tr>\n<tr><td>特徵向量（進階）<\/td><td>特徵值 1 的機率向量即穩定狀態<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"tip\"><p><strong>深究　性質 2、3、4 的證明<\/strong><\/p>\n<ol class=\"steps\">\n<li>性質 2：<span class=\"m\">Ax<\/span> 的每一分量是非負數的乘積和，故非負；分量總和為 <span class=\"m\">u(Ax)=(uA)x=ux=1<\/span>。<\/li>\n<li>性質 3：<span class=\"m\">AB<\/span> 的每一元是非負數的乘積和，故非負；又 <span class=\"m\">u(AB)=(uA)B=uB=u<\/span>，故每行和為 1。以數學歸納法得 <span class=\"m\">A^n<\/span> 為轉移矩陣。<\/li>\n<li>性質 4：<span class=\"m\">u(A-I)=uA-u=0<\/span>，表示 <span class=\"m\">A-I<\/span> 的各列相加為零列，各列線性相依，故行列式為 0。二階可直接驗算：<span class=\"m\">\\begin{vmatrix}-p &amp; q\\\\ p &amp; -q\\end{vmatrix}=pq-pq=0<\/span>。<\/li>\n<\/ol>\n<p>性質 4 表示 1 必為 <span class=\"m\">A<\/span> 的<strong>特徵值<\/strong>（進階）；第五節的穩定狀態就是特徵值 1 所對應、且為機率向量的特徵向量。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　轉移矩陣的特徵值絕對值不超過 1<\/strong>（進階）<\/p>\n<p>設 <span class=\"m\">k<\/span> 階轉移矩陣 <span class=\"m\">A<\/span> 有特徵值 <span class=\"m\">\\mu<\/span>，即存在非零列向量 <span class=\"m\">v=[v_1\\ \\cdots\\ v_k]<\/span> 使 <span class=\"m\">vA=\\mu v<\/span>（<span class=\"m\">A<\/span> 與其轉置的特徵值相同）。取 <span class=\"m\">|v_m|<\/span> 為各分量絕對值的最大者，比較第 <span class=\"m\">m<\/span> 個分量：<\/p>\n<div class=\"mb\">|\\mu||v_m|=\\left|\\sum_{i}v_ia_{im}\\right|\\le\\sum_{i}|v_i|a_{im}\\le|v_m|\\sum_{i}a_{im}=|v_m|<\/div>\n<p>故 <span class=\"m\">|\\mu|\\le 1<\/span>。取 <span class=\"m\">v=u=[1\\ \\cdots\\ 1]<\/span> 得 <span class=\"m\">\\mu=1<\/span>，所以 1 是絕對值最大的特徵值。二階時另一特徵值為 <span class=\"m\">\\lambda=1-p-q\\in[-1,1]<\/span>，與此一致；<span class=\"m\">|\\lambda|&lt;1<\/span> 正是第六節收斂的條件。<\/p><\/div>\n<div class=\"exam\"><p>判斷「可否為轉移矩陣」的選項常設陷阱：元素出現負數但行和仍為 1；列和為 1 而行和不為 1；含 0 或 1 的元（<em>合法<\/em>，表示不可能或必然轉移）。<\/p><\/div>","qs":["M10-05","M10-01","M10-02"]},{"t":"三、狀態向量與 n 期後的分布","h":"<div class=\"note\"><p>每一列＝「流入」該狀態的量相加。<\/p><p>每一行＝「流出」某狀態的量分配。<\/p><\/div>\n<div class=\"formula\" data-t=\"狀態的遞推\"><div class=\"mb\">x_{n+1}=Ax_n，\\qquad x_n=A^n x_0<\/div><p><span class=\"m\">x_n<\/span>：第 <span class=\"m\">n<\/span> 期狀態向量（行向量）　<span class=\"m\">A<\/span>：轉移矩陣　<span class=\"m\">A^n<\/span>：<span class=\"m\">n<\/span> 期轉移矩陣<\/p><\/div>\n<p><strong>推導<\/strong>　設第 <span class=\"m\">n<\/span> 期在狀態 1、2 的機率為 <span class=\"m\">a_n<\/span>、<span class=\"m\">b_n<\/span>。第 <span class=\"m\">n+1<\/span> 期在狀態 1，可能是「本期在 1 且停留」或「本期在 2 且轉入 1」，兩情形互斥，由乘法原理與加法原理：<\/p>\n<div class=\"mb\">\\begin{aligned} a_{n+1}&amp;=a_{11}a_n+a_{12}b_n\\\\ b_{n+1}&amp;=a_{21}a_n+a_{22}b_n\\end{aligned}\\quad\\Longleftrightarrow\\quad \\begin{bmatrix}a_{n+1}\\\\ b_{n+1}\\end{bmatrix}=\\begin{bmatrix}a_{11} &amp; a_{12}\\\\ a_{21} &amp; a_{22}\\end{bmatrix}\\begin{bmatrix}a_n\\\\ b_n\\end{bmatrix}<\/div>\n<p>此即全機率的計算（全機率定理見 M12）。反覆代入得 <span class=\"m\">x_n=A^nx_0<\/span>。<\/p>\n<h4>人數型解讀<\/h4>\n<p>若 <span class=\"m\">x_0<\/span> 改為各狀態的<strong>人數<\/strong>（或數量），且每個個體各自依轉移機率移動，則 <span class=\"m\">Ax_0<\/span> 是下一期各狀態的<span class=\"ul\">預期人數<\/span>；題目若敘述為「每年有 5% 遷出」等比例，則直接視為人數。行和為 1 保證<span class=\"circle\">總數不變<\/span>。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 500 250\" width=\"500\"><defs><marker id=\"M10-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-cr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs><text x=\"85\" y=\"22\" font-size=\"14\" text-anchor=\"middle\">第 n 年<\/text><text x=\"415\" y=\"22\" font-size=\"14\" text-anchor=\"middle\">第 n+1 年<\/text><rect x=\"35\" y=\"40\" width=\"100\" height=\"54\" rx=\"8\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/><text x=\"85.0\" y=\"62\" font-size=\"15\" text-anchor=\"middle\">都市<\/text><text x=\"85.0\" y=\"82\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c2410c\">70 萬<\/text><rect x=\"35\" y=\"170\" width=\"100\" height=\"54\" rx=\"8\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/><text x=\"85.0\" y=\"192\" font-size=\"15\" text-anchor=\"middle\">鄉村<\/text><text x=\"85.0\" y=\"212\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c2410c\">20 萬<\/text><rect x=\"365\" y=\"40\" width=\"100\" height=\"54\" rx=\"8\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/><text x=\"415.0\" y=\"62\" font-size=\"15\" text-anchor=\"middle\">都市<\/text><text x=\"415.0\" y=\"82\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c2410c\">68.5 萬<\/text><rect x=\"365\" y=\"170\" width=\"100\" height=\"54\" rx=\"8\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"2\"/><text x=\"415.0\" y=\"192\" font-size=\"15\" text-anchor=\"middle\">鄉村<\/text><text x=\"415.0\" y=\"212\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c2410c\">21.5 萬<\/text><line x1=\"135\" y1=\"62\" x2=\"363\" y2=\"62\" stroke=\"#1f2a44\" stroke-width=\"1.5\" marker-end=\"url(#M10-c)\"/><text x=\"250\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">×0.95＝66.5<\/text><line x1=\"135\" y1=\"82\" x2=\"363\" y2=\"192\" stroke=\"#1f2a44\" stroke-width=\"1.5\" marker-end=\"url(#M10-c)\"/><text x=\"222\" y=\"94\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">×0.05＝3.5<\/text><line x1=\"135\" y1=\"192\" x2=\"363\" y2=\"82\" stroke=\"#1f2a44\" stroke-width=\"1.5\" marker-end=\"url(#M10-c)\"/><text x=\"215\" y=\"197\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">×0.1＝2<\/text><line x1=\"135\" y1=\"212\" x2=\"363\" y2=\"212\" stroke=\"#1f2a44\" stroke-width=\"1.5\" marker-end=\"url(#M10-c)\"/><text x=\"250\" y=\"232\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">×0.9＝18<\/text><\/svg><figcaption>圖 M10-3　人口流動與矩陣乘法：每一列把流入該狀態的量相加（例題 5）<\/figcaption><\/figure>\n<h4><span class=\"m\">A^n<\/span> 元素的意義<\/h4>\n<div class=\"formula\" data-t=\"n 期轉移機率\"><div class=\"mb\">(A^n)_{ij}=P(\\text{n 期後在 } i\\mid \\text{現在在 } j)<\/div><p>第 <span class=\"m\">j<\/span> 行就是「由狀態 <span class=\"m\">j<\/span> 出發」時 <span class=\"m\">n<\/span> 期後的狀態向量，即 <span class=\"m\">A^n e_j<\/span>，其中 <span class=\"m\">e_j<\/span> 是第 <span class=\"m\">j<\/span> 分量為 1、其餘為 0 的向量。<\/p><\/div>\n<p>以圖 M10-1 的 <span class=\"m\">A<\/span> 計算：<\/p>\n<div class=\"mb\">A^2=\\begin{bmatrix}0.6 &amp; 0.3\\\\ 0.4 &amp; 0.7\\end{bmatrix}^2=\\begin{bmatrix}0.48 &amp; 0.39\\\\ 0.52 &amp; 0.61\\end{bmatrix}<\/div>\n<p><span class=\"m\">(A^2)_{21}=0.52<\/span>：今天晴，後天雨的機率。樹狀圖（圖 M10-4）的兩條路徑「晴→晴→雨」「晴→雨→雨」合計 <span class=\"m\">0.24+0.28=0.52<\/span>，與矩陣結果相同。<span class=\"hand\">矩陣乘法＝樹狀圖分路相加<\/span><\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 460 250\" width=\"460\"><defs><marker id=\"M10-d\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-dr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs><line x1=\"58\" y1=\"120\" x2=\"152\" y2=\"60\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"105.0\" y=\"84.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.6<\/text><line x1=\"58\" y1=\"120\" x2=\"152\" y2=\"180\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"105.0\" y=\"144.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.4<\/text><line x1=\"188\" y1=\"60\" x2=\"282\" y2=\"30\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"235.0\" y=\"39.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.6<\/text><line x1=\"188\" y1=\"60\" x2=\"282\" y2=\"90\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"235.0\" y=\"69.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.4<\/text><line x1=\"188\" y1=\"180\" x2=\"282\" y2=\"150\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"235.0\" y=\"159.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.3<\/text><line x1=\"188\" y1=\"180\" x2=\"282\" y2=\"210\" stroke=\"#1f2a44\" stroke-width=\"1.5\"/><text x=\"235.0\" y=\"189.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">0.7<\/text><rect x=\"23\" y=\"106\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"40\" y=\"125\" font-size=\"15\" text-anchor=\"middle\">晴<\/text><rect x=\"153\" y=\"46\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"170\" y=\"65\" font-size=\"15\" text-anchor=\"middle\">晴<\/text><rect x=\"153\" y=\"166\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.6\"/><text x=\"170\" y=\"185\" font-size=\"15\" text-anchor=\"middle\">雨<\/text><rect x=\"283\" y=\"16\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"300\" y=\"35\" font-size=\"15\" text-anchor=\"middle\">晴<\/text><rect x=\"283\" y=\"76\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.6\"/><text x=\"300\" y=\"95\" font-size=\"15\" text-anchor=\"middle\">雨<\/text><rect x=\"283\" y=\"136\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"300\" y=\"155\" font-size=\"15\" text-anchor=\"middle\">晴<\/text><rect x=\"283\" y=\"196\" width=\"34\" height=\"28\" rx=\"6\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.6\"/><text x=\"300\" y=\"215\" font-size=\"15\" text-anchor=\"middle\">雨<\/text><text x=\"330\" y=\"35\" font-size=\"14\" fill=\"#1f2a44\">0.6×0.6＝0.36<\/text><text x=\"330\" y=\"95\" font-size=\"14\" fill=\"#c2410c\">0.6×0.4＝0.24<\/text><text x=\"330\" y=\"155\" font-size=\"14\" fill=\"#1f2a44\">0.4×0.3＝0.12<\/text><text x=\"330\" y=\"215\" font-size=\"14\" fill=\"#c2410c\">0.4×0.7＝0.28<\/text><text x=\"40\" y=\"160\" font-size=\"13\" text-anchor=\"middle\">今天<\/text><text x=\"170\" y=\"234\" font-size=\"13\" text-anchor=\"middle\">明天<\/text><text x=\"300\" y=\"240\" font-size=\"13\" text-anchor=\"middle\">後天<\/text><\/svg><figcaption>圖 M10-4　今天晴，兩天後各狀態的樹狀圖（紅字兩路徑合計即後天雨的機率 0.52）<\/figcaption><\/figure>\n<div class=\"key\"><p><strong>解題步驟<\/strong>（求 <span class=\"m\">n<\/span> 期後的分布）<\/p>\n<ol class=\"steps\">\n<li>固定狀態順序，寫出轉移矩陣，逐行檢查和為 1。<\/li>\n<li>寫出初始向量 <span class=\"m\">x_0<\/span>（機率或人數），順序與矩陣一致。<\/li>\n<li><span class=\"m\">n<\/span> 小時逐期計算 <span class=\"m\">x_1=Ax_0<\/span>、<span class=\"m\">x_2=Ax_1<\/span>……；只問某一起點時取 <span class=\"m\">A^n<\/span> 的對應行。<\/li>\n<li><span class=\"m\">n<\/span> 大時改用第四節的一般式。<\/li>\n<\/ol><\/div>\n<div class=\"warn\"><p>注意：<span class=\"m\">A^2<\/span> 的元素<em>不是<\/em> <span class=\"m\">A<\/span> 的元素平方。「今天晴，後天雨」的機率不是 <span class=\"m\">0.4^2<\/span>，也不是 <span class=\"m\">0.4\\times 0.7<\/span>，須把經過晴、經過雨兩條路徑相加。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　分段轉移：<span class=\"m\">A^{m+n}=A^mA^n<\/span><\/strong><\/p>\n<p>「現在在 <span class=\"m\">j<\/span>，<span class=\"m\">m+n<\/span> 期後在 <span class=\"m\">i<\/span>」可依第 <span class=\"m\">n<\/span> 期所在的狀態 <span class=\"m\">k<\/span> 分類：先以 <span class=\"m\">n<\/span> 期由 <span class=\"m\">j<\/span> 到 <span class=\"m\">k<\/span>，再以 <span class=\"m\">m<\/span> 期由 <span class=\"m\">k<\/span> 到 <span class=\"m\">i<\/span>。由乘法原理與加法原理，<\/p>\n<div class=\"mb\">(A^{m+n})_{ij}=\\sum_{k}(A^m)_{ik}(A^n)_{kj}<\/div>\n<p>右邊正是矩陣乘積 <span class=\"m\">A^mA^n<\/span> 的 <span class=\"m\">(i,j)<\/span> 元。此式在大學機率課程稱為 Chapman–Kolmogorov（查普曼–柯爾莫哥洛夫）方程式（進階）；它說明矩陣乘法的定義恰好符合「分段轉移」的機率計算，也說明 <span class=\"m\">A^n<\/span> 可用 <span class=\"m\">A^2<\/span>、<span class=\"m\">A^4<\/span>……逐次平方加速計算。例如 <span class=\"m\">A^8=\\left((A^2)^2\\right)^2<\/span> 只需三次矩陣乘法。<\/p><\/div>\n<table class=\"t\"><thead><tr><th>比較<\/th><th>樹狀圖法<\/th><th>矩陣法<\/th><\/tr><\/thead><tbody>\n<tr><td>適用<\/td><td>期數少（2～3 期）、只問一條起訖<\/td><td>期數多、要整個分布或一般式<\/td><\/tr>\n<tr><td>計算<\/td><td>路徑機率相乘，再把同終點的路徑相加<\/td><td>矩陣相乘，一列乘一行即自動完成「乘再加」<\/td><\/tr>\n<tr><td>規模<\/td><td><span class=\"m\">k<\/span> 個狀態、<span class=\"m\">n<\/span> 期有 <span class=\"m\">k^n<\/span> 條路徑<\/td><td>每期只需一次矩陣乘向量<\/td><\/tr>\n<tr><td>優點<\/td><td>直觀，易檢查漏項<\/td><td>可得 <span class=\"m\">A^n<\/span>、穩定狀態與極限<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"exam\"><p>學測常見：(1) 問「第 2 期」時，須分清 <span class=\"m\">x_0<\/span> 是第 0 期還是第 1 期；(2) 由人數求下一期人數；(3) 指定起點與終點，求 <span class=\"m\">A^2<\/span> 或 <span class=\"m\">A^3<\/span> 的某一元。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　由後一期反推前一期<\/strong><\/p>\n<p>若 <span class=\"m\">A<\/span> 可逆，則 <span class=\"m\">x_n=A^{-1}x_{n+1}<\/span>。二階時 <span class=\"m\">\\det A=(1-p)(1-q)-pq=1-p-q<\/span>，故 <span class=\"m\">p+q\\ne 1<\/span> 時可反推。由 <span class=\"m\">uA=u<\/span> 得 <span class=\"m\">u=uA^{-1}<\/span>，<span class=\"m\">A^{-1}<\/span> 每行和仍為 1，但通常含負元：<\/p>\n<div class=\"mb\">A^{-1}=\\dfrac{1}{1-p-q}\\begin{bmatrix}1-q &amp; -q\\\\ -p &amp; 1-p\\end{bmatrix}<\/div>\n<p>故 <span class=\"m\">A^{-1}<\/span> 一般<em>不是轉移矩陣<\/em>，只是計算工具；可證只有 <span class=\"m\">A=I<\/span> 與 <span class=\"m\">A=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span> 的反方陣仍為轉移矩陣（見第 32 題）。<span class=\"m\">p+q=1<\/span> 時兩行相同，任何起點一期後都得到同一向量，無法反推。<\/p><p>注意：<span class=\"m\">A<\/span> 可逆只保證解唯一。一期後的分布必落在 <span class=\"m\">A<\/span> 兩行之間（第一分量介於 <span class=\"m\">1-p<\/span> 與 <span class=\"m\">q<\/span> 之間）；所給 <span class=\"m\">x_{n+1}<\/span> 若不在此範圍，反推出的 <span class=\"m\">x_n<\/span> 含負分量，表示此分布不可能由任何機率向量經一期得到。<\/p><\/div>","sims":[["markov",{}]],"qs":["M10-04","M10-32"]},{"t":"四、二階轉移矩陣的一般式","h":"<p>設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>，<span class=\"m\">x_n=(a_n,\\,1-a_n)<\/span>，並記<\/p>\n<div class=\"mb\">\\lambda=1-p-q，\\qquad \\alpha=\\dfrac{q}{p+q}\\ (p+q&gt;0)<\/div>\n<h4>遞迴法<\/h4>\n<ol class=\"steps\">\n<li><span class=\"m\">a_{n+1}=(1-p)a_n+q(1-a_n)=\\lambda a_n+q<\/span>。<\/li>\n<li>令 <span class=\"m\">\\alpha=\\lambda\\alpha+q<\/span>，得 <span class=\"m\">\\alpha=\\dfrac{q}{1-\\lambda}=\\dfrac{q}{p+q}<\/span>。<\/li>\n<li>兩式相減：<span class=\"m\">a_{n+1}-\\alpha=\\lambda(a_n-\\alpha)<\/span>，故 <span class=\"m\">\\langle a_n-\\alpha\\rangle<\/span> 為公比 <span class=\"m\">\\lambda<\/span> 的等比數列。<\/li>\n<\/ol>\n<div class=\"formula\" data-t=\"n 期後的分布\"><div class=\"mb\">a_n=\\dfrac{q}{p+q}+\\lambda^n\\left(a_0-\\dfrac{q}{p+q}\\right)，\\qquad b_n=1-a_n<\/div><p><span class=\"m\">\\lambda=1-p-q=\\det A<\/span>；<span class=\"m\">a_n<\/span> 與 <span class=\"m\">\\alpha<\/span> 的差每期乘上 <span class=\"m\">\\lambda<\/span>。<\/p><p>速算：二階轉移矩陣 <span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span> 的兩特徵值為 1 與 <span class=\"m\">a+d-1<\/span>（兩特徵值之和等於對角元之和），故 <span class=\"m\">\\lambda=a+d-1<\/span>，即「兩停留機率之和減 1」。<\/p><\/div>\n<h4>分解法<\/h4>\n<div class=\"formula\" data-t=\"A 的 n 次方\"><div class=\"mb\">A^n=\\dfrac{1}{p+q}\\begin{bmatrix}q &amp; q\\\\ p &amp; p\\end{bmatrix}+\\dfrac{\\lambda^n}{p+q}\\begin{bmatrix}p &amp; -q\\\\ -p &amp; q\\end{bmatrix}\\qquad(p+q&gt;0)<\/div><p>第一項與 <span class=\"m\">n<\/span> 無關，兩行都是穩定狀態；第二項隨 <span class=\"m\">\\lambda^n<\/span> 改變。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　分解法的證明<\/strong><\/p>\n<p>記 <span class=\"m\">S=\\dfrac{1}{p+q}\\begin{bmatrix}q &amp; q\\\\ p &amp; p\\end{bmatrix}<\/span>、<span class=\"m\">R=\\dfrac{1}{p+q}\\begin{bmatrix}p &amp; -q\\\\ -p &amp; q\\end{bmatrix}<\/span>。直接計算得<\/p>\n<div class=\"mb\">S+R=I，\\quad S+\\lambda R=A，\\quad S^2=S，\\quad R^2=R，\\quad SR=RS=O<\/div>\n<p>於是 <span class=\"m\">A^2=(S+\\lambda R)^2=S^2+\\lambda(SR+RS)+\\lambda^2R^2=S+\\lambda^2R<\/span>，以數學歸納法得 <span class=\"m\">A^n=S+\\lambda^nR<\/span>。<span class=\"m\">S<\/span>、<span class=\"m\">R<\/span> 都是投影矩陣（M9）：<span class=\"m\">S<\/span> 把向量沿 <span class=\"m\">(1,-1)<\/span> 方向投影到穩定狀態所在直線，<span class=\"m\">R<\/span> 沿穩定狀態方向投影到 <span class=\"m\">(1,-1)<\/span> 所在直線。<\/p>\n<p>（進階）用特徵值的語言：<span class=\"m\">A<\/span> 的特徵值為 1 與 <span class=\"m\">\\lambda<\/span>，對應特徵向量為 <span class=\"m\">(q,p)<\/span> 與 <span class=\"m\">(1,-1)<\/span>；取 <span class=\"m\">Q=\\begin{bmatrix}q &amp; 1\\\\ p &amp; -1\\end{bmatrix}<\/span>，則 <span class=\"m\">A=Q\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; \\lambda\\end{bmatrix}Q^{-1}<\/span>，此即大學線性代數的對角化。<\/p><\/div>\n<p>由一般式，<span class=\"m\">\\lambda<\/span> 的正負決定 <span class=\"m\">a_n<\/span> 的走勢：<\/p>\n<ul>\n<li><span class=\"m\">0&lt;\\lambda&lt;1<\/span>（即 <span class=\"m\">0&lt;p+q&lt;1<\/span>）：<span class=\"m\">a_n-\\alpha<\/span> 不變號，<span class=\"m\">a_n<\/span> 由一側<strong>單調<\/strong>趨近 <span class=\"m\">\\alpha<\/span>。<\/li>\n<li><span class=\"m\">\\lambda=0<\/span>（即 <span class=\"m\">p+q=1<\/span>）：一期後即為穩定狀態；此時 <span class=\"m\">A<\/span> 的兩行相同。<\/li>\n<li><span class=\"m\">-1&lt;\\lambda&lt;0<\/span>（即 <span class=\"m\">1&lt;p+q&lt;2<\/span>）：<span class=\"m\">a_n-\\alpha<\/span> 正負交替，<span class=\"m\">a_n<\/span> 在 <span class=\"m\">\\alpha<\/span> 兩側<strong>擺盪<\/strong>趨近。<\/li>\n<\/ul>\n<figure class=\"fig half\"><svg viewBox=\"0 0 300 220\" width=\"300\"><defs><marker id=\"M10-e\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M10-er\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\"
