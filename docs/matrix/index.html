xt>\n<path d=\"M344.0,202 C400.0,175 400.0,265 344.0,238\" stroke=\"#7a5cc2\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#S3-t-ar)\"/>\n<text x=\"398.0\" y=\"225\" font-size=\"14\" text-anchor=\"start\" fill=\"#1f2a44\">0.7<\/text>\n<path d=\"M192,66.0 C165,10 255,10 228,66.0\" stroke=\"#7a5cc2\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#S3-t-ar)\"/>\n<text x=\"250\" y=\"32\" font-size=\"14\" fill=\"#1f2a44\">0.8<\/text>\n<\/svg><figcaption>圖 S3-5　三區人口每年遷移比例（箭頭由遷出區指向遷入區）<\/figcaption><\/figure>","opts":[],"type":"fill","ans":[],"key":"答案：7/18","sol":"（進階：三階轉移矩陣，課綱以二階為主；本題只用高斯消去求穩定狀態。）穩定狀態 <span class=\"m\">x=(a,b,c)<\/span> 滿足 <span class=\"m\">(A-I)x=0<\/span> 且 <span class=\"m\">a+b+c=1<\/span>。各式乘 10：<span class=\"m\">-4a+2b+c=0<\/span>，<span class=\"m\">3a-3b+c=0<\/span>，<span class=\"m\">a+b-2c=0<\/span>（三式相加為 0，只有兩式獨立，故須加上 <span class=\"m\">a+b+c=1<\/span>）。取增廣矩陣\n<span class=\"m\">\\left[\\begin{matrix}1 &amp; 1 &amp; 1\\\\ 1 &amp; 1 &amp; -2\\\\ 3 &amp; -3 &amp; 1\\end{matrix}\\,\\middle|\\,\\begin{matrix}1\\\\ 0\\\\ 0\\end{matrix}\\right]<\/span>：第二列減第一列得 <span class=\"m\">(0,0,-3\\mid -1)<\/span>，<span class=\"m\">c=\\frac{1}{3}<\/span>；第三列減第一列的 3 倍得 <span class=\"m\">(0,-6,-2\\mid -3)<\/span>，<span class=\"m\">6b=3-2c=\\frac{7}{3}<\/span>，<span class=\"m\">b=\\frac{7}{18}<\/span>；<span class=\"m\">a=1-\\frac{7}{18}-\\frac{6}{18}=\\frac{5}{18}<\/span>。驗算第一式：<span class=\"m\">-\\frac{20}{18}+\\frac{14}{18}+\\frac{6}{18}=0<\/span>。所求 <span class=\"m\">\\frac{7}{18}<\/span>。補充：<span class=\"m\">A<\/span> 的元素皆為正，穩定狀態唯一，且任一初始分布皆收斂至此（進階）。","steps":["（進階：三階轉移矩陣，課綱以二階為主；本題只用高斯消去求穩定狀態。","）穩定狀態 <span class=\"m\">x=(a,b,c)<\/span> 滿足 <span class=\"m\">(A-I)x=0<\/span> 且 <span class=\"m\">a+b+c=1<\/span>。","各式乘 10：<span class=\"m\">-4a+2b+c=0<\/span>，<span class=\"m\">3a-3b+c=0<\/span>，<span class=\"m\">a+b-2c=0<\/span>（三式相加為 0，只有兩式獨立，故須加上 <span class=\"m\">a+b+c=1<\/span>）。"],"hk":"hint"},{"id":"S3-41","unit":"S3","set":"四、跨單元綜合","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">挑戰｜跨單元 M8＋M9<\/span>（進階）設二階方陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A^2=I<\/span>，且 <span class=\"m\">A\\ne I<\/span>、<span class=\"m\">A\\ne -I<\/span>。下列哪些選項必成立？（多選）","opts":[{"k":"A","h":"<span class=\"m\">\\det A=-1<\/span>"},{"k":"B","h":"<span class=\"m\">A<\/span> 的主對角線元素和為 0"},{"k":"C","h":"必為對某一條過原點直線的鏡射矩陣"},{"k":"D","h":"<span class=\"m\">A+I<\/span> 可逆"},{"k":"E","h":"<span class=\"m\">A<\/span> 可寫成 <span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; -a\\end{bmatrix}<\/span>，且 <span class=\"m\">a^2+bc=1<\/span>"}],"type":"multi","ans":["A","B","E"],"key":"(A)(B)(E)","sol":"（進階：選項 (C) 的反例為斜向反射，超出課本的鏡射範圍。）設對角和 <span class=\"m\">t<\/span>、<span class=\"m\">\\det A=d<\/span>，<span class=\"m\">A^2=tA-dI=I<\/span>，得 <span class=\"m\">tA=(1+d)I<\/span>。若 <span class=\"m\">t\\ne 0<\/span>，<span class=\"m\">A<\/span> 為純量方陣 <span class=\"m\">kI<\/span>，由 <span class=\"m\">k^2=1<\/span> 得 <span class=\"m\">A=\\pm I<\/span>，矛盾；故 <span class=\"m\">t=0<\/span>，<span class=\"m\">d=-1<\/span>。(A)(B) 正確。(E) <span class=\"m\">t=0<\/span> 即 <span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; -a\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=-a^2-bc=-1<\/span>，<span class=\"m\">a^2+bc=1<\/span>，正確。(C) 反例 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">A^2=I<\/span>，但 <span class=\"m\">A<\/span> 不是對稱方陣，不是對直線的（垂直）鏡射；它是沿 <span class=\"m\">(1,-2)<\/span> 方向、以 <span class=\"m\">x<\/span> 軸為軸的斜向反射，錯。(D) <span class=\"m\">\\det(A+I)=1+t+d=0<\/span>，不可逆，錯；事實上 <span class=\"m\">(A+I)(A-I)=O<\/span>。","steps":["先判斷 (C)：的反例為斜向反射，超出課本的鏡射範圍。）設對角和 <span class=\"m\">t<\/span>、<span class=\"m\">\\det A=d<\/span>，<span class=\"m\">A^2=tA-dI=I<\/span>，得 <span class=\"m\">tA=(1+d)I<\/span>。若 <span class=\"m\">t\\ne 0<\/span>，<span class=\"m\">A<\/span> 為純量方陣 <span class=\"m\">kI<\/span>，由 <span class=\"m\">k^2=1<\/span> 得 <span class=\"m\">A=\\pm I<\/span>，矛盾；故 <span class=\"m\">t=0<\/span>，<span class=\"m\">d=-1<\/span>。(A)","先判斷 (D)：<span class=\"m\">\\det(A+I)=1+t+d=0<\/span>，不可逆，錯；事實上 <span class=\"m\">(A+I)(A-I)=O<\/span>。"],"hk":"hint"},{"id":"S3-42","unit":"S3","set":"四、跨單元綜合","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">挑戰｜跨單元 M8＋M9＋M10<\/span>（進階）設 <span class=\"m\">A=\\begin{bmatrix}1-p &amp; q\\\\ p &amp; 1-q\\end{bmatrix}<\/span>，其中 <span class=\"m\">0&lt;p&lt;1<\/span>，<span class=\"m\">0&lt;q&lt;1<\/span>，令 <span class=\"m\">r=1-p-q<\/span>，<span class=\"m\">s=\\begin{bmatrix}\\dfrac{q}{p+q}\\\\[4pt] \\dfrac{p}{p+q}\\end{bmatrix}<\/span>，<span class=\"m\">u=\\begin{bmatrix}1\\\\ -1\\end{bmatrix}<\/span>。（非選擇題）\n<ol class=\"steps\"><li>證明 <span class=\"m\">As=s<\/span>，<span class=\"m\">Au=ru<\/span>，且 <span class=\"m\">-1&lt;r&lt;1<\/span>。<\/li><li>設初始狀態 <span class=\"m\">x_0=\\begin{bmatrix}t\\\\ 1-t\\end{bmatrix}<\/span>（<span class=\"m\">0\\le t\\le 1<\/span>）。證明存在實數 <span class=\"m\">c<\/span> 使 <span class=\"m\">x_0=s+cu<\/span>，並由此說明 <span class=\"m\">x_n=A^nx_0=s+cr^nu<\/span>，且當 <span class=\"m\">n<\/span> 趨近無限大時 <span class=\"m\">x_n<\/span> 趨近 <span class=\"m\">s<\/span>。<\/li><li>當 <span class=\"m\">p=\\dfrac{1}{4}<\/span>，<span class=\"m\">q=\\dfrac{1}{2}<\/span>，<span class=\"m\">x_0=\\begin{bmatrix}0\\\\ 1\\end{bmatrix}<\/span> 時，求 <span class=\"m\">x_n<\/span> 的一般式與 <span class=\"m\">x_3<\/span>。<\/li><\/ol>","opts":[],"type":"open","ans":[],"key":"參考答案","sol":"(1) <span class=\"m\">As<\/span> 的第一分量 <span class=\"m\">\\dfrac{(1-p)q+qp}{p+q}=\\dfrac{q}{p+q}<\/span>，第二分量 <span class=\"m\">\\dfrac{pq+(1-q)p}{p+q}=\\dfrac{p}{p+q}<\/span>，故 <span class=\"m\">As=s<\/span>。<span class=\"m\">Au=(1-p-q,\\ p-1+q)^T=r(1,-1)^T=ru<\/span>。由 <span class=\"m\">0&lt;p+q&lt;2<\/span> 得 <span class=\"m\">-1&lt;r&lt;1<\/span>。\n(2) <span class=\"m\">s+cu<\/span> 的兩分量和恆為 1，取 <span class=\"m\">c=t-\\dfrac{q}{p+q}<\/span>，則第一分量 <span class=\"m\">=t<\/span>，第二分量 <span class=\"m\">=1-t<\/span>，即 <span class=\"m\">x_0=s+cu<\/span>。由矩陣乘法的分配律，<span class=\"m\">Ax_0=As+cAu=s+cru<\/span>；歸納可得 <span class=\"m\">A^nx_0=s+cr^nu<\/span>。因 <span class=\"m\">|r|&lt;1<\/span>，<span class=\"m\">r^n\\to 0<\/span>，故 <span class=\"m\">x_n\\to s<\/span>（與 <span class=\"m\">t<\/span> 無關）。\n(3) <span class=\"m\">r=1-\\frac{1}{4}-\\frac{1}{2}=\\frac{1}{4}<\/span>，<span class=\"m\">s=(\\frac{2}{3},\\frac{1}{3})<\/span>，<span class=\"m\">t=0<\/span>，<span class=\"m\">c=-\\frac{2}{3}<\/span>。<span class=\"m\">x_n=\\begin{bmatrix}\\frac{2}{3}-\\frac{2}{3}\\left(\\frac{1}{4}\\right)^n\\\\ \\frac{1}{3}+\\frac{2}{3}\\left(\\frac{1}{4}\\right)^n\\end{bmatrix}<\/span>，<span class=\"m\">x_3=\\begin{bmatrix}\\frac{2}{3}-\\frac{2}{3}\\cdot\\frac{1}{64}\\\\ \\frac{1}{3}+\\frac{2}{3}\\cdot\\frac{1}{64}\\end{bmatrix}=\\begin{bmatrix}\\frac{21}{32}\\\\ \\frac{11}{32}\\end{bmatrix}<\/span>。核對：<span class=\"m\">x_1=(\\frac{1}{2},\\frac{1}{2})<\/span>，<span class=\"m\">x_2=(\\frac{5}{8},\\frac{3}{8})<\/span>，<span class=\"m\">x_3=(\\frac{21}{32},\\frac{11}{32})<\/span>。\n評分要點：(1) 兩個等式與 <span class=\"m\">r<\/span> 的範圍；(2) 求出 <span class=\"m\">c<\/span>、用線性性推得 <span class=\"m\">x_n<\/span> 並說明極限；(3) 一般式與數值。補充（進階）：<span class=\"m\">s<\/span>、<span class=\"m\">u<\/span> 為 <span class=\"m\">A<\/span> 的特徵向量，對應特徵值 1 與 <span class=\"m\">r<\/span>。","steps":["(1) <span class=\"m\">As<\/span> 的第一分量 <span class=\"m\">\\dfrac{(1-p)q+qp}{p+q}=\\dfrac{q}{p+q}<\/span>，第二分量 <span class=\"m\">\\dfrac{pq+(1-q)p}{p+q}=\\dfrac{p}{p+q}<\/span>，故 <span class=\"m\">As=s<\/span>。","<span class=\"m\">Au=(1-p-q,\\ p-1+q)^T=r(1,-1)^T=ru<\/span>。","由 <span class=\"m\">0&lt;p+q&lt;2<\/span> 得 <span class=\"m\">-1&lt;r&lt;1<\/span>。"],"hk":"hint"}],"examples":[],"mis":[],"check":[]}}</script>
<script>
const APP = (function () {
  const IDX = JSON.parse(document.getElementById('site-index').textContent);
  const INLINE = JSON.parse(document.getElementById('site-units').textContent || '{}');
  const SITE = IDX.site;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const NS = SITE.key || 'site';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(NS + ':' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(NS + ':' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let P = store.get('p', {});      // question id -> 'right' | 'wrong'
  let G = store.get('g', {});      // unit id -> guided state
  const saveP = () => store.set('p', P);
  const saveG = () => store.set('g', G);
  const gs = (u) => (G[u] = G[u] || { read: {}, ex: {}, mis: {}, chk: {}, pos: {} });

  document.title = SITE.title;
  $('#siteName').textContent = SITE.title; $('#siteSub').textContent = SITE.sub;
  const NAV = [['home', '單元總覽'], ['review', '錯題本']].concat(SITE.nav || []);
  $('#mainNav').innerHTML = NAV.map(([h, t]) => `<a href="#${h}" data-v="${h}">${t}</a>`).join('');

  function renderMath(root) {
    if (!window.katex) return;
    $$('span.m:not([data-k]), div.mb:not([data-k])', root).forEach((el) => {
      const tex = el.textContent; el.dataset.k = '1';
      try { katex.render(tex, el, { displayMode: el.tagName === 'DIV', throwOnError: false, strict: 'ignore', trust: false }); } catch (e) {}
    });
  }
  function tidy(root) {
    $$('table', root).forEach((t) => { if (!t.parentElement.classList.contains('tablebox')) { const w = document.createElement('div'); w.className = 'tablebox'; t.before(w); w.appendChild(t); } });
    renderMath(root);
    requestAnimationFrame(() => fitMath(root));
  }
  // an inline formula wider than its line gets its own scroll box instead of widening the page
  function fitMath(root) {
    if (!root) return;
    $$('span.m', root).forEach((m) => {
      if (m.classList.contains('m-wide') || !m.offsetWidth) return;
      const box = m.closest('p, li, td, div, span.h, figcaption') || m.parentElement;
      if (m.offsetWidth > box.clientWidth + 1) m.classList.add('m-wide');
    });
  }
  let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => fitMath(document.body), 200); });
  document.addEventListener('click', () => requestAnimationFrame(() => fitMath(document.querySelector('main'))));
  const unitColor = (id) => `var(--c-${id.match(/^[A-Z]/)[0]})`;
  const bookOf = (id) => IDX.books.find((b) => b.ids.includes(id));

  // ---------- data
  const cache = {};
  async function loadUnit(id) {
    if (cache[id]) return cache[id];
    if (INLINE[id]) return (cache[id] = INLINE[id]);
    const r = await fetch(`data/${id}.json`);
    if (!r.ok) throw new Error('load ' + id);
    return (cache[id] = await r.json());
  }
  const unitDone = (id) => { const u = IDX.units[id]; if (!u || !u.qids) return 0; return u.qids.filter((q) => P[q]).length; };

  // ---------- home
  let homeSubj = store.get('subj', 'all'), homeQ = '';
  function drawHome() {
    const v = $('#v-home');
    const units = Object.keys(IDX.units);
    const nq = units.reduce((s, k) => s + IDX.units[k].nq, 0);
    const done = Object.keys(P).length;
    const tags = [...new Set(IDX.books.map((b) => b.tag))];
    v.innerHTML = `
      <div class="hero"><div><h1>${esc(SITE.hero)}</h1><p>${esc(SITE.lead)}</p></div>
        <div class="nums"><div class="num"><b>${units.length}</b><span>單元</span></div><div class="num"><b>${nq.toLocaleString()}</b><span>題目</span></div><div class="num"><b id="doneNum">${done}</b><span>已作答</span></div></div></div>
      <div class="filters"><input id="homeSearch" type="search" placeholder="搜尋單元，例如：摩擦力、酸鹼、建國中學" aria-label="搜尋單元" value="${esc(homeQ)}">
        ${tags.length > 1 ? ['all'].concat(tags).map((t) => `<button type="button" class="chipbtn" data-t="${t}" aria-pressed="${t === homeSubj}">${t === 'all' ? '全部' : t}</button>`).join('') : ''}</div>
      <div id="bookList"></div>`;
    $('#homeSearch').addEventListener('input', (e) => { homeQ = e.target.value.trim(); drawBooks(); });
    $$('.chipbtn', v).forEach((b) => b.addEventListener('click', () => { homeSubj = b.dataset.t; store.set('subj', homeSubj); $$('.chipbtn', v).forEach((x) => x.setAttribute('aria-pressed', x === b)); drawBooks(); }));
    drawBooks();
  }
  function drawBooks() {
    const q = homeQ.toLowerCase();
    const match = (id) => !q || id.toLowerCase().includes(q) || IDX.units[id].title.toLowerCase().includes(q);
    let html = '', lastTag = '';
    IDX.books.forEach((b) => {
      if (homeSubj !== 'all' && b.tag !== homeSubj) return;
      const bookHit = q && b.title.toLowerCase().includes(q);
      const ids = b.ids.filter((id) => bookHit || match(id));
      if (!ids.length) return;
      if (b.tag !== lastTag) { if (lastTag) html += '</div>'; html += `<h2 class="subj-h"><i style="background:${unitColor(b.ids[0])}"></i>${esc(b.tag)}</h2><div class="books">`; lastTag = b.tag; }
      html += `<article class="book" style="--bc:${unitColor(b.ids[0])}"><span class="bno">${esc(b.noLabel || '')}</span><h3>${esc(b.title)}</h3>` +
        b.parts.map((p) => {
          const pids = p.ids.filter((id) => ids.includes(id)); if (!pids.length) return '';
          return (b.parts.length > 1 ? `<div class="part">${esc(p.title)}${p.sub ? '・' + esc(p.sub) : ''}</div>` : '') + pids.map((id) => {
            const u = IDX.units[id], d = unitDone(id), pct = u.nq ? Math.round(100 * d / u.nq) : 0;
            return `<a class="urow" href="#u-${id}"><span class="ucode">${id}</span><span class="utitle">${esc(u.title)}</span><span class="umeta">${u.nq} 題<span class="bar"><span style="width:${pct}%"></span></span></span></a>`;
          }).join('');
        }).join('') + '</article>';
    });
    if (lastTag) html += '</div>';
    $('#bookList').innerHTML = html || '<p class="empty">找不到符合的單元，換個關鍵字試試。</p>';
  }

  // ---------- question card
  const typeName = { single: '單選', multi: '多選', fill: '填充', open: '非選' };
  const coachIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>';
  // opts: { guided, nav: {prev, next, label}, onDone(result) }
  function drawCard(card, q, o = {}) {
    const st = P[q.id];
    const choiceUI = (q.type === 'single' || q.type === 'multi') && q.opts.length > 1;
    const steps = q.steps || [];
    const guided = !!o.guided;
    card.innerHTML = `
      <div class="card-head"><span class="exid">${esc(q.id)}</span><span class="chip t">${typeName[q.type]}</span><span class="chip s">${esc(q.set)}${q.level ? '・' + esc(q.level) : ''}</span>${q.src ? `<span class="chip">${esc(q.src)}</span>` : ''}${st ? `<span class="chip">${st === 'right' ? '上次答對' : '上次答錯'}</span>` : ''}</div>
      ${guided && !o.compact ? `<div class="coach">${coachIcon}<span>${steps.length ? (q.hk === 'hint' ? `先自己想想看。卡住時按「給我提示」，一次給一個提示（共 ${steps.length} 個）。` : `先自己算算看。卡住時按「給我提示」，一次只看一步（共 ${steps.length} 步）。`) : '這題沒有分步提示，先作答，再看詳解。'}${choiceUI ? '答錯可以看提示再試一次。' : ''}</span></div>` : ''}
      ${q.pre ? `<div class="pre content">${q.pre}</div>` : ''}
      ${q.ctx ? `<div class="ctx content">${q.ctx}</div>` : ''}
      <div class="stem content">${q.stem}</div>
      ${choiceUI ? `<div class="choices">${q.opts.map((x) => `<button type="button" class="choice" data-k="${x.k}" aria-pressed="false"><span class="k">${x.k}</span><span class="h content">${x.h}</span></button>`).join('')}</div>` : (q.opts.length ? `<div class="opts content">${q.opts.map((x) => `<span>(${x.k}) ${x.h}</span>`).join('')}</div>` : '')}
      <div class="hints" id="hints"></div>
      <div class="actions">
        ${guided && steps.length ? `<button type="button" class="btn sun" id="hintBtn">給我提示（1/${steps.length}）</button>` : ''}
        ${choiceUI ? `<button type="button" class="btn teal" id="submitBtn" disabled>送出答案</button>` : `<button type="button" class="btn teal" id="showBtn">看答案與詳解</button>`}
        <span class="verdict" id="verdict" aria-live="polite"></span>
        <span class="sp"></span>
        ${o.nav ? `<button type="button" class="btn ghost" id="prevBtn" ${o.nav.prev ? '' : 'disabled'}>上一題</button><button type="button" class="btn ghost" id="nextBtn" ${o.nav.next ? '' : 'disabled'}>下一題</button>` : ''}
      </div>
      <div id="ansBox"></div>`;
    let shown = 0, tries = 0, finished = false;
    const hintBtn = $('#hintBtn', card);
    const showHint = () => {
      if (shown >= steps.length) return;
      const d = document.createElement('div'); d.className = 'hint';
      d.innerHTML = `<b>${q.hk === 'hint' ? '提示 ' + (shown + 1) : '第 ' + (shown + 1) + ' 步'}</b><div class="content">${steps[shown]}</div>`;
      $('#hints', card).appendChild(d); tidy(d); shown++;
      if (hintBtn) { if (shown >= steps.length) hintBtn.remove(); else hintBtn.textContent = `下一個提示（${shown + 1}/${steps.length}）`; }
    };
    if (hintBtn) hintBtn.addEventListener('click', showHint);
    const sel = new Set();
    $$('.choice', card).forEach((b) => b.addEventListener('click', () => {
      if (finished) return;
      const k = b.dataset.k;
      $$('.choice.is-wrong', card).forEach((x) => x.classList.remove('is-wrong'));
      if (q.type === 'single') { sel.clear(); $$('.choice', card).forEach((x) => x.setAttribute('aria-pressed', 'false')); }
      if (sel.has(k)) { sel.delete(k); b.setAttribute('aria-pressed', 'false'); } else { sel.add(k); b.setAttribute('aria-pressed', 'true'); }
      $('#submitBtn', card).disabled = sel.size === 0;
    }));
    const reveal = () => {
      finished = true;
      const box = $('#ansBox', card);
      box.innerHTML = `<div class="answer content"><p class="key-line">答案：${q.key || '見詳解'}</p>${q.sol || ''}</div>`;
      tidy(box); if (hintBtn) hintBtn.remove();
    };
    const record = (ok) => { if (!(q.id in P) || !o.keepFirst || tries <= 1) { P[q.id] = ok ? 'right' : 'wrong'; saveP(); } if (o.onDone) o.onDone(ok); };
    const sb = $('#submitBtn', card);
    if (sb) sb.addEventListener('click', () => {
      tries++;
      const ans = new Set(q.ans);
      const ok = sel.size === ans.size && [...sel].every((k) => ans.has(k));
      const v = $('#verdict', card);
      if (!ok && guided && tries === 1 && (shown < steps.length || q.type === 'multi')) {
        v.textContent = shown < steps.length ? '還不對，看一個提示再試一次' : '還不對，再檢查一次選項';
        v.className = 'verdict no';
        $$('.choice', card).forEach((b) => { if (sel.has(b.dataset.k)) b.classList.add('is-wrong'); });
        if (shown < steps.length) showHint();
        P[q.id] = 'wrong'; saveP();
        return;
      }
      $$('.choice', card).forEach((b) => { b.disabled = true; const k = b.dataset.k; b.classList.remove('is-wrong'); if (ans.has(k)) b.classList.add('is-right'); else if (sel.has(k)) b.classList.add('is-wrong'); });
      v.textContent = ok ? (tries > 1 ? '答對了！下次試著一次就答對' : '答對了！') : `正確答案是 ${q.ans.map((a) => '(' + a + ')').join('')}`;
      v.className = 'verdict ' + (ok ? 'ok' : 'no');
      sb.disabled = true;
      if (tries === 1 || !guided) { P[q.id] = ok ? 'right' : 'wrong'; saveP(); }
      if (o.onDone) o.onDone(ok && tries === 1);
      reveal();
    });
    const shb = $('#showBtn', card);
    if (shb) shb.addEventListener('click', () => {
      reveal(); shb.remove();
      const bx = document.createElement('div'); bx.className = 'actions';
      bx.innerHTML = '<span class="pre" style="margin:0">對照詳解後自己批改：</span><button type="button" class="btn green" id="selfOk">我答對了</button><button type="button" class="btn red" id="selfNo">我答錯了</button>';
      $('#ansBox', card).prepend(bx);
      $('#selfOk', card).addEventListener('click', () => { P[q.id] = 'right'; saveP(); $('#verdict', card).textContent = '已記為答對'; $('#verdict', card).className = 'verdict ok'; bx.remove(); if (o.onDone) o.onDone(true); });
      $('#selfNo', card).addEventListener('click', () => { P[q.id] = 'wrong'; saveP(); $('#verdict', card).textContent = '已收進錯題本'; $('#verdict', card).className = 'verdict no'; bx.remove(); if (o.onDone) o.onDone(false); });
    });
    if (o.nav) {
      $('#prevBtn', card).addEventListener('click', () => { o.nav.prev(); card.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
      $('#nextBtn', card).addEventListener('click', () => { o.nav.next(); card.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
    }
    tidy(card);
  }

  // ---------- unit view
  let U = null, utab = 'lesson';
  async function openUnit(id) {
    const v = $('#v-unit');
    if (!IDX.units[id]) { v.innerHTML = '<p class="empty">找不到這個單元。<a href="#home">回單元總覽</a></p>'; return; }
    if (!U || U.id !== id) {
      v.innerHTML = '<p class="empty">載入中…</p>';
      try { U = await loadUnit(id); } catch (e) { v.innerHTML = '<p class="empty">單元資料載入失敗，請重新整理頁面。</p>'; return; }
      pr = { set: 'all', type: 'all', status: 'all', idx: 0 };
      utab = U.secs.length ? 'lesson' : 'practice';
    }
    const b = bookOf(id);
    const isExam = !U.examples.length && !U.mis.length && !U.secs.some((s) => s.sims || s.qs);
    const hasLesson = U.secs.length > 0;
    v.innerHTML = `<div class="uhead"><div class="crumb"><a href="#home">單元總覽</a>${b ? ` ／ ${esc(b.noLabel || '')} ${esc(b.title)}` : ''}</div>
      <h1><span class="ucode" style="--bc:${unitColor(id)}">${id}</span>${esc(U.title)}</h1>
      <div class="tabs" role="group" aria-label="學習模式">
        ${hasLesson ? `<button type="button" data-tab="lesson" aria-pressed="${utab === 'lesson'}">${isExam ? '試卷分析' : '互動講義'}</button>` : ''}
        <button type="button" data-tab="practice" aria-pressed="${utab === 'practice'}">${isExam ? '逐題作答' : '題庫練習'}<small>${U.questions.length} 題</small></button>
      </div></div><div id="ubody"></div>`;
    $$('.tabs button', v).forEach((bt) => bt.addEventListener('click', () => switchTab(bt.dataset.tab)));
    drawTab();
  }
  function drawTab() { const box = $('#ubody'); if (utab === 'lesson') drawLesson(box); else drawPractice(box); }
  function switchTab(t) { utab = t; $$('#v-unit .tabs button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.tab === t)); drawTab(); window.scrollTo({ top: 0 }); }

  const qById = (id) => U.questions.find((q) => q.id === id);
  const SKIPSEC = /^(導言|課綱對照與考點)$/;
  function drawLesson(box) {
    const g = gs(U.id);
    const nSim = U.secs.reduce((n, s) => n + (s.sims ? s.sims.length : 0), 0);
    const quizIds = U.secs.flatMap((s) => s.qs || []);
    box.innerHTML = `<div class="lesson"><aside class="rail"><div class="rail-prog" id="railProg"></div><ul class="toc">${U.secs.map((s, i) => `<li><a href="#u-${U.id}" data-i="${i}" class="${g.read[i] ? 'read' : ''}"><span>${esc(s.t)}</span>${s.sims ? `<i class="tg sim-tg" title="互動模擬">${s.sims.length > 1 ? s.sims.length + ' ' : ''}模擬</i>` : ''}${s.qs ? `<i class="tg q-tg" title="隨堂練習">${s.qs.length} 題</i>` : ''}</a></li>`).join('')}</ul></aside>
      <article class="sheet content">${U.src ? `<p class="unit-src">${esc(U.src)}</p>` : ''}${U.secs.map((s, i) => `<section class="sec" id="s-${i}" data-i="${i}"><h2>${esc(s.t)}</h2>${s.h}${(s.sims || []).map(([n, o]) => `<div class="sim" data-sim="${n}" data-opt='${esc(JSON.stringify(o))}'></div>`).join('')}${s.qs ? `<div class="sq" data-qs="${s.qs.join(',')}"></div>` : ''}</section>`).join('')}
      <div class="actions"><button type="button" class="btn teal" data-go="practice">到題庫練習全部 ${U.questions.length} 題</button></div></article></div>`;
    const prog = () => {
      const r = Object.keys(g.read).length, a = quizIds.filter((q) => P[q]).length;
      $('#railProg', box).innerHTML = `<div><span>已讀小節</span><b>${r} / ${U.secs.length}</b></div>${quizIds.length ? `<div><span>隨堂練習</span><b>${a} / ${quizIds.length}</b></div>` : ''}${nSim ? `<div><span>互動模擬</span><b>${nSim} 個</b></div>` : ''}`;
    };
    prog();
    $$('.toc a', box).forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const t = document.getElementById('s-' + a.dataset.i); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    $$('[data-go]', box).forEach((bt) => bt.addEventListener('click', () => switchTab(bt.dataset.go)));
    $$('.qlink', box).forEach((p) => p.addEventListener('click', () => { pr.set = 'all'; pr.type = 'all'; pr.status = 'all'; pr.jump = p.dataset.q; switchTab('practice'); }));
    enhanceExamples(box); enhanceMis(box); enhanceCheck(box);
    tidy(box);
    // lazy: simulations and section quizzes start when near the viewport; sections count as read once their end is seen
    const io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      if (el.classList.contains('sim')) mountSim(el);
      else if (el.classList.contains('sq')) mountQuiz(el, prog);
      else if (el.classList.contains('sec-end')) { const i = el.dataset.i; if (!g.read[i]) { g.read[i] = 1; saveG(); const a = $(`.toc a[data-i="${i}"]`, box); if (a) a.classList.add('read'); prog(); } }
    }), { rootMargin: '300px 0px' });
    $$('.sim, .sq', box).forEach((el) => io.observe(el));
    $$('.sec', box).forEach((sec) => { const m = document.createElement('div'); m.className = 'sec-end'; m.dataset.i = sec.dataset.i; sec.appendChild(m); io.observe(m); });
  }
  function mountSim(el) {
    const f = window.SIMS && window.SIMS[el.dataset.sim];
    if (!f) { el.remove(); return; }
    try { f(el, JSON.parse(el.dataset.opt || '{}')); } catch (e) { el.remove(); }
  }
  function mountQuiz(el, prog) {
    const ids = el.dataset.qs.split(',').filter((x) => qById(x));
    if (!ids.length) { el.remove(); return; }
    let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="sq-head"><b>隨堂練習</b><span>讀完本節，馬上試試看。</span><div class="sq-tabs">${ids.map((id, i) => `<button type="button" data-i="${i}" aria-pressed="${i === k}" class="${P[id] || ''}">${i + 1}</button>`).join('')}</div></div><div class="sq-card"></div>`;
      $$('.sq-tabs button', el).forEach((b) => b.addEventListener('click', () => { k = +b.dataset.i; draw(); }));
      drawCard($('.sq-card', el), qById(ids[k]), { guided: true, compact: true, nav: { prev: k > 0 ? () => { k--; draw(); } : null, next: k < ids.length - 1 ? () => { k++; draw(); } : null }, onDone: () => { prog(); const b = $(`.sq-tabs button[data-i="${k}"]`, el); if (b) b.className = P[ids[k]] || ''; } });
    };
    draw();
  }
  function enhanceExamples(root) {
    $$('.example', root).forEach((ex) => {
      const sol = $(':scope > .sol', ex); if (!sol) return;
      const li = $$(':scope > ol.steps > li', sol);
      const rest = $$(':scope > :not(ol.steps)', sol);
      sol.hidden = true; li.forEach((x) => { x.hidden = true; }); rest.forEach((x) => { x.hidden = true; });
      const bar = document.createElement('div'); bar.className = 'ex-bar';
      bar.innerHTML = `<span class="ex-tip">先在紙上試著解，再${li.length ? '一步一步' : ''}對照。</span>${li.length ? `<button type="button" class="btn sun" data-a="step">看第 1 步</button>` : ''}<button type="button" class="btn ghost" data-a="all">${li.length ? '看完整解答' : '看解答'}</button>`;
      ex.appendChild(bar);
      let n = 0;
      const done = () => { rest.forEach((x) => { x.hidden = false; }); bar.innerHTML = '<span class="ex-tip">這題你會了嗎？</span><button type="button" class="btn green" data-a="ok">我會了</button><button type="button" class="btn ghost" data-a="again">再練一次</button>'; };
      bar.addEventListener('click', (e) => {
        const a = e.target.closest('button')?.dataset.a; if (!a) return;
        if (a === 'step') { sol.hidden = false; li[n].hidden = false; n++; if (n >= li.length) done(); else e.target.textContent = `看第 ${n + 1} 步`; }
        else if (a === 'all') { sol.hidden = false; li.forEach((x) => { x.hidden = false; }); n = li.length; done(); }
        else if (a === 'ok') { bar.innerHTML = '<span class="verdict ok">很好！繼續往下讀。</span>'; }
        else if (a === 'again') { sol.hidden = true; li.forEach((x) => { x.hidden = true; }); rest.forEach((x) => { x.hidden = true; }); n = 0; bar.innerHTML = `<span class="ex-tip">遮住了解答，再自己做一次。</span>${li.length ? `<button type="button" class="btn sun" data-a="step">看第 1 步</button>` : ''}<button type="button" class="btn ghost" data-a="all">看完整解答</button>`; }
      });
    });
  }
  function enhanceMis(root) {
    const g = gs(U.id);
    $$('p.bad', root).forEach((bad, idx) => {
      const good = bad.nextElementSibling; if (!good || !good.classList.contains('good')) return;
      const showBad = ((idx * 7 + U.id.length) % 3) !== 1;
      const box = document.createElement('div'); box.className = 'mis';
      const stmt = (showBad ? bad : good).innerHTML.replace(/<span class="mark">[^<]*<\/span>/, '');
      box.innerHTML = `<div class="mis-q"><span class="mis-tag">對還是錯？</span><span class="content">${stmt}</span></div><div class="mis-a"><button type="button" class="btn green" data-a="1">正確</button><button type="button" class="btn red" data-a="0">錯誤</button></div>`;
      bad.before(box); box.appendChild(bad); box.appendChild(good); bad.hidden = true; good.hidden = true;
      box.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-a]'); if (!b) return;
        const ok = (b.dataset.a === '1') === !showBad; g.mis[idx] = ok ? 1 : 0; saveG();
        $('.mis-a', box).innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '判斷正確' : '判斷錯誤'}：這句是${showBad ? '常見迷思' : '正確觀念'}</span>`;
        bad.hidden = false; good.hidden = false; box.classList.add('open');
      });
    });
  }
  function enhanceCheck(root) {
    const g = gs(U.id);

      ul.classList.add('checklist'); ul.classList.remove('check');
      $$(':scope > li', ul).forEach((li, i) => {

        $('input', li).addEventListener('change', (e) => { g.chk[i] = e.target.checked ? 1 : 0; saveG(); });
      });
    });
  }

  // ---------- practice
  let pr = { set: 'all', type: 'all', status: 'all', idx: 0 };
  function prList() {
    return U.questions.filter((q) => (pr.set === 'all' || q.set === pr.set) && (pr.type === 'all' || q.type === pr.type) && (pr.status === 'all' || (P[q.id] || 'new') === pr.status));
  }
  function drawPractice(box) {
    const sets = [...new Set(U.questions.map((q) => q.set))];
    const types = [...new Set(U.questions.map((q) => q.type))];
    box.innerHTML = `<div class="practice"><aside class="panel"><h3>題目篩選</h3>
      <div class="field"><label for="fSet">題組來源</label><select id="fSet"><option value="all">全部（${U.questions.length} 題）</option>${sets.map((s) => `<option value="${esc(s)}">${esc(s)}（${U.questions.filter((q) => q.set === s).length} 題）</option>`).join('')}</select></div>
      <div class="field"><label for="fType">題型</label><select id="fType"><option value="all">全部題型</option>${types.map((t) => `<option value="${t}">${typeName[t]}</option>`).join('')}</select></div>
      <div class="field"><label for="fStatus">作答狀態</label><select id="fStatus"><option value="all">全部</option><option value="new">尚未作答</option><option value="wrong">答錯</option><option value="right">答對</option></select></div>
      <div class="stat" id="pStat"></div><div class="grid-q" id="qGrid" aria-label="題號"></div></aside>
      <div class="card" id="qCard"></div></div>`;

    [['fSet', 'set'], ['fType', 'type'], ['fStatus', 'status']].forEach(([id, k]) => $('#' + id).addEventListener('change', (e) => { pr[k] = e.target.value; pr.idx = 0; prDraw(); }));
    if (pr.jump) { const L = prList(); const i = L.findIndex((q) => q.id === pr.jump); if (i >= 0) pr.idx = i; pr.jump = null; }

  function prDraw() {
    const L = prList(); if (pr.idx >= L.length) pr.idx = Math.max(0, L.length - 1);
    const r = L.filter((q) => P[q.id] === 'right').length, w = L.filter((q) => P[q.id] === 'wrong').length;
    $('#pStat').innerHTML = `<span>共 <b>${L.length}</b> 題</span><span>答對 <b>${r}</b></span><span>答錯 <b>${w}</b></span>`;
    $('#qGrid').innerHTML = L.map((q, i) => `<button type="button" data-i="${i}" class="${P[q.id] || ''}${i === pr.idx ? ' cur' : ''}" title="${esc(q.id)}">${i + 1}</button>`).join('');
    $$('#qGrid button').forEach((b) => b.addEventListener('click', () => { pr.idx = +b.dataset.i; prDraw(); }));
    const card = $('#qCard');
    if (!L.length) { card.innerHTML = '<p class="empty">沒有符合條件的題目，換個篩選條件試試。</p>'; return; }
    drawCard(card, L[pr.idx], { guided: true, nav: { prev: pr.idx > 0 ? () => { pr.idx--; prDraw(); } : null, next: pr.idx < L.length - 1 ? () => { pr.idx++; prDraw(); } : null }, onDone: () => { const g = $('#qGrid button.cur'); if (g) g.className = (P[L[pr.idx].id] || '') + ' cur'; } });
  }

  // ---------- review
  let rv = { list: [], idx: 0 };
  async function drawReview() {
    const v = $('#v-review');
    const wrongIds = Object.keys(P).filter((k) => P[k] === 'wrong');
    if (!wrongIds.length) { v.innerHTML = '<div class="card"><p class="empty">錯題本是空的。在各單元作答後，答錯的題目會自動收進這裡。</p></div>'; return; }
    v.innerHTML = '<p class="empty">整理錯題中…</p>';
    const units = [...new Set(wrongIds.map((q) => Object.keys(IDX.units).find((u) => (IDX.units[u].qids || []).includes(q))).filter(Boolean))];
    const list = [];
    for (const u of units) { try { const d = await loadUnit(u); d.questions.forEach((q) => { if (P[q.id] === 'wrong') list.push(q); }); } catch (e) {} }
    rv.list = list; if (rv.idx >= list.length) rv.idx = 0;
    v.innerHTML = `<div class="practice"><aside class="panel"><h3>錯題本</h3><p class="pre">答錯的題目會留在這裡，重新答對後就會移出。</p><div class="stat"><span>共 <b>${list.length}</b> 題</span><span>${units.length} 個單元</span></div><div id="rvList"></div></aside><div class="card" id="rvCard"></div></div>`;
    rvDraw();
  }
  function rvDraw() {
    const L = rv.list;
    let html = '', last = '';
    L.forEach((q, i) => { if (q.unit !== last) { if (last) html += '</div>'; html += `<div class="rv-unit">${q.unit} ${esc(IDX.units[q.unit]?.title || '')}</div><div class="grid-q">`; last = q.unit; } html += `<button type="button" data-i="${i}" class="${P[q.id] || ''}${i === rv.idx ? ' cur' : ''}" title="${esc(q.id)}">${i + 1}</button>`; });
    $('#rvList').innerHTML = html + '</div>';
    $$('#rvList button').forEach((b) => b.addEventListener('click', () => { rv.idx = +b.dataset.i; rvDraw(); }));
    drawCard($('#rvCard'), L[rv.idx], { guided: true, nav: { prev: rv.idx > 0 ? () => { rv.idx--; rvDraw(); } : null, next: rv.idx < L.length - 1 ? () => { rv.idx++; rvDraw(); } : null } });
  }

  // ---------- routing
  const EXTRA = window.SITE_EXTRA || {};
  function route() {
    let h = (location.hash || '#home').slice(1);
    let view = 'home', uid = null;
    if (h.startsWith('u-')) { view = 'unit'; uid = h.slice(2); } else if (h === 'review') view = 'review'; else if (EXTRA.views && EXTRA.views[h]) view = h; else h = 'home';
    $$('#mainNav a').forEach((a) => a.setAttribute('aria-current', a.dataset.v === (view === 'unit' ? '' : view) ? 'page' : 'false'));
    $$('.view').forEach((s) => { s.hidden = s.id !== 'v-' + view; });
    if (view === 'home') drawHome();
    else if (view === 'unit') openUnit(uid);
    else if (view === 'review') drawReview();
    else EXTRA.views[view]();
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', route);
  route();
  return { $, $$, tidy, store };
})();
</script>
