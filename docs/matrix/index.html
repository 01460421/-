−x 方向拉長的橢圓<\/figcaption><\/figure>\n<p>另解：<span class=\"m\">A=R_{45^\\circ}\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 5\\end{bmatrix}R_{-45^\\circ}<\/span>，可直接相乘驗證。<\/p>\n<p>陷阱：像的橢圓方程式含 <span class=\"m\">xy<\/span> 項，<em>不必整理<\/em>，面積由行列式求得。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 13　兩鏡射的合成<\/strong>　先對 <span class=\"m\">y=x<\/span> 鏡射，再對 <span class=\"m\">y=\\sqrt3x<\/span> 鏡射。(1) 求合成變換的矩陣；(2) 求最小正整數 <span class=\"m\">n<\/span>，使連續作此合成變換 <span class=\"m\">n<\/span> 次後每一點都回到原處。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">M_{45^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M_{60^\\circ}=\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">M_{60^\\circ}M_{45^\\circ}=\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; -\\frac12\\\\ \\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}=R_{30^\\circ}<\/span>。<\/li>\n<li><span class=\"m\">R_{30^\\circ}^n=R_{30^\\circ n}=I<\/span> 的最小正整數 <span class=\"m\">n=12<\/span>。<\/li>\n<\/ol><p>另解：<span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}=R_{2(60^\\circ-45^\\circ)}=R_{30^\\circ}<\/span>，不必乘矩陣。<\/p><p>陷阱：<em>順序相反時為 <span class=\"m\">R_{-30^\\circ}<\/span><\/em>，本小題答案相同，但若問某一點的像則不同。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 14　點列與面積和（挑戰）<\/strong>　<span class=\"m\">A=\\begin{bmatrix}1 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">P_0=(1,0)<\/span>，<span class=\"m\">P_{k+1}=AP_k<\/span>。(1) 求 <span class=\"m\">P_8<\/span>；(2) 求 <span class=\"m\">\\triangle OP_kP_{k+1}<\/span>（<span class=\"m\">k=0,1,\\dots,7<\/span>）的面積和。<\/p><div class=\"sol\"><ol class=\"steps\">\n<li><span class=\"m\">A=\\sqrt2R_{45^\\circ}<\/span>，<span class=\"m\">P_8=A^8P_0=16R_{360^\\circ}P_0=(16,0)<\/span>。<\/li>\n<li><span class=\"m\">\\overline{OP_k}=(\\sqrt2)^k<\/span>，<span class=\"m\">\\angle P_kOP_{k+1}=45^\\circ<\/span>。<\/li>\n<li><span class=\"m\">[\\triangle OP_kP_{k+1}]=\\frac12(\\sqrt2)^k(\\sqrt2)^{k+1}\\sin45^\\circ=\\frac12\\cdot2^k\\sqrt2\\cdot\\frac{\\sqrt2}{2}=2^{k-1}<\/span>。<\/li>\n<li>面積和 <span class=\"m\">\\sum_{k=0}^{7}2^{k-1}=\\frac12(2^8-1)=\\frac{255}{2}<\/span>。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 360 290\" width=\"360\"><defs><marker id=\"M9-f14-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"70\" y1=\"94\" x2=\"310\" y2=\"94\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<line x1=\"200\" y1=\"278\" x2=\"200\" y2=\"16\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f14-m0)\"/>\n<text x=\"306\" y=\"112\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"208\" y=\"24\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"186\" y=\"110\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"280\" y1=\"91\" x2=\"280\" y2=\"97\" stroke=\"#1f2a44\"/>\n<text x=\"280\" y=\"110\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"middle\">4<\/text>\n<line x1=\"197\" y1=\"254\" x2=\"203\" y2=\"254\" stroke=\"#1f2a44\"/>\n<text x=\"194\" y=\"258\" font-size=\"12\" fill=\"#1f2a44\" text-anchor=\"end\">-8<\/text>\n<polygon points=\"200,94 220,94 220,74\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 220,74 200,54\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 200,54 160,54\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 160,54 120,94\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,94 120,174\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<polygon points=\"200,94 120,174 200,254\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<circle cx=\"220\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"224\" y=\"108\" font-size=\"13\" fill=\"#1f2a44\">P₀<\/text>\n<circle cx=\"220\" cy=\"74\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"226\" y=\"70\" font-size=\"13\" fill=\"#1f2a44\">P₁<\/text>\n<circle cx=\"200\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"206\" y=\"48\" font-size=\"13\" fill=\"#1f2a44\">P₂<\/text>\n<circle cx=\"160\" cy=\"54\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"134\" y=\"50\" font-size=\"13\" fill=\"#1f2a44\">P₃<\/text>\n<circle cx=\"120\" cy=\"94\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"88\" font-size=\"13\" fill=\"#1f2a44\">P₄<\/text>\n<circle cx=\"120\" cy=\"174\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"92\" y=\"188\" font-size=\"13\" fill=\"#1f2a44\">P₅<\/text>\n<circle cx=\"200\" cy=\"254\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"208\" y=\"258\" font-size=\"13\" fill=\"#1f2a44\">P₆<\/text>\n<\/svg><figcaption>圖 M9-17　點列 P₀ 到 P₆ 繞原點逆時針旋轉並以 √2 倍外擴<\/figcaption><\/figure>\n<p>另解（行列式）：<span class=\"m\">[\\triangle OP_0P_1]=\\frac12\\begin{vmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{vmatrix}=\\frac12<\/span>；<span class=\"m\">\\triangle OP_{k+1}P_{k+2}<\/span> 是 <span class=\"m\">\\triangle OP_kP_{k+1}<\/span> 經 <span class=\"m\">A<\/span> 的像，面積比 <span class=\"m\">\\det A=2<\/span>，故面積成公比 2 的等比數列。<\/p>\n<p>陷阱：<span class=\"m\">k<\/span> 從 0 到 7 共 8 項，<em>項數算錯<\/em>會得 <span class=\"m\">\\frac{127}{2}<\/span> 或 <span class=\"m\">\\frac{511}{2}<\/span>。<\/p><\/div><\/div>"},{"t":"迷思概念對照","h":"<p class=\"bad\"><span class=\"mark\">誤<\/span>平移 <span class=\"m\">(x,y)\\mapsto(x+1,y-2)<\/span> 是線性變換。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>線性變換必把原點映到原點；平移不是線性變換，無法以二階方陣表示。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">T(1,0)=(a,c)<\/span>、<span class=\"m\">T(0,1)=(b,d)<\/span>，所以矩陣是 <span class=\"m\">\\begin{bmatrix}a &amp; c\\\\ b &amp; d\\end{bmatrix}<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>單位點的像直著填成<strong>行<\/strong>：<span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>先作 <span class=\"m\">A<\/span> 再作 <span class=\"m\">B<\/span>，合成矩陣為 <span class=\"m\">AB<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>合成矩陣為 <span class=\"m\">BA<\/span>，後作用的矩陣寫在左邊。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>經 <span class=\"m\">A<\/span> 變換後面積變為 <span class=\"m\">\\det A<\/span> 倍。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>面積變為 <span class=\"m\">|\\det A|<\/span> 倍；<span class=\"m\">\\det A<\/span> 的正負表示方向是否反轉。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>對原點對稱是一種鏡射，行列式為 <span class=\"m\">-1<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>對原點對稱＝旋轉 <span class=\"m\">180^\\circ<\/span>，矩陣 <span class=\"m\">-I<\/span>，行列式為 <span class=\"m\">1<\/span>，方向不變。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>求圓 <span class=\"m\">x^2+y^2=1<\/span> 經 <span class=\"m\">\\begin{bmatrix}3 &amp; 0\\\\ 0 &amp; 2\\end{bmatrix}<\/span> 的像，把 <span class=\"m\">x'=3x,\\ y'=2y<\/span> 代入得 <span class=\"m\">9x^2+4y^2=1<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>以 <span class=\"m\">x=\\frac{x'}{3},\\ y=\\frac{y'}{2}<\/span> 代入原式，像為 <span class=\"m\">\\frac{x^2}{9}+\\frac{y^2}{4}=1<\/span>。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>線性變換把直線映成直線，把正方形映成正方形。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>直線的像為直線或一點（<span class=\"m\">\\det A=0<\/span> 時可能退化）；正方形的像一般是平行四邊形。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">\\begin{bmatrix}1 &amp; -\\sqrt3\\\\ \\sqrt3 &amp; 1\\end{bmatrix}<\/span> 是旋轉 <span class=\"m\">60^\\circ<\/span> 的矩陣。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>它等於 <span class=\"m\">2R_{60^\\circ}<\/span>，是旋轉 <span class=\"m\">60^\\circ<\/span> 再伸縮 2 倍；行列式為 4。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>兩個鏡射的合成仍是鏡射。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>兩個鏡射的合成是旋轉（行列式 <span class=\"m\">(-1)(-1)=1<\/span>），旋轉角為兩軸夾角的兩倍。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>投影到直線 <span class=\"m\">L<\/span> 的反變換是「從 <span class=\"m\">L<\/span> 拉回原處」。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>投影的行列式為 0，與 <span class=\"m\">L<\/span> 垂直的整條直線都映到同一點，沒有反變換。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>旋轉中心為 <span class=\"m\">C(1,1)<\/span> 的旋轉 <span class=\"m\">90^\\circ<\/span>，矩陣仍為 <span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，直接乘上點坐標即可。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>須寫成 <span class=\"m\">P'=C+R_{90^\\circ}(P-C)<\/span>；中心不在原點的旋轉不是線性變換。<\/p>"},{"t":"自我檢核","h":"<ul class=\"check\">\n<li>能由坐標規則或兩個單位點的像寫出變換矩陣，並說明「行＝單位點的像」。<\/li>\n<li>能由兩個不平行向量的像求矩陣（<span class=\"m\">A=CB^{-1}<\/span> 或線性組合）。<\/li>\n<li>能寫出伸縮、對 <span class=\"m\">x<\/span> 軸、<span class=\"m\">y<\/span> 軸、<span class=\"m\">y=\\pm x<\/span> 及 <span class=\"m\">y=mx<\/span> 鏡射、旋轉 <span class=\"m\">\\theta<\/span>、推移、投影的矩陣，並推導鏡射與旋轉公式。<\/li>\n<li>能辨認 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}=rR_\\theta<\/span>，並求其乘冪。<\/li>\n<li>能寫出合成變換的矩陣（後作用者在左），並判斷兩鏡射、鏡射與旋轉的合成結果。<\/li>\n<li>能用 <span class=\"m\">|\\det A|<\/span> 求面積比，用 <span class=\"m\">\\det A<\/span> 的正負判斷方向，說明 <span class=\"m\">\\det A=0<\/span> 時的退化情形。<\/li>\n<li>能求反變換，並以正確的代入方向求直線、圓的像與原像。<\/li>\n<li>（進階）能求不變直線（特徵向量），並以特徵向量分解（對角化）或凱萊–哈密頓定理（M8）求 <span class=\"m\">A^n<\/span>。<\/li>\n<\/ul>"}],"questions":[{"id":"M9-01","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"平面上的線性變換 <span class=\"m\">T<\/span> 把 <span class=\"m\">(1,0)<\/span> 映到 <span class=\"m\">(2,-1)<\/span>、把 <span class=\"m\">(0,1)<\/span> 映到 <span class=\"m\">(3,4)<\/span>。<span class=\"m\">T(2,-3)<\/span> 為下列哪一點？","opts":[{"k":"A","h":"<span class=\"m\">(-14,-5)<\/span>"},{"k":"B","h":"<span class=\"m\">(-5,-14)<\/span>"},{"k":"C","h":"<span class=\"m\">(7,-6)<\/span>"},{"k":"D","h":"<span class=\"m\">(-5,10)<\/span>"},{"k":"E","h":"<span class=\"m\">(13,-14)<\/span>"}],"type":"single","ans":["B"],"key":"(B)","sol":"矩陣的兩行為兩單位點的像：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 3\\\\ -1 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">T(2,-3)=2(2,-1)-3(3,4)=(-5,-14)<\/span>。(A) 坐標順序顛倒；(C) 把像填成列，即用 <span class=\"m\">\\begin{bmatrix}2 &amp; -1\\\\ 3 &amp; 4\\end{bmatrix}<\/span>；(D) 第二坐標符號錯；(E) 把 <span class=\"m\">-3<\/span> 當成 <span class=\"m\">+3<\/span> 計算第一坐標。","steps":["先排除 (A)：坐標順序顛倒","先排除 (C)：把像填成列，即用 <span class=\"m\">\\begin{bmatrix}2 &amp; -1\\\\ 3 &amp; 4\\end{bmatrix}<\/span>","先排除 (D)：第二坐標符號錯"],"hk":"hint"},{"id":"M9-02","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"下列哪一個矩陣代表「對直線 <span class=\"m\">y=-x<\/span> 鏡射」？","opts":[{"k":"A","h":"<span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>"},{"k":"B","h":"<span class=\"m\">\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>"},{"k":"C","h":"<span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>"},{"k":"D","h":"<span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>"},{"k":"E","h":"<span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>"}],"type":"single","ans":["D"],"key":"(D)","sol":"對 <span class=\"m\">y=-x<\/span> 鏡射：<span class=\"m\">(1,0)\\mapsto(0,-1)<\/span>，<span class=\"m\">(0,1)\\mapsto(-1,0)<\/span>，矩陣為 <span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>。(A) 對 <span class=\"m\">y=x<\/span> 鏡射；(B) 旋轉 <span class=\"m\">180^\\circ<\/span>；(C) 逆時針旋轉 <span class=\"m\">90^\\circ<\/span>；(E) 順時針旋轉 <span class=\"m\">90^\\circ<\/span>。","steps":["先排除 (A)：對 <span class=\"m\">y=x<\/span> 鏡射","先排除 (B)：旋轉 <span class=\"m\">180^\\circ<\/span>","先排除 (C)：逆時針旋轉 <span class=\"m\">90^\\circ<\/span>"],"hk":"hint"},{"id":"M9-03","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"點 <span class=\"m\">P(2\\sqrt3,2)<\/span> 繞原點逆時針旋轉 <span class=\"m\">30^\\circ<\/span> 後的坐標為何？","opts":[{"k":"A","h":"<span class=\"m\">(2,2\\sqrt3)<\/span>"},{"k":"B","h":"<span class=\"m\">(4,0)<\/span>"},{"k":"C","h":"<span class=\"m\">(0,4)<\/span>"},{"k":"D","h":"<span class=\"m\">(-2,2\\sqrt3)<\/span>"},{"k":"E","h":"<span class=\"m\">(2\\sqrt3,-2)<\/span>"}],"type":"single","ans":["A"],"key":"(A)","sol":"<span class=\"m\">P<\/span> 的極坐標為 <span class=\"m\">r=4<\/span>、方向角 <span class=\"m\">30^\\circ<\/span>，旋轉後方向角 <span class=\"m\">60^\\circ<\/span>，坐標 <span class=\"m\">(4\\cos60^\\circ,4\\sin60^\\circ)=(2,2\\sqrt3)<\/span>。也可直接計算 <span class=\"m\">R_{30^\\circ}P=\\left(\\frac{\\sqrt3}{2}\\cdot2\\sqrt3-\\frac12\\cdot2,\\ \\frac12\\cdot2\\sqrt3+\\frac{\\sqrt3}{2}\\cdot2\\right)=(2,2\\sqrt3)<\/span>。(B) 為順時針旋轉 <span class=\"m\">30^\\circ<\/span>；(C) 為旋轉 <span class=\"m\">60^\\circ<\/span>。","steps":["先排除 (B)：為順時針旋轉 <span class=\"m\">30^\\circ<\/span>","先排除 (C)：為旋轉 <span class=\"m\">60^\\circ<\/span>。"],"hk":"hint"},{"id":"M9-04","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"面積為 4 的三角形經矩陣 <span class=\"m\">\\begin{bmatrix}3 &amp; -1\\\\ 2 &amp; 1\\end{bmatrix}<\/span> 變換後，所得圖形的面積為何？","opts":[{"k":"A","h":"<span class=\"m\">\\frac45<\/span>"},{"k":"B","h":"4"},{"k":"C","h":"5"},{"k":"D","h":"9"},{"k":"E","h":"20"}],"type":"single","ans":["E"],"key":"(E)","sol":"<span class=\"m\">\\det=3\\cdot1-(-1)\\cdot2=5<\/span>，面積 <span class=\"m\">4\\times5=20<\/span>。(C) 只算行列式；(B) 誤用 <span class=\"m\">ad+bc=1<\/span>；(A) 誤用除法。","steps":["先排除 (A)：誤用除法。","先排除 (B)：誤用 <span class=\"m\">ad+bc=1<\/span>","先排除 (C)：只算行列式"],"hk":"hint"},{"id":"M9-05","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">T<\/span> 為矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 1\\end{bmatrix}<\/span> 所代表的線性變換。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">T<\/span> 是沿 <span class=\"m\">y<\/span> 軸方向的推移"},{"k":"B","h":"<span class=\"m\">x<\/span> 軸上每一點經 <span class=\"m\">T<\/span> 後都不動"},{"k":"C","h":"<span class=\"m\">T<\/span> 把 <span class=\"m\">y<\/span> 軸映成 <span class=\"m\">y<\/span> 軸"},{"k":"D","h":"<span class=\"m\">T<\/span> 把面積 6 的正方形映成面積 6 的平行四邊形"},{"k":"E","h":"<span class=\"m\">T<\/span> 的反變換矩陣為 <span class=\"m\">\\begin{bmatrix}1 &amp; -2\\\\ 0 &amp; 1\\end{bmatrix}<\/span>"}],"type":"multi","ans":["B","D","E"],"key":"(B)(D)(E)","sol":"(A) <span class=\"m\">k=2<\/span> 在第一列，改變 <span class=\"m\">x<\/span> 坐標，是沿 <span class=\"m\">x<\/span> 軸方向的推移，錯誤。(B) <span class=\"m\">(x,0)\\mapsto(x,0)<\/span>，正確。(C) <span class=\"m\">(0,t)\\mapsto(2t,t)<\/span>，<span class=\"m\">y<\/span> 軸映成 <span class=\"m\">y=\\frac12x<\/span>，錯誤。(D) <span class=\"m\">\\det=1<\/span>，面積不變，正確。(E) 推移 <span class=\"m\">k<\/span> 的反變換為推移 <span class=\"m\">-k<\/span>，正確。","steps":["先判斷 (A)：<span class=\"m\">k=2<\/span> 在第一列，改變 <span class=\"m\">x<\/span> 坐標，是沿 <span class=\"m\">x<\/span> 軸方向的推移，錯誤。","先判斷 (B)：<span class=\"m\">(x,0)\\mapsto(x,0)<\/span>，正確。"],"hk":"hint"},{"id":"M9-06","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"下列哪些變換的矩陣行列式為 <span class=\"m\">-1<\/span>？（多選）","opts":[{"k":"A","h":"對 <span class=\"m\">x<\/span> 軸鏡射"},{"k":"B","h":"繞原點旋轉 <span class=\"m\">180^\\circ<\/span>"},{"k":"C","h":"對直線 <span class=\"m\">y=x<\/span> 鏡射"},{"k":"D","h":"投影到 <span class=\"m\">x<\/span> 軸"},{"k":"E","h":"對直線 <span class=\"m\">y=3x<\/span> 鏡射"}],"type":"multi","ans":["A","C","E"],"key":"(A)(C)(E)","sol":"對直線的鏡射行列式皆為 <span class=\"m\">-1<\/span>：(A)(C)(E) 正確。(B) 旋轉 <span class=\"m\">180^\\circ<\/span> 的矩陣 <span class=\"m\">-I<\/span>，行列式 1。(D) 投影到 <span class=\"m\">x<\/span> 軸 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，行列式 0。(E) 也可由公式 <span class=\"m\">\\frac{1}{10}\\begin{bmatrix}-8 &amp; 6\\\\ 6 &amp; 8\\end{bmatrix}<\/span>，行列式 <span class=\"m\">\\frac{-64-36}{100}=-1<\/span>。","steps":["先判斷 (B)：旋轉 <span class=\"m\">180^\\circ<\/span> 的矩陣 <span class=\"m\">-I<\/span>，行列式 1。","先判斷 (D)：投影到 <span class=\"m\">x<\/span> 軸 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，行列式 0。"],"hk":"hint"},{"id":"M9-07","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">T<\/span> 為平面上任一線性變換。下列哪些敘述<strong>必定<\/strong>成立？（多選）","opts":[{"k":"A","h":"<span class=\"m\">T<\/span> 把任一直線映成直線"},{"k":"B","h":"<span class=\"m\">T<\/span> 把正方形映成正方形"},{"k":"C","h":"若 <span class=\"m\">M<\/span> 為 <span class=\"m\">\\overline{PQ}<\/span> 中點，則 <span class=\"m\">T(M)<\/span> 為 <span class=\"m\">T(P)<\/span>、<span class=\"m\">T(Q)<\/span> 連線段的中點"},{"k":"D","h":"對所有 <span class=\"m\">x,y<\/span>，<span class=\"m\">T(x+1,y)=T(x,y)+(1,0)<\/span>"},{"k":"E","h":"<span class=\"m\">T(0,0)=(0,0)<\/span>"}],"type":"multi","ans":["C","E"],"key":"(C)(E)","sol":"(A) <span class=\"m\">\\det=0<\/span> 時，與「被映到原點的直線」平行的直線會映成一點（如投影到 <span class=\"m\">x<\/span> 軸把 <span class=\"m\">x=1<\/span> 映成點 <span class=\"m\">(1,0)<\/span>），錯誤。(B) 一般映成平行四邊形，錯誤。(C) <span class=\"m\">T\\left(\\frac{P+Q}{2}\\right)=\\frac{T(P)+T(Q)}{2}<\/span>，正確。(D) <span class=\"m\">T(x+1,y)=T(x,y)+T(1,0)<\/span>，<span class=\"m\">T(1,0)<\/span> 不一定是 <span class=\"m\">(1,0)<\/span>，錯誤。(E) <span class=\"m\">A\\vec{0}=\\vec{0}<\/span>，正確。","steps":["先判斷 (A)：<span class=\"m\">\\det=0<\/span> 時，與「被映到原點的直線」平行的直線會映成一點（如投影到 <span class=\"m\">x<\/span> 軸把 <span class=\"m\">x=1<\/span> 映成點 <span class=\"m\">(1,0)<\/span>），錯誤。","先判斷 (B)：一般映成平行四邊形，錯誤。"],"hk":"hint"},{"id":"M9-08","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"矩陣 <span class=\"m\">A=\\begin{bmatrix}2 &amp; a\\\\ b &amp; 3\\end{bmatrix}<\/span> 把點 <span class=\"m\">(1,1)<\/span> 映到 <span class=\"m\">(5,1)<\/span>，則 <span class=\"m\">A<\/span> 把單位正方形映成面積為 <span class=\"m\">\\fbox{\\phantom{0}}<\/span> 的平行四邊形。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：12","sol":"<span class=\"m\">2+a=5<\/span>，<span class=\"m\">b+3=1<\/span>，得 <span class=\"m\">a=3<\/span>、<span class=\"m\">b=-2<\/span>；<span class=\"m\">\\det A=6-(3)(-2)=12<\/span>，單位正方形面積 1，像的面積 12。","steps":[]},{"id":"M9-09","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"點 <span class=\"m\">(5,5)<\/span> 對直線 <span class=\"m\">x-3y=0<\/span> 的對稱點為 <span class=\"m\">(\\fbox{\\phantom{0}},\\fbox{\\phantom{0}})<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：(7, −1)","sol":"<span class=\"m\">m=\\frac13<\/span>，鏡射矩陣 <span class=\"m\">\\dfrac{1}{1+\\frac19}\\begin{bmatrix}\\frac89 &amp; \\frac23\\\\ \\frac23 &amp; -\\frac89\\end{bmatrix}=\\begin{bmatrix}\\frac45 &amp; \\frac35\\\\ \\frac35 &amp; -\\frac45\\end{bmatrix}<\/span>，<span class=\"m\">(5,5)\\mapsto(4+3,\\ 3-4)=(7,-1)<\/span>。驗算：中點 <span class=\"m\">(6,2)<\/span> 在 <span class=\"m\">x-3y=0<\/span> 上；<span class=\"m\">(7,-1)-(5,5)=(2,-6)<\/span> 與方向 <span class=\"m\">(3,1)<\/span> 內積 0。","steps":["<span class=\"m\">m=\\frac13<\/span>，鏡射矩陣 <span class=\"m\">\\dfrac{1}{1+\\frac19}\\begin{bmatrix}\\frac89 &amp; \\frac23\\\\ \\frac23 &amp; -\\frac89\\end{bmatrix}=\\begin{bmatrix}\\frac45 &amp; \\frac35\\\\ \\frac35 &amp; -\\frac45\\end{bmatrix}<\/span>，<span class=\"m\">(5,5)\\mapsto(4+3,\\ 3-4)=(7,-1)<\/span>。"],"hk":"hint"},{"id":"M9-10","unit":"M9","set":"分級測驗","level":"基礎題","src":"","ctx":"","pre":"","stem":"點 <span class=\"m\">(3,1)<\/span> 先繞原點逆時針旋轉 <span class=\"m\">90^\\circ<\/span>，再經 <span class=\"m\">\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span> 變換，所得點的坐標為 <span class=\"m\">(\\fbox{\\phantom{0}},\\fbox{\\phantom{0}})<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：(−2, 3)","sol":"合成矩陣 <span class=\"m\">\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}0 &amp; -2\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">(3,1)\\mapsto(-2,3)<\/span>。分步：旋轉得 <span class=\"m\">(-1,3)<\/span>，再伸縮得 <span class=\"m\">(-2,3)<\/span>。","steps":["合成矩陣 <span class=\"m\">\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}0 &amp; -2\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">(3,1)\\mapsto(-2,3)<\/span>。"],"hk":"hint"},{"id":"M9-11","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"先對 <span class=\"m\">x<\/span> 軸鏡射，再對直線 <span class=\"m\">y=x<\/span> 鏡射。此合成變換等同於下列何者？","opts":[{"k":"A","h":"繞原點順時針旋轉 <span class=\"m\">90^\\circ<\/span>"},{"k":"B","h":"對直線 <span class=\"m\">y=-x<\/span> 鏡射"},{"k":"C","h":"繞原點逆時針旋轉 <span class=\"m\">90^\\circ<\/span>"},{"k":"D","h":"繞原點旋轉 <span class=\"m\">180^\\circ<\/span>"},{"k":"E","h":"對 <span class=\"m\">y<\/span> 軸鏡射"}],"type":"single","ans":["C"],"key":"(C)","sol":"<span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}=R_{90^\\circ}<\/span>。也可用 <span class=\"m\">M_{45^\\circ}M_{0^\\circ}=R_{2(45^\\circ-0^\\circ)}<\/span>。(A) 為順序相反的結果；兩鏡射合成為旋轉，故 (B)(E) 不可能。","steps":["先排除 (A)：為順序相反的結果；兩鏡射合成為旋轉，故 (B)","先排除 (E)：不可能。"],"hk":"hint"},{"id":"M9-12","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"矩陣 <span class=\"m\">\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span> 所代表的線性變換把整個坐標平面映成下列何者？","opts":[{"k":"A","h":"直線 <span class=\"m\">y=2x<\/span>"},{"k":"B","h":"直線 <span class=\"m\">y=\\frac12x<\/span>"},{"k":"C","h":"直線 <span class=\"m\">x+2y=0<\/span>"},{"k":"D","h":"整個坐標平面"},{"k":"E","h":"原點"}],"type":"single","ans":["A"],"key":"(A)","sol":"<span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}=(x+2y)\\begin{bmatrix}1\\\\ 2\\end{bmatrix}<\/span>，像都在直線 <span class=\"m\">y=2x<\/span> 上，且 <span class=\"m\">x+2y<\/span> 可取任意實數，故像為整條直線 <span class=\"m\">y=2x<\/span>。(C) <span class=\"m\">x+2y=0<\/span> 是被映到原點的點所成的直線；(D) <span class=\"m\">\\det=0<\/span>，不可能。","steps":["先排除 (C)：<span class=\"m\">x+2y=0<\/span> 是被映到原點的點所成的直線","先排除 (D)：<span class=\"m\">\\det=0<\/span>，不可能。"],"hk":"hint"},{"id":"M9-13","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; -\\frac12\\\\ \\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}<\/span>，則 <span class=\"m\">A^{2027}<\/span> 等於下列何者？","opts":[{"k":"A","h":"<span class=\"m\">A<\/span>"},{"k":"B","h":"<span class=\"m\">-A<\/span>"},{"k":"C","h":"<span class=\"m\">I<\/span>"},{"k":"D","h":"<span class=\"m\">\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; \\frac12\\\\ -\\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}<\/span>"},{"k":"E","h":"<span class=\"m\">\\begin{bmatrix}\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}<\/span>"}],"type":"single","ans":["D"],"key":"(D)","sol":"<span class=\"m\">A=R_{30^\\circ}<\/span>，<span class=\"m\">A^{2027}=R_{60810^\\circ}<\/span>；<span class=\"m\">60810=360\\times168+330<\/span>，故 <span class=\"m\">A^{2027}=R_{330^\\circ}=R_{-30^\\circ}=\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; \\frac12\\\\ -\\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}<\/span>。(B) 為 <span class=\"m\">R_{210^\\circ}<\/span>；(C) 為 <span class=\"m\">R_{360^\\circ}<\/span>；(E) 為 <span class=\"m\">R_{-60^\\circ}<\/span>，同界角計算錯誤所得。","steps":["先排除 (B)：為 <span class=\"m\">R_{210^\\circ}<\/span>","先排除 (C)：為 <span class=\"m\">R_{360^\\circ}<\/span>","先排除 (E)：為 <span class=\"m\">R_{-60^\\circ}<\/span>，同界角計算錯誤所得。"],"hk":"hint"},{"id":"M9-14","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">P<\/span> 為「投影到直線 <span class=\"m\">y=x<\/span>」的變換矩陣，<span class=\"m\">I<\/span> 為二階單位方陣。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">P<\/span> 所代表的變換有反變換"},{"k":"B","h":"<span class=\"m\">P^2=P<\/span>"},{"k":"C","h":"<span class=\"m\">\\det P=0<\/span>"},{"k":"D","h":"直線 <span class=\"m\">x+y=4<\/span> 上每一點經 <span class=\"m\">P<\/span> 後都映到 <span class=\"m\">(2,2)<\/span>"},{"k":"E","h":"<span class=\"m\">2P-I<\/span> 為對直線 <span class=\"m\">y=x<\/span> 鏡射的矩陣"}],"type":"multi","ans":["B","C","D","E"],"key":"(B)(C)(D)(E)","sol":"<span class=\"m\">P=\\frac12\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。(A) <span class=\"m\">\\det P=0<\/span>，無反變換，錯誤。(B) <span class=\"m\">P^2=\\frac14\\begin{bmatrix}2 &amp; 2\\\\ 2 &amp; 2\\end{bmatrix}=P<\/span>，正確。(C) 正確。(D) <span class=\"m\">P(x,y)=\\left(\\frac{x+y}{2},\\frac{x+y}{2}\\right)=(2,2)<\/span>，正確。(E) <span class=\"m\">2P-I=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，正確。","steps":["先判斷 (A)：<span class=\"m\">\\det P=0<\/span>，無反變換，錯誤。","先判斷 (B)：<span class=\"m\">P^2=\\frac14\\begin{bmatrix}2 &amp; 2\\\\ 2 &amp; 2\\end{bmatrix}=P<\/span>，正確。"],"hk":"hint"},{"id":"M9-15","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"線性變換 <span class=\"m\">T<\/span>（矩陣 <span class=\"m\">A<\/span>）把 <span class=\"m\">O(0,0)<\/span>、<span class=\"m\">P(1,0)<\/span>、<span class=\"m\">Q(0,1)<\/span> 分別映到 <span class=\"m\">O<\/span>、<span class=\"m\">P'(3,1)<\/span>、<span class=\"m\">Q'(1,2)<\/span>。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span>"},{"k":"B","h":"<span class=\"m\">\\triangle OP'Q'<\/span> 的面積為 5"},{"k":"C","h":"<span class=\"m\">O\\to P'\\to Q'<\/span> 為順時針排列"},{"k":"D","h":"<span class=\"m\">T<\/span> 把 <span class=\"m\">(2,-1)<\/span> 映到 <span class=\"m\">(5,0)<\/span>"},{"k":"E","h":"<span class=\"m\">A^{-1}=\\dfrac15\\begin{bmatrix}2 &amp; -1\\\\ -1 &amp; 3\\end{bmatrix}<\/span>"}],"type":"multi","ans":["A","D","E"],"key":"(A)(D)(E)","sol":"(A) 兩行為 <span class=\"m\">P',Q'<\/span>，正確。(B) <span class=\"m\">\\det A=5<\/span>，原三角形面積 <span class=\"m\">\\frac12<\/span>，像面積 <span class=\"m\">\\frac52<\/span>，錯誤。(C) <span class=\"m\">\\det A&gt;0<\/span>，方向不變，<span class=\"m\">O\\to P\\to Q<\/span> 為逆時針，像亦為逆時針，錯誤。(D) <span class=\"m\">(6-1,\\ 2-2)=(5,0)<\/span>，正確。(E) <span class=\"m\">\\frac15\\begin{bmatrix}2 &amp; -1\\\\ -1 &amp; 3\\end{bmatrix}<\/span>，正確。","steps":["先判斷 (A)：兩行為 <span class=\"m\">P',Q'<\/span>，正確。","先判斷 (B)：<span class=\"m\">\\det A=5<\/span>，原三角形面積 <span class=\"m\">\\frac12<\/span>，像面積 <span class=\"m\">\\frac52<\/span>，錯誤。"],"hk":"hint"},{"id":"M9-16","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"以 <span class=\"m\">R_\\theta<\/span> 表示繞原點逆時針旋轉 <span class=\"m\">\\theta<\/span> 的矩陣，<span class=\"m\">M_\\alpha<\/span> 表示對傾斜角 <span class=\"m\">\\alpha<\/span>、過原點的直線鏡射的矩陣。下列哪些敘述對所有實數 <span class=\"m\">\\theta,\\alpha,\\beta<\/span> 都成立？（多選）","opts":[{"k":"A","h":"<span class=\"m\">M_\\alpha M_\\beta=M_\\beta M_\\alpha<\/span>"},{"k":"B","h":"<span class=\"m\">\\det R_\\theta=1<\/span>"},{"k":"C","h":"<span class=\"m\">R_\\theta^{-1}=R_{-\\theta}<\/span>"},{"k":"D","h":"<span class=\"m\">R_\\theta+R_{-\\theta}=2\\cos\\theta\\,I<\/span>"},{"k":"E","h":"<span class=\"m\">(R_\\theta)^2=R_{\\theta^2}<\/span>"}],"type":"multi","ans":["B","C","D"],"key":"(B)(C)(D)","sol":"(A) <span class=\"m\">M_\\alpha M_\\beta=R_{2(\\alpha-\\beta)}<\/span>，<span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}<\/span>，一般不相等（例：<span class=\"m\">\\alpha=0,\\beta=45^\\circ<\/span> 時分別為 <span class=\"m\">R_{-90^\\circ}<\/span>、<span class=\"m\">R_{90^\\circ}<\/span>），錯誤。(B) <span class=\"m\">\\cos^2\\theta+\\sin^2\\theta=1<\/span>，正確。(C) 正確。(D) 非對角元素 <span class=\"m\">-\\sin\\theta+\\sin\\theta=0<\/span>，對角 <span class=\"m\">2\\cos\\theta<\/span>，正確。(E) <span class=\"m\">(R_\\theta)^2=R_{2\\theta}<\/span>，錯誤。","steps":["先判斷 (A)：<span class=\"m\">M_\\alpha M_\\beta=R_{2(\\alpha-\\beta)}<\/span>，<span class=\"m\">M_\\beta M_\\alpha=R_{2(\\beta-\\alpha)}<\/span>，一般不相等（例：<span class=\"m\">\\alpha=0,\\beta=45^\\circ<\/span> 時分別為 <span class=\"m\">R_{-90^\\circ}<\/span>、<span class=\"m\">R_{90^\\circ}<\/span>），錯誤。","先判斷 (B)：<span class=\"m\">\\cos^2\\theta+\\sin^2\\theta=1<\/span>，正確。"],"hk":"hint"},{"id":"M9-17","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"線性變換 <span class=\"m\">T<\/span>（矩陣 <span class=\"m\">A<\/span>）把 <span class=\"m\">(1,2)<\/span> 映到 <span class=\"m\">(3,4)<\/span>、把 <span class=\"m\">(2,3)<\/span> 映到 <span class=\"m\">(5,7)<\/span>。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ 2 &amp; 1\\end{bmatrix}<\/span>"},{"k":"B","h":"<span class=\"m\">\\det A=1<\/span>"},{"k":"C","h":"<span class=\"m\">T(1,0)=(1,2)<\/span>"},{"k":"D","h":"<span class=\"m\">T<\/span> 把任一三角形映成面積相等的三角形"},{"k":"E","h":"<span class=\"m\">T<\/span> 保持三角形頂點的繞行方向"}],"type":"multi","ans":["A","C","D"],"key":"(A)(C)(D)","sol":"<span class=\"m\">A=\\begin{bmatrix}3 &amp; 5\\\\ 4 &amp; 7\\end{bmatrix}\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 3\\end{bmatrix}^{-1}=\\begin{bmatrix}3 &amp; 5\\\\ 4 &amp; 7\\end{bmatrix}\\begin{bmatrix}-3 &amp; 2\\\\ 2 &amp; -1\\end{bmatrix}=\\begin{bmatrix}1 &amp; 1\\\\ 2 &amp; 1\\end{bmatrix}<\/span>，(A) 正確。(B) <span class=\"m\">\\det A=1-2=-1<\/span>，錯誤。(C) 第一行 <span class=\"m\">(1,2)<\/span>，正確。(D) <span class=\"m\">|\\det A|=1<\/span>，正確。(E) <span class=\"m\">\\det A&lt;0<\/span>，方向反轉，錯誤。","steps":["先判斷 (B)：<span class=\"m\">\\det A=1-2=-1<\/span>，錯誤。","先判斷 (C)：第一行 <span class=\"m\">(1,2)<\/span>，正確。"],"hk":"hint"},{"id":"M9-18","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"單位圓 <span class=\"m\">\\Gamma:\\ x^2+y^2=1<\/span> 經矩陣 <span class=\"m\">\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 3\\end{bmatrix}<\/span> 變換後的圖形為 <span class=\"m\">\\Gamma'<\/span>。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">\\Gamma':\\ \\frac{x^2}{4}+\\frac{y^2}{9}=1<\/span>"},{"k":"B","h":"<span class=\"m\">\\Gamma'<\/span> 所圍區域面積為 <span class=\"m\">6\\pi<\/span>"},{"k":"C","h":"直線 <span class=\"m\">y=x<\/span> 經此變換的像仍為 <span class=\"m\">y=x<\/span>"},{"k":"D","h":"<span class=\"m\">\\Gamma'<\/span> 的長軸在 <span class=\"m\">y<\/span> 軸上"},{"k":"E","h":"點 <span class=\"m\">(1,1)<\/span> 的像在 <span class=\"m\">\\Gamma'<\/span> 上"}],"type":"multi","ans":["A","B","D"],"key":"(A)(B)(D)","sol":"(A) 以 <span class=\"m\">x=\\frac{x'}{2},\\ y=\\frac{y'}{3}<\/span> 代入，正確。(B) <span class=\"m\">\\pi\\cdot2\\cdot3=6\\pi<\/span>，或 <span class=\"m\">\\pi\\times\\det=6\\pi<\/span>，正確。(C) <span class=\"m\">(t,t)\\mapsto(2t,3t)<\/span>，像為 <span class=\"m\">y=\\frac32x<\/span>，錯誤。(D) <span class=\"m\">3&gt;2<\/span>，長軸在 <span class=\"m\">y<\/span> 軸上，正確。(E) <span class=\"m\">(1,1)\\mapsto(2,3)<\/span>，<span class=\"m\">\\frac44+\\frac99=2\\ne1<\/span>；<span class=\"m\">(1,1)<\/span> 不在 <span class=\"m\">\\Gamma<\/span> 上，其像不在 <span class=\"m\">\\Gamma'<\/span> 上，錯誤。","steps":["先判斷 (A)：以 <span class=\"m\">x=\\frac{x'}{2},\\ y=\\frac{y'}{3}<\/span> 代入，正確。","先判斷 (B)：<span class=\"m\">\\pi\\cdot2\\cdot3=6\\pi<\/span>，或 <span class=\"m\">\\pi\\times\\det=6\\pi<\/span>，正確。"],"hk":"hint"},{"id":"M9-19","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">R<\/span> 為繞原點逆時針旋轉 <span class=\"m\">90^\\circ<\/span> 的矩陣，<span class=\"m\">M<\/span> 為對 <span class=\"m\">x<\/span> 軸鏡射的矩陣，<span class=\"m\">S=\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">RM=MR<\/span>"},{"k":"B","h":"<span class=\"m\">MS=SM<\/span>"},{"k":"C","h":"<span class=\"m\">RS=SR<\/span>"},{"k":"D","h":"<span class=\"m\">R^2=I<\/span>"},{"k":"E","h":"<span class=\"m\">(MR)^2=I<\/span>"}],"type":"multi","ans":["B","E"],"key":"(B)(E)","sol":"<span class=\"m\">R=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">M=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>。(A) <span class=\"m\">RM=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">MR=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，錯誤。(B) 兩對角矩陣可交換，正確。(C) <span class=\"m\">RS=\\begin{bmatrix}0 &amp; -1\\\\ 2 &amp; 0\\end{bmatrix}<\/span>、<span class=\"m\">SR=\\begin{bmatrix}0 &amp; -2\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，錯誤。(D) <span class=\"m\">R^2=R_{180^\\circ}=-I<\/span>，錯誤。(E) <span class=\"m\">MR<\/span> 為對 <span class=\"m\">y=-x<\/span> 鏡射，平方為 <span class=\"m\">I<\/span>，正確。","steps":["先判斷 (A)：<span class=\"m\">RM=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">MR=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，錯誤。","先判斷 (B)：兩對角矩陣可交換，正確。"],"hk":"hint"},{"id":"M9-20","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"點 <span class=\"m\">P(5,3)<\/span> 繞點 <span class=\"m\">C(1,-1)<\/span> 逆時針旋轉 <span class=\"m\">90^\\circ<\/span> 後的坐標為 <span class=\"m\">(\\fbox{\\phantom{0}},\\fbox{\\phantom{0}})<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：(−3, 3)","sol":"<span class=\"m\">\\overrightarrow{CP}=(4,4)<\/span>，旋轉 <span class=\"m\">90^\\circ<\/span> 得 <span class=\"m\">(-4,4)<\/span>，<span class=\"m\">P'=C+(-4,4)=(-3,3)<\/span>。驗算：<span class=\"m\">\\overline{CP'}=\\overline{CP}=4\\sqrt2<\/span>，且 <span class=\"m\">(4,4)\\cdot(-4,4)=0<\/span>。","steps":["<span class=\"m\">\\overrightarrow{CP}=(4,4)<\/span>，旋轉 <span class=\"m\">90^\\circ<\/span> 得 <span class=\"m\">(-4,4)<\/span>，<span class=\"m\">P'=C+(-4,4)=(-3,3)<\/span>。"],"hk":"hint"},{"id":"M9-21","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">a&gt;0<\/span>，矩陣 <span class=\"m\">\\begin{bmatrix}a &amp; 1\\\\ 2 &amp; a\\end{bmatrix}<\/span> 把面積為 2 的正方形映成面積為 14 的平行四邊形，且保持頂點的繞行方向，則 <span class=\"m\">a=\\fbox{\\phantom{0}}<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：3","sol":"面積比 <span class=\"m\">\\frac{14}{2}=7<\/span>；保持方向，<span class=\"m\">\\det=a^2-2=7<\/span>，<span class=\"m\">a^2=9<\/span>，<span class=\"m\">a&gt;0<\/span> 得 <span class=\"m\">a=3<\/span>。若 <span class=\"m\">a^2-2=-7<\/span> 則無實數解。","steps":["面積比 <span class=\"m\">\\frac{14}{2}=7<\/span>；保持方向，<span class=\"m\">\\det=a^2-2=7<\/span>，<span class=\"m\">a^2=9<\/span>，<span class=\"m\">a&gt;0<\/span> 得 <span class=\"m\">a=3<\/span>。"],"hk":"hint"},{"id":"M9-22","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"沿 <span class=\"m\">x<\/span> 軸方向的推移 <span class=\"m\">T:\\ (x,y)\\mapsto(x+ky,\\ y)<\/span> 把直線 <span class=\"m\">y=2x<\/span> 映成 <span class=\"m\">y<\/span> 軸，則 <span class=\"m\">k=\\fbox{\\phantom{0}}<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：−1/2","sol":"直線 <span class=\"m\">y=2x<\/span> 上的點 <span class=\"m\">(t,2t)\\mapsto(t+2kt,\\ 2t)<\/span>；落在 <span class=\"m\">y<\/span> 軸上須 <span class=\"m\">(1+2k)t=0<\/span> 對所有 <span class=\"m\">t<\/span> 成立，<span class=\"m\">k=-\\frac12<\/span>。","steps":[]},{"id":"M9-23","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"直線 <span class=\"m\">L<\/span> 經矩陣 <span class=\"m\">\\begin{bmatrix}3 &amp; 1\\\\ 2 &amp; 1\\end{bmatrix}<\/span> 變換後的像為直線 <span class=\"m\">x-2y=1<\/span>，則 <span class=\"m\">L<\/span> 的方程式為 <span class=\"m\">x+y=\\fbox{\\phantom{0}}<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：−1","sol":"求原像：<span class=\"m\">x'=3x+y<\/span>、<span class=\"m\">y'=2x+y<\/span> 代入 <span class=\"m\">x'-2y'=1<\/span>，得 <span class=\"m\">3x+y-4x-2y=-x-y=1<\/span>，即 <span class=\"m\">L:\\ x+y=-1<\/span>。","steps":[]},{"id":"M9-24","unit":"M9","set":"分級測驗","level":"進階題","src":"","ctx":"","pre":"","stem":"投影到直線 <span class=\"m\">y=2x<\/span> 的變換矩陣為 <span class=\"m\">\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}<\/span>，則 <span class=\"m\">p+q+r+s=\\fbox{\\phantom{0}}<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：9/5","sol":"方向 <span class=\"m\">(1,2)<\/span>，<span class=\"m\">P=\\dfrac15\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span>，元素和 <span class=\"m\">\\frac{1+2+2+4}{5}=\\frac95<\/span>。","steps":[]},{"id":"M9-25","unit":"M9","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">I<\/span> 為二階單位方陣，則 <span class=\"m\">A^{100}<\/span> 等於下列何者？","opts":[{"k":"A","h":"<span class=\"m\">I<\/span>"},{"k":"B","h":"<span class=\"m\">A<\/span>"},{"k":"C","h":"<span class=\"m\">A^2<\/span>"},{"k":"D","h":"<span class=\"m\">-A<\/span>"},{"k":"E","h":"<span class=\"m\">-I<\/span>"}],"type":"single","ans":["B"],"key":"(B)","sol":"<span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">A^3=A^2A=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}=I<\/span>。<span class=\"m\">100=3\\times33+1<\/span>，<span class=\"m\">A^{100}=A<\/span>。另解：凱萊–哈密頓定理（見 M8），跡 <span class=\"m\">-1<\/span>、行列式 <span class=\"m\">1<\/span>，<span class=\"m\">A^2+A+I=O<\/span>，兩邊乘 <span class=\"m\">A-I<\/span> 得 <span class=\"m\">A^3-I=O<\/span>。<span class=\"m\">A<\/span> 不是旋轉矩陣，但三次方為 <span class=\"m\">I<\/span>。","steps":[]},{"id":"M9-26","unit":"M9","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">M_1<\/span> 為對 <span class=\"m\">x<\/span> 軸鏡射的矩陣，<span class=\"m\">M_2<\/span> 為對直線 <span class=\"m\">y=\\sqrt3x<\/span> 鏡射的矩陣。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">M_2M_1<\/span> 為繞原點逆時針旋轉 <span class=\"m\">120^\\circ<\/span> 的矩陣"},{"k":"B","h":"<span class=\"m\">M_1M_2<\/span> 為繞原點逆時針旋轉 <span class=\"m\">120^\\circ<\/span> 的矩陣"},{"k":"C","h":"<span class=\"m\">(M_2M_1)^3=I<\/span>"},{"k":"D","h":"<span class=\"m\">M_1M_2M_1<\/span> 為對直線 <span class=\"m\">y=-\\sqrt3x<\/span> 鏡射的矩陣"},{"k":"E","h":"<span class=\"m\">M_2M_1M_2=M_1M_2M_1<\/span>"}],"type":"multi","ans":["A","C","D","E"],"key":"(A)(C)(D)(E)","sol":"<span class=\"m\">M_1=M_{0^\\circ}<\/span>，<span class=\"m\">M_2=M_{60^\\circ}<\/span>。(A) <span class=\"m\">M_{60^\\circ}M_{0^\\circ}=R_{2(60^\\circ-0^\\circ)}=R_{120^\\circ}<\/span>，正確。(B) <span class=\"m\">M_1M_2=R_{-120^\\circ}<\/span>，錯誤。(C) <span class=\"m\">R_{120^\\circ}^3=R_{360^\\circ}=I<\/span>，正確。(D) <span class=\"m\">M_\\beta M_\\alpha M_\\beta=M_{2\\beta-\\alpha}<\/span>：<span class=\"m\">M_1M_2M_1=M_{-60^\\circ}<\/span>，傾斜角 <span class=\"m\">-60^\\circ<\/span>（即 <span class=\"m\">120^\\circ<\/span>）的直線為 <span class=\"m\">y=-\\sqrt3x<\/span>，正確。(E) <span class=\"m\">M_2M_1M_2=M_{120^\\circ}<\/span>，與 (D) 為同一直線的鏡射，正確。","steps":["先判斷 (A)：<span class=\"m\">M_{60^\\circ}M_{0^\\circ}=R_{2(60^\\circ-0^\\circ)}=R_{120^\\circ}<\/span>，正確。","先判斷 (B)：<span class=\"m\">M_1M_2=R_{-120^\\circ}<\/span>，錯誤。"],"hk":"hint"},{"id":"M9-27","unit":"M9","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}4 &amp; 1\\\\ 2 &amp; 3\\end{bmatrix}<\/span>。選出正確的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">A<\/span> 把 <span class=\"m\">(2,2)<\/span> 映到 <span class=\"m\">(10,10)<\/span>"},{"k":"B","h":"<span class=\"m\">A<\/span> 把直線 <span class=\"m\">y=x<\/span> 映成自身"},{"k":"C","h":"<span class=\"m\">A<\/span> 把直線 <span class=\"m\">y=-2x<\/span> 映成自身"},{"k":"D","h":"<span class=\"m\">A^2\\begin{bmatrix}1\\\\ -2\\end{bmatrix}=\\begin{bmatrix}4\\\\ -8\\end{bmatrix}<\/span>"},{"k":"E","h":"<span class=\"m\">A<\/span> 把面積為 1 的區域映成面積為 14 的區域"}],"type":"multi","ans":["A","B","C","D"],"key":"(A)(B)(C)(D)","sol":"(A) <span class=\"m\">(8+2,\\ 4+6)=(10,10)<\/span>，正確。(B) <span class=\"m\">A(t,t)=(5t,5t)<\/span>，正確。(C) <span class=\"m\">A(t,-2t)=(2t,-4t)=2(t,-2t)<\/span>，在 <span class=\"m\">y=-2x<\/span> 上且取遍整條直線，正確。(D) <span class=\"m\">A^2(1,-2)=2^2(1,-2)=(4,-8)<\/span>，正確。(E) <span class=\"m\">\\det A=12-2=10<\/span>，面積為 10，錯誤（14 為誤算 <span class=\"m\">ad+bc<\/span>）。","steps":["先判斷 (A)：<span class=\"m\">(8+2,\\ 4+6)=(10,10)<\/span>，正確。","先判斷 (B)：<span class=\"m\">A(t,t)=(5t,5t)<\/span>，正確。"],"hk":"hint"},{"id":"M9-28","unit":"M9","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"矩陣 <span class=\"m\">A<\/span> 代表對某一條過原點直線的鏡射，且 <span class=\"m\">A<\/span> 把 <span class=\"m\">(5,12)<\/span> 映到 <span class=\"m\">(13,0)<\/span>，則 <span class=\"m\">A<\/span> 把 <span class=\"m\">(0,13)<\/span> 映到 <span class=\"m\">(\\fbox{\\phantom{0}},\\fbox{\\phantom{0}})<\/span>。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：(12, −5) "#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"228\" y=\"38\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"206\" y=\"236\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"220,220 296,220 296,144 220,144\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"2\"/>\n<circle cx=\"296\" cy=\"220\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"300\" y=\"236\" font-size=\"14\" fill=\"#2f6fb5\">P<\/text>\n<circle cx=\"296\" cy=\"144\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"302\" y=\"140\" font-size=\"14\" fill=\"#2f6fb5\">Q<\/text>\n<circle cx=\"220\" cy=\"144\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"226\" y=\"138\" font-size=\"14\" fill=\"#2f6fb5\">S<\/text>\n<\/svg><figcaption>圖 M9-18　題組的正方形圖示 OPQS<\/figcaption><\/figure>","pre":"","stem":"（非選擇題）(1) 求「先 <span class=\"m\">T_1<\/span> 後 <span class=\"m\">T_2<\/span>」之反變換的矩陣，並說明此反變換可由哪兩個基本變換依序合成。(2) 求經「先 <span class=\"m\">T_1<\/span> 後 <span class=\"m\">T_2<\/span>」後像為 <span class=\"m\">(-1,3)<\/span> 的點。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) <span class=\"m\">(T_2T_1)^{-1}=T_1^{-1}T_2^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ 0 &amp; 1\\end{bmatrix}\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>；驗算 <span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}\\begin{bmatrix}1 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=I<\/span>。反變換為「先繞原點順時針旋轉 <span class=\"m\">90^\\circ<\/span>，再作沿 <span class=\"m\">x<\/span> 軸方向的推移 <span class=\"m\">(x,y)\\mapsto(x-y,\\ y)<\/span>」。(2) <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}\\begin{bmatrix}-1\\\\ 3\\end{bmatrix}=\\begin{bmatrix}2\\\\ 1\\end{bmatrix}<\/span>，所求點為 <span class=\"m\">(2,1)<\/span>；驗算 <span class=\"m\">T_1(2,1)=(3,1)<\/span>，<span class=\"m\">T_2(3,1)=(-1,3)<\/span>。","sol":"評分要點：反方陣正確（可用公式或 <span class=\"m\">T_1^{-1}T_2^{-1}<\/span>）；指出兩步驟的順序（先撤銷旋轉、再撤銷推移）；(2) 有計算過程或驗算。","steps":[]},{"id":"M9-32","unit":"M9","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"設直線 <span class=\"m\">L<\/span> 過原點、傾斜角為 <span class=\"m\">\\theta<\/span>。(1) 以極坐標與和角公式證明：對 <span class=\"m\">L<\/span> 鏡射的矩陣為 <span class=\"m\">\\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix}<\/span>。(2) 利用 (1) 求點 <span class=\"m\">(2,0)<\/span> 對直線 <span class=\"m\">y=\\sqrt3x<\/span> 的對稱點，並以「中點在 <span class=\"m\">L<\/span> 上、連線垂直 <span class=\"m\">L<\/span>」驗證。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) 設 <span class=\"m\">P(r\\cos\\varphi,r\\sin\\varphi)<\/span>。對稱點 <span class=\"m\">P'<\/span> 滿足 <span class=\"m\">\\overline{OP'}=r<\/span>，且 <span class=\"m\">L<\/span> 平分 <span class=\"m\">\\angle POP'<\/span>，故 <span class=\"m\">OP'<\/span> 的方向角為 <span class=\"m\">2\\theta-\\varphi<\/span>。<span class=\"m\">x'=r\\cos(2\\theta-\\varphi)=x\\cos2\\theta+y\\sin2\\theta<\/span>，<span class=\"m\">y'=r\\sin(2\\theta-\\varphi)=x\\sin2\\theta-y\\cos2\\theta<\/span>，即得所求矩陣。(2) <span class=\"m\">\\theta=60^\\circ<\/span>：<span class=\"m\">\\begin{bmatrix}-\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}2\\\\ 0\\end{bmatrix}=\\begin{bmatrix}-1\\\\ \\sqrt3\\end{bmatrix}<\/span>。驗算：中點 <span class=\"m\">\\left(\\frac12,\\frac{\\sqrt3}{2}\\right)<\/span> 滿足 <span class=\"m\">y=\\sqrt3x<\/span>；<span class=\"m\">(-1,\\sqrt3)-(2,0)=(-3,\\sqrt3)<\/span> 與方向 <span class=\"m\">(1,\\sqrt3)<\/span> 內積 <span class=\"m\">-3+3=0<\/span>。","sol":"評分要點：說明 <span class=\"m\">L<\/span> 為角平分線、長度不變；和角公式展開正確；(2) 計算與兩項驗算。","steps":[]},{"id":"M9-33","unit":"M9","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}3 &amp; -4\\\\ 4 &amp; 3\\end{bmatrix}<\/span>。(1) 將 <span class=\"m\">A<\/span> 寫成 <span class=\"m\">rR_\\theta<\/span> 的形式（<span class=\"m\">r&gt;0<\/span>，寫出 <span class=\"m\">\\cos\\theta<\/span>、<span class=\"m\">\\sin\\theta<\/span>），並說明其幾何意義。(2) 求圓 <span class=\"m\">x^2+y^2=1<\/span> 經 <span class=\"m\">A<\/span> 的像的方程式。(3) 求以 <span class=\"m\">O<\/span>、<span class=\"m\">(1,0)<\/span>、<span class=\"m\">(0,1)<\/span> 為頂點的三角形經 <span class=\"m\">A<\/span> 後的面積。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) <span class=\"m\">r=\\sqrt{9+16}=5<\/span>，<span class=\"m\">A=5\\begin{bmatrix}\\frac35 &amp; -\\frac45\\\\ \\frac45 &amp; \\frac35\\end{bmatrix}<\/span>，<span class=\"m\">\\cos\\theta=\\frac35<\/span>、<span class=\"m\">\\sin\\theta=\\frac45<\/span>；幾何意義：繞原點逆時針旋轉 <span class=\"m\">\\theta<\/span> 後再以原點為中心伸縮 5 倍。(2) 單位圓上的點旋轉後仍在單位圓上，再伸縮 5 倍，像為 <span class=\"m\">x^2+y^2=25<\/span>（亦可由 <span class=\"m\">A^{-1}=\\frac{1}{25}\\begin{bmatrix}3 &amp; 4\\\\ -4 &amp; 3\\end{bmatrix}<\/span> 代入得 <span class=\"m\">\\frac{x^2+y^2}{25}=1<\/span>）。(3) 原面積 <span class=\"m\">\\frac12<\/span>，<span class=\"m\">\\det A=25<\/span>，像面積 <span class=\"m\">\\frac{25}{2}<\/span>。","sol":"評分要點：<span class=\"m\">r<\/span> 與 <span class=\"m\">\\theta<\/span> 的三角函數值；幾何意義含旋轉與伸縮；(2) 代入方向正確；(3) 用行列式。","steps":[]},{"id":"M9-34","unit":"M9","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"(1) 設 <span class=\"m\">A,B<\/span> 為二階方陣，直接展開證明 <span class=\"m\">\\det(AB)=\\det A\\cdot\\det B<\/span>，並以面積比說明其幾何意義。(2) 若 <span class=\"m\">A<\/span> 把面積 3 的區域映成面積 12 的區域，<span class=\"m\">B<\/span> 把面積 2 的區域映成面積 1 的區域，求 <span class=\"m\">AB<\/span> 所代表的變換的面積比。(3) 由 (2) 能否推得 <span class=\"m\">AB=BA<\/span>？舉例說明理由。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) 設 <span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>、<span class=\"m\">B=\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}<\/span>，<span class=\"m\">\\det(AB)=(ap+br)(cq+ds)-(aq+bs)(cp+dr)<\/span>，展開後 <span class=\"m\">apcq<\/span>、<span class=\"m\">brds<\/span> 兩項相消，剩 <span class=\"m\">adps+bcqr-adqr-bcps=(ad-bc)(ps-qr)<\/span>。幾何意義：<span class=\"m\">AB<\/span> 為先 <span class=\"m\">B<\/span> 後 <span class=\"m\">A<\/span>，面積先乘 <span class=\"m\">|\\det B|<\/span> 再乘 <span class=\"m\">|\\det A|<\/span>，故面積比為兩者之積；正負號表示方向翻轉的次數。(2) <span class=\"m\">|\\det A|=4<\/span>、<span class=\"m\">|\\det B|=\\frac12<\/span>，<span class=\"m\">AB<\/span> 的面積比 <span class=\"m\">4\\times\\frac12=2<\/span>。(3) 不能。<span class=\"m\">\\det(AB)=\\det(BA)<\/span> 恆成立，但矩陣本身可不同。例：<span class=\"m\">S=\\begin{bmatrix}2 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>、<span class=\"m\">H=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">SH=\\begin{bmatrix}2 &amp; 2\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">HS=\\begin{bmatrix}2 &amp; 1\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，兩者行列式皆為 2（面積比相同），但 <span class=\"m\">SH\\ne HS<\/span>，<span class=\"m\">(0,1)<\/span> 的像分別為 <span class=\"m\">(2,1)<\/span> 與 <span class=\"m\">(1,1)<\/span>。","sol":"評分要點：展開正確；指出合成順序與面積比相乘；(2) 取絕對值；(3) 給出具體反例。","steps":[]},{"id":"M9-35","unit":"M9","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"（進階）設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。(1) 求所有實數 <span class=\"m\">\\lambda<\/span> 及對應的非零向量 <span class=\"m\">\\vec{v}<\/span>，使 <span class=\"m\">A\\vec{v}=\\lambda\\vec{v}<\/span>。(2) 說明 <span class=\"m\">A<\/span> 在直線 <span class=\"m\">y=x<\/span> 與 <span class=\"m\">y=-x<\/span> 方向上的作用。(3) 將 <span class=\"m\">(1,0)<\/span> 寫成 (1) 中向量的線性組合，求 <span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}<\/span>（<span class=\"m\">n<\/span> 為正整數）。","opts":[],"type":"open","ans":[],"key":"參考答案：(1) <span class=\"m\">\\det(A-\\lambda I)=(1-\\lambda)^2-4=0<\/span>，<span class=\"m\">\\lambda=3<\/span> 或 <span class=\"m\">-1<\/span>。<span class=\"m\">\\lambda=3<\/span>：<span class=\"m\">-2x+2y=0<\/span>，<span class=\"m\">\\vec{v}=t(1,1)<\/span>；<span class=\"m\">\\lambda=-1<\/span>：<span class=\"m\">2x+2y=0<\/span>，<span class=\"m\">\\vec{v}=t(1,-1)<\/span>（<span class=\"m\">t\\ne0<\/span>）。(2) 沿 <span class=\"m\">y=x<\/span> 方向伸長為 3 倍；沿 <span class=\"m\">y=-x<\/span> 方向長度不變、方向相反（相當於該分量對 <span class=\"m\">y=x<\/span> 鏡射）；兩直線都映成自身。(3) <span class=\"m\">(1,0)=\\frac12(1,1)+\\frac12(1,-1)<\/span>，<span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\frac{3^n}{2}\\begin{bmatrix}1\\\\ 1\\end{bmatrix}+\\frac{(-1)^n}{2}\\begin{bmatrix}1\\\\ -1\\end{bmatrix}=\\begin{bmatrix}\\frac{3^n+(-1)^n}{2}\\\\ \\frac{3^n-(-1)^n}{2}\\end{bmatrix}<\/span>。驗算 <span class=\"m\">n=1<\/span>：<span class=\"m\">(1,2)<\/span>，與 <span class=\"m\">A<\/span> 的第一行相符；<span class=\"m\">n=2<\/span>：<span class=\"m\">(5,4)<\/span>。","sol":"評分要點：特徵方程式與兩組解；幾何意義含「不變直線」與倍率；(3) 分解係數與 <span class=\"m\">(-1)^n<\/span> 的正負。","steps":[]},{"id":"M9-K01","unit":"M9","set":"歷屆學測精選","level":"","src":"精選 1　112 學測數A 第 11 題（T3-13）","ctx":"","pre":"<p>以下選自歷屆學科能力測驗數學考科中與本單元相關的試題，題目照原卷謄錄，詳解為本書撰寫。完整分類與題型分析見下冊「歷屆學測試題」（括號內為下冊題號）。<\/p>","stem":"坐標平面上，設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 分別表示以原點為中心，順時針、逆時針旋轉 <span class=\"m\">90^\\circ<\/span> 的旋轉矩陣。設 <span class=\"m\">C<\/span>、<span class=\"m\">D<\/span> 分別表示以直線 <span class=\"m\">x=y<\/span>、<span class=\"m\">x=-y<\/span> 為鏡射軸的鏡射矩陣。試選出正確的選項。","opts":[{"k":"1","h":"<span class=\"m\">A<\/span>、<span class=\"m\">C<\/span> 將點 <span class=\"m\">(1,0)<\/span> 映射到同一點"},{"k":"2","h":"<span class=\"m\">A=-B<\/span>"},{"k":"3","h":"<span class=\"m\">C=D^{-1}<\/span>"},{"k":"4","h":"<span class=\"m\">AB=CD<\/span>"},{"k":"5","h":"<span class=\"m\">AC=BD<\/span>"}],"type":"multi","ans":["2","5"],"key":"(2)(5)","sol":"\n<ol class=\"steps\"><li>寫出矩陣：<span class=\"m\">A=R_{-90^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=R_{90^\\circ}=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(y,x)<\/span>，<span class=\"m\">C=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=-x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(-y,-x)<\/span>，<span class=\"m\">D=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>。<\/li>\n<li>(1) <span class=\"m\">A<\/span> 把 <span class=\"m\">(1,0)<\/span> 轉到 <span class=\"m\">(0,-1)<\/span>，<span class=\"m\">C<\/span> 把 <span class=\"m\">(1,0)<\/span> 映到 <span class=\"m\">(0,1)<\/span>，不同點，錯誤。<\/li>\n<li>(2) <span class=\"m\">-B=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=A<\/span>，正確。（順時針 <span class=\"m\">90^\\circ<\/span> 等於逆時針 <span class=\"m\">90^\\circ<\/span> 再轉 <span class=\"m\">180^\\circ<\/span>，而 <span class=\"m\">R_{180^\\circ}=-I<\/span>。）<\/li>\n<li>(3) 鏡射兩次回原處，<span class=\"m\">D^2=I<\/span>，<span class=\"m\">D^{-1}=D\\ne C<\/span>，錯誤。<\/li>\n<li>(4) <span class=\"m\">AB=I<\/span>（一順一逆抵消）；<span class=\"m\">CD=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>（對兩條互相垂直的軸各鏡射一次＝旋轉 <span class=\"m\">180^\\circ<\/span>），<span class=\"m\">AB\\ne CD<\/span>，錯誤。<\/li>\n<li>(5) <span class=\"m\">AC=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">BD=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，兩者都是對 <span class=\"m\">x<\/span> 軸的鏡射，正確。<\/li><\/ol>\n<div class=\"formula\" data-t=\"過原點直線的鏡射矩陣\"><div class=\"mb\">\\text{對傾斜角 }\\theta\\text{ 的直線鏡射：}\\ \\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix}<\/div><p><span class=\"m\">\\theta=45^\\circ<\/span> 得 <span class=\"m\">C<\/span>，<span class=\"m\">\\theta=135^\\circ<\/span> 得 <span class=\"m\">D<\/span>。鏡射矩陣的行列式為 <span class=\"m\">-1<\/span>，自己的反方陣是自己；兩鏡射合成為旋轉，旋轉角為兩軸夾角的兩倍。<\/p><\/div>\n<p><strong>考點<\/strong>：旋轉與鏡射矩陣、合成變換與矩陣乘法、反方陣　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把「順時針 <span class=\"m\">90^\\circ<\/span>」直接代入 <span class=\"m\">R_{90^\\circ}<\/span>，把 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 對調；本題 (2)(4)(5) 的對錯不受影響，但 (1) 會誤判為正確。<\/p>","steps":["寫出矩陣：<span class=\"m\">A=R_{-90^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=R_{90^\\circ}=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(y,x)<\/span>，<span class=\"m\">C=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=-x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(-y,-x)<\/span>，<span class=\"m\">D=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>。","(1) <span class=\"m\">A<\/span> 把 <span class=\"m\">(1,0)<\/span> 轉到 <span class=\"m\">(0,-1)<\/span>，<span class=\"m\">C<\/span> 把 <span class=\"m\">(1,0)<\/span> 映到 <span class=\"m\">(0,1)<\/span>，不同點，錯誤。","(2) <span class=\"m\">-B=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=A<\/span>，正確。（順時針 <span class=\"m\">90^\\circ<\/span> 等於逆時針 <span class=\"m\">90^\\circ<\/span> 再轉 <span class=\"m\">180^\\circ<\/span>，而 <span class=\"m\">R_{180^\\circ}=-I<\/span>。）","(3) 鏡射兩次回原處，<span class=\"m\">D^2=I<\/span>，<span class=\"m\">D^{-1}=D\\ne C<\/span>，錯誤。","(4) <span class=\"m\">AB=I<\/span>（一順一逆抵消）；<span class=\"m\">CD=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>（對兩條互相垂直的軸各鏡射一次＝旋轉 <span class=\"m\">180^\\circ<\/span>），<span class=\"m\">AB\\ne CD<\/span>，錯誤。","(5) <span class=\"m\">AC=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">BD=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，兩者都是對 <span class=\"m\">x<\/span> 軸的鏡射，正確。"]},{"id":"M9-K02","unit":"M9","set":"歷屆學測精選","level":"","src":"精選 2　113 學測數A 第 12 題（T3-12）","ctx":"","pre":"","stem":"在坐標平面上給定三點 <span class=\"m\">A(1,0)<\/span>、<span class=\"m\">B(0,1)<\/span>、<span class=\"m\">C(-1,0)<\/span>，令 <span class=\"m\">\\Gamma<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經矩陣 <span class=\"m\">T=\\begin{bmatrix}3 &amp; 0\\\\ a &amp; 1\\end{bmatrix}<\/span> 變換後的圖形，其中 <span class=\"m\">a<\/span> 為實數。試選出正確的選項。","opts":[{"k":"1","h":"若 <span class=\"m\">a=0<\/span>，則 <span class=\"m\">\\Gamma<\/span> 為等腰直角三角形"},{"k":"2","h":"<span class=\"m\">\\triangle ABC<\/span> 的邊上至少有兩點經 <span class=\"m\">T<\/span> 變換後坐標不變"},{"k":"3","h":"<span class=\"m\">\\Gamma<\/span> 必有部分落在第四象限"},{"k":"4","h":"平面上找得到一個圖形 <span class=\"m\">\\Omega<\/span> 經 <span class=\"m\">T<\/span> 變換後為 <span class=\"m\">\\triangle ABC<\/span>"},{"k":"5","h":"<span class=\"m\">\\Gamma<\/span> 的面積為定值"}],"type":"multi","ans":["2","4","5"],"key":"(2)(4)(5)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">T\\begin{bmatrix}x\\\\ y\\end{bmatrix}=\\begin{bmatrix}3x\\\\ ax+y\\end{bmatrix}<\/span>。三頂點的像：<span class=\"m\">A'(3,a)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,-a)<\/span>。線性變換把線段映成線段，<span class=\"m\">\\Gamma<\/span> 是 <span class=\"m\">\\triangle A'B'C'<\/span>。<\/li>\n<li>(1) <span class=\"m\">a=0<\/span> 時 <span class=\"m\">A'(3,0)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,0)<\/span>：<span class=\"m\">\\overline{A'B'}=\\overline{B'C'}=\\sqrt{10}<\/span>、<span class=\"m\">\\overline{A'C'}=6<\/span>，等腰；但 <span class=\"m\">10+10\\ne36<\/span>（<span class=\"m\">\\angle B'<\/span> 為鈍角），不是直角三角形，錯誤。<\/li>\n<li>(2) 坐標不變 <span class=\"m\">\\Leftrightarrow 3x=x<\/span> 且 <span class=\"m\">ax+y=y\\Leftrightarrow x=0<\/span>：<span class=\"m\">y<\/span> 軸上每一點都不動。<span class=\"m\">\\triangle ABC<\/span> 的邊與 <span class=\"m\">y<\/span> 軸交於 <span class=\"m\">B(0,1)<\/span> 與 <span class=\"m\">\\overline{AC}<\/span> 的中點 <span class=\"m\">O(0,0)<\/span>，至少兩點，正確。<\/li>\n<li>(3) 取 <span class=\"m\">a=0<\/span>，<span class=\"m\">\\Gamma<\/span> 落在 <span class=\"m\">y\\ge0<\/span> 的範圍，沒有任何點在第四象限，錯誤。（<span class=\"m\">a&lt;0<\/span> 時 <span class=\"m\">A'<\/span> 才在第四象限。）<\/li>\n<li>(4) <span class=\"m\">\\det T=3\\ne0<\/span>，<span class=\"m\">T<\/span> 可逆。取 <span class=\"m\">\\Omega<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經 <span class=\"m\">T^{-1}=\\frac13\\begin{bmatrix}1 &amp; 0\\\\ -a &amp; 3\\end{bmatrix}<\/span> 變換後的三角形，則 <span class=\"m\">T(\\Omega)=\\triangle ABC<\/span>，正確。<\/li>\n<li>(5) 面積比為 <span class=\"m\">|\\det T|=3<\/span>，<span class=\"m\">\\triangle ABC<\/span> 面積 <span class=\"m\">\\frac12\\cdot2\\cdot1=1<\/span>，<span class=\"m\">\\Gamma<\/span> 面積恆為 3，與 <span class=\"m\">a<\/span> 無關，正確。<span class=\"hand\">推移不改面積<\/span><\/li><\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 260\" width=\"420\">\n<defs><marker id=\"M9-T3-ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"30\" y1=\"160\" x2=\"400\" y2=\"160\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-T3-ar2)\"/>\n<line x1=\"210\" y1=\"250\" x2=\"210\" y2=\"20\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-T3-ar2)\"/>\n<text x=\"392\" y=\"178\" font-size=\"15\" font-style=\"italic\">x<\/text><text x=\"217\" y=\"30\" font-size=\"15\" font-style=\"italic\">y<\/text>\n<polygon points=\"260,160 210,110 160,160\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/>\n<polygon points=\"360,160 210,110 60,160\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.8\"/>\n<polygon points=\"360,110 210,110 60,210\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<text x=\"258\" y=\"178\" font-size=\"14\" font-style=\"italic\">A<\/text><text x=\"214\" y=\"104\" font-size=\"14\" font-style=\"italic\">B<\/text><text x=\"150\" y=\"178\" font-size=\"14\" font-style=\"italic\">C<\/text>\n<text x=\"196\" y=\"176\" font-size=\"13\" font-style=\"italic\">O<\/text>\n<text x=\"352\" y=\"178\" font-size=\"13\" fill=\"#c2410c\">(3, 0)<\/text><text x=\"44\" y=\"178\" font-size=\"13\" fill=\"#c2410c\">(−3, 0)<\/text>\n<text x=\"352\" y=\"102\" font-size=\"13\" fill=\"#d9772b\">(3, 1)<\/text><text x=\"44\" y=\"226\" font-size=\"13\" fill=\"#d9772b\">(−3, −1)<\/text>\n<text x=\"300\" y=\"232\" font-size=\"13\" fill=\"#c2410c\">實線：<tspan font-style=\"italic\">a<\/tspan>＝0<\/text>\n<text x=\"300\" y=\"250\" font-size=\"13\" fill=\"#d9772b\">虛線：<tspan font-style=\"italic\">a<\/tspan>＝1<\/text>\n<\/svg><figcaption>圖 T3-2　<span class=\"m\">\\triangle ABC<\/span>（藍）經 <span class=\"m\">T<\/span> 變換後的 <span class=\"m\">\\Gamma<\/span>：<span class=\"m\">B<\/span> 與 <span class=\"m\">O<\/span> 不動，面積恆為 3<\/figcaption><\/figure>\n<p><strong>考點<\/strong>：線性變換下的頂點像、不動點、可逆性、面積比 <span class=\"m\">|\\det T|<\/span>　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>(2) 只檢查三個頂點，找到 <span class=\"m\">B<\/span> 一點就判錯。不動點集合是整條 <span class=\"m\">y<\/span> 軸，要看 <span class=\"m\">y<\/span> 軸與三角形「邊」的交點，<span class=\"m\">\\overline{AC}<\/span> 上的原點也算。<\/p>","steps":["<span class=\"m\">T\\begin{bmatrix}x\\\\ y\\end{bmatrix}=\\begin{bmatrix}3x\\\\ ax+y\\end{bmatrix}<\/span>。三頂點的像：<span class=\"m\">A'(3,a)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,-a)<\/span>。線性變換把線段映成線段，<span class=\"m\">\\Gamma<\/span> 是 <span class=\"m\">\\triangle A'B'C'<\/span>。","(1) <span class=\"m\">a=0<\/span> 時 <span class=\"m\">A'(3,0)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,0)<\/span>：<span class=\"m\">\\overline{A'B'}=\\overline{B'C'}=\\sqrt{10}<\/span>、<span class=\"m\">\\overline{A'C'}=6<\/span>，等腰；但 <span class=\"m\">10+10\\ne36<\/span>（<span class=\"m\">\\angle B'<\/span> 為鈍角），不是直角三角形，錯誤。","(2) 坐標不變 <span class=\"m\">\\Leftrightarrow 3x=x<\/span> 且 <span class=\"m\">ax+y=y\\Leftrightarrow x=0<\/span>：<span class=\"m\">y<\/span> 軸上每一點都不動。<span class=\"m\">\\triangle ABC<\/span> 的邊與 <span class=\"m\">y<\/span> 軸交於 <span class=\"m\">B(0,1)<\/span> 與 <span class=\"m\">\\overline{AC}<\/span> 的中點 <span class=\"m\">O(0,0)<\/span>，至少兩點，正確。","(3) 取 <span class=\"m\">a=0<\/span>，<span class=\"m\">\\Gamma<\/span> 落在 <span class=\"m\">y\\ge0<\/span> 的範圍，沒有任何點在第四象限，錯誤。（<span class=\"m\">a&lt;0<\/span> 時 <span class=\"m\">A'<\/span> 才在第四象限。）","(4) <span class=\"m\">\\det T=3\\ne0<\/span>，<span class=\"m\">T<\/span> 可逆。取 <span class=\"m\">\\Omega<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經 <span class=\"m\">T^{-1}=\\frac13\\begin{bmatrix}1 &amp; 0\\\\ -a &amp; 3\\end{bmatrix}<\/span> 變換後的三角形，則 <span class=\"m\">T(\\Omega)=\\triangle ABC<\/span>，正確。","(5) 面積比為 <span class=\"m\">|\\det T|=3<\/span>，<span class=\"m\">\\triangle ABC<\/span> 面積 <span class=\"m\">\\frac12\\cdot2\\cdot1=1<\/span>，<span class=\"m\">\\Gamma<\/span> 面積恆為 3，與 <span class=\"m\">a<\/span> 無關，正確。<span class=\"hand\">推移不改面積<\/span>"]},{"id":"M9-K03","unit":"M9","set":"歷屆學測精選","level":"","src":"精選 3　數A參考試卷 第 6 題（T3-17）","ctx":"","pre":"","stem":"考慮坐標平面上的直線 <span class=\"m\">L:3x-2y=1<\/span>。若 <span class=\"m\">a<\/span> 為實數且二階方陣 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}<\/span> 所代表的線性變換可以將 <span class=\"m\">L<\/span> 上的點變換到一條斜率為 2 的直線，則 <span class=\"m\">a<\/span> 的值為下列哪一個選項？","opts":[{"k":"1","h":"6"},{"k":"2","h":"8"},{"k":"3","h":"10"},{"k":"4","h":"12"},{"k":"5","h":"14"}],"type":"single","ans":["5"],"key":"(5)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">L<\/span> 的斜率 <span class=\"m\">\\frac32<\/span>，方向向量 <span class=\"m\">(2,3)<\/span>。<span class=\"m\">L<\/span> 上的點寫成 <span class=\"m\">P_0+t(2,3)<\/span>，像點為 <span class=\"m\">MP_0+t\\,M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>，所以像直線的方向向量是 <span class=\"m\">M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}\\begin{bmatrix}2\\\\ 3\\end{bmatrix}=\\begin{bmatrix}2\\\\ 2a-24\\end{bmatrix}<\/span>，斜率 <span class=\"m\">\\frac{2a-24}{2}=a-12<\/span>。<\/li>\n<li><span class=\"m\">a-12=2<\/span>，<span class=\"m\">a=14<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　取 <span class=\"m\">L<\/span> 上兩點 <span class=\"m\">(1,1)<\/span>、<span class=\"m\">(-1,-2)<\/span>，像點 <span class=\"m\">(1,a-8)<\/span>、<span class=\"m\">(-1,16-a)<\/span>，斜率 <span class=\"m\">\\frac{(a-8)-(16-a)}{2}=a-12=2<\/span>。<\/p>\n<p><strong>考點<\/strong>：線性變換把直線映成直線、方向向量的像　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>拿法向量 <span class=\"m\">(3,-2)<\/span> 去乘矩陣。法向量經變換後一般不再垂直於像直線；要變換的是方向向量。<\/p>","steps":["<span class=\"m\">L<\/span> 的斜率 <span class=\"m\">\\frac32<\/span>，方向向量 <span class=\"m\">(2,3)<\/span>。<span class=\"m\">L<\/span> 上的點寫成 <span class=\"m\">P_0+t(2,3)<\/span>，像點為 <span class=\"m\">MP_0+t\\,M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>，所以像直線的方向向量是 <span class=\"m\">M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>。","<span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}\\begin{bmatrix}2\\\\ 3\\end{bmatrix}=\\begin{bmatrix}2\\\\ 2a-24\\end{bmatrix}<\/span>，斜率 <span class=\"m\">\\frac{2a-24}{2}=a-12<\/span>。","<span class=\"m\">a-12=2<\/span>，<span class=\"m\">a=14<\/span>。"]}],"examples":[{"title":"例題 1　由坐標規則求矩陣、像與原像","q":"<p>線性變換 <span class=\"m\">T(x,y)=(2x-y,\\ x+3y)<\/span>。(1) 寫出 <span class=\"m\">T<\/span> 的矩陣 <span class=\"m\">A<\/span>；(2) 求點 <span class=\"m\">P(1,2)<\/span> 的像；(3) 求像為 <span class=\"m\">(3,5)<\/span> 的點。<\/p>","steps":["係數依列填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 1 &amp; 3\\end{bmatrix}<\/span>。","<span class=\"m\">A\\begin{bmatrix}1\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-2\\\\ 1+6\\end{bmatrix}=\\begin{bmatrix}0\\\\ 7\\end{bmatrix}<\/span>，像為 <span class=\"m\">(0,7)<\/span>。","解 <span class=\"m\">\\begin{cases}2x-y=3\\\\ x+3y=5\\end{cases}<\/span>：<span class=\"m\">\\det A=7\\ne0<\/span>，<span class=\"m\">A^{-1}=\\dfrac17\\begin{bmatrix}3 &amp; 1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^{-1}\\begin{bmatrix}3\\\\ 5\\end{bmatrix}=\\dfrac17\\begin{bmatrix}14\\\\ 7\\end{bmatrix}=\\begin{bmatrix}2\\\\ 1\\end{bmatrix}<\/span>，所求點為 <span class=\"m\">(2,1)<\/span>。"],"after":"<p>陷阱：<span class=\"m\">x'=2x-y<\/span> 的係數是矩陣的<strong>第一列<\/strong>；<em>把係數直著填入<\/em>會得到轉置矩陣 <span class=\"m\">A^{T}<\/span>。<\/p>","sol":"<ol class=\"steps\">\n<li>係數依列填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 1 &amp; 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">A\\begin{bmatrix}1\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-2\\\\ 1+6\\end{bmatrix}=\\begin{bmatrix}0\\\\ 7\\end{bmatrix}<\/span>，像為 <span class=\"m\">(0,7)<\/span>。<\/li>\n<li>解 <span class=\"m\">\\begin{cases}2x-y=3\\\\ x+3y=5\\end{cases}<\/span>：<span class=\"m\">\\det A=7\\ne0<\/span>，<span class=\"m\">A^{-1}=\\dfrac17\\begin{bmatrix}3 &amp; 1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^{-1}\\begin{bmatrix}3\\\\ 5\\end{bmatrix}=\\dfrac17\\begin{bmatrix}14\\\\ 7\\end{bmatrix}=\\begin{bmatrix}2\\\\ 1\\end{bmatrix}<\/span>，所求點為 <span class=\"m\">(2,1)<\/span>。<\/li>\n<\/ol><p>陷阱：<span class=\"m\">x'=2x-y<\/span> 的係數是矩陣的<strong>第一列<\/strong>；<em>把係數直著填入<\/em>會得到轉置矩陣 <span class=\"m\">A^{T}<\/span>。<\/p>"},{"title":"例題 2　由兩點的像求矩陣","q":"<p>線性變換 <span class=\"m\">T<\/span> 把 <span class=\"m\">(1,1)<\/span> 映到 <span class=\"m\">(3,1)<\/span>、把 <span class=\"m\">(1,-1)<\/span> 映到 <span class=\"m\">(1,5)<\/span>。求 <span class=\"m\">T<\/span> 的矩陣與 <span class=\"m\">T(4,2)<\/span>。<\/p>","steps":["<span class=\"m\">(1,0)=\\frac12[(1,1)+(1,-1)]<\/span>，故 <span class=\"m\">T(1,0)=\\frac12[(3,1)+(1,5)]=(2,3)<\/span>。","<span class=\"m\">(0,1)=\\frac12[(1,1)-(1,-1)]<\/span>，故 <span class=\"m\">T(0,1)=\\frac12[(3,1)-(1,5)]=(1,-2)<\/span>。","兩行依序填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>；<span class=\"m\">T(4,2)=(8+2,\\ 12-4)=(10,8)<\/span>。"],"after":"<p>另解：<span class=\"m\">A\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; -1\\end{bmatrix}=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}\\cdot\\dfrac{1}{-2}\\begin{bmatrix}-1 &amp; -1\\\\ -1 &amp; 1\\end{bmatrix}=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>。求 <span class=\"m\">T(4,2)<\/span> 也可不求矩陣：<span class=\"m\">(4,2)=3(1,1)+(1,-1)<\/span>，<span class=\"m\">T(4,2)=3(3,1)+(1,5)=(10,8)<\/span>。<\/p>\n<p>陷阱：<span class=\"m\">A=CB^{-1}<\/span>，<em>寫成 <span class=\"m\">B^{-1}C<\/span><\/em> 會得到錯誤矩陣。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">(1,0)=\\frac12[(1,1)+(1,-1)]<\/span>，故 <span class=\"m\">T(1,0)=\\frac12[(3,1)+(1,5)]=(2,3)<\/span>。<\/li>\n<li><span class=\"m\">(0,1)=\\frac12[(1,1)-(1,-1)]<\/span>，故 <span class=\"m\">T(0,1)=\\frac12[(3,1)-(1,5)]=(1,-2)<\/span>。<\/li>\n<li>兩行依序填入：<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>；<span class=\"m\">T(4,2)=(8+2,\\ 12-4)=(10,8)<\/span>。<\/li>\n<\/ol>\n<p>另解：<span class=\"m\">A\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; -1\\end{bmatrix}=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 1 &amp; 5\\end{bmatrix}\\cdot\\dfrac{1}{-2}\\begin{bmatrix}-1 &amp; -1\\\\ -1 &amp; 1\\end{bmatrix}=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; -2\\end{bmatrix}<\/span>。求 <span class=\"m\">T(4,2)<\/span> 也可不求矩陣：<span class=\"m\">(4,2)=3(1,1)+(1,-1)<\/span>，<span class=\"m\">T(4,2)=3(3,1)+(1,5)=(10,8)<\/span>。<\/p>\n<p>陷阱：<span class=\"m\">A=CB^{-1}<\/span>，<em>寫成 <span class=\"m\">B^{-1}C<\/span><\/em> 會得到錯誤矩陣。<\/p>"},{"title":"例題 3　伸縮與圓的像","q":"<p>圓 <span class=\"m\">C:\\ x^2+y^2=4<\/span> 經矩陣 <span class=\"m\">\\begin{bmatrix}3 &amp; 0\\\\ 0 &amp; \\frac12\\end{bmatrix}<\/span> 變換，求像的方程式與所圍面積。<\/p>","steps":["設像上一點 <span class=\"m\">(x',y')<\/span>，原像 <span class=\"m\">x=\\dfrac{x'}{3},\\ y=2y'<\/span>。","代入：<span class=\"m\">\\dfrac{x'^2}{9}+4y'^2=4<\/span>，即 <span class=\"m\">\\dfrac{x^2}{36}+y^2=1<\/span>（圖 M9-2）。","面積比 <span class=\"m\">|\\det|=3\\cdot\\frac12=\\frac32<\/span>，像的面積 <span class=\"m\">4\\pi\\cdot\\frac32=6\\pi<\/span>；與 <span class=\"m\">\\pi ab=\\pi\\cdot6\\cdot1<\/span> 一致。"],"after":"<p>陷阱：<em>把 <span class=\"m\">x'=3x,\\ y'=\\frac12y<\/span> 直接代入<\/em> <span class=\"m\">x^2+y^2=4<\/span> 得 <span class=\"m\">9x^2+\\frac14y^2=4<\/span>，那是原像的方程式。<\/p>","sol":"<ol class=\"steps\">\n<li>設像上一點 <span class=\"m\">(x',y')<\/span>，原像 <span class=\"m\">x=\\dfrac{x'}{3},\\ y=2y'<\/span>。<\/li>\n<li>代入：<span class=\"m\">\\dfrac{x'^2}{9}+4y'^2=4<\/span>，即 <span class=\"m\">\\dfrac{x^2}{36}+y^2=1<\/span>（圖 M9-2）。<\/li>\n<li>面積比 <span class=\"m\">|\\det|=3\\cdot\\frac12=\\frac32<\/span>，像的面積 <span class=\"m\">4\\pi\\cdot\\frac32=6\\pi<\/span>；與 <span class=\"m\">\\pi ab=\\pi\\cdot6\\cdot1<\/span> 一致。<\/li>\n<\/ol><p>陷阱：<em>把 <span class=\"m\">x'=3x,\\ y'=\\frac12y<\/span> 直接代入<\/em> <span class=\"m\">x^2+y^2=4<\/span> 得 <span class=\"m\">9x^2+\\frac14y^2=4<\/span>，那是原像的方程式。<\/p>"},{"title":"例題 4　對 y = 2x 鏡射","q":"<p>求對直線 <span class=\"m\">L:\\ y=2x<\/span> 鏡射的矩陣，並求 <span class=\"m\">P(5,0)<\/span> 的對稱點。<\/p>","steps":["<span class=\"m\">m=2<\/span>：<span class=\"m\">M=\\dfrac{1}{5}\\begin{bmatrix}1-4 &amp; 4\\\\ 4 &amp; 4-1\\end{bmatrix}=\\dfrac15\\begin{bmatrix}-3 &amp; 4\\\\ 4 &amp; 3\\end{bmatrix}<\/span>。","<span class=\"m\">M\\begin{bmatrix}5\\\\ 0\\end{bmatrix}=\\begin{bmatrix}-3\\\\ 4\\end{bmatrix}<\/span>，對稱點 <span class=\"m\">(-3,4)<\/span>。","驗算：中點 <span class=\"m\">(1,2)<\/span> 在 <span class=\"m\">L<\/span> 上；<span class=\"m\">(-3,4)-(5,0)=(-8,4)<\/span> 與方向 <span class=\"m\">(1,2)<\/span> 內積 <span class=\"m\">0<\/span>。"],"after":"<p>另解（投影）：<span class=\"m\">P<\/span> 在 <span class=\"m\">L<\/span> 上的投影 <span class=\"m\">Q=\\dfrac{(5,0)\\cdot(1,2)}{5}(1,2)=(1,2)<\/span>，對稱點 <span class=\"m\">2Q-P=(-3,4)<\/span>。<\/p>\n<p>另解（倍角）：<span class=\"m\">\\tan\\theta=2<\/span>，<span class=\"m\">\\cos2\\theta=\\dfrac{1-4}{1+4}=-\\dfrac35<\/span>，<span class=\"m\">\\sin2\\theta=\\dfrac{4}{5}<\/span>，代入 <span class=\"m\">M_\\theta<\/span> 相同。<\/p>\n<p>陷阱：公式中 <span class=\"m\">m<\/span> 是斜率；直線寫成 <span class=\"m\">2x-y=0<\/span> 時<em>誤取 <span class=\"m\">m=-2<\/span><\/em> 會得到對 <span class=\"m\">y=-2x<\/span> 的鏡射。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">m=2<\/span>：<span class=\"m\">M=\\dfrac{1}{5}\\begin{bmatrix}1-4 &amp; 4\\\\ 4 &amp; 4-1\\end{bmatrix}=\\dfrac15\\begin{bmatrix}-3 &amp; 4\\\\ 4 &amp; 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">M\\begin{bmatrix}5\\\\ 0\\end{bmatrix}=\\begin{bmatrix}-3\\\\ 4\\end{bmatrix}<\/span>，對稱點 <span class=\"m\">(-3,4)<\/span>。<\/li>\n<li>驗算：中點 <span class=\"m\">(1,2)<\/span> 在 <span class=\"m\">L<\/span> 上；<span class=\"m\">(-3,4)-(5,0)=(-8,4)<\/span> 與方向 <span class=\"m\">(1,2)<\/span> 內積 <span class=\"m\">0<\/span>。<\/li>\n<\/ol>\n<p>另解（投影）：<span class=\"m\">P<\/span> 在 <span class=\"m\">L<\/span> 上的投影 <span class=\"m\">Q=\\dfrac{(5,0)\\cdot(1,2)}{5}(1,2)=(1,2)<\/span>，對稱點 <span class=\"m\">2Q-P=(-3,4)<\/span>。<\/p>\n<p>另解（倍角）：<span class=\"m\">\\tan\\theta=2<\/span>，<span class=\"m\">\\cos2\\theta=\\dfrac{1-4}{1+4}=-\\dfrac35<\/span>，<span class=\"m\">\\sin2\\theta=\\dfrac{4}{5}<\/span>，代入 <span class=\"m\">M_\\theta<\/span> 相同。<\/p>\n<p>陷阱：公式中 <span class=\"m\">m<\/span> 是斜率；直線寫成 <span class=\"m\">2x-y=0<\/span> 時<em>誤取 <span class=\"m\">m=-2<\/span><\/em> 會得到對 <span class=\"m\">y=-2x<\/span> 的鏡射。<\/p>"},{"title":"例題 5　以旋轉求正三角形頂點","q":"<p><span class=\"m\">O<\/span> 為原點，<span class=\"m\">A(4,2)<\/span>。求所有點 <span class=\"m\">B<\/span> 使 <span class=\"m\">\\triangle OAB<\/span> 為正三角形。<\/p>","steps":["<span class=\"m\">B<\/span> 是 <span class=\"m\">A<\/span> 繞 <span class=\"m\">O<\/span> 旋轉 <span class=\"m\">\\pm60^\\circ<\/span> 的像。","<span class=\"m\">R_{60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-\\sqrt3\\\\ 2\\sqrt3+1\\end{bmatrix}<\/span>。","<span class=\"m\">R_{-60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2+\\sqrt3\\\\ 1-2\\sqrt3\\end{bmatrix}<\/span>。","<span class=\"m\">B_1(2-\\sqrt3,\\ 1+2\\sqrt3)<\/span> 或 <span class=\"m\">B_2(2+\\sqrt3,\\ 1-2\\sqrt3)<\/span>（圖 M9-14）。"],"after":"<figure class=\"fig\"><svg viewBox=\"0 0 400 300\" width=\"400\"><defs><marker id=\"M9-f13-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f13-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<line x1=\"86\" y1=\"286\" x2=\"86\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"118\" y1=\"286\" x2=\"118\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"150\" y1=\"286\" x2=\"150\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"182\" y1=\"286\" x2=\"182\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"214\" y1=\"286\" x2=\"214\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"246\" y1=\"286\" x2=\"246\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"278\" y1=\"286\" x2=\"278\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"310\" y1=\"286\" x2=\"310\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"342\" y1=\"286\" x2=\"342\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"374\" y1=\"286\" x2=\"374\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"286\" x2=\"374\" y2=\"286\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"254\" x2=\"374\" y2=\"254\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"222\" x2=\"374\" y2=\"222\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"190\" x2=\"374\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"158\" x2=\"374\" y2=\"158\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"126\" x2=\"374\" y2=\"126\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"94\" x2=\"374\" y2=\"94\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"62\" x2=\"374\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"86\" y1=\"190\" x2=\"380.4\" y2=\"190\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f13-m0)\"/>\n<line x1=\"150\" y1=\"298.8\" x2=\"150\" y2=\"20.4\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f13-m0)\"/>\n<text x=\"376.4\" y=\"208\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"158\" y=\"28.4\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"136\" y=\"206\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"150,190 278,126 158.6,47.1\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<polygon points=\"150,190 278,126 269.4,268.9\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<circle cx=\"278\" cy=\"126\" r=\"3.2\" fill=\"#1f2a44\"/>\n<text x=\"286\" y=\"126\" font-size=\"14\" fill=\"#1f2a44\">A(4,2)<\/text>\n<circle cx=\"158.6\" cy=\"47.1\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"134.6\" y=\"43.1\" font-size=\"14\" fill=\"#2f6fb5\">B₁<\/text>\n<circle cx=\"269.4\" cy=\"268.9\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"277.4\" y=\"280.9\" font-size=\"14\" fill=\"#d9772b\">B₂<\/text>\n<path d=\"M181.5,174.3 A35.2,35.2 0 0 0 152.1,154.9\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\" marker-end=\"url(#M9-f13-m1)\"/>\n<text x=\"126.4\" y=\"148.4\" font-size=\"12\" fill=\"#2f6fb5\">60°<\/text>\n<path d=\"M187.4,214.7 A44.8,44.8 0 0 0 190.1,170\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<text x=\"202\" y=\"206\" font-size=\"12\" fill=\"#d9772b\">−60°<\/text>\n<\/svg><figcaption>圖 M9-14　A 繞原點旋轉 ±60° 得到兩個正三角形的第三頂點<\/figcaption><\/figure>\n<p>另解（複數）：<span class=\"m\">(4+2i)\\left(\\frac12\\pm\\frac{\\sqrt3}{2}i\\right)<\/span>，展開得相同結果。<\/p>\n<p>陷阱：題目未指定方向時有兩解，<em>只寫逆時針一解<\/em>會漏答。<\/p>","sol":"<ol class=\"steps\">\n<li><span class=\"m\">B<\/span> 是 <span class=\"m\">A<\/span> 繞 <span class=\"m\">O<\/span> 旋轉 <span class=\"m\">\\pm60^\\circ<\/span> 的像。<\/li>\n<li><span class=\"m\">R_{60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2-\\sqrt3\\\\ 2\\sqrt3+1\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">R_{-60^\\circ}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}\\frac12 &amp; \\frac{\\sqrt3}{2}\\\\ -\\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}\\begin{bmatrix}4\\\\ 2\\end{bmatrix}=\\begin{bmatrix}2+\\sqrt3\\\\ 1-2\\sqrt3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">B_1(2-\\sqrt3,\\ 1+2\\sqrt3)<\/span> 或 <span class=\"m\">B_2(2+\\sqrt3,\\ 1-2\\sqrt3)<\/span>（圖 M9-14）。<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 300\" width=\"400\"><defs><marker id=\"M9-f13-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f13-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<line x1=\"86\" y1=\"286\" x2=\"86\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"118\" y1=\"286\" x2=\"118\" y2=\"62\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"150\" y1=\"286\" x2=\"150\" y2=\"62\" stroke=\"#e
