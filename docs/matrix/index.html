width=\"7\"/>\n<line x1=\"420\" y1=\"150\" x2=\"580\" y2=\"50\" stroke=\"#d9772b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<g font-size=\"14\" text-anchor=\"middle\" fill=\"#1f2a44\">\n<text x=\"100\" y=\"182\">Δ ≠ 0：恰一解<\/text>\n<text x=\"300\" y=\"182\">Δ＝0，兩線平行：無解<\/text>\n<text x=\"500\" y=\"182\">Δ＝0，兩線重合：無限多解<\/text>\n<\/g>\n<\/svg><figcaption>圖 M8-10　二元一次聯立方程式的係數行列式與兩直線的關係<\/figcaption><\/figure>\n<p>判別：<span class=\"m\">\\Delta=0<\/span> 且 <span class=\"m\">\\Delta_x,\\Delta_y<\/span> 不全為 0 時無解；<span class=\"m\">\\Delta=\\Delta_x=\\Delta_y=0<\/span> 且係數不全為 0 時無限多解。<\/p>\n<p>示例（<span class=\"m\">\\Delta=0<\/span> 的兩種結果）：<\/p>\n<ul>\n<li><span class=\"m\">\\begin{cases}x+2y=3\\\\ 2x+4y=5\\end{cases}<\/span>：<span class=\"m\">\\Delta=4-4=0<\/span>，<span class=\"m\">\\Delta_x=\\begin{vmatrix}3 &amp; 2\\\\ 5 &amp; 4\\end{vmatrix}=2\\ne 0<\/span>，無解（兩平行線）。<\/li>\n<li><span class=\"m\">\\begin{cases}x+2y=3\\\\ 2x+4y=6\\end{cases}<\/span>：<span class=\"m\">\\Delta=\\Delta_x=\\Delta_y=0<\/span>，第二式為第一式的 2 倍，解為 <span class=\"m\">x=3-2t<\/span>，<span class=\"m\">y=t<\/span>（<span class=\"m\">t\\in\\mathbb{R}<\/span>），無限多解（兩直線重合）。<\/li>\n<\/ul>\n<p>示例（含參數的討論）：<span class=\"m\">\\begin{cases}kx+2y=4\\\\ 2x+ky=4\\end{cases}<\/span>。<span class=\"m\">\\Delta=k^2-4=(k-2)(k+2)<\/span>，<span class=\"m\">\\Delta_x=\\begin{vmatrix}4 &amp; 2\\\\ 4 &amp; k\\end{vmatrix}=4(k-2)<\/span>，<span class=\"m\">\\Delta_y=\\begin{vmatrix}k &amp; 4\\\\ 2 &amp; 4\\end{vmatrix}=4(k-2)<\/span>。<\/p>\n<table class=\"t\"><thead><tr><th><span class=\"m\">k<\/span> 的範圍<\/th><th>係數矩陣<\/th><th>解的情形<\/th><\/tr><\/thead><tbody>\n<tr><td><span class=\"m\">k\\ne\\pm 2<\/span><\/td><td>可逆<\/td><td>恰一解 <span class=\"m\">x=y=\\dfrac{4}{k+2}<\/span><\/td><\/tr>\n<tr><td><span class=\"m\">k=2<\/span><\/td><td>不可逆<\/td><td><span class=\"m\">\\Delta=\\Delta_x=\\Delta_y=0<\/span>，兩式皆為 <span class=\"m\">x+y=2<\/span>，無限多解<\/td><\/tr>\n<tr><td><span class=\"m\">k=-2<\/span><\/td><td>不可逆<\/td><td><span class=\"m\">\\Delta=0<\/span>、<span class=\"m\">\\Delta_x=-16\\ne 0<\/span>，無解<\/td><\/tr>\n<\/tbody><\/table>\n<p>注意：<span class=\"m\">k\\ne\\pm 2<\/span> 時，<span class=\"m\">x=\\dfrac{4(k-2)}{(k-2)(k+2)}<\/span> 須先確認 <span class=\"m\">k\\ne 2<\/span> 才能約分；<em>約分後代入 <span class=\"m\">k=2<\/span> 得 <span class=\"m\">x=1<\/span> 並不表示 <span class=\"m\">k=2<\/span> 時恰一解<\/em>。<\/p>\n<p><strong>同一係數矩陣、多組常數<\/strong>　若要解 <span class=\"m\">AX=B_1<\/span>、<span class=\"m\">AX=B_2<\/span>、…，只需算一次 <span class=\"m\">A^{-1}<\/span>，再分別左乘；也可把常數並排成 <span class=\"m\">AX=\\begin{bmatrix}B_1 &amp; B_2\\end{bmatrix}<\/span>，一次得 <span class=\"m\">X=A^{-1}\\begin{bmatrix}B_1 &amp; B_2\\end{bmatrix}<\/span>。這是反方陣法相對於逐題消去的優點，也是電腦解大型方程組的基本做法。<\/p>\n<p><strong>應用：編碼與解碼<\/strong>　把訊息轉為數字後兩兩分組寫成行矩陣 <span class=\"m\">X<\/span>，以可逆方陣 <span class=\"m\">A<\/span> 左乘得密文 <span class=\"m\">Y=AX<\/span>；收方以 <span class=\"m\">A^{-1}<\/span> 左乘還原 <span class=\"m\">X=A^{-1}Y<\/span>。選 <span class=\"m\">\\det A=\\pm 1<\/span> 且元素為整數，則 <span class=\"m\">A^{-1}<\/span> 的元素也是整數，解碼不產生分數。此法源自希爾（Lester S. Hill）1929 年提出的希爾密碼（原法另取除以 26 的餘數，屬進階）。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 540 170\" width=\"540\">\n<defs><marker id=\"M8-ar6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><marker id=\"M8-ar7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><\/defs>\n<rect x=\"20\" y=\"50\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#e2e8f0\" stroke=\"#1f2a44\" stroke-width=\"1.4\"/>\n<rect x=\"205\" y=\"50\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<rect x=\"390\" y=\"50\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#e2e8f0\" stroke=\"#1f2a44\" stroke-width=\"1.4\"/>\n<g font-size=\"15\" text-anchor=\"middle\" fill=\"#1f2a44\">\n<text x=\"85\" y=\"80\">明文 X<\/text><text x=\"270\" y=\"80\">密文 Y＝AX<\/text><text x=\"455\" y=\"80\">A⁻¹Y＝X<\/text>\n<\/g>\n<line x1=\"152\" y1=\"75\" x2=\"200\" y2=\"75\" stroke=\"#2f6fb5\" stroke-width=\"2\" marker-end=\"url(#M8-ar6)\"/>\n<line x1=\"337\" y1=\"75\" x2=\"385\" y2=\"75\" stroke=\"#2e8b57\" stroke-width=\"2\" marker-end=\"url(#M8-ar7)\"/>\n<text x=\"176\" y=\"40\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2f6fb5\">左乘 A<\/text>\n<text x=\"361\" y=\"40\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e8b57\">左乘 A⁻¹<\/text>\n<text x=\"270\" y=\"140\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1f2a44\">A⁻¹(AX)＝(A⁻¹A)X＝IX＝X<\/text>\n<\/svg><figcaption>圖 M8-11　以可逆方陣編碼、以反方陣解碼的流程（例題 14）<\/figcaption><\/figure>\n<div class=\"exam\"><p>情境題（配方、禮盒、密碼）常把「已知結果求原量」包裝成 <span class=\"m\">AX=B<\/span>。先確認矩陣的列、行各代表什麼，再寫出 <span class=\"m\">X=A^{-1}B<\/span>；<em>左乘、右乘不可對調<\/em>。<\/p><\/div>","qs":["M8-09","M8-22","M8-34"]},{"t":"七、（進階）轉置、三階反方陣與電腦運算","h":"<p><strong>轉置<\/strong>　把 <span class=\"m\">m\\times n<\/span> 矩陣 <span class=\"m\">A<\/span> 的列與行對調，得到 <span class=\"m\">n\\times m<\/span> 矩陣，稱為 <span class=\"m\">A<\/span> 的轉置，記作 <span class=\"m\">A^{T}<\/span>：<span class=\"m\">(A^{T})_{ij}=a_{ji}<\/span>。例如 <span class=\"m\">\\begin{bmatrix}1 &amp; 2 &amp; 3\\\\ 4 &amp; 5 &amp; 6\\end{bmatrix}^{T}=\\begin{bmatrix}1 &amp; 4\\\\ 2 &amp; 5\\\\ 3 &amp; 6\\end{bmatrix}<\/span>。<\/p>\n<div class=\"formula\" data-t=\"轉置的性質\"><div class=\"mb\">(A^{T})^{T}=A,\\quad (A+B)^{T}=A^{T}+B^{T},\\quad (rA)^{T}=rA^{T},\\quad (AB)^{T}=B^{T}A^{T},\\quad (A^{-1})^{T}=(A^{T})^{-1}<\/div><p>方陣另有 <span class=\"m\">\\det(A^{T})=\\det A<\/span>。滿足 <span class=\"m\">A^{T}=A<\/span> 的方陣稱為<strong>對稱方陣<\/strong>。<\/p><\/div>\n<p><span class=\"m\">(AB)^{T}=B^{T}A^{T}<\/span> 的驗證：兩邊的 <span class=\"m\">(i,j)<\/span> 元都等於 <span class=\"m\">\\sum_k a_{jk}b_{ki}<\/span>。與反方陣一樣<span class=\"ul\">順序相反<\/span>。資料表轉置後列、行標籤互換，原本的「分店 × 商品」變成「商品 × 分店」。<\/p>\n<p><strong>三階反方陣<\/strong>（課綱：可概念探討，確切計算限二階）<\/p>\n<ul>\n<li>定義與二階相同：<span class=\"m\">AB=BA=I_3<\/span>。<\/li>\n<li>存在條件：<span class=\"m\">A<\/span> 可逆 <span class=\"m\">\\iff\\det A\\ne 0<\/span>（三階行列式見 M4）。幾何意義：三個行向量不共面，張成的平行六面體體積不為 0。<\/li>\n<li>公式（進階）：<span class=\"m\">A^{-1}=\\dfrac{1}{\\det A}\\operatorname{adj}A<\/span>，其中 <span class=\"m\">\\operatorname{adj}A<\/span> 的 <span class=\"m\">(i,j)<\/span> 元是 <span class=\"m\">a_{ji}<\/span> 的餘因子（M4）。二階公式中的 <span class=\"m\">\\begin{bmatrix}d &amp; -b\\\\ -c &amp; a\\end{bmatrix}<\/span> 就是二階的 <span class=\"m\">\\operatorname{adj}A<\/span>。<\/li>\n<li>計算方法：對增廣矩陣 <span class=\"m\">[A\\,|\\,I]<\/span> 作列運算（高斯–喬丹消去法，M7），左半化成 <span class=\"m\">I<\/span> 時右半即為 <span class=\"m\">A^{-1}<\/span>；若左半出現全為 0 的列，則 <span class=\"m\">A<\/span> 不可逆。<\/li>\n<\/ul>\n<p>示例（進階，學測不考計算）：<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2 &amp; 3\\\\ 0 &amp; 1 &amp; 4\\\\ 5 &amp; 6 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=1<\/span>。<\/p>\n<div class=\"mb\">\\left[\\begin{array}{ccc|ccc}1 &amp; 2 &amp; 3 &amp; 1 &amp; 0 &amp; 0\\\\ 0 &amp; 1 &amp; 4 &amp; 0 &amp; 1 &amp; 0\\\\ 5 &amp; 6 &amp; 0 &amp; 0 &amp; 0 &amp; 1\\end{array}\\right]\\xrightarrow{R_3-5R_1}\\left[\\begin{array}{ccc|ccc}1 &amp; 2 &amp; 3 &amp; 1 &amp; 0 &amp; 0\\\\ 0 &amp; 1 &amp; 4 &amp; 0 &amp; 1 &amp; 0\\\\ 0 &amp; -4 &amp; -15 &amp; -5 &amp; 0 &amp; 1\\end{array}\\right]<\/div>\n<div class=\"mb\">\\xrightarrow[R_3+4R_2]{R_1-2R_2}\\left[\\begin{array}{ccc|ccc}1 &amp; 0 &amp; -5 &amp; 1 &amp; -2 &amp; 0\\\\ 0 &amp; 1 &amp; 4 &amp; 0 &amp; 1 &amp; 0\\\\ 0 &amp; 0 &amp; 1 &amp; -5 &amp; 4 &amp; 1\\end{array}\\right]\\xrightarrow[R_2-4R_3]{R_1+5R_3}\\left[\\begin{array}{ccc|ccc}1 &amp; 0 &amp; 0 &amp; -24 &amp; 18 &amp; 5\\\\ 0 &amp; 1 &amp; 0 &amp; 20 &amp; -15 &amp; -4\\\\ 0 &amp; 0 &amp; 1 &amp; -5 &amp; 4 &amp; 1\\end{array}\\right]<\/div>\n<p>故 <span class=\"m\">A^{-1}=\\begin{bmatrix}-24 &amp; 18 &amp; 5\\\\ 20 &amp; -15 &amp; -4\\\\ -5 &amp; 4 &amp; 1\\end{bmatrix}<\/span>，可驗算 <span class=\"m\">AA^{-1}=I_3<\/span>。三元一次聯立 <span class=\"m\">AX=B<\/span> 於是有 <span class=\"m\">X=A^{-1}B<\/span>（M7）。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 540 140\" width=\"540\">\n<defs><marker id=\"M8-ar8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<rect x=\"40\" y=\"35\" width=\"80\" height=\"70\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/>\n<rect x=\"140\" y=\"35\" width=\"80\" height=\"70\" fill=\"#e2e8f0\" stroke=\"#94a3b8\" stroke-width=\"1.6\"/>\n<line x1=\"130\" y1=\"28\" x2=\"130\" y2=\"112\" stroke=\"#1f2a44\" stroke-width=\"1.6\"/>\n<path d=\"M36,28 L28,28 L28,112 L36,112\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.8\"/><path d=\"M224,28 L232,28 L232,112 L224,112\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.8\"/>\n<line x1=\"245\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"#1f2a44\" stroke-width=\"1.8\" marker-end=\"url(#M8-ar8)\"/>\n<text x=\"272\" y=\"60\" font-size=\"13\" text-anchor=\"middle\">列運算<\/text>\n<rect x=\"320\" y=\"35\" width=\"80\" height=\"70\" fill=\"#e2e8f0\" stroke=\"#94a3b8\" stroke-width=\"1.6\"/>\n<rect x=\"420\" y=\"35\" width=\"80\" height=\"70\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.6\"/>\n<line x1=\"410\" y1=\"28\" x2=\"410\" y2=\"112\" stroke=\"#1f2a44\" stroke-width=\"1.6\"/>\n<path d=\"M316,28 L308,28 L308,112 L316,112\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.8\"/><path d=\"M504,28 L512,28 L512,112 L504,112\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.8\"/>\n<g font-size=\"18\" text-anchor=\"middle\" font-style=\"italic\" fill=\"#1f2a44\">\n<text x=\"80\" y=\"76\">A<\/text><text x=\"180\" y=\"76\">I<\/text><text x=\"360\" y=\"76\">I<\/text><text x=\"460\" y=\"76\">A⁻¹<\/text>\n<\/g>\n<text x=\"270\" y=\"132\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c2410c\">左半化不成 I（出現零列）⇔ det A＝0 ⇔ A 不可逆<\/text>\n<\/svg><figcaption>圖 M8-12　以列運算求反方陣：[A | I] 化為 [I | A⁻¹]<\/figcaption><\/figure>\n<div class=\"warn\"><p>課綱備註：任意階反方陣可以在概念上討論（存在條件、性質、<span class=\"m\">X=A^{-1}B<\/span>），但<strong>確切計算只限二階<\/strong>。三階反方陣的計算屬進階，依課綱不列入學測計算範圍。<\/p><\/div>\n<div class=\"exam\"><p>學測對三階反方陣只考概念：判斷 <span class=\"m\">\\det A\\ne 0<\/span> 以決定是否可逆、套用 <span class=\"m\">(AB)^{-1}=B^{-1}A^{-1}<\/span>、<span class=\"m\">\\det(A^{-1})=\\frac{1}{\\det A}<\/span>、<span class=\"m\">\\det(rA)=r^3\\det A<\/span>（三階）等性質；三階方陣的 <span class=\"m\">\\det(rA)<\/span> 是 <span class=\"m\">r^3<\/span> 倍，<em>與二階的 <span class=\"m\">r^2<\/span> 不同<\/em>。<\/p><\/div>\n\n<p><strong>用電腦做矩陣運算<\/strong>　大型資料表的矩陣運算以電腦處理。<\/p>\n<table class=\"t\"><thead><tr><th>運算<\/th><th>試算表函數<\/th><th>Python（NumPy）<\/th><\/tr><\/thead><tbody>\n<tr><td>乘積 <span class=\"m\">AB<\/span><\/td><td>MMULT(範圍1, 範圍2)<\/td><td>A @ B<\/td><\/tr>\n<tr><td>反方陣 <span class=\"m\">A^{-1}<\/span><\/td><td>MINVERSE(範圍)<\/td><td>numpy.linalg.inv(A)<\/td><\/tr>\n<tr><td>行列式 <span class=\"m\">\\det A<\/span><\/td><td>MDETERM(範圍)<\/td><td>numpy.linalg.det(A)<\/td><\/tr>\n<tr><td>轉置 <span class=\"m\">A^{T}<\/span><\/td><td>TRANSPOSE(範圍)<\/td><td>A.T<\/td><\/tr>\n<\/tbody><\/table>\n<ul>\n<li>MMULT、MINVERSE、TRANSPOSE 傳回整個矩陣：較舊版本的試算表須先選取與結果同大小的儲存格範圍，再以陣列公式輸入；支援動態陣列的版本只須在左上角儲存格輸入。<\/li>\n<li>Python 中 A * B 是<em>逐元相乘<\/em>，矩陣乘法須用 A @ B。<\/li>\n<li>電腦以浮點數計算，結果可能有微小誤差：上例三階方陣的行列式，電腦輸出為 0.9999999999999964 而非 1；判斷「行列式是否為 0」時須考慮誤差。<\/li>\n<\/ul>\n<figure class=\"fig\"><svg viewBox=\"0 0 560 250\" width=\"560\">\n<g stroke=\"#94a3b8\" stroke-width=\"1\" fill=\"none\">\n<rect x=\"50\" y=\"40\" width=\"480\" height=\"180\"/>\n<line x1=\"50\" y1=\"70\" x2=\"530\" y2=\"70\"/><line x1=\"50\" y1=\"100\" x2=\"530\" y2=\"100\"/><line x1=\"50\" y1=\"130\" x2=\"530\" y2=\"130\"/><line x1=\"50\" y1=\"160\" x2=\"530\" y2=\"160\"/><line x1=\"50\" y1=\"190\" x2=\"530\" y2=\"190\"/>\n<line x1=\"130\" y1=\"40\" x2=\"130\" y2=\"220\"/><line x1=\"210\" y1=\"40\" x2=\"210\" y2=\"220\"/><line x1=\"290\" y1=\"40\" x2=\"290\" y2=\"220\"/><line x1=\"370\" y1=\"40\" x2=\"370\" y2=\"220\"/><line x1=\"450\" y1=\"40\" x2=\"450\" y2=\"220\"/>\n<\/g>\n<rect x=\"50\" y=\"40\" width=\"480\" height=\"30\" fill=\"#e2e8f0\" stroke=\"#94a3b8\"/>\n<rect x=\"20\" y=\"70\" width=\"30\" height=\"150\" fill=\"#e2e8f0\" stroke=\"#94a3b8\"/>\n<g font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2a44\">\n<text x=\"90\" y=\"60\">A<\/text><text x=\"170\" y=\"60\">B<\/text><text x=\"250\" y=\"60\">C<\/text><text x=\"330\" y=\"60\">D<\/text><text x=\"410\" y=\"60\">E<\/text><text x=\"490\" y=\"60\">F<\/text>\n<text x=\"35\" y=\"90\">1<\/text><text x=\"35\" y=\"120\">2<\/text><text x=\"35\" y=\"150\">3<\/text><text x=\"35\" y=\"180\">4<\/text><text x=\"35\" y=\"210\">5<\/text>\n<\/g>\n<rect x=\"51\" y=\"71\" width=\"158\" height=\"58\" fill=\"#cfe3f8\"/><rect x=\"291\" y=\"71\" width=\"158\" height=\"58\" fill=\"#c9ebd7\"/>\n<rect x=\"51\" y=\"161\" width=\"158\" height=\"58\" fill=\"#fbdcbd\"/><rect x=\"291\" y=\"161\" width=\"158\" height=\"58\" fill=\"#fbdcbd\"/>\n<g font-size=\"15\" text-anchor=\"middle\" fill=\"#1f2a44\">\n<text x=\"90\" y=\"90\">2<\/text><text x=\"170\" y=\"90\">1<\/text><text x=\"90\" y=\"120\">5<\/text><text x=\"170\" y=\"120\">3<\/text>\n<text x=\"330\" y=\"90\">1<\/text><text x=\"410\" y=\"90\">0<\/text><text x=\"330\" y=\"120\">2<\/text><text x=\"410\" y=\"120\">1<\/text>\n<text x=\"90\" y=\"180\">4<\/text><text x=\"170\" y=\"180\">1<\/text><text x=\"90\" y=\"210\">11<\/text><text x=\"170\" y=\"210\">3<\/text>\n<text x=\"330\" y=\"180\">3<\/text><text x=\"410\" y=\"180\">−1<\/text><text x=\"330\" y=\"210\">−5<\/text><text x=\"410\" y=\"210\">2<\/text>\n<\/g>\n<rect x=\"51\" y=\"131\" width=\"158\" height=\"28\" fill=\"#ffffff\"/><rect x=\"291\" y=\"131\" width=\"158\" height=\"28\" fill=\"#ffffff\"/><text x=\"130\" y=\"152\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c2410c\">=MMULT(A1:B2, D1:E2)<\/text>\n<text x=\"370\" y=\"152\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c2410c\">=MINVERSE(A1:B2)<\/text>\n<text x=\"130\" y=\"244\" font-size=\"13\" text-anchor=\"middle\">乘積（A4:B5）<\/text>\n<text x=\"370\" y=\"244\" font-size=\"13\" text-anchor=\"middle\">反方陣（D4:E5）<\/text>\n<text x=\"130\" y=\"30\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2f6fb5\">矩陣 P（A1:B2）<\/text>\n<text x=\"370\" y=\"30\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e8b57\">矩陣 Q（D1:E2）<\/text>\n<\/svg><figcaption>圖 M8-13　試算表中的矩陣運算：P＝[2 1；5 3]，Q＝[1 0；2 1]，PQ＝[4 1；11 3]，P⁻¹＝[3 −1；−5 2]<\/figcaption><\/figure>\n<div class=\"tip\"><p><strong>深究　乘法的計算量與結合順序<\/strong>（進階）<\/p>\n<p><span class=\"m\">(m\\times n)<\/span> 與 <span class=\"m\">(n\\times p)<\/span> 矩陣相乘，乘積共 <span class=\"m\">mp<\/span> 個元，每個元需 <span class=\"m\">n<\/span> 次乘法，合計 <span class=\"m\">mnp<\/span> 次乘法；兩個 <span class=\"m\">n<\/span> 階方陣相乘需 <span class=\"m\">n^3<\/span> 次（二階 8 次、三階 27 次）。<\/p>\n<p>結合律保證 <span class=\"m\">(AB)C=A(BC)<\/span>，但計算量可能相差很多。設 <span class=\"m\">A<\/span> 為 <span class=\"m\">20\\times 50<\/span>、<span class=\"m\">B<\/span> 為 <span class=\"m\">50\\times 4<\/span>、<span class=\"m\">C<\/span> 為 <span class=\"m\">4\\times 30<\/span>：<\/p>\n<table class=\"t\"><thead><tr><th>順序<\/th><th>第一步<\/th><th>第二步<\/th><th>乘法次數<\/th><\/tr><\/thead><tbody>\n<tr><td><span class=\"m\">(AB)C<\/span><\/td><td><span class=\"m\">20\\cdot 50\\cdot 4=4000<\/span><\/td><td><span class=\"m\">20\\cdot 4\\cdot 30=2400<\/span><\/td><td>6400<\/td><\/tr>\n<tr><td><span class=\"m\">A(BC)<\/span><\/td><td><span class=\"m\">50\\cdot 4\\cdot 30=6000<\/span><\/td><td><span class=\"m\">20\\cdot 50\\cdot 30=30000<\/span><\/td><td>36000<\/td><\/tr>\n<\/tbody><\/table>\n<p>同一結果，後者的乘法次數約為前者的 5.6 倍。電腦處理大型資料表時，會先決定相乘順序再計算。手算時同理：例題 3 的毛利以 <span class=\"m\">Q\\left(P\\begin{bmatrix}1\\\\ -1\\end{bmatrix}\\right)<\/span> 計算，比先算 <span class=\"m\">QP<\/span> 再相減省事。<\/p><\/div>\n<div class=\"tip\"><p><strong>深究　數學史<\/strong><\/p><ul>\n<li>漢代成書的《九章算術》方程章把聯立一次方程組的係數排成算籌陣列，以「遍乘」「直除」消去求解（方程術：「以右行上禾遍乘中行，而以直除」），與今日的列運算相同，只是以行（直排）代表一個方程式。<\/li>\n<li>高斯（Gauss）依 1803–1809 年的觀測資料計算小行星智神星（Pallas）的軌道，得到六元一次聯立方程組，並以有系統的消去法求解，後稱高斯消去法。<\/li>\n<li>「矩陣」（matrix）一詞由西爾維斯特（J. J. Sylvester）於 1850 年首先使用；凱萊於 1858 年發表矩陣代數的第一篇系統論文，定義加法、係數積、乘法與反方陣。<\/li>\n<li>弗羅貝尼烏斯於 1878 年證明一般 <span class=\"m\">n<\/span> 階的凱萊–哈密頓定理，1896 年後開始採用 matrix 一詞。<\/li>\n<li>希爾於 1929 年提出以矩陣乘法加密的希爾密碼。<\/li>\n<\/ul><\/div>\n<div class=\"tip\"><p><strong>深究　可逆的等價條件<\/strong>（進階，大學線性代數；課綱不延伸秩與線性獨立）<\/p><p>對 <span class=\"m\">n<\/span> 階方陣 <span class=\"m\">A<\/span>，下列敘述等價：(1) <span class=\"m\">A<\/span> 可逆；(2) <span class=\"m\">\\det A\\ne 0<\/span>；(3) <span class=\"m\">AX=B<\/span> 對每個 <span class=\"m\">B<\/span> 恰有一解；(4) <span class=\"m\">AX=O<\/span> 只有 <span class=\"m\">X=O<\/span> 一解；(5) <span class=\"m\">A<\/span> 的各行向量線性獨立（二階：不共線；三階：不共面）；(6) <span class=\"m\">A<\/span> 的秩為 <span class=\"m\">n<\/span>。條件 (4) 不成立時 <span class=\"m\">A<\/span> 是零因子：取 <span class=\"m\">AX=O<\/span> 的非零解 <span class=\"m\">X<\/span> 排成 <span class=\"m\">B<\/span>，即有 <span class=\"m\">AB=O<\/span>。<\/p><\/div>"},{"t":"八、重點總整理","h":"<div class=\"key\"><p><strong>實數運算與方陣運算對照<\/strong><\/p>\n<table class=\"t\"><thead><tr><th>項目<\/th><th>實數<\/th><th>二階方陣<\/th><\/tr><\/thead><tbody>\n<tr><td>乘法交換律<\/td><td><span class=\"m\">ab=ba<\/span><\/td><td>一般 <span class=\"m\">AB\\ne BA<\/span><\/td><\/tr>\n<tr><td>零因子<\/td><td><span class=\"m\">ab=0\\Rightarrow a=0<\/span> 或 <span class=\"m\">b=0<\/span><\/td><td><span class=\"m\">AB=O<\/span> 時 <span class=\"m\">A,B<\/span> 可能皆非零<\/td><\/tr>\n<tr><td>消去律<\/td><td><span class=\"m\">ab=ac,\\ a\\ne 0\\Rightarrow b=c<\/span><\/td><td>須 <span class=\"m\">A<\/span> 可逆<\/td><\/tr>\n<tr><td>乘法公式<\/td><td><span class=\"m\">(a+b)^2=a^2+2ab+b^2<\/span><\/td><td>須 <span class=\"m\">AB=BA<\/span><\/td><\/tr>\n<tr><td>倒數（反元素）<\/td><td><span class=\"m\">a\\ne 0<\/span> 即有 <span class=\"m\">a^{-1}<\/span><\/td><td>須 <span class=\"m\">\\det A\\ne 0<\/span>，非零不夠<\/td><\/tr>\n<tr><td>除法<\/td><td><span class=\"m\">\\dfrac{b}{a}=a^{-1}b=ba^{-1}<\/span><\/td><td>無除法；<span class=\"m\">A^{-1}B\\ne BA^{-1}<\/span>（一般）<\/td><\/tr>\n<tr><td><span class=\"m\">x^2=1<\/span> 的解<\/td><td>恰為 <span class=\"m\">\\pm 1<\/span><\/td><td><span class=\"m\">X^2=I<\/span> 有無限多解，如 <span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; -a\\end{bmatrix}<\/span>，<span class=\"m\">a^2+bc=1<\/span><\/td><\/tr>\n<tr><td><span class=\"m\">x^2=0<\/span> 的解<\/td><td>只有 0<\/td><td><span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}<\/span> 等非零解<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>表中 <span class=\"m\">X^2=I<\/span> 的解族可直接驗算：<span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; -a\\end{bmatrix}^2=\\begin{bmatrix}a^2+bc &amp; 0\\\\ 0 &amp; a^2+bc\\end{bmatrix}<\/span>。例如 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>（對 <span class=\"m\">x<\/span> 軸鏡射）、<span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>（對 <span class=\"m\">y=x<\/span> 鏡射）的平方都是 <span class=\"m\">I<\/span>，幾何意義見 M9。<\/p>\n<div class=\"key\"><p><strong>與第三冊 A 平面向量的對照<\/strong><\/p>\n<table class=\"t\"><thead><tr><th>平面向量（第三冊 A）<\/th><th>矩陣（本單元）<\/th><\/tr><\/thead><tbody>\n<tr><td>向量加法、係數積，逐分量計算<\/td><td>矩陣加法、係數積，逐元計算<\/td><\/tr>\n<tr><td>內積 <span class=\"m\">a_1b_1+a_2b_2<\/span><\/td><td>乘積的 <span class=\"m\">(i,j)<\/span> 元＝第 <span class=\"m\">i<\/span> 列與第 <span class=\"m\">j<\/span> 行的「內積」<\/td><\/tr>\n<tr><td>線性組合 <span class=\"m\">x\\vec{u}+y\\vec{v}<\/span><\/td><td><span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/span>，<span class=\"m\">\\vec{u},\\vec{v}<\/span> 為 <span class=\"m\">A<\/span> 的兩行<\/td><\/tr>\n<tr><td>兩向量張成的平行四邊形面積 <span class=\"m\">|a_1b_2-a_2b_1|<\/span><\/td><td><span class=\"m\">|\\det A|<\/span><\/td><\/tr>\n<tr><td>兩向量共線 <span class=\"m\">\\iff<\/span> 面積為 0<\/td><td><span class=\"m\">A<\/span> 不可逆 <span class=\"m\">\\iff\\det A=0<\/span><\/td><\/tr>\n<tr><td>二元一次聯立的克拉瑪公式<\/td><td><span class=\"m\">X=A^{-1}B<\/span><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"key\"><p><strong>題型與解題步驟<\/strong><\/p>\n<table class=\"t\"><thead><tr><th>題型<\/th><th>關鍵<\/th><th>步驟<\/th><\/tr><\/thead><tbody>\n<tr><td>矩陣相等<\/td><td>同階、逐元相等<\/td><td>列出每一個元的方程式→解聯立→回代檢查<\/td><\/tr>\n<tr><td>乘積是否有定義<\/td><td>內項相等<\/td><td>寫出兩矩陣的階→比較內項→外項為積的階<\/td><\/tr>\n<tr><td>運算律真偽（多選）<\/td><td>交換律、零因子、消去律<\/td><td>先找反例；展開式只比較 <span class=\"m\">AB<\/span> 與 <span class=\"m\">BA<\/span><\/td><\/tr>\n<tr><td>可交換的方陣<\/td><td><span class=\"m\">AB=BA<\/span><\/td><td>設四個未知元→比較四個元→整理成參數式<\/td><\/tr>\n<tr><td>求 <span class=\"m\">A^n<\/span><\/td><td>辨認類型<\/td><td>算 <span class=\"m\">A^2<\/span>、<span class=\"m\">A^3<\/span>→判斷對角／推移／<span class=\"m\">kA<\/span>／週期→否則用凱萊–哈密頓降次（進階）<\/td><\/tr>\n<tr><td>可逆的條件<\/td><td><span class=\"m\">\\det A\\ne 0<\/span><\/td><td>算行列式→解 <span class=\"m\">\\det A=0<\/span>→排除這些值<\/td><\/tr>\n<tr><td>矩陣方程式<\/td><td>左乘、右乘<\/td><td>移項並提出 <span class=\"m\">X<\/span>（常數乘 <span class=\"m\">I<\/span>）→確認可逆→同側乘反方陣→驗算<\/td><\/tr>\n<tr><td>由多項式關係求 <span class=\"m\">A^{-1}<\/span><\/td><td>常數項不為 0<\/td><td>把含 <span class=\"m\">A<\/span> 的項移到一側並提出 <span class=\"m\">A<\/span>→除以常數<\/td><\/tr>\n<tr><td>行列式的計算<\/td><td>乘法定理<\/td><td><span class=\"m\">\\det(rA)=r^2\\det A<\/span>、<span class=\"m\">\\det A^{-1}=\\frac{1}{\\det A}<\/span>、<span class=\"m\">\\det A^n=(\\det A)^n<\/span><\/td><\/tr>\n<tr><td>情境（資料表）<\/td><td>分類接得上<\/td><td>寫明列、行標籤→決定左乘或右乘→解釋乘積各元<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"exam\"><p>綜合題常把兩個以上的觀念串在一起：例如「<span class=\"m\">A^2-4A+3I=O<\/span>，求 <span class=\"m\">A^{-1}<\/span> 與 <span class=\"m\">A^5<\/span>」同時考凱萊–哈密頓定理、反方陣與降次；「已知 <span class=\"m\">A\\begin{bmatrix}1\\\\ 1\\end{bmatrix}<\/span>、<span class=\"m\">A\\begin{bmatrix}1\\\\ -1\\end{bmatrix}<\/span> 求 <span class=\"m\">A<\/span>」考行組合觀點與右乘反方陣。作答時先判斷每一步用到的是哪一條性質，特別留意<em>乘的方向<\/em>與<em>常數須乘 <span class=\"m\">I<\/span><\/em>。<\/p><\/div>"},{"t":"例題精解","h":"<div class=\"example\"><p><strong>例題 1　矩陣相等<\/strong>（基礎）　已知 <span class=\"m\">\\begin{bmatrix}x+2y &amp; z^2\\\\ 4 &amp; x-y\\end{bmatrix}=\\begin{bmatrix}7 &amp; 4\\\\ w &amp; 1\\end{bmatrix}<\/span>，求實數 <span class=\"m\">x,y,z,w<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li>兩矩陣同為 <span class=\"m\">2\\times 2<\/span>，對應元相等：<span class=\"m\">x+2y=7<\/span>，<span class=\"m\">z^2=4<\/span>，<span class=\"m\">4=w<\/span>，<span class=\"m\">x-y=1<\/span>。<\/li><li>解 <span class=\"m\">\\begin{cases}x+2y=7\\\\ x-y=1\\end{cases}<\/span>：相減得 <span class=\"m\">3y=6<\/span>，<span class=\"m\">y=2<\/span>，<span class=\"m\">x=3<\/span>。<\/li><li><span class=\"m\">z=\\pm 2<\/span>，<span class=\"m\">w=4<\/span>。<\/li><\/ol>\n<p>答：<span class=\"m\">(x,y,z,w)=(3,2,2,4)<\/span> 或 <span class=\"m\">(3,2,-2,4)<\/span>。<\/p><p>陷阱：<span class=\"m\">z^2=4<\/span> 漏掉負根；<span class=\"m\">(2,1)<\/span> 元的方程式 <span class=\"m\">4=w<\/span> 漏列。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 2　矩陣方程式<\/strong>（基礎）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 0 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}4 &amp; 2\\\\ -2 &amp; 4\\end{bmatrix}<\/span>，求滿足 <span class=\"m\">3X-2A=B+X<\/span> 的矩陣 <span class=\"m\">X<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li>移項：<span class=\"m\">3X-X=B+2A<\/span>，<span class=\"m\">2X=B+2A<\/span>。<\/li><li><span class=\"m\">B+2A=\\begin{bmatrix}4+4 &amp; 2-2\\\\ -2+0 &amp; 4+6\\end{bmatrix}=\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=\\dfrac{1}{2}\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}=\\begin{bmatrix}4 &amp; 0\\\\ -1 &amp; 5\\end{bmatrix}<\/span>。<\/li><li>驗算 <span class=\"m\">(1,1)<\/span> 元：<span class=\"m\">3\\cdot 4-2\\cdot 2=8=4+4<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">-2A<\/span> 移項後應為 <span class=\"m\">+2A<\/span>；係數積須乘到每一個元。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 3　資料表與矩陣乘法<\/strong>（基礎）　某商店兩家分店一週的銷售量（件）與三種商品的售價、成本（元）如下：<\/p>\n<div class=\"mb\">Q=\\begin{bmatrix}20 &amp; 15 &amp; 10\\\\ 12 &amp; 25 &amp; 8\\end{bmatrix}\\ \\begin{matrix}\\leftarrow\\text{一店}\\\\ \\leftarrow\\text{二店}\\end{matrix},\\qquad P=\\begin{bmatrix}30 &amp; 18\\\\ 45 &amp; 30\\\\ 60 &amp; 40\\end{bmatrix}\\ \\begin{matrix}\\leftarrow\\text{甲}\\\\ \\leftarrow\\text{乙}\\\\ \\leftarrow\\text{丙}\\end{matrix}<\/div>\n<p><span class=\"m\">Q<\/span> 的三行依序為商品甲、乙、丙；<span class=\"m\">P<\/span> 的兩行依序為售價、成本。(1) 求 <span class=\"m\">QP<\/span> 並說明各元的意義。(2) 求兩店的毛利。(3) <span class=\"m\">PQ<\/span> 是否有定義？是否有實際意義？<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">Q<\/span> 為 <span class=\"m\">2\\times 3<\/span>，<span class=\"m\">P<\/span> 為 <span class=\"m\">3\\times 2<\/span>，<span class=\"m\">QP<\/span> 為 <span class=\"m\">2\\times 2<\/span>。<br><span class=\"m\">(QP)_{11}=20\\cdot 30+15\\cdot 45+10\\cdot 60=1875<\/span>，<span class=\"m\">(QP)_{12}=20\\cdot 18+15\\cdot 30+10\\cdot 40=1210<\/span>，<br><span class=\"m\">(QP)_{21}=12\\cdot 30+25\\cdot 45+8\\cdot 60=1965<\/span>，<span class=\"m\">(QP)_{22}=12\\cdot 18+25\\cdot 30+8\\cdot 40=1286<\/span>。<br><span class=\"m\">QP=\\begin{bmatrix}1875 &amp; 1210\\\\ 1965 &amp; 1286\\end{bmatrix}<\/span>：列為分店、行為（營收、總成本）。<\/li><li>毛利＝營收－成本：一店 <span class=\"m\">1875-1210=665<\/span> 元，二店 <span class=\"m\">1965-1286=679<\/span> 元。亦可先算 <span class=\"m\">P\\begin{bmatrix}1\\\\ -1\\end{bmatrix}=\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}<\/span>（每件毛利），再求 <span class=\"m\">Q\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}=\\begin{bmatrix}665\\\\ 679\\end{bmatrix}<\/span>（結合律）。<\/li><li><span class=\"m\">PQ<\/span> 為 <span class=\"m\">(3\\times 2)(2\\times 3)=3\\times 3<\/span>，有定義；但其 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">30\\cdot 20+18\\cdot 12<\/span> 是「甲的售價 × 一店銷量＋甲的成本 × 二店銷量」，加總的分類（售價／成本 與 一店／二店）不相同，<strong>沒有實際意義<\/strong>。<\/li><\/ol><p>陷阱：乘積有定義只是階數相容；有無意義要看<span class=\"ul\">被加總的分類是否一致<\/span>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 4　與給定方陣可交換的方陣<\/strong>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}<\/span>，求所有滿足 <span class=\"m\">AB=BA<\/span> 的二階方陣 <span class=\"m\">B<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li>設 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}a+2c &amp; b+2d\\\\ 3c &amp; 3d\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}a &amp; 2a+3b\\\\ c &amp; 2c+3d\\end{bmatrix}<\/span>。<\/li><li>比較各元：<span class=\"m\">(1,1)<\/span>：<span class=\"m\">a+2c=a\\Rightarrow c=0<\/span>；<span class=\"m\">(2,1)<\/span>：<span class=\"m\">3c=c<\/span>，同；<span class=\"m\">(2,2)<\/span>：<span class=\"m\">3d=2c+3d<\/span>，同；<span class=\"m\">(1,2)<\/span>：<span class=\"m\">b+2d=2a+3b\\Rightarrow d=a+b<\/span>。<\/li><li>所求 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ 0 &amp; a+b\\end{bmatrix}<\/span>，<span class=\"m\">a,b<\/span> 為任意實數。<\/li><\/ol>\n<p>另解：<span class=\"m\">A<\/span> 不是 <span class=\"m\">kI<\/span>，與 <span class=\"m\">A<\/span> 可交換者為 <span class=\"m\">pI+qA=\\begin{bmatrix}p+q &amp; 2q\\\\ 0 &amp; p+3q\\end{bmatrix}<\/span>；令 <span class=\"m\">a=p+q<\/span>、<span class=\"m\">b=2q<\/span>，則 <span class=\"m\">p+3q=a+b<\/span>，結果相同。<\/p><p>陷阱：四個元都要比較；只比較兩個元會漏掉條件或多出條件。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 5　零因子與消去律<\/strong>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span>。(1) 求所有二階方陣 <span class=\"m\">B<\/span> 使 <span class=\"m\">AB=O<\/span>。(2) 取其中一個 <span class=\"m\">B\\ne O<\/span>，計算 <span class=\"m\">BA<\/span>。(3) 說明 <span class=\"m\">AB=AC<\/span> 不能推得 <span class=\"m\">B=C<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li>設 <span class=\"m\">B=\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}p+2r &amp; q+2s\\\\ 2p+4r &amp; 2q+4s\\end{bmatrix}=O\\iff p=-2r,\\ q=-2s<\/span>，即 <span class=\"m\">B=\\begin{bmatrix}-2r &amp; -2s\\\\ r &amp; s\\end{bmatrix}<\/span>（<span class=\"m\">B<\/span> 的每一行都是 <span class=\"m\">(-2,1)<\/span> 的倍數）。<\/li><li>取 <span class=\"m\">r=-1,s=-2<\/span>：<span class=\"m\">B=\\begin{bmatrix}2 &amp; 4\\\\ -1 &amp; -2\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}2+8 &amp; 4+16\\\\ -1-4 &amp; -2-8\\end{bmatrix}=\\begin{bmatrix}10 &amp; 20\\\\ -5 &amp; -10\\end{bmatrix}\\ne O<\/span>。<\/li><li>取 <span class=\"m\">C=O<\/span>：<span class=\"m\">AB=O=AC<\/span>，但 <span class=\"m\">B\\ne C<\/span>。原因：<span class=\"m\">\\det A=4-4=0<\/span>，<span class=\"m\">A<\/span> 不可逆，不能左乘 <span class=\"m\">A^{-1}<\/span> 消去。<\/li><\/ol><p>陷阱：<span class=\"m\">AB=O<\/span> 不保證 <span class=\"m\">BA=O<\/span>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 6　乘法公式的修正<\/strong>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}1 &amp; 0\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。判斷 <span class=\"m\">(A+B)^2=A^2+2AB+B^2<\/span> 與 <span class=\"m\">(A+B)(A-B)=A^2-B^2<\/span> 是否成立，並求兩邊之差。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">AB=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">AB\\ne BA<\/span>，故兩式皆不成立。<\/li><li><span class=\"m\">(A+B)^2-(A^2+2AB+B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">(A+B)(A-B)-(A^2-B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">(A+B)^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}^2=\\begin{bmatrix}5 &amp; 4\\\\ 4 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A^2+2AB+B^2=\\begin{bmatrix}6 &amp; 4\\\\ 4 &amp; 4\\end{bmatrix}<\/span>，差為 <span class=\"m\">\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">(A+B)(A-B)<\/span> 展開的中間項是 <span class=\"m\">-AB+BA<\/span>，順序不可寫反。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 7　推移型的乘冪<\/strong>（基礎）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}<\/span>，求 <span class=\"m\">A^{10}<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}4 &amp; 4\\\\ 0 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}8 &amp; 12\\\\ 0 &amp; 8\\end{bmatrix}<\/span>，猜測 <span class=\"m\">A^n=\\begin{bmatrix}2^n &amp; n\\cdot 2^{n-1}\\\\ 0 &amp; 2^n\\end{bmatrix}<\/span>。<\/li><li>數學歸納法：<span class=\"m\">n=1<\/span> 成立；設 <span class=\"m\">n=k<\/span> 成立，<span class=\"m\">A^{k+1}=A^kA=\\begin{bmatrix}2^{k+1} &amp; 2^k+k\\cdot 2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}=\\begin{bmatrix}2^{k+1} &amp; (k+1)2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}<\/span>，<span class=\"m\">n=k+1<\/span> 亦成立。<\/li><li><span class=\"m\">A^{10}=\\begin{bmatrix}1024 &amp; 10\\cdot 512\\\\ 0 &amp; 1024\\end{bmatrix}=\\begin{bmatrix}1024 &amp; 5120\\\\ 0 &amp; 1024\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解：<span class=\"m\">A=2I+N<\/span>，<span class=\"m\">N=\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">N^2=O<\/span>，且 <span class=\"m\">2I<\/span> 與 <span class=\"m\">N<\/span> 可交換，<span class=\"m\">A^{10}=(2I)^{10}+10(2I)^9N=1024I+5120N<\/span>。<\/p><p>陷阱：<span class=\"m\">(1,2)<\/span> 元不是 <span class=\"m\">1^{10}<\/span> 也不是 <span class=\"m\">2^{10}<\/span>；乘冪不能逐元取次方（只有對角方陣可以）。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 8　週期型的乘冪<\/strong>（進階）　<span class=\"m\">A=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，求 <span class=\"m\">A^{2026}<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">A^3=A^2A=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>，故 <span class=\"m\">A^6=I<\/span>（圖 M8-7）。<\/li><li><span class=\"m\">2026=6\\times 337+4<\/span>，<span class=\"m\">A^{2026}=(A^6)^{337}A^4=A^4=A^3A=-A=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; -1\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解：<span class=\"m\">a+d=1<\/span>，<span class=\"m\">ad-bc=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-A+I=O<\/span>；兩邊左乘 <span class=\"m\">A+I<\/span>：<span class=\"m\">(A+I)(A^2-A+I)=A^3+I=O<\/span>，即 <span class=\"m\">A^3=-I<\/span>。<\/p><p>陷阱：以 3 為週期得 <span class=\"m\">A^{2026}=A<\/span>，忽略 <span class=\"m\">A^3=-I<\/span> 的負號。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 9　以凱萊–哈密頓定理降次<\/strong>（挑戰）　<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 2 &amp; 2\\end{bmatrix}<\/span>。將 <span class=\"m\">A^4<\/span> 表示成 <span class=\"m\">pA+qI<\/span>，並求 <span class=\"m\">A^4<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">a+d=5<\/span>，<span class=\"m\">\\det A=6-2=4<\/span>，故 <span class=\"m\">A^2=5A-4I<\/span>。<\/li><li><span class=\"m\">A^3=5A^2-4A=5(5A-4I)-4A=21A-20I<\/span>。<\/li><li><span class=\"m\">A^4=21A^2-20A=21(5A-4I)-20A=85A-84I<\/span>，<span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。<\/li><li><span class=\"m\">A^4=\\begin{bmatrix}255-84 &amp; 85\\\\ 170 &amp; 170-84\\end{bmatrix}=\\begin{bmatrix}171 &amp; 85\\\\ 170 &amp; 86\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解一（多項式除法）：<span class=\"m\">x^2-5x+4=(x-1)(x-4)<\/span>。設 <span class=\"m\">x^4=(x-1)(x-4)g(x)+px+q<\/span>，以 <span class=\"m\">x=1<\/span>、<span class=\"m\">x=4<\/span> 代入：<span class=\"m\">p+q=1<\/span>，<span class=\"m\">4p+q=256<\/span>，得 <span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。因 <span class=\"m\">(A-I)(A-4I)=O<\/span>，<span class=\"m\">A^4=85A-84I<\/span>。一般地 <span class=\"m\">A^n=\\dfrac{4^n-1}{3}A+\\dfrac{4-4^n}{3}I<\/span>。<\/p>\n<p>另解二（對角化，進階）：<span class=\"m\">A<\/span> 的特徵值為 1、4，<span class=\"m\">A=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 4\\end{bmatrix}P^{-1}<\/span>，故 <span class=\"m\">A^4=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 256\\end{bmatrix}P^{-1}<\/span>，結果相同；<span class=\"m\">P<\/span> 的求法詳見 M9 第八節。<\/p><p>陷阱：<span class=\"m\">A^2=5A-4I<\/span> 中的 <span class=\"m\">4I<\/span> 寫成 4。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 10　反方陣存在條件<\/strong>（基礎）　<span class=\"m\">A=\\begin{bmatrix}k &amp; 3\\\\ 2 &amp; k-1\\end{bmatrix}<\/span>。(1) 求使 <span class=\"m\">A<\/span> 不可逆的所有實數 <span class=\"m\">k<\/span>。(2) 當 <span class=\"m\">k=4<\/span> 時，求 <span class=\"m\">A^{-1}<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">\\det A=k(k-1)-6=k^2-k-6=(k-3)(k+2)<\/span>。不可逆 <span class=\"m\">\\iff\\det A=0\\iff k=3<\/span> 或 <span class=\"m\">k=-2<\/span>。<\/li><li><span class=\"m\">k=4<\/span>：<span class=\"m\">A=\\begin{bmatrix}4 &amp; 3\\\\ 2 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=6<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{6}\\begin{bmatrix}3 &amp; -3\\\\ -2 &amp; 4\\end{bmatrix}=\\begin{bmatrix}\\frac{1}{2} &amp; -\\frac{1}{2}\\\\ -\\frac{1}{3} &amp; \\frac{2}{3}\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">AA^{-1}<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">4\\cdot\\frac{1}{2}+3\\cdot(-\\frac{1}{3})=1<\/span>。<\/li><\/ol><p>陷阱：公式中副對角線「變號」與主對角線「互換」做反了。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 11　以反方陣解二元一次聯立<\/strong>（基礎）　(1) 以反方陣解 <span class=\"m\">\\begin{cases}3x+5y=7\\\\ 2x+4y=6\\end{cases}<\/span>。(2) 同一組係數，常數改為 <span class=\"m\">(1,0)<\/span>，求解。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">A=\\begin{bmatrix}3 &amp; 5\\\\ 2 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=2<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{2}\\begin{bmatrix}4 &amp; -5\\\\ -2 &amp; 3\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=A^{-1}\\begin{bmatrix}7\\\\ 6\\end{bmatrix}=\\dfrac{1}{2}\\begin{bmatrix}28-30\\\\ -14+18\\end{bmatrix}=\\begin{bmatrix}-1\\\\ 2\\end{bmatrix}<\/span>，即 <span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。<\/li><li>(2) <span class=\"m\">A^{-1}\\begin{bmatrix}1\\\\ 0\\end{bmatrix}<\/span>＝<span class=\"m\">A^{-1}<\/span> 的第 1 行＝<span class=\"m\">\\begin{bmatrix}2\\\\ -1\\end{bmatrix}<\/span>，即 <span class=\"m\">x=2<\/span>，<span class=\"m\">y=-1<\/span>。<\/li><\/ol>\n<p>另解（克拉瑪公式）：<span class=\"m\">\\Delta=2<\/span>，<span class=\"m\">\\Delta_x=\\begin{vmatrix}7 &amp; 5\\\\ 6 &amp; 4\\end{vmatrix}=-2<\/span>，<span class=\"m\">\\Delta_y=\\begin{vmatrix}3 &amp; 7\\\\ 2 &amp; 6\\end{vmatrix}=4<\/span>，<span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。<\/p><p>陷阱：寫成 <span class=\"m\">X=BA^{-1}<\/span>（無定義）。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 12　左乘與右乘<\/strong>（進階）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 5 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}1 &amp; 0\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。分別求滿足 <span class=\"m\">AX=B<\/span> 與 <span class=\"m\">YA=B<\/span> 的方陣 <span class=\"m\">X<\/span>、<span class=\"m\">Y<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">\\det A=6-5=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ -5 &amp; 2\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=A^{-1}B=\\begin{bmatrix}3-2 &amp; -1\\\\ -5+4 &amp; 2\\end{bmatrix}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">Y=BA^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ 6-5 &amp; -2+2\\end{bmatrix}=\\begin{bmatrix}3 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">AX<\/span> 的 <span class=\"m\">(2,1)<\/span> 元 <span class=\"m\">5\\cdot 1+3\\cdot(-1)=2<\/span>；<span class=\"m\">YA<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">3\\cdot 2+(-1)\\cdot 5=1<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">X\\ne Y<\/span>，左乘與右乘的結果一般不同；<span class=\"m\">AX=B<\/span> 兩邊<span class=\"circle\">同一側<\/span>乘 <span class=\"m\">A^{-1}<\/span>。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 13　由多項式關係求反方陣<\/strong>（挑戰）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; 2\\end{bmatrix}<\/span>。(1) 證明 <span class=\"m\">A^2-4A+I=O<\/span>。(2) 以 (1) 求 <span class=\"m\">A^{-1}<\/span>。(3) 求 <span class=\"m\">A^2+A^{-2}<\/span> 與 <span class=\"m\">A^3+A^{-3}<\/span>。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">a+d=4<\/span>，<span class=\"m\">\\det A=4-3=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-4A+I=O<\/span>。（直接驗算：<span class=\"m\">A^2=\\begin{bmatrix}7 &amp; 4\\\\ 12 &amp; 7\\end{bmatrix}=4A-I<\/span>。）<\/li><li><span class=\"m\">A(4I-A)=4A-A^2=I<\/span>，且 <span class=\"m\">(4I-A)A=I<\/span>，故 <span class=\"m\">A^{-1}=4I-A=\\begin{bmatrix}2 &amp; -1\\\\ -3 &amp; 2\\end{bmatrix}<\/span>。<\/li><li>由 (2)，<span class=\"m\">A+A^{-1}=4I<\/span>。<span class=\"m\">A<\/span> 與 <span class=\"m\">A^{-1}<\/span> 可交換，<span class=\"m\">(A+A^{-1})^2=A^2+2I+A^{-2}<\/span>，故 <span class=\"m\">A^2+A^{-2}=16I-2I=14I<\/span>。<\/li><li><span class=\"m\">(A+A^{-1})^3=A^3+3A+3A^{-1}+A^{-3}<\/span>，故 <span class=\"m\">A^3+A^{-3}=64I-3\\cdot 4I=52I<\/span>。<\/li><\/ol>\n<p>另解（直接計算）：<span class=\"m\">A^{-2}=(A^{-1})^2=\\begin{bmatrix}7 &amp; -4\\\\ -12 &amp; 7\\end{bmatrix}<\/span>，<span class=\"m\">A^2+A^{-2}=\\begin{bmatrix}14 &amp; 0\\\\ 0 &amp; 14\\end{bmatrix}<\/span>，相同。<\/p><p>陷阱：<span class=\"m\">A+A^{-1}=4I<\/span> 寫成 4；用乘法公式前須確認兩方陣可交換（此處 <span class=\"m\">AA^{-1}=A^{-1}A=I<\/span>）。<\/p><\/div><\/div>\n\n<div class=\"example\"><p><strong>例題 14　編碼與解碼<\/strong>（應用）　以 <span class=\"m\">A=1,B=2,\\ldots,Z=26<\/span> 將英文字母轉成數字，每兩個字母組成行矩陣 <span class=\"m\">X<\/span>，以 <span class=\"m\">E=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span> 左乘得 <span class=\"m\">Y=EX<\/span> 傳出。收到的數字依序為 27、14、48、28，求原文。<\/p>\n<div class=\"sol\"><ol class=\"steps\"><li><span class=\"m\">\\det E=1<\/span>，<span class=\"m\">E^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li><li>密文排成 <span class=\"m\">Y=\\begin{bmatrix}27 &amp; 48\\\\ 14 &amp; 28\\end{bmatrix}<\/span>（每行一組）。<\/li><li><span class=\"m\">X=E^{-1}Y=\\begin{bmatrix}27-14 &amp; 48-28\\\\ -27+28 &amp; -48+56\\end{bmatrix}=\\begin{bmatrix}13 &amp; 20\\\\ 1 &amp; 8\\end{bmatrix}<\/span>。<\/li><li>13、1、20、8 對應 M、A、T、H，原文為 MATH。<\/li><\/ol><p>陷阱：密文須依「每兩個一組成一行」排列；排成列再右乘 <span class=\"m\">E^{-1}<\/span> 會得到錯誤結果。<\/p><\/div><\/div>"},{"t":"迷思概念對照","h":"<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">m\\times n<\/span> 矩陣有 <span class=\"m\">m<\/span> 行、<span class=\"m\">n<\/span> 列。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span><span class=\"m\">m\\times n<\/span> 矩陣有 <span class=\"m\">m<\/span> 列（橫）、<span class=\"m\">n<\/span> 行（直），先列後行。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">AB<\/span> 與 <span class=\"m\">BA<\/span> 都有定義時，兩者相等。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>兩者可能階數不同；同階時一般也不相等。乘法不具交換律。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">AB=O<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">B=O<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>可能有零因子；只能推得 <span class=\"m\">\\det A\\cdot\\det B=0<\/span>。若 <span class=\"m\">A<\/span> 可逆才有 <span class=\"m\">B=O<\/span>。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">AB=AC<\/span> 且 <span class=\"m\">A\\ne O<\/span>，則 <span class=\"m\">B=C<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>須 <span class=\"m\">A<\/span> 可逆（<span class=\"m\">\\det A\\ne 0<\/span>）才能左乘 <span class=\"m\">A^{-1}<\/span> 消去。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">(A+B)^2=A^2+2AB+B^2<\/span>，<span class=\"m\">(A+B)(A-B)=A^2-B^2<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>一般為 <span class=\"m\">A^2+AB+BA+B^2<\/span> 與 <span class=\"m\">A^2-AB+BA-B^2<\/span>；<span class=\"m\">AB=BA<\/span> 時才化簡。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">A^2=O<\/span>，則 <span class=\"m\">A=O<\/span>；<span class=\"m\">A^2=A<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">I<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span><span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}^2=O<\/span>，<span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}^2=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，皆為反例。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>非零方陣都有反方陣。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>二階方陣可逆的條件是 <span class=\"m\">\\det A\\ne 0<\/span>，如 <span class=\"m\">\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span> 非零卻不可逆；非方陣沒有反方陣。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">(AB)^{-1}=A^{-1}B^{-1}<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span><span class=\"m\">(AB)^{-1}=B^{-1}A^{-1}<\/span>，順序相反。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>二階方陣 <span class=\"m\">\\det(2A)=2\\det A<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span><span class=\"m\">\\det(2A)=2^2\\det A=4\\det A<\/span>，係數乘到每一列。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">AX=B<\/span> 的解為 <span class=\"m\">X=BA^{-1}<\/span> 或 <span class=\"m\">X=\\dfrac{B}{A}<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>兩邊左乘 <span class=\"m\">A^{-1}<\/span>：<span class=\"m\">X=A^{-1}B<\/span>；矩陣沒有除法。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">AX-3X=(A-3)X<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span><span class=\"m\">AX-3X=(A-3I)X<\/span>；方陣不能減去實數。<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span><span class=\"m\">\\det(A+B)=\\det A+\\det B<\/span>。<\/p>\n<p class=\"good\"><span class=\"mark\">正<\/span>行列式只有乘法定理；例如 <span class=\"m\">\\det(I+I)=4\\ne 1+1<\/span>。<\/p>"},{"t":"自我檢核","h":"<ul class=\"check\">\n<li>能說出 <span class=\"m\">m\\times n<\/span> 矩陣的列、行與 <span class=\"m\">(i,j)<\/span> 元的意義，判斷兩矩陣是否相等。<\/li>\n<li>能做同階矩陣的加減與係數積，解只含線性運算的矩陣方程式。<\/li>\n<li>能判斷乘積是否有定義並寫出其階數；能以「列乘行」計算乘積的任一元。<\/li>\n<li>能說明資料表相乘時各元的意義，以及乘積「有定義但無意義」的情形。<\/li>\n<li>能舉例說明乘法不具交換律、零因子、消去律失效，並正確展開 <span class=\"m\">(A+B)^2<\/span>。<\/li>\n<li>能以對角、推移、<span class=\"m\">kI+N<\/span>、<span clas )=\\begin{bmatrix}15 &amp; 25\\end{bmatrix}\\begin{bmatrix}86\\\\ 54\\end{bmatrix}=1290+1350=2640<\/span>（先求點心總數，再乘單價）。兩者相等是矩陣乘法的結合律 <span class=\"m\">(CM)X=C(MX)<\/span>。總成本 2640 元。評分要點：<span class=\"m\">CM<\/span> 計算與兩元意義（3 分）；總成本 2640（2 分）；指出兩種算法的意義並引用結合律（3 分）。","steps":["(1) <span class=\"m\">CM=\\begin{bmatrix}15\\cdot 2+25\\cdot 3 &amp; 15\\cdot 4+25\\cdot 1\\end{bmatrix}=\\begin{bmatrix}105 &amp; 85\\end{bmatrix}<\/span>：甲盒一盒的點心成本 105 元，乙盒一盒 85 元。","(2) <span class=\"m\">(CM)X=105\\cdot 13+85\\cdot 15=1365+1275=2640<\/span>（先求每盒成本，再乘盒數）；<span class=\"m\">C(MX)=\\begin{bmatrix}15 &amp; 25\\end{bmatrix}\\begin{bmatrix}86\\\\ 54\\end{bmatrix}=1290+1350=2640<\/span>（先求點心總數，再乘單價）。","兩者相等是矩陣乘法的結合律 <span class=\"m\">(CM)X=C(MX)<\/span>。"],"hk":"hint"},{"id":"M8-29","unit":"M8","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設二階方陣 <span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\ne O<\/span> 且 <span class=\"m\">A^2=O<\/span>。下列敘述何者必定成立？","opts":[{"k":"A","h":"<span class=\"m\">a=d=0<\/span>"},{"k":"B","h":"<span class=\"m\">b=c=0<\/span>"},{"k":"C","h":"<span class=\"m\">a+d=0<\/span> 與 <span class=\"m\">ad-bc=0<\/span> 同時成立"},{"k":"D","h":"<span class=\"m\">A<\/span> 可逆"},{"k":"E","h":"<span class=\"m\">A^3\\ne O<\/span>"}],"type":"single","ans":["C"],"key":"(C)","sol":"<span class=\"m\">(\\det A)^2=\\det(A^2)=0<\/span>，故 <span class=\"m\">ad-bc=0<\/span>。凱萊–哈密頓定理：<span class=\"m\">A^2=(a+d)A-(ad-bc)I=(a+d)A<\/span>，又 <span class=\"m\">A^2=O<\/span>、<span class=\"m\">A\\ne O<\/span>，得 <span class=\"m\">a+d=0<\/span>。(A) 反例 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ -1 &amp; -1\\end{bmatrix}<\/span>。(B) 若 <span class=\"m\">b=c=0<\/span>，<span class=\"m\">A^2=\\begin{bmatrix}a^2 &amp; 0\\\\ 0 &amp; d^2\\end{bmatrix}=O<\/span> 推得 <span class=\"m\">A=O<\/span>，與假設矛盾，故必不成立。(D) 行列式為 0。(E) <span class=\"m\">A^3=A\\cdot A^2=O<\/span>。","steps":["先排除 (A)：反例 <span class=\"m\">\\begin{bmatrix}1 &amp; 1\\\\ -1 &amp; -1\\end{bmatrix}<\/span>。","先排除 (B)：若 <span class=\"m\">b=c=0<\/span>，<span class=\"m\">A^2=\\begin{bmatrix}a^2 &amp; 0\\\\ 0 &amp; d^2\\end{bmatrix}=O<\/span> 推得 <span class=\"m\">A=O<\/span>，與假設矛盾，故必不成立。","先排除 (D)：行列式為 0。"],"hk":"hint"},{"id":"M8-30","unit":"M8","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"設二階方陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A^2=A<\/span>。選出恆成立的選項。（多選）","opts":[{"k":"A","h":"<span class=\"m\">\\det A=1<\/span>"},{"k":"B","h":"<span class=\"m\">A(I-A)=O<\/span>"},{"k":"C","h":"若 <span class=\"m\">A\\ne I<\/span>，則 <span class=\"m\">A<\/span> 不可逆"},{"k":"D","h":"<span class=\"m\">I+A<\/span> 可逆，且 <span class=\"m\">(I+A)^{-1}=I-\\dfrac{1}{2}A<\/span>"},{"k":"E","h":"對所有正整數 <span class=\"m\">n<\/span>，<span class=\"m\">(I+A)^n=I+nA<\/span>"}],"type":"multi","ans":["B","C","D"],"key":"(B)(C)(D)","sol":"(A) 反例 <span class=\"m\">A=O<\/span>（<span class=\"m\">\\det A=0<\/span>）；一般 <span class=\"m\">(\\det A)^2=\\det A<\/span>，<span class=\"m\">\\det A<\/span> 為 0 或 1。(B) <span class=\"m\">A-A^2=O<\/span>，正確。(C) 若 <span class=\"m\">A<\/span> 可逆，<span class=\"m\">A^2=A<\/span> 兩邊左乘 <span class=\"m\">A^{-1}<\/span> 得 <span class=\"m\">A=I<\/span>；故 <span class=\"m\">A\\ne I<\/span> 時不可逆，正確。(D) <span class=\"m\">(I+A)(I-\\frac{1}{2}A)=I-\\frac{1}{2}A+A-\\frac{1}{2}A^2=I<\/span>，正確。(E) <span class=\"m\">(I+A)^2=I+2A+A^2=I+3A<\/span>；一般 <span class=\"m\">(I+A)^n=I+(2^n-1)A<\/span>，<span class=\"m\">A\\ne O<\/span> 時與 <span class=\"m\">I+nA<\/span> 不同，錯。","steps":["先判斷 (A)：反例 <span class=\"m\">A=O<\/span>（<span class=\"m\">\\det A=0<\/span>）；一般 <span class=\"m\">(\\det A)^2=\\det A<\/span>，<span class=\"m\">\\det A<\/span> 為 0 或 1。","先判斷 (B)：<span class=\"m\">A-A^2=O<\/span>，正確。"],"hk":"hint"},{"id":"M8-31","unit":"M8","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"（選填）設 <span class=\"m\">A=\\begin{bmatrix}4 &amp; -2\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，且實數 <span class=\"m\">p,q<\/span> 滿足 <span class=\"m\">A^5=pA+qI<\/span>，則 <span class=\"m\">p=<\/span>＿＿＿，<span class=\"m\">q=<\/span>＿＿＿。","opts":[],"type":"fill","ans":[],"key":"答案：<span class=\"m\">p=211<\/span>，<span class=\"m\">q=-390<\/span>","sol":"<span class=\"m\">a+d=5<\/span>，<span class=\"m\">\\det A=4+2=6<\/span>，<span class=\"m\">A^2-5A+6I=O<\/span>，即 <span class=\"m\">(A-2I)(A-3I)=O<\/span>。設 <span class=\"m\">x^5=(x-2)(x-3)g(x)+px+q<\/span>：<span class=\"m\">x=2<\/span> 得 <span class=\"m\">2p+q=32<\/span>，<span class=\"m\">x=3<\/span> 得 <span class=\"m\">3p+q=243<\/span>，解得 <span class=\"m\">p=211<\/span>、<span class=\"m\">q=-390<\/span>。驗算：<span class=\"m\">A^5=\\begin{bmatrix}454 &amp; -422\\\\ 211 &amp; -179\\end{bmatrix}=211A-390I<\/span>。另解：逐步降次 <span class=\"m\">A^2=5A-6I<\/span>，<span class=\"m\">A^3=19A-30I<\/span>，<span class=\"m\">A^4=65A-114I<\/span>，<span class=\"m\">A^5=211A-390I<\/span>。","steps":["<span class=\"m\">a+d=5<\/span>，<span class=\"m\">\\det A=4+2=6<\/span>，<span class=\"m\">A^2-5A+6I=O<\/span>，即 <span class=\"m\">(A-2I)(A-3I)=O<\/span>。","設 <span class=\"m\">x^5=(x-2)(x-3)g(x)+px+q<\/span>：<span class=\"m\">x=2<\/span> 得 <span class=\"m\">2p+q=32<\/span>，<span class=\"m\">x=3<\/span> 得 <span class=\"m\">3p+q=243<\/span>，解得 <span class=\"m\">p=211<\/span>、<span class=\"m\">q=-390<\/span>。","驗算：<span class=\"m\">A^5=\\begin{bmatrix}454 &amp; -422\\\\ 211 &amp; -179\\end{bmatrix}=211A-390I<\/span>。"],"hk":"hint"},{"id":"M8-32","unit":"M8","set":"分級測驗","level":"挑戰題","src":"","ctx":"","pre":"","stem":"（選填）設 <span class=\"m\">N=\\begin{bmatrix}2 &amp; -4\\\\ 1 &amp; -2\\end{bmatrix}<\/span>。若 <span class=\"m\">(I+N)^{-5}=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，則 <span class=\"m\">a=<\/span>＿＿＿，<span class=\"m\">b=<\/span>＿＿＿。","opts":[],"type":"fill","ans":[],"key":"答案：<span class=\"m\">a=-9<\/span>，<span class=\"m\">b=20<\/span>","sol":"<span class=\"m\">N^2=\\begin{bmatrix}4-4 &amp; -8+8\\\\ 2-2 &amp; -4+4\\end{bmatrix}=O<\/span>。<span class=\"m\">(I+N)(I-N)=I-N^2=I<\/span>，故 <span class=\"m\">(I+N)^{-1}=I-N<\/span>，<span class=\"m\">(I+N)^{-5}=(I-N)^5=I-5N<\/span>（<span class=\"m\">N^2=O<\/span>，二項展開僅剩兩項）。<span class=\"m\">I-5N=\\begin{bmatrix}-9 &amp; 20\\\\ -5 &amp; 11\\end{bmatrix}<\/span>。另解：<span class=\"m\">(I+N)^5=I+5N=\\begin{bmatrix}11 &amp; -20\\\\ 5 &amp; -9\\end{bmatrix}<\/span>，行列式為 1，用二階公式求反方陣，結果相同。","steps":["<span class=\"m\">N^2=\\begin{bmatrix}4-4 &amp; -8+8\\\\ 2-2 &amp; -4+4\\end{bmatrix}=O<\/span>。","<span class=\"m\">(I+N)(I-N)=I-N^2=I<\/span>，故 <span class=\"m\">(I+N)^{-1}=I-N<\/span>，<span class=\"m\">(I+N)^{-5}=(I-N)^5=I-5N<\/span>（<span class=\"m\">N^2=O<\/span>，二項展開僅剩兩項）。","<span class=\"m\">I-5N=\\begin{bmatrix}-9 &amp; 20\\\\ -5 &amp; 11\\end{bmatrix}<\/span>。"],"hk":"hint"},{"id":"M8-33","unit":"M8","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ -2 &amp; 4\\end{bmatrix}<\/span>。(1) 證明 <span class=\"m\">A^2-5A+6I=O<\/span>。(2) 利用 (1) 說明 <span class=\"m\">A<\/span> 可逆，並求 <span class=\"m\">A^{-1}<\/span>。(3) 證明：凡滿足 <span class=\"m\">P^2-5P+6I=O<\/span> 的二階方陣 <span class=\"m\">P<\/span> 皆可逆，且 <span class=\"m\">P^{-1}=\\dfrac{1}{6}(5I-P)<\/span>。","opts":[],"type":"open","ans":[],"key":"參考答案：","sol":"(1) <span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; 5\\\\ -10 &amp; 14\\end{bmatrix}<\/span>，<span class=\"m\">A^2-5A+6I=\\begin{bmatrix}-1-5+6 &amp; 5-5\\\\ -10+10 &amp; 14-20+6\\end{bmatrix}=O<\/span>。(2) 由 (1)，<span class=\"m\">A(5I-A)=5A-A^2=6I<\/span>，且 <span class=\"m\">(5I-A)A=6I<\/span>，故 <span class=\"m\">A\\cdot\\frac{1}{6}(5I-A)=\\frac{1}{6}(5I-A)\\cdot A=I<\/span>，<span class=\"m\">A<\/span> 可逆，<span class=\"m\">A^{-1}=\\frac{1}{6}\\begin{bmatrix}4 &amp; -1\\\\ 2 &amp; 1\\end{bmatrix}=\\begin{bmatrix}\\frac{2}{3} &amp; -\\frac{1}{6}\\\\ \\frac{1}{3} &amp; \\frac{1}{6}\\end{bmatrix}<\/span>（與公式 <span class=\"m\">\\frac{1}{6}\\begin{bmatrix}4 &amp; -1\\\\ 2 &amp; 1\\end{bmatrix}<\/span> 一致，<span class=\"m\">\\det A=6<\/span>）。(3) <span class=\"m\">P(5I-P)=5P-P^2=6I<\/span>；<span class=\"m\">P<\/span> 與 <span class=\"m\">5I-P<\/span> 可交換，<span class=\"m\">(5I-P)P=6I<\/span>。故 <span class=\"m\">\\frac{1}{6}(5I-P)<\/span> 為 <span class=\"m\">P<\/span> 的反方陣。評分要點：(1) 計算正確（2 分）；(2) 寫出兩側乘積皆為 <span class=\"m\">I<\/span> 並求得 <span class=\"m\">A^{-1}<\/span>（3 分）；(3) 一般性證明，須說明常數項乘 <span class=\"m\">I<\/span> 與可交換（3 分）。","steps":["(1) <span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; 5\\\\ -10 &amp; 14\\end{bmatrix}<\/span>，<span class=\"m\">A^2-5A+6I=\\begin{bmatrix}-1-5+6 &amp; 5-5\\\\ -10+10 &amp; 14-20+6\\end{bmatrix}=O<\/span>。","(2) 由 (1)，<span class=\"m\">A(5I-A)=5A-A^2=6I<\/span>，且 <span class=\"m\">(5I-A)A=6I<\/span>，故 <span class=\"m\">A\\cdot\\frac{1}{6}(5I-A)=\\frac{1}{6}(5I-A)\\cdot A=I<\/span>，<span class=\"m\">A<\/span> 可逆，<span class=\"m\">A^{-1}=\\frac{1}{6}\\begin{bmatrix}4 &amp; -1\\\\ 2 &amp; 1\\end{bmatrix}=\\begin{bmatrix}\\frac{2}{3} &amp; -\\frac{1}{6}\\\\ \\frac{1}{3} &amp; \\frac{1}{6}\\end{bmatrix}<\/span>（與公式 <span class=\"m\">\\frac{1}{6}\\begin{bmatrix}4 &amp; -1\\\\ 2 &amp; 1\\end{bmatrix}<\/span> 一致，<span class=\"m\">\\det A=6<\/span>）。","(3) <span class=\"m\">P(5I-P)=5P-P^2=6I<\/span>；<span class=\"m\">P<\/span> 與 <span class=\"m\">5I-P<\/span> 可交換，<span class=\"m\">(5I-P)P=6I<\/span>。"],"hk":"hint"},{"id":"M8-34","unit":"M8","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A,B<\/span> 為二階方陣且 <span class=\"m\">AB=O<\/span>。(1) 證明：若 <span class=\"m\">A<\/span> 可逆，則 <span class=\"m\">B=O<\/span>。(2) 舉出一組 <span class=\"m\">A\\ne O<\/span>、<span class=\"m\">B\\ne O<\/span>，使 <span class=\"m\">AB=O<\/span> 但 <span class=\"m\">BA\\ne O<\/span>，並驗證之。","opts":[],"type":"open","ans":[],"key":"參考答案：","sol":"(1) <span class=\"m\">A<\/span> 可逆，<span class=\"m\">AB=O<\/span> 兩邊左乘 <span class=\"m\">A^{-1}<\/span>：<span class=\"m\">B=(A^{-1}A)B=A^{-1}(AB)=A^{-1}O=O<\/span>。(2) 例：<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span>，<span cl  0\\end{bmatrix}<\/span>，相等得 <span class=\"m\">a=d<\/span>。故 <span class=\"m\">A=\\begin{bmatrix}a &amp; 0\\\\ 0 &amp; a\\end{bmatrix}=aI<\/span>，取 <span class=\"m\">k=a<\/span> 即得。評分要點：選取適當的特殊方陣（3 分）；比較各元得 <span class=\"m\">b=c=0<\/span>（2 分）、<span class=\"m\">a=d<\/span>（2 分）；結論（1 分）。只驗證 <span class=\"m\">kI<\/span> 與所有方陣可交換（逆命題）者不給分。","steps":["設 <span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>。","取 <span class=\"m\">E_{11}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>：<span class=\"m\">AE_{11}=\\begin{bmatrix}a &amp; 0\\\\ c &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">E_{11}A=\\begin{bmatrix}a &amp; b\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，相等得 <span class=\"m\">b=0<\/span>、<span class=\"m\">c=0<\/span>。","再取 <span class=\"m\">E_{12}=\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}<\/span>：<span class=\"m\">AE_{12}=\\begin{bmatrix}0 &amp; a\\\\ 0 &amp; c\\end{bmatrix}<\/span>，<span class=\"m\">E_{12}A=\\begin{bmatrix}c &amp; d\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，相等得 <span class=\"m\">a=d<\/span>。"],"hk":"hint"},{"id":"M8-36","unit":"M8","set":"分級測驗","level":"非選擇題","src":"","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}5 &amp; 2\\\\ 4 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}-1 &amp; -6\\\\ -3 &amp; -8\\end{bmatrix}<\/span>。求滿足 <span class=\"m\">AX+B=2X<\/span> 的二階方陣 <span class=\"m\">X<\/span>，並寫出提出公因式的依據。","opts":[],"type":"open","ans":[],"key":"參考答案：","sol":"<span class=\"m\">AX+B=2X\\Rightarrow AX-2X=-B<\/span>。因 <span class=\"m\">2X=2IX<\/span>，由右分配律 <span class=\"m\">AX-2IX=(A-2I)X<\/span>，得 <span class=\"m\">(A-2I)X=-B<\/span>。<span class=\"m\">A-2I=\\begin{bmatrix}3 &amp; 2\\\\ 4 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">\\det=3-8=-5\\ne 0<\/span>，<span class=\"m\">(A-2I)^{-1}=-\\dfrac{1}{5}\\begin{bmatrix}1 &amp; -2\\\\ -4 &amp; 3\\end{bmatrix}<\/span>。<span class=\"m\">X=(A-2I)^{-1}(-B)=-\\dfrac{1}{5}\\begin{bmatrix}1 &amp; -2\\\\ -4 &amp; 3\\end{bmatr
