{bmatrix}<\/span>、<span class=\"m\">B=\\begin{bmatrix}b_1 &amp; b_2\\\\ b_3 &amp; b_4\\end{bmatrix}<\/span> 皆為坐標平面上以原點 <span class=\"m\">O<\/span> 為中心，逆時針旋轉一銳角的旋轉矩陣，且滿足 <span class=\"m\">A^2=B^3=\\begin{bmatrix}0 &amp; c\\\\ 1 &amp; d\\end{bmatrix}<\/span>，其中 <span class=\"m\">c,d<\/span> 為實數。設點 <span class=\"m\">P(1,1)<\/span> 經 <span class=\"m\">A^3<\/span> 變換後為點 <span class=\"m\">Q<\/span>，且點 <span class=\"m\">Q<\/span> 經 <span class=\"m\">B^4<\/span> 變換後為點 <span class=\"m\">R<\/span>。根據上述，試回答下列問題。<\/p>","pre":"","stem":"試求點 <span class=\"m\">Q<\/span> 的坐標，以及 <span class=\"m\">\\overrightarrow{OR}<\/span> 與向量 <span class=\"m\">(1,0)<\/span> 的夾角。（非選擇題，6 分）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">Q(-\\sqrt2,0)<\/span>；夾角 <span class=\"m\">60^\\circ<\/span>","sol":"\n<ol class=\"steps\"><li>設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 的旋轉角為 <span class=\"m\">\\alpha<\/span>、<span class=\"m\">\\beta<\/span>（皆為銳角）。<span class=\"m\">A^2<\/span> 旋轉 <span class=\"m\">2\\alpha<\/span>，<span class=\"m\">0^\\circ&lt;2\\alpha&lt;180^\\circ<\/span>，又 <span class=\"m\">2\\alpha<\/span> 與 <span class=\"m\">90^\\circ<\/span> 同界，故 <span class=\"m\">2\\alpha=90^\\circ<\/span>，<span class=\"m\">\\alpha=45^\\circ<\/span>。<\/li>\n<li><span class=\"m\">0^\\circ&lt;3\\beta&lt;270^\\circ<\/span> 且 <span class=\"m\">3\\beta<\/span> 與 <span class=\"m\">90^\\circ<\/span> 同界，故 <span class=\"m\">3\\beta=90^\\circ<\/span>，<span class=\"m\">\\beta=30^\\circ<\/span>。<span class=\"hand\">銳角條件保證唯一<\/span><\/li>\n<li><span class=\"m\">A^3<\/span> 為旋轉 <span class=\"m\">135^\\circ<\/span>。<span class=\"m\">\\overrightarrow{OP}=(1,1)<\/span>，長 <span class=\"m\">\\sqrt2<\/span>、方向角 <span class=\"m\">45^\\circ<\/span>，旋轉後方向角 <span class=\"m\">180^\\circ<\/span>，所以 <span class=\"m\">Q(-\\sqrt2,0)<\/span>。驗算：<span class=\"m\">A^3=\\begin{bmatrix}-\\frac{\\sqrt2}{2} &amp; -\\frac{\\sqrt2}{2}\\\\ \\frac{\\sqrt2}{2} &amp; -\\frac{\\sqrt2}{2}\\end{bmatrix}<\/span>，<span class=\"m\">A^3\\begin{bmatrix}1\\\\ 1\\end{bmatrix}=\\begin{bmatrix}-\\sqrt2\\\\ 0\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">B^4<\/span> 為旋轉 <span class=\"m\">120^\\circ<\/span>，<span class=\"m\">\\overrightarrow{OR}<\/span> 的方向角為 <span class=\"m\">180^\\circ+120^\\circ=300^\\circ<\/span>，<span class=\"m\">R\\left(\\frac{\\sqrt2}{2},-\\frac{\\sqrt6}{2}\\right)<\/span>。<\/li>\n<li><span class=\"m\">\\cos\\phi=\\dfrac{\\overrightarrow{OR}\\cdot(1,0)}{|\\overrightarrow{OR}|}=\\dfrac{\\sqrt2/2}{\\sqrt2}=\\dfrac12<\/span>，夾角 <span class=\"m\">\\phi=60^\\circ<\/span>。<\/li><\/ol>\n<p><strong>考點<\/strong>：旋轉矩陣的乘冪、以方向角處理旋轉、向量夾角　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把夾角寫成方向角 <span class=\"m\">300^\\circ<\/span>。兩向量的夾角介於 <span class=\"m\">0^\\circ<\/span> 與 <span class=\"m\">180^\\circ<\/span>，<span class=\"m\">300^\\circ<\/span> 方向與 <span class=\"m\">(1,0)<\/span> 的夾角是 <span class=\"m\">360^\\circ-300^\\circ=60^\\circ<\/span>。<\/p>","steps":["設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 的旋轉角為 <span class=\"m\">\\alpha<\/span>、<span class=\"m\">\\beta<\/span>（皆為銳角）。<span class=\"m\">A^2<\/span> 旋轉 <span class=\"m\">2\\alpha<\/span>，<span class=\"m\">0^\\circ&lt;2\\alpha&lt;180^\\circ<\/span>，又 <span class=\"m\">2\\alpha<\/span> 與 <span class=\"m\">90^\\circ<\/span> 同界，故 <span class=\"m\">2\\alpha=90^\\circ<\/span>，<span class=\"m\">\\alpha=45^\\circ<\/span>。","<span class=\"m\">0^\\circ&lt;3\\beta&lt;270^\\circ<\/span> 且 <span class=\"m\">3\\beta<\/span> 與 <span class=\"m\">90^\\circ<\/span> 同界，故 <span class=\"m\">3\\beta=90^\\circ<\/span>，<span class=\"m\">\\beta=30^\\circ<\/span>。<span class=\"hand\">銳角條件保證唯一<\/span>","<span class=\"m\">A^3<\/span> 為旋轉 <span class=\"m\">135^\\circ<\/span>。<span class=\"m\">\\overrightarrow{OP}=(1,1)<\/span>，長 <span class=\"m\">\\sqrt2<\/span>、方向角 <span class=\"m\">45^\\circ<\/span>，旋轉後方向角 <span class=\"m\">180^\\circ<\/span>，所以 <span class=\"m\">Q(-\\sqrt2,0)<\/span>。驗算：<span class=\"m\">A^3=\\begin{bmatrix}-\\frac{\\sqrt2}{2} &amp; -\\frac{\\sqrt2}{2}\\\\ \\frac{\\sqrt2}{2} &amp; -\\frac{\\sqrt2}{2}\\end{bmatrix}<\/span>，<span class=\"m\">A^3\\begin{bmatrix}1\\\\ 1\\end{bmatrix}=\\begin{bmatrix}-\\sqrt2\\\\ 0\\end{bmatrix}<\/span>。","<span class=\"m\">B^4<\/span> 為旋轉 <span class=\"m\">120^\\circ<\/span>，<span class=\"m\">\\overrightarrow{OR}<\/span> 的方向角為 <span class=\"m\">180^\\circ+120^\\circ=300^\\circ<\/span>，<span class=\"m\">R\\left(\\frac{\\sqrt2}{2},-\\frac{\\sqrt6}{2}\\right)<\/span>。","<span class=\"m\">\\cos\\phi=\\dfrac{\\overrightarrow{OR}\\cdot(1,0)}{|\\overrightarrow{OR}|}=\\dfrac{\\sqrt2/2}{\\sqrt2}=\\dfrac12<\/span>，夾角 <span class=\"m\">\\phi=60^\\circ<\/span>。"]},{"id":"T3-11","unit":"T3","set":"二、平面上的線性變換","level":"","src":"114 學測數A 第 20 題","ctx":"<p><strong>第 9–11 題為題組（114 學測數A 第 18–20 題）<\/strong><\/p>\n<p>已知 <span class=\"m\">A=\\begin{bmatrix}a_1 &amp; a_2\\\\ a_3 &amp; a_4\\end{bmatrix}<\/span>、<span class=\"m\">B=\\begin{bmatrix}b_1 &amp; b_2\\\\ b_3 &amp; b_4\\end{bmatrix}<\/span> 皆為坐標平面上以原點 <span class=\"m\">O<\/span> 為中心，逆時針旋轉一銳角的旋轉矩陣，且滿足 <span class=\"m\">A^2=B^3=\\begin{bmatrix}0 &amp; c\\\\ 1 &amp; d\\end{bmatrix}<\/span>，其中 <span class=\"m\">c,d<\/span> 為實數。設點 <span class=\"m\">P(1,1)<\/span> 經 <span class=\"m\">A^3<\/span> 變換後為點 <span class=\"m\">Q<\/span>，且點 <span class=\"m\">Q<\/span> 經 <span class=\"m\">B^4<\/span> 變換後為點 <span class=\"m\">R<\/span>。根據上述，試回答下列問題。<\/p>","pre":"","stem":"設 <span class=\"m\">L<\/span> 為過點 <span class=\"m\">P<\/span> 且與直線 <span class=\"m\">OQ<\/span> 平行的直線，點 <span class=\"m\">S<\/span> 為 <span class=\"m\">L<\/span> 和直線 <span class=\"m\">OR<\/span> 的交點，試求 <span class=\"m\">\\angle OSP<\/span>，並求點 <span class=\"m\">S<\/span> 的坐標。（非選擇題，6 分）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">\\angle OSP=60^\\circ<\/span>；<span class=\"m\">S\\left(-\\dfrac{\\sqrt3}{3},1\\right)<\/span>","sol":"\n<ol class=\"steps\"><li>直線 <span class=\"m\">OQ<\/span> 即 <span class=\"m\">x<\/span> 軸，<span class=\"m\">L<\/span> 為過 <span class=\"m\">P(1,1)<\/span> 的水平線 <span class=\"m\">y=1<\/span>。<\/li>\n<li>直線 <span class=\"m\">OR<\/span> 過原點與 <span class=\"m\">R\\left(\\frac{\\sqrt2}{2},-\\frac{\\sqrt6}{2}\\right)<\/span>，斜率 <span class=\"m\">-\\sqrt3<\/span>，方程式 <span class=\"m\">y=-\\sqrt3x<\/span>。<\/li>\n<li>聯立 <span class=\"m\">y=1<\/span>：<span class=\"m\">x=-\\frac{1}{\\sqrt3}=-\\frac{\\sqrt3}{3}<\/span>，故 <span class=\"m\">S\\left(-\\frac{\\sqrt3}{3},1\\right)<\/span>。<\/li>\n<li><span class=\"m\">\\overrightarrow{SP}=\\left(1+\\frac{\\sqrt3}{3},0\\right)<\/span> 指向 <span class=\"m\">x<\/span> 軸正向，<span class=\"m\">\\overrightarrow{SO}=\\left(\\frac{\\sqrt3}{3},-1\\right)<\/span>，<span class=\"m\">|\\overrightarrow{SO}|=\\frac{2\\sqrt3}{3}<\/span>。<span class=\"m\">\\cos\\angle OSP=\\dfrac{\\frac{\\sqrt3}{3}}{\\frac{2\\sqrt3}{3}}=\\dfrac12<\/span>，<span class=\"m\">\\angle OSP=60^\\circ<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　<span class=\"m\">L\\parallel x<\/span> 軸，<span class=\"m\">\\angle OSP<\/span> 與 <span class=\"m\">\\overrightarrow{OR}<\/span> 和 <span class=\"m\">x<\/span> 軸正向的夾角是內錯角，由第 19 題即得 <span class=\"m\">60^\\circ<\/span>。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 300\" width=\"440\">\n<defs><marker id=\"T3-ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"T3-arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<line x1=\"40\" y1=\"150\" x2=\"420\" y2=\"150\" stroke=\"#1f2a44\" stroke-width=\"1.4\" marker-end=\"url(#T3-ar)\"/>\n<line x1=\"230\" y1=\"290\" x2=\"230\" y2=\"18\" stroke=\"#1f2a44\" stroke-width=\"1.4\" marker-end=\"url(#T3-ar)\"/>\n<text x=\"410\" y=\"168\" font-size=\"15\" font-style=\"italic\">x<\/text>\n<text x=\"238\" y=\"28\" font-size=\"15\" font-style=\"italic\">y<\/text>\n<text x=\"214\" y=\"168\" font-size=\"14\" font-style=\"italic\">O<\/text>\n<line x1=\"50\" y1=\"60\" x2=\"410\" y2=\"60\" stroke=\"#2e8b57\" stroke-width=\"1.6\"/>\n<text x=\"384\" y=\"52\" font-size=\"14\" fill=\"#2e8b57\"><tspan font-style=\"italic\">L<\/tspan>：<tspan font-style=\"italic\">y<\/tspan>＝1<\/text>\n<line x1=\"178\" y1=\"60\" x2=\"306\" y2=\"281.7\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n<line x1=\"230\" y1=\"150\" x2=\"317\" y2=\"63\" stroke=\"#2f6fb5\" stroke-width=\"1.8\" marker-end=\"url(#T3-arb)\"/>\n<line x1=\"230\" y1=\"150\" x2=\"106\" y2=\"150\" stroke=\"#2f6fb5\" stroke-width=\"1.8\" marker-end=\"url(#T3-arb)\"/>\n<line x1=\"230\" y1=\"150\" x2=\"292\" y2=\"257.4\" stroke=\"#2f6fb5\" stroke-width=\"1.8\" marker-end=\"url(#T3-arb)\"/>\n<circle cx=\"320\" cy=\"60\" r=\"3.5\" fill=\"#1f2a44\"/><text x=\"326\" y=\"80\" font-size=\"14\" font-style=\"italic\">P<\/text><text x=\"338\" y=\"80\" font-size=\"13\">(1, 1)<\/text>\n<circle cx=\"102.7\" cy=\"150\" r=\"3.5\" fill=\"#1f2a44\"/><text x=\"70\" y=\"140\" font-size=\"14\" font-style=\"italic\">Q<\/text><text x=\"84\" y=\"140\" font-size=\"13\">(−√2, 0)<\/text>\n<circle cx=\"293.6\" cy=\"260.2\" r=\"3.5\" fill=\"#1f2a44\"/><text x=\"302\" y=\"268\" font-size=\"14\" font-style=\"italic\">R<\/text>\n<circle cx=\"178\" cy=\"60\" r=\"3.5\" fill=\"#c2410c\"/><text x=\"150\" y=\"50\" font-size=\"14\" font-style=\"italic\" fill=\"#c2410c\">S<\/text>\n<path d=\"M 198,60 A 20,20 0 0 1 188,77.3\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.4\"/>\n<text x=\"200\" y=\"84\" font-size=\"13\" fill=\"#c2410c\">60°<\/text>\n<path d=\"M 260,150 A 30,30 0 0 0 251.2,128.8\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.3\"/>\n<text x=\"262\" y=\"134\" font-size=\"12\" fill=\"#d9772b\">45°<\/text>\n<path d=\"M 250,150 A 20,20 0 0 1 240,167.3\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.3\"/>\n<text x=\"252\" y=\"178\" font-size=\"12\" fill=\"#d9772b\">60°<\/text>\n<\/svg><figcaption>圖 T3-1　<span class=\"m\">P<\/span> 經旋轉 <span class=\"m\">135^\\circ<\/span> 到 <span class=\"m\">Q<\/span>，再旋轉 <span class=\"m\">120^\\circ<\/span> 到 <span class=\"m\">R<\/span>；<span class=\"m\">L\\parallel OQ<\/span>，<span class=\"m\">\\angle OSP<\/span> 與 <span class=\"m\">OR<\/span> 對 <span class=\"m\">x<\/span> 軸的夾角為內錯角<\/figcaption><\/figure>\n<p><strong>考點<\/strong>：平行線的內錯角、直線交點、向量夾角　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把 <span class=\"m\">S<\/span> 取在 <span class=\"m\">L<\/span> 與射線 <span class=\"m\">OR<\/span> 上。<span class=\"m\">R<\/span> 在第四象限，<span class=\"m\">L<\/span> 在 <span class=\"m\">x<\/span> 軸上方，交點在直線 <span class=\"m\">OR<\/span> 往第二象限的延長部分，<span class=\"m\">S<\/span> 的 <span class=\"m\">x<\/span> 坐標為負。<\/p>","steps":["直線 <span class=\"m\">OQ<\/span> 即 <span class=\"m\">x<\/span> 軸，<span class=\"m\">L<\/span> 為過 <span class=\"m\">P(1,1)<\/span> 的水平線 <span class=\"m\">y=1<\/span>。","直線 <span class=\"m\">OR<\/span> 過原點與 <span class=\"m\">R\\left(\\frac{\\sqrt2}{2},-\\frac{\\sqrt6}{2}\\right)<\/span>，斜率 <span class=\"m\">-\\sqrt3<\/span>，方程式 <span class=\"m\">y=-\\sqrt3x<\/span>。","聯立 <span class=\"m\">y=1<\/span>：<span class=\"m\">x=-\\frac{1}{\\sqrt3}=-\\frac{\\sqrt3}{3}<\/span>，故 <span class=\"m\">S\\left(-\\frac{\\sqrt3}{3},1\\right)<\/span>。","<span class=\"m\">\\overrightarrow{SP}=\\left(1+\\frac{\\sqrt3}{3},0\\right)<\/span> 指向 <span class=\"m\">x<\/span> 軸正向，<span class=\"m\">\\overrightarrow{SO}=\\left(\\frac{\\sqrt3}{3},-1\\right)<\/span>，<span class=\"m\">|\\overrightarrow{SO}|=\\frac{2\\sqrt3}{3}<\/span>。<span class=\"m\">\\cos\\angle OSP=\\dfrac{\\frac{\\sqrt3}{3}}{\\frac{2\\sqrt3}{3}}=\\dfrac12<\/span>，<span class=\"m\">\\angle OSP=60^\\circ<\/span>。"]},{"id":"T3-12","unit":"T3","set":"二、平面上的線性變換","level":"","src":"113 學測數A 第 12 題","ctx":"","pre":"","stem":"在坐標平面上給定三點 <span class=\"m\">A(1,0)<\/span>、<span class=\"m\">B(0,1)<\/span>、<span class=\"m\">C(-1,0)<\/span>，令 <span class=\"m\">\\Gamma<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經矩陣 <span class=\"m\">T=\\begin{bmatrix}3 &amp; 0\\\\ a &amp; 1\\end{bmatrix}<\/span> 變換後的圖形，其中 <span class=\"m\">a<\/span> 為實數。試選出正確的選項。","opts":[{"k":"1","h":"若 <span class=\"m\">a=0<\/span>，則 <span class=\"m\">\\Gamma<\/span> 為等腰直角三角形"},{"k":"2","h":"<span class=\"m\">\\triangle ABC<\/span> 的邊上至少有兩點經 <span class=\"m\">T<\/span> 變換後坐標不變"},{"k":"3","h":"<span class=\"m\">\\Gamma<\/span> 必有部分落在第四象限"},{"k":"4","h":"平面上找得到一個圖形 <span class=\"m\">\\Omega<\/span> 經 <span class=\"m\">T<\/span> 變換後為 <span class=\"m\">\\triangle ABC<\/span>"},{"k":"5","h":"<span class=\"m\">\\Gamma<\/span> 的面積為定值"}],"type":"multi","ans":["2","4","5"],"key":"(2)(4)(5)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">T\\begin{bmatrix}x\\\\ y\\end{bmatrix}=\\begin{bmatrix}3x\\\\ ax+y\\end{bmatrix}<\/span>。三頂點的像：<span class=\"m\">A'(3,a)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,-a)<\/span>。線性變換把線段映成線段，<span class=\"m\">\\Gamma<\/span> 是 <span class=\"m\">\\triangle A'B'C'<\/span>。<\/li>\n<li>(1) <span class=\"m\">a=0<\/span> 時 <span class=\"m\">A'(3,0)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,0)<\/span>：<span class=\"m\">\\overline{A'B'}=\\overline{B'C'}=\\sqrt{10}<\/span>、<span class=\"m\">\\overline{A'C'}=6<\/span>，等腰；但 <span class=\"m\">10+10\\ne36<\/span>（<span class=\"m\">\\angle B'<\/span> 為鈍角），不是直角三角形，錯誤。<\/li>\n<li>(2) 坐標不變 <span class=\"m\">\\Leftrightarrow 3x=x<\/span> 且 <span class=\"m\">ax+y=y\\Leftrightarrow x=0<\/span>：<span class=\"m\">y<\/span> 軸上每一點都不動。<span class=\"m\">\\triangle ABC<\/span> 的邊與 <span class=\"m\">y<\/span> 軸交於 <span class=\"m\">B(0,1)<\/span> 與 <span class=\"m\">\\overline{AC}<\/span> 的中點 <span class=\"m\">O(0,0)<\/span>，至少兩點，正確。<\/li>\n<li>(3) 取 <span class=\"m\">a=0<\/span>，<span class=\"m\">\\Gamma<\/span> 落在 <span class=\"m\">y\\ge0<\/span> 的範圍，沒有任何點在第四象限，錯誤。（<span class=\"m\">a&lt;0<\/span> 時 <span class=\"m\">A'<\/span> 才在第四象限。）<\/li>\n<li>(4) <span class=\"m\">\\det T=3\\ne0<\/span>，<span class=\"m\">T<\/span> 可逆。取 <span class=\"m\">\\Omega<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經 <span class=\"m\">T^{-1}=\\frac13\\begin{bmatrix}1 &amp; 0\\\\ -a &amp; 3\\end{bmatrix}<\/span> 變換後的三角形，則 <span class=\"m\">T(\\Omega)=\\triangle ABC<\/span>，正確。<\/li>\n<li>(5) 面積比為 <span class=\"m\">|\\det T|=3<\/span>，<span class=\"m\">\\triangle ABC<\/span> 面積 <span class=\"m\">\\frac12\\cdot2\\cdot1=1<\/span>，<span class=\"m\">\\Gamma<\/span> 面積恆為 3，與 <span class=\"m\">a<\/span> 無關，正確。<span class=\"hand\">推移不改面積<\/span><\/li><\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 260\" width=\"420\">\n<defs><marker id=\"T3-ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"30\" y1=\"160\" x2=\"400\" y2=\"160\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#T3-ar2)\"/>\n<line x1=\"210\" y1=\"250\" x2=\"210\" y2=\"20\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#T3-ar2)\"/>\n<text x=\"392\" y=\"178\" font-size=\"15\" font-style=\"italic\">x<\/text><text x=\"217\" y=\"30\" font-size=\"15\" font-style=\"italic\">y<\/text>\n<polygon points=\"260,160 210,110 160,160\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/>\n<polygon points=\"360,160 210,110 60,160\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.8\"/>\n<polygon points=\"360,110 210,110 60,210\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<text x=\"258\" y=\"178\" font-size=\"14\" font-style=\"italic\">A<\/text><text x=\"214\" y=\"104\" font-size=\"14\" font-style=\"italic\">B<\/text><text x=\"150\" y=\"178\" font-size=\"14\" font-style=\"italic\">C<\/text>\n<text x=\"196\" y=\"176\" font-size=\"13\" font-style=\"italic\">O<\/text>\n<text x=\"352\" y=\"178\" font-size=\"13\" fill=\"#c2410c\">(3, 0)<\/text><text x=\"44\" y=\"178\" font-size=\"13\" fill=\"#c2410c\">(−3, 0)<\/text>\n<text x=\"352\" y=\"102\" font-size=\"13\" fill=\"#d9772b\">(3, 1)<\/text><text x=\"44\" y=\"226\" font-size=\"13\" fill=\"#d9772b\">(−3, −1)<\/text>\n<text x=\"300\" y=\"232\" font-size=\"13\" fill=\"#c2410c\">實線：<tspan font-style=\"italic\">a<\/tspan>＝0<\/text>\n<text x=\"300\" y=\"250\" font-size=\"13\" fill=\"#d9772b\">虛線：<tspan font-style=\"italic\">a<\/tspan>＝1<\/text>\n<\/svg><figcaption>圖 T3-2　<span class=\"m\">\\triangle ABC<\/span>（藍）經 <span class=\"m\">T<\/span> 變換後的 <span class=\"m\">\\Gamma<\/span>：<span class=\"m\">B<\/span> 與 <span class=\"m\">O<\/span> 不動，面積恆為 3<\/figcaption><\/figure>\n<p><strong>考點<\/strong>：線性變換下的頂點像、不動點、可逆性、面積比 <span class=\"m\">|\\det T|<\/span>　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>(2) 只檢查三個頂點，找到 <span class=\"m\">B<\/span> 一點就判錯。不動點集合是整條 <span class=\"m\">y<\/span> 軸，要看 <span class=\"m\">y<\/span> 軸與三角形「邊」的交點，<span class=\"m\">\\overline{AC}<\/span> 上的原點也算。<\/p>","steps":["<span class=\"m\">T\\begin{bmatrix}x\\\\ y\\end{bmatrix}=\\begin{bmatrix}3x\\\\ ax+y\\end{bmatrix}<\/span>。三頂點的像：<span class=\"m\">A'(3,a)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,-a)<\/span>。線性變換把線段映成線段，<span class=\"m\">\\Gamma<\/span> 是 <span class=\"m\">\\triangle A'B'C'<\/span>。","(1) <span class=\"m\">a=0<\/span> 時 <span class=\"m\">A'(3,0)<\/span>、<span class=\"m\">B'(0,1)<\/span>、<span class=\"m\">C'(-3,0)<\/span>：<span class=\"m\">\\overline{A'B'}=\\overline{B'C'}=\\sqrt{10}<\/span>、<span class=\"m\">\\overline{A'C'}=6<\/span>，等腰；但 <span class=\"m\">10+10\\ne36<\/span>（<span class=\"m\">\\angle B'<\/span> 為鈍角），不是直角三角形，錯誤。","(2) 坐標不變 <span class=\"m\">\\Leftrightarrow 3x=x<\/span> 且 <span class=\"m\">ax+y=y\\Leftrightarrow x=0<\/span>：<span class=\"m\">y<\/span> 軸上每一點都不動。<span class=\"m\">\\triangle ABC<\/span> 的邊與 <span class=\"m\">y<\/span> 軸交於 <span class=\"m\">B(0,1)<\/span> 與 <span class=\"m\">\\overline{AC}<\/span> 的中點 <span class=\"m\">O(0,0)<\/span>，至少兩點，正確。","(3) 取 <span class=\"m\">a=0<\/span>，<span class=\"m\">\\Gamma<\/span> 落在 <span class=\"m\">y\\ge0<\/span> 的範圍，沒有任何點在第四象限，錯誤。（<span class=\"m\">a&lt;0<\/span> 時 <span class=\"m\">A'<\/span> 才在第四象限。）","(4) <span class=\"m\">\\det T=3\\ne0<\/span>，<span class=\"m\">T<\/span> 可逆。取 <span class=\"m\">\\Omega<\/span> 為 <span class=\"m\">\\triangle ABC<\/span> 經 <span class=\"m\">T^{-1}=\\frac13\\begin{bmatrix}1 &amp; 0\\\\ -a &amp; 3\\end{bmatrix}<\/span> 變換後的三角形，則 <span class=\"m\">T(\\Omega)=\\triangle ABC<\/span>，正確。","(5) 面積比為 <span class=\"m\">|\\det T|=3<\/span>，<span class=\"m\">\\triangle ABC<\/span> 面積 <span class=\"m\">\\frac12\\cdot2\\cdot1=1<\/span>，<span class=\"m\">\\Gamma<\/span> 面積恆為 3，與 <span class=\"m\">a<\/span> 無關，正確。<span class=\"hand\">推移不改面積<\/span>"]},{"id":"T3-13","unit":"T3","set":"二、平面上的線性變換","level":"","src":"112 學測數A 第 11 題","ctx":"","pre":"","stem":"坐標平面上，設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 分別表示以原點為中心，順時針、逆時針旋轉 <span class=\"m\">90^\\circ<\/span> 的旋轉矩陣。設 <span class=\"m\">C<\/span>、<span class=\"m\">D<\/span> 分別表示以直線 <span class=\"m\">x=y<\/span>、<span class=\"m\">x=-y<\/span> 為鏡射軸的鏡射矩陣。試選出正確的選項。","opts":[{"k":"1","h":"<span class=\"m\">A<\/span>、<span class=\"m\">C<\/span> 將點 <span class=\"m\">(1,0)<\/span> 映射到同一點"},{"k":"2","h":"<span class=\"m\">A=-B<\/span>"},{"k":"3","h":"<span class=\"m\">C=D^{-1}<\/span>"},{"k":"4","h":"<span class=\"m\">AB=CD<\/span>"},{"k":"5","h":"<span class=\"m\">AC=BD<\/span>"}],"type":"multi","ans":["2","5"],"key":"(2)(5)","sol":"\n<ol class=\"steps\"><li>寫出矩陣：<span class=\"m\">A=R_{-90^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=R_{90^\\circ}=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(y,x)<\/span>，<span class=\"m\">C=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=-x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(-y,-x)<\/span>，<span class=\"m\">D=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>。<\/li>\n<li>(1) <span class=\"m\">A<\/span> 把 <span class=\"m\">(1,0)<\/span> 轉到 <span class=\"m\">(0,-1)<\/span>，<span class=\"m\">C<\/span> 把 <span class=\"m\">(1,0)<\/span> 映到 <span class=\"m\">(0,1)<\/span>，不同點，錯誤。<\/li>\n<li>(2) <span class=\"m\">-B=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=A<\/span>，正確。（順時針 <span class=\"m\">90^\\circ<\/span> 等於逆時針 <span class=\"m\">90^\\circ<\/span> 再轉 <span class=\"m\">180^\\circ<\/span>，而 <span class=\"m\">R_{180^\\circ}=-I<\/span>。）<\/li>\n<li>(3) 鏡射兩次回原處，<span class=\"m\">D^2=I<\/span>，<span class=\"m\">D^{-1}=D\\ne C<\/span>，錯誤。<\/li>\n<li>(4) <span class=\"m\">AB=I<\/span>（一順一逆抵消）；<span class=\"m\">CD=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>（對兩條互相垂直的軸各鏡射一次＝旋轉 <span class=\"m\">180^\\circ<\/span>），<span class=\"m\">AB\\ne CD<\/span>，錯誤。<\/li>\n<li>(5) <span class=\"m\">AC=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">BD=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，兩者都是對 <span class=\"m\">x<\/span> 軸的鏡射，正確。<\/li><\/ol>\n<div class=\"formula\" data-t=\"過原點直線的鏡射矩陣\"><div class=\"mb\">\\text{對傾斜角 }\\theta\\text{ 的直線鏡射：}\\ \\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix}<\/div><p><span class=\"m\">\\theta=45^\\circ<\/span> 得 <span class=\"m\">C<\/span>，<span class=\"m\">\\theta=135^\\circ<\/span> 得 <span class=\"m\">D<\/span>。鏡射矩陣的行列式為 <span class=\"m\">-1<\/span>，自己的反方陣是自己；兩鏡射合成為旋轉，旋轉角為兩軸夾角的兩倍。<\/p><\/div>\n<p><strong>考點<\/strong>：旋轉與鏡射矩陣、合成變換與矩陣乘法、反方陣　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把「順時針 <span class=\"m\">90^\\circ<\/span>」直接代入 <span class=\"m\">R_{90^\\circ}<\/span>，把 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 對調；本題 (2)(4)(5) 的對錯不受影響，但 (1) 會誤判為正確。<\/p>","steps":["寫出矩陣：<span class=\"m\">A=R_{-90^\\circ}=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=R_{90^\\circ}=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(y,x)<\/span>，<span class=\"m\">C=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>；對 <span class=\"m\">y=-x<\/span> 鏡射 <span class=\"m\">(x,y)\\mapsto(-y,-x)<\/span>，<span class=\"m\">D=\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}<\/span>。","(1) <span class=\"m\">A<\/span> 把 <span class=\"m\">(1,0)<\/span> 轉到 <span class=\"m\">(0,-1)<\/span>，<span class=\"m\">C<\/span> 把 <span class=\"m\">(1,0)<\/span> 映到 <span class=\"m\">(0,1)<\/span>，不同點，錯誤。","(2) <span class=\"m\">-B=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}=A<\/span>，正確。（順時針 <span class=\"m\">90^\\circ<\/span> 等於逆時針 <span class=\"m\">90^\\circ<\/span> 再轉 <span class=\"m\">180^\\circ<\/span>，而 <span class=\"m\">R_{180^\\circ}=-I<\/span>。）","(3) 鏡射兩次回原處，<span class=\"m\">D^2=I<\/span>，<span class=\"m\">D^{-1}=D\\ne C<\/span>，錯誤。","(4) <span class=\"m\">AB=I<\/span>（一順一逆抵消）；<span class=\"m\">CD=\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>（對兩條互相垂直的軸各鏡射一次＝旋轉 <span class=\"m\">180^\\circ<\/span>），<span class=\"m\">AB\\ne CD<\/span>，錯誤。","(5) <span class=\"m\">AC=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，<span class=\"m\">BD=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}0 &amp; -1\\\\ -1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span>，兩者都是對 <span class=\"m\">x<\/span> 軸的鏡射，正確。"]},{"id":"T3-14","unit":"T3","set":"二、平面上的線性變換","level":"","src":"110 試辦數A 第 18 題","ctx":"<p><strong>第 14–16 題為題組（110 學年度試辦考試數A 第 18–20 題）<\/strong><\/p>\n<p>以 <span class=\"m\">T<\/span> 表由 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}<\/span> 定義的平面線性變換，其中 <span class=\"m\">a<\/span>、<span class=\"m\">b<\/span> 為實數。試回答下列問題。<\/p>","pre":"","stem":"若 <span class=\"m\">T<\/span> 將點 <span class=\"m\">(0,1)<\/span> 映射到直線 <span class=\"m\">y=5x+13<\/span> 上一點，試問下列哪一選項是正確的？（單選題，3 分）","opts":[{"k":"1","h":"<span class=\"m\">a-5b=13<\/span>"},{"k":"2","h":"<span class=\"m\">a+5b=13<\/span>"},{"k":"3","h":"<span class=\"m\">5a-b=13<\/span>"},{"k":"4","h":"<span class=\"m\">5a+b=13<\/span>"},{"k":"5","h":"<span class=\"m\">-5a+b=13<\/span>"}],"type":"single","ans":["2"],"key":"(2)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}\\begin{bmatrix}0\\\\ 1\\end{bmatrix}=\\begin{bmatrix}-b\\\\ a\\end{bmatrix}<\/span>，像點為 <span class=\"m\">(-b,a)<\/span>。<span class=\"hand\">乘 [0,1]ᵀ 取出第二行<\/span><\/li>\n<li>代入 <span class=\"m\">y=5x+13<\/span>：<span class=\"m\">a=-5b+13<\/span>，即 <span class=\"m\">a+5b=13<\/span>。<\/li><\/ol>\n<p><strong>考點<\/strong>：矩陣乘向量　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>取成第二列 <span class=\"m\">(b,a)<\/span>，得 <span class=\"m\">a=5b+13<\/span>，即選項 (1)。<\/p>","steps":["<span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}\\begin{bmatrix}0\\\\ 1\\end{bmatrix}=\\begin{bmatrix}-b\\\\ a\\end{bmatrix}<\/span>，像點為 <span class=\"m\">(-b,a)<\/span>。<span class=\"hand\">乘 [0,1]ᵀ 取出第二行<\/span>","代入 <span class=\"m\">y=5x+13<\/span>：<span class=\"m\">a=-5b+13<\/span>，即 <span class=\"m\">a+5b=13<\/span>。"]},{"id":"T3-15","unit":"T3","set":"二、平面上的線性變換","level":"","src":"110 試辦數A 第 19 題","ctx":"<p><strong>第 14–16 題為題組（110 學年度試辦考試數A 第 18–20 題）<\/strong><\/p>\n<p>以 <span class=\"m\">T<\/span> 表由 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}<\/span> 定義的平面線性變換，其中 <span class=\"m\">a<\/span>、<span class=\"m\">b<\/span> 為實數。試回答下列問題。<\/p>","pre":"","stem":"若 <span class=\"m\">T<\/span> 將直線 <span class=\"m\">y=x+1<\/span> 上的點都映射到直線 <span class=\"m\">y=5x+13<\/span> 上，試求 <span class=\"m\">a<\/span>、<span class=\"m\">b<\/span>。（非選擇題，6 分）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">a=3<\/span>，<span class=\"m\">b=2<\/span>","sol":"\n<ol class=\"steps\"><li>直線 <span class=\"m\">y=x+1<\/span> 上的點寫成 <span class=\"m\">(t,t+1)<\/span>，<span class=\"m\">t\\in\\mathbb{R}<\/span>。像點 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}\\begin{bmatrix}t\\\\ t+1\\end{bmatrix}=\\begin{bmatrix}(a-b)t-b\\\\ (a+b)t+a\\end{bmatrix}<\/span>。<\/li>\n<li>代入 <span class=\"m\">y=5x+13<\/span>：<span class=\"m\">(a+b)t+a=5(a-b)t-5b+13<\/span>，整理為 <span class=\"m\">(6b-4a)t+(a+5b-13)=0<\/span>。<\/li>\n<li>對所有實數 <span class=\"m\">t<\/span> 成立，係數皆為 0：<span class=\"m\">\\begin{cases}2a-3b=0\\\\ a+5b=13\\end{cases}<\/span>，解得 <span class=\"m\">a=3<\/span>、<span class=\"m\">b=2<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　取直線上兩點 <span class=\"m\">(0,1)<\/span>、<span class=\"m\">(-1,0)<\/span>，像點 <span class=\"m\">(-b,a)<\/span>、<span class=\"m\">(-a,-b)<\/span> 都在 <span class=\"m\">y=5x+13<\/span> 上：<span class=\"m\">a+5b=13<\/span>、<span class=\"m\">5a-b=13<\/span>，同樣得 <span class=\"m\">a=3<\/span>、<span class=\"m\">b=2<\/span>。<\/p>\n<p><strong>考點<\/strong>：直線的參數式、恆等式係數比較　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>只用一個點列出一條方程式就想解兩個未知數。「直線上所有點」要用參數式或取兩點。<\/p>","steps":["直線 <span class=\"m\">y=x+1<\/span> 上的點寫成 <span class=\"m\">(t,t+1)<\/span>，<span class=\"m\">t\\in\\mathbb{R}<\/span>。像點 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}\\begin{bmatrix}t\\\\ t+1\\end{bmatrix}=\\begin{bmatrix}(a-b)t-b\\\\ (a+b)t+a\\end{bmatrix}<\/span>。","代入 <span class=\"m\">y=5x+13<\/span>：<span class=\"m\">(a+b)t+a=5(a-b)t-5b+13<\/span>，整理為 <span class=\"m\">(6b-4a)t+(a+5b-13)=0<\/span>。","對所有實數 <span class=\"m\">t<\/span> 成立，係數皆為 0：<span class=\"m\">\\begin{cases}2a-3b=0\\\\ a+5b=13\\end{cases}<\/span>，解得 <span class=\"m\">a=3<\/span>、<span class=\"m\">b=2<\/span>。"]},{"id":"T3-16","unit":"T3","set":"二、平面上的線性變換","level":"","src":"110 試辦數A 第 20 題","ctx":"<p><strong>第 14–16 題為題組（110 學年度試辦考試數A 第 18–20 題）<\/strong><\/p>\n<p>以 <span class=\"m\">T<\/span> 表由 <span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}<\/span> 定義的平面線性變換，其中 <span class=\"m\">a<\/span>、<span class=\"m\">b<\/span> 為實數。試回答下列問題。<\/p>","pre":"","stem":"（承 19 題）設 <span class=\"m\">P,Q<\/span> 為平面上兩相異點，令 <span class=\"m\">P'=T(P)<\/span>、<span class=\"m\">Q'=T(Q)<\/span>，試說明 <span class=\"m\">\\dfrac{\\overline{P'Q'}}{\\overline{PQ}}<\/span> 為定值，並求此值。（非選擇題，6 分）","opts":[],"type":"open","ans":[],"key":"定值 <span class=\"m\">\\sqrt{13}<\/span>","sol":"\n<ol class=\"steps\"><li>由第 19 題，<span class=\"m\">T=\\begin{bmatrix}3 &amp; -2\\\\ 2 &amp; 3\\end{bmatrix}<\/span>。設 <span class=\"m\">\\overrightarrow{PQ}=(h,k)\\ne(0,0)<\/span>。<\/li>\n<li>線性變換保持向量的線性關係：<span class=\"m\">\\overrightarrow{P'Q'}=T\\begin{bmatrix}h\\\\ k\\end{bmatrix}=\\begin{bmatrix}3h-2k\\\\ 2h+3k\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">\\overline{P'Q'}^{\\,2}=(3h-2k)^2+(2h+3k)^2=13h^2+13k^2=13\\,\\overline{PQ}^{\\,2}<\/span>。<\/li>\n<li>故 <span class=\"m\">\\dfrac{\\overline{P'Q'}}{\\overline{PQ}}=\\sqrt{13}<\/span>，與 <span class=\"m\">P,Q<\/span> 的選取無關，為定值。<\/li><\/ol>\n<div class=\"tip\"><p><strong>深究　旋轉伸縮型矩陣<\/strong><\/p><p><span class=\"m\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}=\\sqrt{a^2+b^2}\\begin{bmatrix}\\cos\\varphi &amp; -\\sin\\varphi\\\\ \\sin\\varphi &amp; \\cos\\varphi\\end{bmatrix}<\/span>，其中 <span class=\"m\">\\cos\\varphi=\\frac{a}{\\sqrt{a^2+b^2}}<\/span>、<span class=\"m\">\\sin\\varphi=\\frac{b}{\\sqrt{a^2+b^2}}<\/span>：先旋轉 <span class=\"m\">\\varphi<\/span> 再以原點為中心伸縮 <span class=\"m\">\\sqrt{a^2+b^2}<\/span> 倍。所有長度放大 <span class=\"m\">\\sqrt{a^2+b^2}<\/span> 倍，面積放大 <span class=\"m\">a^2+b^2=\\det T<\/span> 倍，圖形保持相似。對照複數乘法 <span class=\"m\">(a+bi)(x+yi)<\/span>。<\/p><\/div>\n<p><strong>考點<\/strong>：線性變換作用於向量、長度比　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>以面積比 <span class=\"m\">\\det T=13<\/span> 當作長度比。長度比是 <span class=\"m\">\\sqrt{13}<\/span>；只有旋轉伸縮型（相似變換）才有固定長度比，一般矩陣的長度比隨方向改變。<\/p>","steps":["由第 19 題，<span class=\"m\">T=\\begin{bmatrix}3 &amp; -2\\\\ 2 &amp; 3\\end{bmatrix}<\/span>。設 <span class=\"m\">\\overrightarrow{PQ}=(h,k)\\ne(0,0)<\/span>。","線性變換保持向量的線性關係：<span class=\"m\">\\overrightarrow{P'Q'}=T\\begin{bmatrix}h\\\\ k\\end{bmatrix}=\\begin{bmatrix}3h-2k\\\\ 2h+3k\\end{bmatrix}<\/span>。","<span class=\"m\">\\overline{P'Q'}^{\\,2}=(3h-2k)^2+(2h+3k)^2=13h^2+13k^2=13\\,\\overline{PQ}^{\\,2}<\/span>。","故 <span class=\"m\">\\dfrac{\\overline{P'Q'}}{\\overline{PQ}}=\\sqrt{13}<\/span>，與 <span class=\"m\">P,Q<\/span> 的選取無關，為定值。"]},{"id":"T3-17","unit":"T3","set":"二、平面上的線性變換","level":"","src":"數A參考試卷 第 6 題","ctx":"","pre":"","stem":"考慮坐標平面上的直線 <span class=\"m\">L:3x-2y=1<\/span>。若 <span class=\"m\">a<\/span> 為實數且二階方陣 <span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}<\/span> 所代表的線性變換可以將 <span class=\"m\">L<\/span> 上的點變換到一條斜率為 2 的直線，則 <span class=\"m\">a<\/span> 的值為下列哪一個選項？","opts":[{"k":"1","h":"6"},{"k":"2","h":"8"},{"k":"3","h":"10"},{"k":"4","h":"12"},{"k":"5","h":"14"}],"type":"single","ans":["5"],"key":"(5)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">L<\/span> 的斜率 <span class=\"m\">\\frac32<\/span>，方向向量 <span class=\"m\">(2,3)<\/span>。<span class=\"m\">L<\/span> 上的點寫成 <span class=\"m\">P_0+t(2,3)<\/span>，像點為 <span class=\"m\">MP_0+t\\,M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>，所以像直線的方向向量是 <span class=\"m\">M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}\\begin{bmatrix}2\\\\ 3\\end{bmatrix}=\\begin{bmatrix}2\\\\ 2a-24\\end{bmatrix}<\/span>，斜率 <span class=\"m\">\\frac{2a-24}{2}=a-12<\/span>。<\/li>\n<li><span class=\"m\">a-12=2<\/span>，<span class=\"m\">a=14<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　取 <span class=\"m\">L<\/span> 上兩點 <span class=\"m\">(1,1)<\/span>、<span class=\"m\">(-1,-2)<\/span>，像點 <span class=\"m\">(1,a-8)<\/span>、<span class=\"m\">(-1,16-a)<\/span>，斜率 <span class=\"m\">\\frac{(a-8)-(16-a)}{2}=a-12=2<\/span>。<\/p>\n<p><strong>考點<\/strong>：線性變換把直線映成直線、方向向量的像　<strong>對應<\/strong>：M9<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>拿法向量 <span class=\"m\">(3,-2)<\/span> 去乘矩陣。法向量經變換後一般不再垂直於像直線；要變換的是方向向量。<\/p>","steps":["<span class=\"m\">L<\/span> 的斜率 <span class=\"m\">\\frac32<\/span>，方向向量 <span class=\"m\">(2,3)<\/span>。<span class=\"m\">L<\/span> 上的點寫成 <span class=\"m\">P_0+t(2,3)<\/span>，像點為 <span class=\"m\">MP_0+t\\,M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>，所以像直線的方向向量是 <span class=\"m\">M\\begin{bmatrix}2\\\\ 3\\end{bmatrix}<\/span>。","<span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ a &amp; -8\\end{bmatrix}\\begin{bmatrix}2\\\\ 3\\end{bmatrix}=\\begin{bmatrix}2\\\\ 2a-24\\end{bmatrix}<\/span>，斜率 <span class=\"m\">\\frac{2a-24}{2}=a-12<\/span>。","<span class=\"m\">a-12=2<\/span>，<span class=\"m\">a=14<\/span>。"]},{"id":"T3-18","unit":"T3","set":"三、轉移矩陣","level":"","src":"104 學測數學 選填 G","ctx":"","pre":"","stem":"某一公司，有 A、B、C 三個營業據點，開始時各有 36 位營業員，為了讓營業員了解各據點業務狀況，所以進行兩次調動。每次調動都是：<br>將當時 A 據點營業員中的 1/6 調到 B 據點、1/6 調到 C 據點；<br>將當時 B 據點營業員中的 1/6 調到 A 據點、1/3 調到 C 據點；<br>將當時 C 據點營業員中的 1/6 調到 A 據點、1/6 調到 B 據點。<br>則兩次的調動後，C 據點有 <span class=\"m\">\\fbox{27}\\,\\fbox{28}<\/span> 位營業員。","opts":[],"type":"open","ans":[],"key":"44","sol":"\n<ol class=\"steps\"><li>A 留下 <span class=\"m\">1-\\frac16-\\frac16=\\frac23<\/span>，B 留下 <span class=\"m\">1-\\frac16-\\frac13=\\frac12<\/span>，C 留下 <span class=\"m\">\\frac23<\/span>。以 <span class=\"m\">X_n=\\begin{bmatrix}A_n\\\\ B_n\\\\ C_n\\end{bmatrix}<\/span> 表第 <span class=\"m\">n<\/span> 次調動後的人數，<span class=\"m\">X_{n+1}=MX_n<\/span>，<div class=\"mb\">M=\\begin{bmatrix}\\frac23 &amp; \\frac16 &amp; \\frac16\\\\ \\frac16 &amp; \\frac12 &amp; \\frac16\\\\ \\frac16 &amp; \\frac13 &amp; \\frac23\\end{bmatrix}<\/div>第 <span class=\"m\">j<\/span> 行是第 <span class=\"m\">j<\/span> 個據點人員的去向，每一行和為 1。<\/li>\n<li>第一次：<span class=\"m\">X_1=M\\begin{bmatrix}36\\\\ 36\\\\ 36\\end{bmatrix}=\\begin{bmatrix}24+6+6\\\\ 6+18+6\\\\ 6+12+24\\end{bmatrix}=\\begin{bmatrix}36\\\\ 30\\\\ 42\\end{bmatrix}<\/span>。<\/li>\n<li>第二次：<span class=\"m\">C_2=\\frac16\\cdot36+\\frac13\\cdot30+\\frac23\\cdot42=6+10+28=44<\/span>。（同理 <span class=\"m\">A_2=36<\/span>、<span class=\"m\">B_2=28<\/span>，總數 108 不變。）<\/li><\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 300\" width=\"420\">\n<defs><marker id=\"T3-ar3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f6fb5\"/><\/marker><\/defs>\n<circle cx=\"110\" cy=\"80\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"104\" y=\"86\" font-size=\"17\">A<\/text>\n<circle cx=\"330\" cy=\"80\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"324\" y=\"86\" font-size=\"17\">B<\/text>\n<circle cx=\"220\" cy=\"230\" r=\"24\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.6\"/><text x=\"214\" y=\"236\" font-size=\"17\">C<\/text>\n<path d=\"M 132,68 Q 220,28 306,68\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"212\" y=\"40\" font-size=\"14\">1/6<\/text>\n<path d=\"M 307,93 Q 220,128 133,93\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"212\" y=\"128\" font-size=\"14\">1/6<\/text>\n<path d=\"M 92,97 Q 110,200 196,234\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"94\" y=\"196\" font-size=\"14\">1/6<\/text>\n<path d=\"M 204,212 Q 160,150 126,100\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"166\" y=\"160\" font-size=\"14\">1/6<\/text>\n<path d=\"M 348,97 Q 330,200 244,234\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"326\" y=\"196\" font-size=\"14\" fill=\"#c2410c\">1/3<\/text>\n<path d=\"M 236,212 Q 280,150 314,100\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.5\" marker-end=\"url(#T3-ar3)\"/><text x=\"258\" y=\"160\" font-size=\"14\">1/6<\/text>\n<path d=\"M 88,70 C 40,40 40,120 88,92\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#T3-ar3)\"/><text x=\"22\" y=\"86\" font-size=\"14\" fill=\"#2e8b57\">2/3<\/text>\n<path d=\"M 352,70 C 400,40 400,120 352,92\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#T3-ar3)\"/><text x=\"398\" y=\"86\" font-size=\"14\" fill=\"#2e8b57\">1/2<\/text>\n<path d=\"M 206,250 C 180,295 260,295 234,250\" fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"1.4\" marker-end=\"url(#T3-ar3)\"/><text x=\"262\" y=\"288\" font-size=\"14\" fill=\"#2e8b57\">2/3<\/text>\n<\/svg><figcaption>圖 T3-3　每次調動的轉移圖：箭頭上的數為「當時人數」的比例，每個據點流出比例（含留下）總和為 1<\/figcaption><\/figure>\n<p><strong>考點<\/strong>：轉移矩陣的建立、<span class=\"m\">X_{n+1}=MX_n<\/span>　<strong>對應<\/strong>：M10<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>第二次調動仍以 36 人計算調出人數。每次調動依「當時」人數按比例分配，必須先算出第一次調動後的人數。<\/p>","steps":["A 留下 <span class=\"m\">1-\\frac16-\\frac16=\\frac23<\/span>，B 留下 <span class=\"m\">1-\\frac16-\\frac13=\\frac12<\/span>，C 留下 <span class=\"m\">\\frac23<\/span>。以 <span class=\"m\">X_n=\\begin{bmatrix}A_n\\\\ B_n\\\\ C_n\\end{bmatrix}<\/span> 表第 <span class=\"m\">n<\/span> 次調動後的人數，<span class=\"m\">X_{n+1}=MX_n<\/span>，<div class=\"mb\">M=\\begin{bmatrix}\\frac23 &amp; \\frac16 &amp; \\frac16\\\\ \\frac16 &amp; \\frac12 &amp; \\frac16\\\\ \\frac16 &amp; \\frac13 &amp; \\frac23\\end{bmatrix}<\/div>第 <span class=\"m\">j<\/span> 行是第 <span class=\"m\">j<\/span> 個據點人員的去向，每一行和為 1。","第一次：<span class=\"m\">X_1=M\\begin{bmatrix}36\\\\ 36\\\\ 36\\end{bmatrix}=\\begin{bmatrix}24+6+6\\\\ 6+18+6\\\\ 6+12+24\\end{bmatrix}=\\begin{bmatrix}36\\\\ 30\\\\ 42\\end{bmatrix}<\/span>。","第二次：<span class=\"m\">C_2=\\frac16\\cdot36+\\frac13\\cdot30+\\frac23\\cdot42=6+10+28=44<\/span>。（同理 <span class=\"m\">A_2=36<\/span>、<span class=\"m\">B_2=28<\/span>，總數 108 不變。）"]},{"id":"T3-19","unit":"T3","set":"三、轉移矩陣","level":"","src":"103 學測數學 選填 G","ctx":"","pre":"","stem":"已知 <span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span> 是一個轉移矩陣，並且其行列式（值）為 <span class=\"m\">\\dfrac58<\/span>。則 <span class=\"m\">a+d=\\dfrac{\\fbox{30}\\,\\fbox{31}}{\\fbox{32}}<\/span>。（化為最簡分數）","opts":[],"type":"open","ans":[],"key":"<span class=\"m\">\\dfrac{13}{8}<\/span>","sol":"\n<ol class=\"steps\"><li>轉移矩陣的元素皆非負，且每一行和為 1：<span class=\"m\">a+c=1<\/span>、<span class=\"m\">b+d=1<\/span>，即 <span class=\"m\">c=1-a<\/span>、<span class=\"m\">b=1-d<\/span>。<\/li>\n<li><span class=\"m\">ad-bc=ad-(1-d)(1-a)=ad-(1-a-d+ad)=a+d-1<\/span>。<\/li>\n<li><span class=\"m\">a+d-1=\\frac58<\/span>，<span class=\"m\">a+d=\\frac{13}{8}<\/span>。<\/li><\/ol>\n<p><strong>補充<\/strong>　若採「每一列和為 1」的約定（<span class=\"m\">b=1-a<\/span>、<span class=\"m\">c=1-d<\/span>），<span class=\"m\">ad-bc=ad-(1-a)(1-d)=a+d-1<\/span>，結果相同；兩種約定互為轉置，而 <span class=\"m\">\\det A^{T}=\\det A<\/span>。<\/p>\n<div class=\"formula\" data-t=\"二階轉移矩陣\"><div class=\"mb\">A=\\begin{bmatrix}a &amp; 1-d\\\\ 1-a &amp; d\\end{bmatrix}:\\quad \\det A=a+d-1,\\qquad -1\\le\\det A\\le 1<\/div><p>另一個特徵值為 <span class=\"m\">a+d-1<\/span>（一個特徵值恆為 1），所以 <span class=\"m\">|a+d-1|&lt;1<\/span> 時 <span class=\"m\">A^n<\/span> 收斂到穩定狀態（進階）。<\/p><\/div>\n<p><strong>考點<\/strong>：轉移矩陣的定義、二階行列式　<strong>對應<\/strong>：M10、M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>忘了轉移矩陣的元素有「和為 1」的限制，以為四個未知數只有一個條件而無法求。<\/p>","steps":["轉移矩陣的元素皆非負，且每一行和為 1：<span class=\"m\">a+c=1<\/span>、<span class=\"m\">b+d=1<\/span>，即 <span class=\"m\">c=1-a<\/span>、<span class=\"m\">b=1-d<\/span>。","<span class=\"m\">ad-bc=ad-(1-d)(1-a)=ad-(1-a-d+ad)=a+d-1<\/span>。","<span class=\"m\">a+d-1=\\frac58<\/span>，<span class=\"m\">a+d=\\frac{13}{8}<\/span>。"]}],"examples":[],"mis":[],"check":[]},"S3":{"id":"S3","title":"綜合題庫：矩陣","subject":"數學","src":"","secs":[{"t":"使用說明與題型分布","h":"<p>範圍：M8–M10（矩陣運算與二階反方陣、平面上的線性變換、二階轉移矩陣與穩定狀態），並結合 M7 的高斯消去法。共 42 題，依主題分四節；第四節與各節中標「跨單元」者為綜合題。<\/p>\n<div class=\"key\"><p><strong>約定<\/strong>：轉移矩陣每一<strong>行（column）<\/strong>的元素和為 1；第 <span class=\"m\">n<\/span> 期的狀態以行向量 <span class=\"m\">x_n<\/span> 表示，<span class=\"m\">x_{n+1}=Ax_n<\/span>。點 <span class=\"m\">(x,y)<\/span> 經二階方陣 <span class=\"m\">A<\/span> 的線性變換，指 <span class=\"m\">\\begin{bmatrix}x'\\\\ y'\\end{bmatrix}=A\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/span>；「先 <span class=\"m\">T_1<\/span> 再 <span class=\"m\">T_2<\/span>」的合成矩陣為 <span class=\"m\">A_2A_1<\/span>。<span class=\"hand\">合成順序由右往左讀<\/span><\/p><p>注意：另一種約定為每一<strong>列<\/strong>和為 1、狀態以列向量右乘（見 M10），本單元不採用。標「（進階）」的 S3-40–S3-42 涉及三階轉移矩陣、斜向反射與特徵向量，超出課綱計算範圍，供延伸練習。<\/p><\/div>\n<table class=\"t\"><thead><tr><th>題號範圍<\/th><th>題型<\/th><th>主題<\/th><th>難度<\/th><\/tr><\/thead><tbody>\n<tr><td>01–03<\/td><td>單選、選填、單選<\/td><td>運算性質、矩陣作為資料表、行列式<\/td><td>基礎<\/td><\/tr>\n<tr><td>04–08<\/td><td>選填、單選、多選、多選、選填<\/td><td>方陣乘冪、矩陣方程、零因子、基本列運算（跨單元 M7）<\/td><td>進階<\/td><\/tr>\n<tr><td>09–12<\/td><td>多選、多選、選填、非選<\/td><td>冪零方陣、反方陣性質、含參數聯立（跨單元 M7）、二階方陣恆等式證明<\/td><td>進階～挑戰<\/td><\/tr>\n<tr><td>13–14<\/td><td>單選、選填<\/td><td>合成變換的順序、面積比<\/td><td>基礎<\/td><\/tr>\n<tr><td>15–18<\/td><td>多選、單選、選填、多選<\/td><td>推移、對斜線鏡射、旋轉、不可逆變換<\/td><td>進階～挑戰<\/td><\/tr>\n<tr><td>19–22<\/td><td>單選、混合、多選、單選<\/td><td>由像求矩陣（跨單元 M8）、不變直線、鏡射與旋轉的合成、面積比<\/td><td>進階～挑戰<\/td><\/tr>\n<tr><td>23–25<\/td><td>題組：單選、多選、選填<\/td><td>鏡射與推移的合成、反變換、乘冪（跨單元 M8）<\/td><td>基礎～挑戰<\/td><\/tr>\n<tr><td>26–30<\/td><td>多選、選填、多選、單選、選填<\/td><td>轉移矩陣的判定、<span class=\"m\">n<\/span> 期分布、穩定狀態、收斂速度<\/td><td>基礎～挑戰<\/td><\/tr>\n<tr><td>31–34<\/td><td>單選、多選、非選、多選<\/td><td>回推初始狀態（跨單元 M8）、天氣模型、由 <span class=\"m\">A^2<\/span> 求 <span class=\"m\">A<\/span>、吸收與週期<\/td><td>進階～挑戰<\/td><\/tr>\n<tr><td>35–37<\/td><td>題組：單選、選填、混合<\/td><td>單車流動、穩定狀態、乘冪公式（跨單元 M8）<\/td><td>基礎～挑戰<\/td><\/tr>\n<tr><td>38–42<\/td><td>多選、選填、選填、多選、非選<\/td><td>轉移矩陣視為線性變換、旋轉乘冪、三區遷移與高斯消去（進階）、<span class=\"m\">A^2=I<\/span>（進階）、收斂證明（進階）（全為跨單元）<\/td><td>進階～挑戰<\/td><\/tr>\n<\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>統計<\/th><th>題數<\/th><th>題號<\/th><\/tr><\/thead><tbody>\n<tr><td>單選<\/td><td>11<\/td><td>01、03、05、13、16、19、22、23、29、31、35<\/td><\/tr>\n<tr><td>多選<\/td><td>14<\/td><td>06、07、09、10、15、18、21、24、26、28、32、34、38、41<\/td><\/tr>\n<tr><td>選填<\/td><td>12<\/td><td>02、04、08、11、14、17、25、27、30、36、39、40<\/td><\/tr>\n<tr><td>混合、非選<\/td><td>5<\/td><td>12、20、33、37、42<\/td><\/tr>\n<tr><td>基礎／進階／挑戰<\/td><td>9／19／14<\/td><td>難度標於各題題號後<\/td><\/tr>\n<tr><td>跨單元<\/td><td>16<\/td><td>07、11、19、22、23–25、31、35–37、38–42<\/td><\/tr>\n<\/tbody><\/table>"},{"t":"一、矩陣的運算與反方陣","h":"<p class=\"qlink\" data-q=\"S3-01\">本節有 12 題練習（S3-01～S3-12），到「練習」分頁作答。<\/p>"},{"t":"二、平面上的線性變換","h":"<p class=\"qlink\" data-q=\"S3-13\">本節有 13 題練習（S3-13～S3-25），到「練習」分頁作答。<\/p>"},{"t":"三、轉移矩陣與穩定狀態","h":"<p class=\"qlink\" data-q=\"S3-26\">本節有 12 題練習（S3-26～S3-37），到「練習」分頁作答。<\/p>"},{"t":"四、跨單元綜合","h":"<p class=\"qlink\" data-q=\"S3-38\">本節有 5 題練習（S3-38～S3-42），到「練習」分頁作答。<\/p>"}],"questions":[{"id":"S3-01","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">基礎｜M8<\/span>設 <span class=\"m\">A<\/span>、<span class=\"m\">B<\/span> 為任意二階方陣，<span class=\"m\">I<\/span> 為二階單位方陣，<span class=\"m\">O<\/span> 為二階零矩陣。下列何者恆成立？","opts":[{"k":"A","h":"<span class=\"m\">(A+B)^2=A^2+2AB+B^2<\/span>"},{"k":"B","h":"<span class=\"m\">(A+B)(A-B)=A^2-B^2<\/span>"},{"k":"C","h":"<span class=\"m\">(A+I)(A-I)=A^2-I<\/span>"},{"k":"D","h":"若 <span class=\"m\">AB=O<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">B=O<\/span>"},{"k":"E","h":"若 <span class=\"m\">A^2=A<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">A=I<\/span>"}],"type":"single","ans":["C"],"key":"(C)","sol":"(A) 展開 <span class=\"m\">(A+B)^2=A^2+AB+BA+B^2<\/span>，矩陣乘法不具交換律，<span class=\"m\">AB+BA<\/span> 未必等於 <span class=\"m\">2AB<\/span>，錯。(B) <span class=\"m\">(A+B)(A-B)=A^2-AB+BA-B^2<\/span>，同理錯。(C) <span class=\"m\">I<\/span> 與任何方陣可交換：<span class=\"m\">(A+I)(A-I)=A^2-AI+IA-I^2=A^2-I<\/span>，正確。(D) 反例 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}0 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">AB=O<\/span> 但兩者皆非零矩陣，錯。(E) 同一個 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span> 滿足 <span class=\"m\">A^2=A<\/span>，但 <span class=\"m\">A\\ne O<\/span>、<span class=\"m\">A\\ne I<\/span>，錯。","steps":["先排除 (A)：展開 <span class=\"m\">(A+B)^2=A^2+AB+BA+B^2<\/span>，矩陣乘法不具交換律，<span class=\"m\">AB+BA<\/span> 未必等於 <span class=\"m\">2AB<\/span>，錯。","先排除 (B)：<span class=\"m\">(A+B)(A-B)=A^2-AB+BA-B^2<\/span>，同理錯。","先排除 (D)：反例 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}0 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">AB=O<\/span> 但兩者皆非零矩陣，錯。"],"hk":"hint"},{"id":"S3-02","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">基礎｜M8<\/span>某飲料店有甲、乙兩家分店，某日三種飲料的銷售杯數與每杯的售價、成本如下，以矩陣表示（<span class=\"m\">S<\/span> 的列依序為甲店、乙店，行依序為紅茶、奶茶、果汁；<span class=\"m\">C<\/span> 的列依序為紅茶、奶茶、果汁，行依序為每杯售價、每杯成本，單位：元）：\n<div class=\"mb\">S=\\begin{bmatrix}30 &amp; 20 &amp; 10\\\\ 25 &amp; 40 &amp; 15\\end{bmatrix},\\qquad C=\\begin{bmatrix}50 &amp; 20\\\\ 40 &amp; 15\\\\ 60 &amp; 25\\end{bmatrix}<\/div>\n令 <span class=\"m\">P=SC<\/span>。<span class=\"m\">P<\/span> 的第 2 列第 1 行元素減去第 2 列第 2 行元素，所得之值為 ＿＿＿ 元。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：2275","sol":"<span class=\"m\">P<\/span> 的第 2 列為乙店那一列與 <span class=\"m\">C<\/span> 各行的乘積：第 1 行（營收）<span class=\"m\">25\\cdot 50+40\\cdot 40+15\\cdot 60=1250+1600+900=3750<\/span>；第 2 行（成本）<span class=\"m\">25\\cdot 20+40\\cdot 15+15\\cdot 25=500+600+375=1475<\/span>。所求 <span class=\"m\">3750-1475=2275<\/span>，即乙店當日的毛利。注意：<span class=\"m\">P=SC<\/span> 為 <span class=\"m\">2\\times 2<\/span> 矩陣，<span class=\"m\">(i,j)<\/span> 元為第 <span class=\"m\">i<\/span> 店在第 <span class=\"m\">j<\/span> 項（售價或成本）的總額；<span class=\"m\">CS<\/span> 為 <span class=\"m\">3\\times 3<\/span>，無此意義。","steps":["<span class=\"m\">P<\/span> 的第 2 列為乙店那一列與 <span class=\"m\">C<\/span> 各行的乘積：第 1 行（營收）<span class=\"m\">25\\cdot 50+40\\cdot 40+15\\cdot 60=1250+1600+900=3750<\/span>；第 2 行（成本）<span class=\"m\">25\\cdot 20+40\\cdot 15+15\\cdot 25=500+600+375=1475<\/span>。","所求 <span class=\"m\">3750-1475=2275<\/span>，即乙店當日的毛利。"],"hk":"hint"},{"id":"S3-03","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">基礎｜M8<\/span>設二階方陣 <span class=\"m\">A<\/span> 的行列式 <span class=\"m\">\\det A=3<\/span>，則 <span class=\"m\">\\det\\big((2A)^{-1}\\big)<\/span> 之值為何？","opts":[{"k":"A","h":"<span class=\"m\">\\dfrac{1}{6}<\/span>"},{"k":"B","h":"<span class=\"m\">\\dfrac{1}{12}<\/span>"},{"k":"C","h":"<span class=\"m\">\\dfrac{2}{3}<\/span>"},{"k":"D","h":"<span class=\"m\">6<\/span>"},{"k":"E","h":"<span class=\"m\">12<\/span>"}],"type":"single","ans":["B"],"key":"(B)","sol":"二階方陣 <span class=\"m\">\\det(kA)=k^2\\det A<\/span>，故 <span class=\"m\">\\det(2A)=4\\cdot 3=12<\/span>；又 <span class=\"m\">\\det(M^{-1})=\\dfrac{1}{\\det M}<\/span>，所以 <span class=\"m\">\\det\\big((2A)^{-1}\\big)=\\dfrac{1}{12}<\/span>。誤選 (A) 是把 <span class=\"m\">\\det(2A)<\/span> 當成 <span class=\"m\">2\\det A<\/span>；誤選 (C) 是算成 <span class=\"m\">\\det(2A^{-1})<\/span> 且又漏平方。","steps":["先排除 (A)：是把 <span class=\"m\">\\det(2A)<\/span> 當成 <span class=\"m\">2\\det A<\/span>；誤選","先排除 (C)：是算成 <span class=\"m\">\\det(2A^{-1})<\/span> 且又漏平方。"],"hk":"hint"},{"id":"S3-04","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">進階｜M8<\/span>設 <span class=\"m\">A=\\begin{bmatrix}4 &amp; -5\\\\ 1 &amp; -2\\end{bmatrix}<\/span>。已知 <span class=\"m\">A^5=pA+qI<\/span>（<span class=\"m\">p<\/span>、<span class=\"m\">q<\/span> 為實數），則 <span class=\"m\">A^5<\/span> 的第 1 列第 1 行元素為 ＿＿＿。（選填）","opts":[],"type":"fill","ans":[],"key":"答案：304","sol":"<span class=\"m\">A<\/span> 的主對角線元素和 <span class=\"m\">4+(-2)=2<\/span>，<span class=\"m\">\\det A=-8+5=-3<\/span>，由二階方陣恆等式 <span class=\"m\">A^2=2A+3I<\/span>。逐次降次：<span class=\"m\">A^3=2A^2+3A=2(2A+3I)+3A=7A+6I<\/span>；<span class=\"m\">A^4=7A^2+6A=7(2A+3I)+6A=20A+21I<\/span>；<span class=\"m\">A^5=20A^2+21A=20(2A+3I)+21A=61A+60I<\/span>。故 <span class=\"m\">p=61<\/span>，<span class=\"m\">q=60<\/span>，第 1 列第 1 行元素為 <span class=\"m\">61\\cdot 4+60=304<\/span>。另解：<span class=\"m\">x^2-2x-3=(x-3)(x+1)<\/span>，設 <span class=\"m\">x^5=(x-3)(x+1)Q(x)+px+q<\/span>，代 <span class=\"m\">x=3,-1<\/span> 得 <span class=\"m\">3p+q=243<\/span>，<span class=\"m\">-p+q=-1<\/span>，<span class=\"m\">p=61<\/span>，<span class=\"m\">q=60<\/span>。（已直接計算 <span class=\"m\">A^5=\\begin{bmatrix}304 &amp; -305\\\\ 61 &amp; -62\\end{bmatrix}<\/span> 核對。）陷阱：恆等式為 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span>，<span class=\"m\">\\det A=-3<\/span> 移項後常數項為 <span class=\"m\">+3I<\/span>。","steps":["<span class=\"m\">A<\/span> 的主對角線元素和 <span class=\"m\">4+(-2)=2<\/span>，<span class=\"m\">\\det A=-8+5=-3<\/span>，由二階方陣恆等式 <span class=\"m\">A^2=2A+3I<\/span>。","逐次降次：<span class=\"m\">A^3=2A^2+3A=2(2A+3I)+3A=7A+6I<\/span>；<span class=\"m\">A^4=7A^2+6A=7(2A+3I)+6A=20A+21I<\/span>；<span class=\"m\">A^5=20A^2+21A=20(2A+3I)+21A=61A+60I<\/span>。","故 <span class=\"m\">p=61<\/span>，<span class=\"m\">q=60<\/span>，第 1 列第 1 行元素為 <span class=\"m\">61\\cdot 4+60=304<\/span>。"],"hk":"hint"},{"id":"S3-05","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">進階｜M8<\/span>設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 3 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。若二階方陣 <span class=\"m\">X<\/span> 滿足 <span class=\"m\">XA=B<\/span>，則 <span class=\"m\">X=<\/span>？","opts":[{"k":"A","h":"<span class=\"m\">\\begin{bmatrix}-8 &amp; -3\\\\ 5 &amp; 2\\end{bmatrix}<\/span>"},{"k":"B","h":"<span class=\"m\">\\begin{bmatrix}-5 &amp; 2\\\\ 3 &amp; -1\\end{bmatrix}<\/span>"},{"k":"C","h":"<span class=\"m\">\\begin{bmatrix}7 &amp; -3\\\\ 2 &amp; -1\\end{bmatrix}<\/span>"},{"k":"D","h":"<span class=\"m\">\\begin{bmatrix}-7 &amp; 3\\\\ -2 &amp; 1\\end{bmatrix}<\/span>"},{"k":"E","h":"<span class=\"m\">\\begin{bmatrix}-1 &amp; 3\\\\ -2 &amp; 7\\end{bmatrix}<\/span>"}],"type":"single","ans":["D"],"key":"(D)","sol":"<span class=\"m\">\\det A=5-6=-1\\ne 0<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{-1}\\begin{bmatrix}5 &amp; -2\\\\ -3 &amp; 1\\end{bmatrix}=\\begin{bmatrix}-5 &amp; 2\\\\ 3 &amp; -1\\end{bmatrix}<\/span>。由 <span class=\"m\">XA=B<\/span>，兩邊<strong>右乘<\/strong> <span class=\"m\">A^{-1}<\/span>：<span class=\"m\">X=BA^{-1}=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}\\begin{bmatrix}-5 &amp; 2\\\\ 3 &amp; -1\\end{bmatrix}=\\begin{bmatrix}-7 &amp; 3\\\\ -2 &amp; 1\\end{bmatrix}<\/span>。(A) 為 <span class=\"m\">A^{-1}B<\/span>（左乘，順序錯）；(B) 為 <span class=\"m\">A^{-1}<\/span> 本身；(C) 為求反方陣時漏除以 <span class=\"m\">-1<\/span> 的結果；(E) 為 <span class=\"m\">AB^{-1}<\/span>。","steps":["先排除 (A)：為 <span class=\"m\">A^{-1}B<\/span>（左乘，順序錯）","先排除 (B)：為 <span class=\"m\">A^{-1}<\/span> 本身","先排除 (C)：為求反方陣時漏除以 <span class=\"m\">-1<\/span> 的結果"],"hk":"hint"},{"id":"S3-06","unit":"S3","set":"一、矩陣的運算與反方陣","level":"","src":"","ctx":"","pre":"","stem":"<span class=\"hand blue no\">進階｜M8<\/span>設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 3\\\\ 2 &amp; 6\\end{bmatrix}<\/span>，<span class=\"m\">
