\n<ol class=\"steps\"><li>分配律：<span class=\"m\">BA=(I+A+A^{-1})A=A+A^2+I<\/span>。<span class=\"hand\">A⁻¹A＝I，不必求 A⁻¹<\/span><\/li>\n<li><span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}=\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}+\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p><strong>另解<\/strong>　<span class=\"m\">a+d=5<\/span>、<span class=\"m\">\\det A=4-3=1<\/span>，故 <span class=\"m\">A^2-5A+I=O<\/span>，<span class=\"m\">A^2+I=5A<\/span>，<span class=\"m\">BA=A+5A=6A=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。<\/p>\n<p><strong>考點<\/strong>：反方陣的定義 <span class=\"m\">A^{-1}A=I<\/span>、矩陣乘法分配律　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>選項 (3) 是 <span class=\"m\">A^{-1}<\/span> 本身，(4) 是 <span class=\"m\">A<\/span>，都是算到一半就停的誘答。乘法分配時要注意左右：<span class=\"m\">(I+A+A^{-1})A<\/span> 是每一項<em>右乘<\/em> <span class=\"m\">A<\/span>。<\/p>","steps":["分配律：<span class=\"m\">BA=(I+A+A^{-1})A=A+A^2+I<\/span>。<span class=\"hand\">A⁻¹A＝I，不必求 A⁻¹<\/span>","<span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}=\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}<\/span>。","<span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 3 &amp; 4\\end{bmatrix}+\\begin{bmatrix}4 &amp; 5\\\\ 15 &amp; 19\\end{bmatrix}+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}=\\begin{bmatrix}6 &amp; 6\\\\ 18 &amp; 24\\end{bmatrix}<\/span>。"]},{"id":"M8-K02","unit":"M8","set":"歷屆學測精選","level":"","src":"精選 2　110 學測數學 第 1 題（T3-03）","ctx":"","pre":"","stem":"設 <span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}<\/span>。若 <span class=\"m\">A^4=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，則 <span class=\"m\">a+b+c+d<\/span> 之值為下列哪一個選項？","opts":[{"k":"1","h":"158"},{"k":"2","h":"162"},{"k":"3","h":"166"},{"k":"4","h":"170"},{"k":"5","h":"174"}],"type":"single","ans":["2"],"key":"(2)","sol":"\n<ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">A^4=(A^2)^2=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}=\\begin{bmatrix}1 &amp; 80\\\\ 0 &amp; 81\\end{bmatrix}<\/span>。<\/li>\n<li><span class=\"m\">a+b+c+d=1+80+0+81=162<\/span>。<\/li><\/ol>\n<p><strong>補充<\/strong>　上三角方陣的乘冪仍是上三角，對角線元素各自乘冪。本題可歸納 <span class=\"m\">A^n=\\begin{bmatrix}1 &amp; 3^n-1\\\\ 0 &amp; 3^n\\end{bmatrix}<\/span>（由 <span class=\"m\">A^{n+1}=A^nA<\/span> 驗證：右上元素 <span class=\"m\">2+3(3^n-1)=3^{n+1}-1<\/span>）。<\/p>\n<p><strong>考點<\/strong>：矩陣乘法、乘冪　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>把乘冪當成逐元素乘冪，寫成 <span class=\"m\">\\begin{bmatrix}1 &amp; 16\\\\ 0 &amp; 81\\end{bmatrix}<\/span>，得 98（不在選項中，但同型選填題會失分）。<\/p>","steps":["<span class=\"m\">A^2=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}<\/span>。","<span class=\"m\">A^4=(A^2)^2=\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}\\begin{bmatrix}1 &amp; 8\\\\ 0 &amp; 9\\end{bmatrix}=\\begin{bmatrix}1 &amp; 80\\\\ 0 &amp; 81\\end{bmatrix}<\/span>。","<span class=\"m\">a+b+c+d=1+80+0+81=162<\/span>。"]},{"id":"M8-K03","unit":"M8","set":"歷屆學測精選","level":"","src":"精選 3　115 學測數A 第 5 題（T3-01）","ctx":"","pre":"","stem":"已知實數三階方陣 <span class=\"m\">A<\/span> 滿足 <span class=\"m\">A\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>，<span class=\"m\">A\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>，<span class=\"m\">A\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}=\\begin{bmatrix}0\\\\ 0\\\\ 0\\end{bmatrix}<\/span>。試問有多少個行向量 <span class=\"m\">\\vec{v}=\\begin{bmatrix}v_1\\\\ v_2\\\\ v_3\\end{bmatrix}<\/span> 滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 且 <span class=\"m\">\\vec{v}<\/span> 垂直於行向量 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span>？","opts":[{"k":"1","h":"1 個"},{"k":"2","h":"2 個"},{"k":"3","h":"3 個"},{"k":"4","h":"0 個"},{"k":"5","h":"無窮多個"}],"type":"single","ans":["5"],"key":"(5)","sol":"\n<ol class=\"steps\"><li>令 <span class=\"m\">\\vec{u}_1=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_2=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}<\/span>。題設即 <span class=\"m\">A\\vec{u}_1=\\vec{u}_2<\/span>、<span class=\"m\">A\\vec{u}_2=\\vec{u}_1<\/span>、<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span>。<span class=\"hand\">A 把 u₁、u₂ 互換<\/span><\/li>\n<li>目標向量 <span class=\"m\">\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}=\\vec{u}_1+\\vec{u}_2<\/span>，而 <span class=\"m\">A(\\vec{u}_1+\\vec{u}_2)=\\vec{u}_2+\\vec{u}_1<\/span>，故 <span class=\"m\">\\vec{v}_0=\\vec{u}_1+\\vec{u}_2=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 是一組解。<\/li>\n<li>又 <span class=\"m\">A(\\vec{v}_0+t\\vec{u}_3)=A\\vec{v}_0+tA\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>，所以 <span class=\"m\">\\vec{v}=\\begin{bmatrix}1+t\\\\ 0\\\\ 1-t\\end{bmatrix}<\/span>（<span class=\"m\">t<\/span> 為任意實數）都滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>。由於 <span class=\"m\">\\begin{vmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{vmatrix}=2\\ne 0<\/span>，<span class=\"m\">\\vec{u}_1,\\vec{u}_2,\\vec{u}_3<\/span> 線性獨立，解恰為這一族。<\/li>\n<li>這些 <span class=\"m\">\\vec{v}<\/span> 的第二分量都是 0，與 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span> 的內積皆為 0，全部滿足垂直條件，故有<strong>無窮多個<\/strong>。<\/li><\/ol>\n<p><strong>另解<\/strong>　由 <span class=\"m\">A\\begin{bmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{bmatrix}=\\begin{bmatrix}0 &amp; 1 &amp; 0\\\\ -1 &amp; 1 &amp; 0\\\\ 1 &amp; 0 &amp; 0\\end{bmatrix}<\/span> 右乘反方陣，得 <span class=\"m\">A=\\begin{bmatrix}\\frac12 &amp; -\\frac12 &amp; \\frac12\\\\ 0 &amp; -1 &amp; 0\\\\ \\frac12 &amp; \\frac12 &amp; \\frac12\\end{bmatrix}<\/span>。<span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 化為 <span class=\"m\">v_1-v_2+v_3=2<\/span>、<span class=\"m\">-v_2=0<\/span>、<span class=\"m\">v_1+v_2+v_3=2<\/span>，即 <span class=\"m\">v_2=0<\/span>、<span class=\"m\">v_1+v_3=2<\/span>，有無窮多解，且都滿足 <span class=\"m\">v_2=0<\/span>。<\/p>\n<p><strong>考點<\/strong>：矩陣乘法的線性性質 <span class=\"m\">A(s\\vec{x}+t\\vec{y})=sA\\vec{x}+tA\\vec{y}<\/span>、不可逆方陣的方程組解集　<strong>對應<\/strong>：M8、M7<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>「方陣乘向量等於已知向量，解唯一」。<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span> 且 <span class=\"m\">\\vec{u}_3\\ne\\vec{0}<\/span>，表示 <span class=\"m\">\\det A=0<\/span>，<span class=\"m\">A<\/span> 沒有反方陣；有解時必為無窮多解。<\/p>","steps":["令 <span class=\"m\">\\vec{u}_1=\\begin{bmatrix}1\\\\ 1\\\\ 0\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_2=\\begin{bmatrix}0\\\\ -1\\\\ 1\\end{bmatrix}<\/span>、<span class=\"m\">\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ -1\\end{bmatrix}<\/span>。題設即 <span class=\"m\">A\\vec{u}_1=\\vec{u}_2<\/span>、<span class=\"m\">A\\vec{u}_2=\\vec{u}_1<\/span>、<span class=\"m\">A\\vec{u}_3=\\vec{0}<\/span>。<span class=\"hand\">A 把 u₁、u₂ 互換<\/span>","目標向量 <span class=\"m\">\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}=\\vec{u}_1+\\vec{u}_2<\/span>，而 <span class=\"m\">A(\\vec{u}_1+\\vec{u}_2)=\\vec{u}_2+\\vec{u}_1<\/span>，故 <span class=\"m\">\\vec{v}_0=\\vec{u}_1+\\vec{u}_2=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span> 是一組解。","又 <span class=\"m\">A(\\vec{v}_0+t\\vec{u}_3)=A\\vec{v}_0+tA\\vec{u}_3=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>，所以 <span class=\"m\">\\vec{v}=\\begin{bmatrix}1+t\\\\ 0\\\\ 1-t\\end{bmatrix}<\/span>（<span class=\"m\">t<\/span> 為任意實數）都滿足 <span class=\"m\">A\\vec{v}=\\begin{bmatrix}1\\\\ 0\\\\ 1\\end{bmatrix}<\/span>。由於 <span class=\"m\">\\begin{vmatrix}1 &amp; 0 &amp; 1\\\\ 1 &amp; -1 &amp; 0\\\\ 0 &amp; 1 &amp; -1\\end{vmatrix}=2\\ne 0<\/span>，<span class=\"m\">\\vec{u}_1,\\vec{u}_2,\\vec{u}_3<\/span> 線性獨立，解恰為這一族。","這些 <span class=\"m\">\\vec{v}<\/span> 的第二分量都是 0，與 <span class=\"m\">\\begin{bmatrix}0\\\\ 1\\\\ 0\\end{bmatrix}<\/span> 的內積皆為 0，全部滿足垂直條件，故有<strong>無窮多個<\/strong>。"]},{"id":"M8-K04","unit":"M8","set":"歷屆學測精選","level":"","src":"精選 4　115 學測數A 第 8 題（T3-02）","ctx":"","pre":"","stem":"已知 <span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，且對所有正整數 <span class=\"m\">n\\ge 2<\/span>，令 <span class=\"m\">A^n=\\begin{bmatrix}a_n &amp; b_n\\\\ c_n &amp; d_n\\end{bmatrix}<\/span>。試選出正確的選項。","opts":[{"k":"1","h":"<span class=\"m\">b_2&lt;c_2<\/span>"},{"k":"2","h":"<span class=\"m\">A^2=2A+\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>"},{"k":"3","h":"<span class=\"m\">c_{n+2}=c_{n+1}+2c_n<\/span>"},{"k":"4","h":"<span class=\"m\">\\begin{bmatrix}a_n &amp; b_n\\\\ c_n &amp; d_n\\end{bmatrix}\\begin{bmatrix}0\\\\ 1\\end{bmatrix}=\\begin{bmatrix}b_{n+1}\\\\ d_{n+1}\\end{bmatrix}<\/span>"},{"k":"5","h":"<span class=\"m\">d_{2n}-a_{2n}=(d_n)^2-(a_n)^2<\/span>"}],"type":"multi","ans":["2","5"],"key":"(2)(5)","sol":"\n<ol class=\"steps\"><li>先算 <span class=\"m\">A^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}12 &amp; 5\\\\ 5 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^4=\\begin{bmatrix}29 &amp; 12\\\\ 12 &amp; 5\\end{bmatrix}<\/span>。<\/li>\n<li>(1) <span class=\"m\">b_2=c_2=2<\/span>，錯誤。（<span class=\"m\">A<\/span> 對稱，<span class=\"m\">A^n<\/span> 也對稱，恆有 <span class=\"m\">b_n=c_n<\/span>。）<\/li>\n<li>(2) <span class=\"m\">2A+I=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}=A^2<\/span>，正確。這正是 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span>：<span class=\"m\">a+d=2<\/span>、<span class=\"m\">ad-bc=-1<\/span>。<\/li>\n<li>(3) 由 (2) 兩邊乘 <span class=\"m\">A^n<\/span>：<span class=\"m\">A^{n+2}=2A^{n+1}+A^n<\/span>，比較左下元素得 <span class=\"m\">c_{n+2}=2c_{n+1}+c_n<\/span>。反例 <span class=\"m\">n=2<\/span>：<span class=\"m\">c_4=12<\/span>，而 <span class=\"m\">c_3+2c_2=5+4=9<\/span>，錯誤。<\/li>\n<li>(4) 左邊是 <span class=\"m\">A^n<\/span> 的第二行 <span class=\"m\">\\begin{bmatrix}b_n\\\\ d_n\\end{bmatrix}<\/span>。而 <span class=\"m\">A^{n+1}=A^nA<\/span> 的第二行是 <span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}a_n\\\\ c_n\\end{bmatrix}<\/span>，即 <span class=\"m\">b_{n+1}=a_n<\/span>。<span class=\"m\">n=2<\/span> 時 <span class=\"m\">b_3=5\\ne b_2=2<\/span>，錯誤。<span class=\"hand\">乘 [0,1]ᵀ 是取第二行<\/span><\/li>\n<li>(5) <span class=\"m\">A^{2n}=A^nA^n<\/span>，所以 <span class=\"m\">a_{2n}=a_n^2+b_nc_n<\/span>、<span class=\"m\">d_{2n}=c_nb_n+d_n^2<\/span>，相減得 <span class=\"m\">d_{2n}-a_{2n}=d_n^2-a_n^2<\/span>，正確。<\/li><\/ol>\n<div class=\"formula\" data-t=\"二階方陣的降次公式\"><div class=\"mb\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\ \\Rightarrow\\ A^2-(a+d)A+(ad-bc)I=O<\/div><p>兩邊乘 <span class=\"m\">A^n<\/span> 得乘冪的二階遞迴：<span class=\"m\">A^{n+2}=(a+d)A^{n+1}-(ad-bc)A^n<\/span>，每個元素都滿足同一遞迴。<\/p><\/div>\n<p><strong>考點<\/strong>：矩陣乘冪、乘法的列行意義、遞迴關係　<strong>對應<\/strong>：M8<\/p>\n<p class=\"bad\"><span class=\"mark\">誤<\/span>(3) 把係數看反，誤以為 <span class=\"m\">A^2=A+2I<\/span>。係數由 <span class=\"m\">a+d<\/span> 與 <span class=\"m\">ad-bc<\/span> 決定，代 <span class=\"m\">n=2<\/span> 驗算一次即可排除。<\/p>","steps":["先算 <span class=\"m\">A^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 0\\end{bmatrix}=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}12 &amp; 5\\\\ 5 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">A^4=\\begin{bmatrix}29 &amp; 12\\\\ 12 &amp; 5\\end{bmatrix}<\/span>。","(1) <span class=\"m\">b_2=c_2=2<\/span>，錯誤。（<span class=\"m\">A<\/span> 對稱，<span class=\"m\">A^n<\/span> 也對稱，恆有 <span class=\"m\">b_n=c_n<\/span>。）","(2) <span class=\"m\">2A+I=\\begin{bmatrix}5 &amp; 2\\\\ 2 &amp; 1\\end{bmatrix}=A^2<\/span>，正確。這正是 <span class=\"m\">A^2-(a+d)A+(ad-bc)I=O<\/span>：<span class=\"m\">a+d=2<\/span>、<span class=\"m\">ad-bc=-1<\/span>。","(3) 由 (2) 兩邊乘 <span class=\"m\">A^n<\/span>：<span class=\"m\">A^{n+2}=2A^{n+1}+A^n<\/span>，比較左下元素得 <span class=\"m\">c_{n+2}=2c_{n+1}+c_n<\/span>。反例 <span class=\"m\">n=2<\/span>：<span class=\"m\">c_4=12<\/span>，而 <span class=\"m\">c_3+2c_2=5+4=9<\/span>，錯誤。","(4) 左邊是 <span class=\"m\">A^n<\/span> 的第二行 <span class=\"m\">\\begin{bmatrix}b_n\\\\ d_n\\end{bmatrix}<\/span>。而 <span class=\"m\">A^{n+1}=A^nA<\/span> 的第二行是 <span class=\"m\">A^n\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}a_n\\\\ c_n\\end{bmatrix}<\/span>，即 <span class=\"m\">b_{n+1}=a_n<\/span>。<span class=\"m\">n=2<\/span> 時 <span class=\"m\">b_3=5\\ne b_2=2<\/span>，錯誤。<span class=\"hand\">乘 [0,1]ᵀ 是取第二行<\/span>","(5) <span class=\"m\">A^{2n}=A^nA^n<\/span>，所以 <span class=\"m\">a_{2n}=a_n^2+b_nc_n<\/span>、<span class=\"m\">d_{2n}=c_nb_n+d_n^2<\/span>，相減得 <span class=\"m\">d_{2n}-a_{2n}=d_n^2-a_n^2<\/span>，正確。"]}],"examples":[{"title":"例題 1　矩陣相等","q":"<p>（基礎）　已知 <span class=\"m\">\\begin{bmatrix}x+2y &amp; z^2\\\\ 4 &amp; x-y\\end{bmatrix}=\\begin{bmatrix}7 &amp; 4\\\\ w &amp; 1\\end{bmatrix}<\/span>，求實數 <span class=\"m\">x,y,z,w<\/span>。<\/p>","steps":["兩矩陣同為 <span class=\"m\">2\\times 2<\/span>，對應元相等：<span class=\"m\">x+2y=7<\/span>，<span class=\"m\">z^2=4<\/span>，<span class=\"m\">4=w<\/span>，<span class=\"m\">x-y=1<\/span>。","解 <span class=\"m\">\\begin{cases}x+2y=7\\\\ x-y=1\\end{cases}<\/span>：相減得 <span class=\"m\">3y=6<\/span>，<span class=\"m\">y=2<\/span>，<span class=\"m\">x=3<\/span>。","<span class=\"m\">z=\\pm 2<\/span>，<span class=\"m\">w=4<\/span>。"],"after":"<p>答：<span class=\"m\">(x,y,z,w)=(3,2,2,4)<\/span> 或 <span class=\"m\">(3,2,-2,4)<\/span>。<\/p><p>陷阱：<span class=\"m\">z^2=4<\/span> 漏掉負根；<span class=\"m\">(2,1)<\/span> 元的方程式 <span class=\"m\">4=w<\/span> 漏列。<\/p>","sol":"<ol class=\"steps\"><li>兩矩陣同為 <span class=\"m\">2\\times 2<\/span>，對應元相等：<span class=\"m\">x+2y=7<\/span>，<span class=\"m\">z^2=4<\/span>，<span class=\"m\">4=w<\/span>，<span class=\"m\">x-y=1<\/span>。<\/li><li>解 <span class=\"m\">\\begin{cases}x+2y=7\\\\ x-y=1\\end{cases}<\/span>：相減得 <span class=\"m\">3y=6<\/span>，<span class=\"m\">y=2<\/span>，<span class=\"m\">x=3<\/span>。<\/li><li><span class=\"m\">z=\\pm 2<\/span>，<span class=\"m\">w=4<\/span>。<\/li><\/ol>\n<p>答：<span class=\"m\">(x,y,z,w)=(3,2,2,4)<\/span> 或 <span class=\"m\">(3,2,-2,4)<\/span>。<\/p><p>陷阱：<span class=\"m\">z^2=4<\/span> 漏掉負根；<span class=\"m\">(2,1)<\/span> 元的方程式 <span class=\"m\">4=w<\/span> 漏列。<\/p>"},{"title":"例題 2　矩陣方程式","q":"<p>（基礎）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; -1\\\\ 0 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}4 &amp; 2\\\\ -2 &amp; 4\\end{bmatrix}<\/span>，求滿足 <span class=\"m\">3X-2A=B+X<\/span> 的矩陣 <span class=\"m\">X<\/span>。<\/p>","steps":["移項：<span class=\"m\">3X-X=B+2A<\/span>，<span class=\"m\">2X=B+2A<\/span>。","<span class=\"m\">B+2A=\\begin{bmatrix}4+4 &amp; 2-2\\\\ -2+0 &amp; 4+6\\end{bmatrix}=\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}<\/span>。","<span class=\"m\">X=\\dfrac{1}{2}\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}=\\begin{bmatrix}4 &amp; 0\\\\ -1 &amp; 5\\end{bmatrix}<\/span>。","驗算 <span class=\"m\">(1,1)<\/span> 元：<span class=\"m\">3\\cdot 4-2\\cdot 2=8=4+4<\/span>。"],"after":"<p>陷阱：<span class=\"m\">-2A<\/span> 移項後應為 <span class=\"m\">+2A<\/span>；係數積須乘到每一個元。<\/p>","sol":"<ol class=\"steps\"><li>移項：<span class=\"m\">3X-X=B+2A<\/span>，<span class=\"m\">2X=B+2A<\/span>。<\/li><li><span class=\"m\">B+2A=\\begin{bmatrix}4+4 &amp; 2-2\\\\ -2+0 &amp; 4+6\\end{bmatrix}=\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=\\dfrac{1}{2}\\begin{bmatrix}8 &amp; 0\\\\ -2 &amp; 10\\end{bmatrix}=\\begin{bmatrix}4 &amp; 0\\\\ -1 &amp; 5\\end{bmatrix}<\/span>。<\/li><li>驗算 <span class=\"m\">(1,1)<\/span> 元：<span class=\"m\">3\\cdot 4-2\\cdot 2=8=4+4<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">-2A<\/span> 移項後應為 <span class=\"m\">+2A<\/span>；係數積須乘到每一個元。<\/p>"},{"title":"例題 3　資料表與矩陣乘法","q":"<p>（基礎）　某商店兩家分店一週的銷售量（件）與三種商品的售價、成本（元）如下：<\/p>\n<div class=\"mb\">Q=\\begin{bmatrix}20 &amp; 15 &amp; 10\\\\ 12 &amp; 25 &amp; 8\\end{bmatrix}\\ \\begin{matrix}\\leftarrow\\text{一店}\\\\ \\leftarrow\\text{二店}\\end{matrix},\\qquad P=\\begin{bmatrix}30 &amp; 18\\\\ 45 &amp; 30\\\\ 60 &amp; 40\\end{bmatrix}\\ \\begin{matrix}\\leftarrow\\text{甲}\\\\ \\leftarrow\\text{乙}\\\\ \\leftarrow\\text{丙}\\end{matrix}<\/div>\n<p><span class=\"m\">Q<\/span> 的三行依序為商品甲、乙、丙；<span class=\"m\">P<\/span> 的兩行依序為售價、成本。(1) 求 <span class=\"m\">QP<\/span> 並說明各元的意義。(2) 求兩店的毛利。(3) <span class=\"m\">PQ<\/span> 是否有定義？是否有實際意義？<\/p>","steps":["<span class=\"m\">Q<\/span> 為 <span class=\"m\">2\\times 3<\/span>，<span class=\"m\">P<\/span> 為 <span class=\"m\">3\\times 2<\/span>，<span class=\"m\">QP<\/span> 為 <span class=\"m\">2\\times 2<\/span>。<br><span class=\"m\">(QP)_{11}=20\\cdot 30+15\\cdot 45+10\\cdot 60=1875<\/span>，<span class=\"m\">(QP)_{12}=20\\cdot 18+15\\cdot 30+10\\cdot 40=1210<\/span>，<br><span class=\"m\">(QP)_{21}=12\\cdot 30+25\\cdot 45+8\\cdot 60=1965<\/span>，<span class=\"m\">(QP)_{22}=12\\cdot 18+25\\cdot 30+8\\cdot 40=1286<\/span>。<br><span class=\"m\">QP=\\begin{bmatrix}1875 &amp; 1210\\\\ 1965 &amp; 1286\\end{bmatrix}<\/span>：列為分店、行為（營收、總成本）。","毛利＝營收－成本：一店 <span class=\"m\">1875-1210=665<\/span> 元，二店 <span class=\"m\">1965-1286=679<\/span> 元。亦可先算 <span class=\"m\">P\\begin{bmatrix}1\\\\ -1\\end{bmatrix}=\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}<\/span>（每件毛利），再求 <span class=\"m\">Q\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}=\\begin{bmatrix}665\\\\ 679\\end{bmatrix}<\/span>（結合律）。","<span class=\"m\">PQ<\/span> 為 <span class=\"m\">(3\\times 2)(2\\times 3)=3\\times 3<\/span>，有定義；但其 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">30\\cdot 20+18\\cdot 12<\/span> 是「甲的售價 × 一店銷量＋甲的成本 × 二店銷量」，加總的分類（售價／成本 與 一店／二店）不相同，<strong>沒有實際意義<\/strong>。"],"after":"<p>陷阱：乘積有定義只是階數相容；有無意義要看<span class=\"ul\">被加總的分類是否一致<\/span>。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">Q<\/span> 為 <span class=\"m\">2\\times 3<\/span>，<span class=\"m\">P<\/span> 為 <span class=\"m\">3\\times 2<\/span>，<span class=\"m\">QP<\/span> 為 <span class=\"m\">2\\times 2<\/span>。<br><span class=\"m\">(QP)_{11}=20\\cdot 30+15\\cdot 45+10\\cdot 60=1875<\/span>，<span class=\"m\">(QP)_{12}=20\\cdot 18+15\\cdot 30+10\\cdot 40=1210<\/span>，<br><span class=\"m\">(QP)_{21}=12\\cdot 30+25\\cdot 45+8\\cdot 60=1965<\/span>，<span class=\"m\">(QP)_{22}=12\\cdot 18+25\\cdot 30+8\\cdot 40=1286<\/span>。<br><span class=\"m\">QP=\\begin{bmatrix}1875 &amp; 1210\\\\ 1965 &amp; 1286\\end{bmatrix}<\/span>：列為分店、行為（營收、總成本）。<\/li><li>毛利＝營收－成本：一店 <span class=\"m\">1875-1210=665<\/span> 元，二店 <span class=\"m\">1965-1286=679<\/span> 元。亦可先算 <span class=\"m\">P\\begin{bmatrix}1\\\\ -1\\end{bmatrix}=\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}<\/span>（每件毛利），再求 <span class=\"m\">Q\\begin{bmatrix}12\\\\ 15\\\\ 20\\end{bmatrix}=\\begin{bmatrix}665\\\\ 679\\end{bmatrix}<\/span>（結合律）。<\/li><li><span class=\"m\">PQ<\/span> 為 <span class=\"m\">(3\\times 2)(2\\times 3)=3\\times 3<\/span>，有定義；但其 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">30\\cdot 20+18\\cdot 12<\/span> 是「甲的售價 × 一店銷量＋甲的成本 × 二店銷量」，加總的分類（售價／成本 與 一店／二店）不相同，<strong>沒有實際意義<\/strong>。<\/li><\/ol><p>陷阱：乘積有定義只是階數相容；有無意義要看<span class=\"ul\">被加總的分類是否一致<\/span>。<\/p>"},{"title":"例題 4　與給定方陣可交換的方陣","q":"<p>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 0 &amp; 3\\end{bmatrix}<\/span>，求所有滿足 <span class=\"m\">AB=BA<\/span> 的二階方陣 <span class=\"m\">B<\/span>。<\/p>","steps":["設 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}a+2c &amp; b+2d\\\\ 3c &amp; 3d\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}a &amp; 2a+3b\\\\ c &amp; 2c+3d\\end{bmatrix}<\/span>。","比較各元：<span class=\"m\">(1,1)<\/span>：<span class=\"m\">a+2c=a\\Rightarrow c=0<\/span>；<span class=\"m\">(2,1)<\/span>：<span class=\"m\">3c=c<\/span>，同；<span class=\"m\">(2,2)<\/span>：<span class=\"m\">3d=2c+3d<\/span>，同；<span class=\"m\">(1,2)<\/span>：<span class=\"m\">b+2d=2a+3b\\Rightarrow d=a+b<\/span>。","所求 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ 0 &amp; a+b\\end{bmatrix}<\/span>，<span class=\"m\">a,b<\/span> 為任意實數。"],"after":"<p>另解：<span class=\"m\">A<\/span> 不是 <span class=\"m\">kI<\/span>，與 <span class=\"m\">A<\/span> 可交換者為 <span class=\"m\">pI+qA=\\begin{bmatrix}p+q &amp; 2q\\\\ 0 &amp; p+3q\\end{bmatrix}<\/span>；令 <span class=\"m\">a=p+q<\/span>、<span class=\"m\">b=2q<\/span>，則 <span class=\"m\">p+3q=a+b<\/span>，結果相同。<\/p><p>陷阱：四個元都要比較；只比較兩個元會漏掉條件或多出條件。<\/p>","sol":"<ol class=\"steps\"><li>設 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}a+2c &amp; b+2d\\\\ 3c &amp; 3d\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}a &amp; 2a+3b\\\\ c &amp; 2c+3d\\end{bmatrix}<\/span>。<\/li><li>比較各元：<span class=\"m\">(1,1)<\/span>：<span class=\"m\">a+2c=a\\Rightarrow c=0<\/span>；<span class=\"m\">(2,1)<\/span>：<span class=\"m\">3c=c<\/span>，同；<span class=\"m\">(2,2)<\/span>：<span class=\"m\">3d=2c+3d<\/span>，同；<span class=\"m\">(1,2)<\/span>：<span class=\"m\">b+2d=2a+3b\\Rightarrow d=a+b<\/span>。<\/li><li>所求 <span class=\"m\">B=\\begin{bmatrix}a &amp; b\\\\ 0 &amp; a+b\\end{bmatrix}<\/span>，<span class=\"m\">a,b<\/span> 為任意實數。<\/li><\/ol>\n<p>另解：<span class=\"m\">A<\/span> 不是 <span class=\"m\">kI<\/span>，與 <span class=\"m\">A<\/span> 可交換者為 <span class=\"m\">pI+qA=\\begin{bmatrix}p+q &amp; 2q\\\\ 0 &amp; p+3q\\end{bmatrix}<\/span>；令 <span class=\"m\">a=p+q<\/span>、<span class=\"m\">b=2q<\/span>，則 <span class=\"m\">p+3q=a+b<\/span>，結果相同。<\/p><p>陷阱：四個元都要比較；只比較兩個元會漏掉條件或多出條件。<\/p>"},{"title":"例題 5　零因子與消去律","q":"<p>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span>。(1) 求所有二階方陣 <span class=\"m\">B<\/span> 使 <span class=\"m\">AB=O<\/span>。(2) 取其中一個 <span class=\"m\">B\\ne O<\/span>，計算 <span class=\"m\">BA<\/span>。(3) 說明 <span class=\"m\">AB=AC<\/span> 不能推得 <span class=\"m\">B=C<\/span>。<\/p>","steps":["設 <span class=\"m\">B=\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}p+2r &amp; q+2s\\\\ 2p+4r &amp; 2q+4s\\end{bmatrix}=O\\iff p=-2r,\\ q=-2s<\/span>，即 <span class=\"m\">B=\\begin{bmatrix}-2r &amp; -2s\\\\ r &amp; s\\end{bmatrix}<\/span>（<span class=\"m\">B<\/span> 的每一行都是 <span class=\"m\">(-2,1)<\/span> 的倍數）。","取 <span class=\"m\">r=-1,s=-2<\/span>：<span class=\"m\">B=\\begin{bmatrix}2 &amp; 4\\\\ -1 &amp; -2\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}2+8 &amp; 4+16\\\\ -1-4 &amp; -2-8\\end{bmatrix}=\\begin{bmatrix}10 &amp; 20\\\\ -5 &amp; -10\\end{bmatrix}\\ne O<\/span>。","取 <span class=\"m\">C=O<\/span>：<span class=\"m\">AB=O=AC<\/span>，但 <span class=\"m\">B\\ne C<\/span>。原因：<span class=\"m\">\\det A=4-4=0<\/span>，<span class=\"m\">A<\/span> 不可逆，不能左乘 <span class=\"m\">A^{-1}<\/span> 消去。"],"after":"<p>陷阱：<span class=\"m\">AB=O<\/span> 不保證 <span class=\"m\">BA=O<\/span>。<\/p>","sol":"<ol class=\"steps\"><li>設 <span class=\"m\">B=\\begin{bmatrix}p &amp; q\\\\ r &amp; s\\end{bmatrix}<\/span>，<span class=\"m\">AB=\\begin{bmatrix}p+2r &amp; q+2s\\\\ 2p+4r &amp; 2q+4s\\end{bmatrix}=O\\iff p=-2r,\\ q=-2s<\/span>，即 <span class=\"m\">B=\\begin{bmatrix}-2r &amp; -2s\\\\ r &amp; s\\end{bmatrix}<\/span>（<span class=\"m\">B<\/span> 的每一行都是 <span class=\"m\">(-2,1)<\/span> 的倍數）。<\/li><li>取 <span class=\"m\">r=-1,s=-2<\/span>：<span class=\"m\">B=\\begin{bmatrix}2 &amp; 4\\\\ -1 &amp; -2\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}2+8 &amp; 4+16\\\\ -1-4 &amp; -2-8\\end{bmatrix}=\\begin{bmatrix}10 &amp; 20\\\\ -5 &amp; -10\\end{bmatrix}\\ne O<\/span>。<\/li><li>取 <span class=\"m\">C=O<\/span>：<span class=\"m\">AB=O=AC<\/span>，但 <span class=\"m\">B\\ne C<\/span>。原因：<span class=\"m\">\\det A=4-4=0<\/span>，<span class=\"m\">A<\/span> 不可逆，不能左乘 <span class=\"m\">A^{-1}<\/span> 消去。<\/li><\/ol><p>陷阱：<span class=\"m\">AB=O<\/span> 不保證 <span class=\"m\">BA=O<\/span>。<\/p>"},{"title":"例題 6　乘法公式的修正","q":"<p>（進階）　<span class=\"m\">A=\\begin{bmatrix}1 &amp; 1\\\\ 0 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}1 &amp; 0\\\\ 1 &amp; 1\\end{bmatrix}<\/span>。判斷 <span class=\"m\">(A+B)^2=A^2+2AB+B^2<\/span> 與 <span class=\"m\">(A+B)(A-B)=A^2-B^2<\/span> 是否成立，並求兩邊之差。<\/p>","steps":["<span class=\"m\">AB=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">AB\\ne BA<\/span>，故兩式皆不成立。","<span class=\"m\">(A+B)^2-(A^2+2AB+B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。","<span class=\"m\">(A+B)(A-B)-(A^2-B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。","驗算：<span class=\"m\">(A+B)^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}^2=\\begin{bmatrix}5 &amp; 4\\\\ 4 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A^2+2AB+B^2=\\begin{bmatrix}6 &amp; 4\\\\ 4 &amp; 4\\end{bmatrix}<\/span>，差為 <span class=\"m\">\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。"],"after":"<p>陷阱：<span class=\"m\">(A+B)(A-B)<\/span> 展開的中間項是 <span class=\"m\">-AB+BA<\/span>，順序不可寫反。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">AB=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，<span class=\"m\">BA=\\begin{bmatrix}1 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span>，<span class=\"m\">AB\\ne BA<\/span>，故兩式皆不成立。<\/li><li><span class=\"m\">(A+B)^2-(A^2+2AB+B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">(A+B)(A-B)-(A^2-B^2)=BA-AB=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">(A+B)^2=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}^2=\\begin{bmatrix}5 &amp; 4\\\\ 4 &amp; 5\\end{bmatrix}<\/span>，<span class=\"m\">A^2+2AB+B^2=\\begin{bmatrix}6 &amp; 4\\\\ 4 &amp; 4\\end{bmatrix}<\/span>，差為 <span class=\"m\">\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; 1\\end{bmatrix}<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">(A+B)(A-B)<\/span> 展開的中間項是 <span class=\"m\">-AB+BA<\/span>，順序不可寫反。<\/p>"},{"title":"例題 7　推移型的乘冪","q":"<p>（基礎）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 0 &amp; 2\\end{bmatrix}<\/span>，求 <span class=\"m\">A^{10}<\/span>。<\/p>","steps":["<span class=\"m\">A^2=\\begin{bmatrix}4 &amp; 4\\\\ 0 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}8 &amp; 12\\\\ 0 &amp; 8\\end{bmatrix}<\/span>，猜測 <span class=\"m\">A^n=\\begin{bmatrix}2^n &amp; n\\cdot 2^{n-1}\\\\ 0 &amp; 2^n\\end{bmatrix}<\/span>。","數學歸納法：<span class=\"m\">n=1<\/span> 成立；設 <span class=\"m\">n=k<\/span> 成立，<span class=\"m\">A^{k+1}=A^kA=\\begin{bmatrix}2^{k+1} &amp; 2^k+k\\cdot 2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}=\\begin{bmatrix}2^{k+1} &amp; (k+1)2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}<\/span>，<span class=\"m\">n=k+1<\/span> 亦成立。","<span class=\"m\">A^{10}=\\begin{bmatrix}1024 &amp; 10\\cdot 512\\\\ 0 &amp; 1024\\end{bmatrix}=\\begin{bmatrix}1024 &amp; 5120\\\\ 0 &amp; 1024\\end{bmatrix}<\/span>。"],"after":"<p>另解：<span class=\"m\">A=2I+N<\/span>，<span class=\"m\">N=\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">N^2=O<\/span>，且 <span class=\"m\">2I<\/span> 與 <span class=\"m\">N<\/span> 可交換，<span class=\"m\">A^{10}=(2I)^{10}+10(2I)^9N=1024I+5120N<\/span>。<\/p><p>陷阱：<span class=\"m\">(1,2)<\/span> 元不是 <span class=\"m\">1^{10}<\/span> 也不是 <span class=\"m\">2^{10}<\/span>；乘冪不能逐元取次方（只有對角方陣可以）。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}4 &amp; 4\\\\ 0 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">A^3=\\begin{bmatrix}8 &amp; 12\\\\ 0 &amp; 8\\end{bmatrix}<\/span>，猜測 <span class=\"m\">A^n=\\begin{bmatrix}2^n &amp; n\\cdot 2^{n-1}\\\\ 0 &amp; 2^n\\end{bmatrix}<\/span>。<\/li><li>數學歸納法：<span class=\"m\">n=1<\/span> 成立；設 <span class=\"m\">n=k<\/span> 成立，<span class=\"m\">A^{k+1}=A^kA=\\begin{bmatrix}2^{k+1} &amp; 2^k+k\\cdot 2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}=\\begin{bmatrix}2^{k+1} &amp; (k+1)2^k\\\\ 0 &amp; 2^{k+1}\\end{bmatrix}<\/span>，<span class=\"m\">n=k+1<\/span> 亦成立。<\/li><li><span class=\"m\">A^{10}=\\begin{bmatrix}1024 &amp; 10\\cdot 512\\\\ 0 &amp; 1024\\end{bmatrix}=\\begin{bmatrix}1024 &amp; 5120\\\\ 0 &amp; 1024\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解：<span class=\"m\">A=2I+N<\/span>，<span class=\"m\">N=\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">N^2=O<\/span>，且 <span class=\"m\">2I<\/span> 與 <span class=\"m\">N<\/span> 可交換，<span class=\"m\">A^{10}=(2I)^{10}+10(2I)^9N=1024I+5120N<\/span>。<\/p><p>陷阱：<span class=\"m\">(1,2)<\/span> 元不是 <span class=\"m\">1^{10}<\/span> 也不是 <span class=\"m\">2^{10}<\/span>；乘冪不能逐元取次方（只有對角方陣可以）。<\/p>"},{"title":"例題 8　週期型的乘冪","q":"<p>（進階）　<span class=\"m\">A=\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span>，求 <span class=\"m\">A^{2026}<\/span>。<\/p>","steps":["<span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">A^3=A^2A=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>，故 <span class=\"m\">A^6=I<\/span>（圖 M8-7）。","<span class=\"m\">2026=6\\times 337+4<\/span>，<span class=\"m\">A^{2026}=(A^6)^{337}A^4=A^4=A^3A=-A=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; -1\\end{bmatrix}<\/span>。"],"after":"<p>另解：<span class=\"m\">a+d=1<\/span>，<span class=\"m\">ad-bc=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-A+I=O<\/span>；兩邊左乘 <span class=\"m\">A+I<\/span>：<span class=\"m\">(A+I)(A^2-A+I)=A^3+I=O<\/span>，即 <span class=\"m\">A^3=-I<\/span>。<\/p><p>陷阱：以 3 為週期得 <span class=\"m\">A^{2026}=A<\/span>，忽略 <span class=\"m\">A^3=-I<\/span> 的負號。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">A^2=\\begin{bmatrix}-1 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>，<span class=\"m\">A^3=A^2A=\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}=-I<\/span>，故 <span class=\"m\">A^6=I<\/span>（圖 M8-7）。<\/li><li><span class=\"m\">2026=6\\times 337+4<\/span>，<span class=\"m\">A^{2026}=(A^6)^{337}A^4=A^4=A^3A=-A=\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; -1\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解：<span class=\"m\">a+d=1<\/span>，<span class=\"m\">ad-bc=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-A+I=O<\/span>；兩邊左乘 <span class=\"m\">A+I<\/span>：<span class=\"m\">(A+I)(A^2-A+I)=A^3+I=O<\/span>，即 <span class=\"m\">A^3=-I<\/span>。<\/p><p>陷阱：以 3 為週期得 <span class=\"m\">A^{2026}=A<\/span>，忽略 <span class=\"m\">A^3=-I<\/span> 的負號。<\/p>"},{"title":"例題 9　以凱萊–哈密頓定理降次","q":"<p>（挑戰）　<span class=\"m\">A=\\begin{bmatrix}3 &amp; 1\\\\ 2 &amp; 2\\end{bmatrix}<\/span>。將 <span class=\"m\">A^4<\/span> 表示成 <span class=\"m\">pA+qI<\/span>，並求 <span class=\"m\">A^4<\/span>。<\/p>","steps":["<span class=\"m\">a+d=5<\/span>，<span class=\"m\">\\det A=6-2=4<\/span>，故 <span class=\"m\">A^2=5A-4I<\/span>。","<span class=\"m\">A^3=5A^2-4A=5(5A-4I)-4A=21A-20I<\/span>。","<span class=\"m\">A^4=21A^2-20A=21(5A-4I)-20A=85A-84I<\/span>，<span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。","<span class=\"m\">A^4=\\begin{bmatrix}255-84 &amp; 85\\\\ 170 &amp; 170-84\\end{bmatrix}=\\begin{bmatrix}171 &amp; 85\\\\ 170 &amp; 86\\end{bmatrix}<\/span>。"],"after":"<p>另解一（多項式除法）：<span class=\"m\">x^2-5x+4=(x-1)(x-4)<\/span>。設 <span class=\"m\">x^4=(x-1)(x-4)g(x)+px+q<\/span>，以 <span class=\"m\">x=1<\/span>、<span class=\"m\">x=4<\/span> 代入：<span class=\"m\">p+q=1<\/span>，<span class=\"m\">4p+q=256<\/span>，得 <span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。因 <span class=\"m\">(A-I)(A-4I)=O<\/span>，<span class=\"m\">A^4=85A-84I<\/span>。一般地 <span class=\"m\">A^n=\\dfrac{4^n-1}{3}A+\\dfrac{4-4^n}{3}I<\/span>。<\/p>\n<p>另解二（對角化，進階）：<span class=\"m\">A<\/span> 的特徵值為 1、4，<span class=\"m\">A=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 4\\end{bmatrix}P^{-1}<\/span>，故 <span class=\"m\">A^4=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 256\\end{bmatrix}P^{-1}<\/span>，結果相同；<span class=\"m\">P<\/span> 的求法詳見 M9 第八節。<\/p><p>陷阱：<span class=\"m\">A^2=5A-4I<\/span> 中的 <span class=\"m\">4I<\/span> 寫成 4。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">a+d=5<\/span>，<span class=\"m\">\\det A=6-2=4<\/span>，故 <span class=\"m\">A^2=5A-4I<\/span>。<\/li><li><span class=\"m\">A^3=5A^2-4A=5(5A-4I)-4A=21A-20I<\/span>。<\/li><li><span class=\"m\">A^4=21A^2-20A=21(5A-4I)-20A=85A-84I<\/span>，<span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。<\/li><li><span class=\"m\">A^4=\\begin{bmatrix}255-84 &amp; 85\\\\ 170 &amp; 170-84\\end{bmatrix}=\\begin{bmatrix}171 &amp; 85\\\\ 170 &amp; 86\\end{bmatrix}<\/span>。<\/li><\/ol>\n<p>另解一（多項式除法）：<span class=\"m\">x^2-5x+4=(x-1)(x-4)<\/span>。設 <span class=\"m\">x^4=(x-1)(x-4)g(x)+px+q<\/span>，以 <span class=\"m\">x=1<\/span>、<span class=\"m\">x=4<\/span> 代入：<span class=\"m\">p+q=1<\/span>，<span class=\"m\">4p+q=256<\/span>，得 <span class=\"m\">p=85<\/span>，<span class=\"m\">q=-84<\/span>。因 <span class=\"m\">(A-I)(A-4I)=O<\/span>，<span class=\"m\">A^4=85A-84I<\/span>。一般地 <span class=\"m\">A^n=\\dfrac{4^n-1}{3}A+\\dfrac{4-4^n}{3}I<\/span>。<\/p>\n<p>另解二（對角化，進階）：<span class=\"m\">A<\/span> 的特徵值為 1、4，<span class=\"m\">A=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 4\\end{bmatrix}P^{-1}<\/span>，故 <span class=\"m\">A^4=P\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 256\\end{bmatrix}P^{-1}<\/span>，結果相同；<span class=\"m\">P<\/span> 的求法詳見 M9 第八節。<\/p><p>陷阱：<span class=\"m\">A^2=5A-4I<\/span> 中的 <span class=\"m\">4I<\/span> 寫成 4。<\/p>"},{"title":"例題 10　反方陣存在條件","q":"<p>（基礎）　<span class=\"m\">A=\\begin{bmatrix}k &amp; 3\\\\ 2 &amp; k-1\\end{bmatrix}<\/span>。(1) 求使 <span class=\"m\">A<\/span> 不可逆的所有實數 <span class=\"m\">k<\/span>。(2) 當 <span class=\"m\">k=4<\/span> 時，求 <span class=\"m\">A^{-1}<\/span>。<\/p>","steps":["<span class=\"m\">\\det A=k(k-1)-6=k^2-k-6=(k-3)(k+2)<\/span>。不可逆 <span class=\"m\">\\iff\\det A=0\\iff k=3<\/span> 或 <span class=\"m\">k=-2<\/span>。","<span class=\"m\">k=4<\/span>：<span class=\"m\">A=\\begin{bmatrix}4 &amp; 3\\\\ 2 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=6<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{6}\\begin{bmatrix}3 &amp; -3\\\\ -2 &amp; 4\\end{bmatrix}=\\begin{bmatrix}\\frac{1}{2} &amp; -\\frac{1}{2}\\\\ -\\frac{1}{3} &amp; \\frac{2}{3}\\end{bmatrix}<\/span>。","驗算：<span class=\"m\">AA^{-1}<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">4\\cdot\\frac{1}{2}+3\\cdot(-\\frac{1}{3})=1<\/span>。"],"after":"<p>陷阱：公式中副對角線「變號」與主對角線「互換」做反了。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">\\det A=k(k-1)-6=k^2-k-6=(k-3)(k+2)<\/span>。不可逆 <span class=\"m\">\\iff\\det A=0\\iff k=3<\/span> 或 <span class=\"m\">k=-2<\/span>。<\/li><li><span class=\"m\">k=4<\/span>：<span class=\"m\">A=\\begin{bmatrix}4 &amp; 3\\\\ 2 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=6<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{6}\\begin{bmatrix}3 &amp; -3\\\\ -2 &amp; 4\\end{bmatrix}=\\begin{bmatrix}\\frac{1}{2} &amp; -\\frac{1}{2}\\\\ -\\frac{1}{3} &amp; \\frac{2}{3}\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">AA^{-1}<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">4\\cdot\\frac{1}{2}+3\\cdot(-\\frac{1}{3})=1<\/span>。<\/li><\/ol><p>陷阱：公式中副對角線「變號」與主對角線「互換」做反了。<\/p>"},{"title":"例題 11　以反方陣解二元一次聯立","q":"<p>（基礎）　(1) 以反方陣解 <span class=\"m\">\\begin{cases}3x+5y=7\\\\ 2x+4y=6\\end{cases}<\/span>。(2) 同一組係數，常數改為 <span class=\"m\">(1,0)<\/span>，求解。<\/p>","steps":["<span class=\"m\">A=\\begin{bmatrix}3 &amp; 5\\\\ 2 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=2<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{2}\\begin{bmatrix}4 &amp; -5\\\\ -2 &amp; 3\\end{bmatrix}<\/span>。","<span class=\"m\">X=A^{-1}\\begin{bmatrix}7\\\\ 6\\end{bmatrix}=\\dfrac{1}{2}\\begin{bmatrix}28-30\\\\ -14+18\\end{bmatrix}=\\begin{bmatrix}-1\\\\ 2\\end{bmatrix}<\/span>，即 <span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。","(2) <span class=\"m\">A^{-1}\\begin{bmatrix}1\\\\ 0\\end{bmatrix}<\/span>＝<span class=\"m\">A^{-1}<\/span> 的第 1 行＝<span class=\"m\">\\begin{bmatrix}2\\\\ -1\\end{bmatrix}<\/span>，即 <span class=\"m\">x=2<\/span>，<span class=\"m\">y=-1<\/span>。"],"after":"<p>另解（克拉瑪公式）：<span class=\"m\">\\Delta=2<\/span>，<span class=\"m\">\\Delta_x=\\begin{vmatrix}7 &amp; 5\\\\ 6 &amp; 4\\end{vmatrix}=-2<\/span>，<span class=\"m\">\\Delta_y=\\begin{vmatrix}3 &amp; 7\\\\ 2 &amp; 6\\end{vmatrix}=4<\/span>，<span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。<\/p><p>陷阱：寫成 <span class=\"m\">X=BA^{-1}<\/span>（無定義）。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">A=\\begin{bmatrix}3 &amp; 5\\\\ 2 &amp; 4\\end{bmatrix}<\/span>，<span class=\"m\">\\det A=2<\/span>，<span class=\"m\">A^{-1}=\\dfrac{1}{2}\\begin{bmatrix}4 &amp; -5\\\\ -2 &amp; 3\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=A^{-1}\\begin{bmatrix}7\\\\ 6\\end{bmatrix}=\\dfrac{1}{2}\\begin{bmatrix}28-30\\\\ -14+18\\end{bmatrix}=\\begin{bmatrix}-1\\\\ 2\\end{bmatrix}<\/span>，即 <span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。<\/li><li>(2) <span class=\"m\">A^{-1}\\begin{bmatrix}1\\\\ 0\\end{bmatrix}<\/span>＝<span class=\"m\">A^{-1}<\/span> 的第 1 行＝<span class=\"m\">\\begin{bmatrix}2\\\\ -1\\end{bmatrix}<\/span>，即 <span class=\"m\">x=2<\/span>，<span class=\"m\">y=-1<\/span>。<\/li><\/ol>\n<p>另解（克拉瑪公式）：<span class=\"m\">\\Delta=2<\/span>，<span class=\"m\">\\Delta_x=\\begin{vmatrix}7 &amp; 5\\\\ 6 &amp; 4\\end{vmatrix}=-2<\/span>，<span class=\"m\">\\Delta_y=\\begin{vmatrix}3 &amp; 7\\\\ 2 &amp; 6\\end{vmatrix}=4<\/span>，<span class=\"m\">x=-1<\/span>，<span class=\"m\">y=2<\/span>。<\/p><p>陷阱：寫成 <span class=\"m\">X=BA^{-1}<\/span>（無定義）。<\/p>"},{"title":"例題 12　左乘與右乘","q":"<p>（進階）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 5 &amp; 3\\end{bmatrix}<\/span>，<span class=\"m\">B=\\begin{bmatrix}1 &amp; 0\\\\ 2 &amp; 1\\end{bmatrix}<\/span>。分別求滿足 <span class=\"m\">AX=B<\/span> 與 <span class=\"m\">YA=B<\/span> 的方陣 <span class=\"m\">X<\/span>、<span class=\"m\">Y<\/span>。<\/p>","steps":["<span class=\"m\">\\det A=6-5=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ -5 &amp; 2\\end{bmatrix}<\/span>。","<span class=\"m\">X=A^{-1}B=\\begin{bmatrix}3-2 &amp; -1\\\\ -5+4 &amp; 2\\end{bmatrix}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。","<span class=\"m\">Y=BA^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ 6-5 &amp; -2+2\\end{bmatrix}=\\begin{bmatrix}3 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。","驗算：<span class=\"m\">AX<\/span> 的 <span class=\"m\">(2,1)<\/span> 元 <span class=\"m\">5\\cdot 1+3\\cdot(-1)=2<\/span>；<span class=\"m\">YA<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">3\\cdot 2+(-1)\\cdot 5=1<\/span>。"],"after":"<p>陷阱：<span class=\"m\">X\\ne Y<\/span>，左乘與右乘的結果一般不同；<span class=\"m\">AX=B<\/span> 兩邊<span class=\"circle\">同一側<\/span>乘 <span class=\"m\">A^{-1}<\/span>。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">\\det A=6-5=1<\/span>，<span class=\"m\">A^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ -5 &amp; 2\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">X=A^{-1}B=\\begin{bmatrix}3-2 &amp; -1\\\\ -5+4 &amp; 2\\end{bmatrix}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li><li><span class=\"m\">Y=BA^{-1}=\\begin{bmatrix}3 &amp; -1\\\\ 6-5 &amp; -2+2\\end{bmatrix}=\\begin{bmatrix}3 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span>。<\/li><li>驗算：<span class=\"m\">AX<\/span> 的 <span class=\"m\">(2,1)<\/span> 元 <span class=\"m\">5\\cdot 1+3\\cdot(-1)=2<\/span>；<span class=\"m\">YA<\/span> 的 <span class=\"m\">(1,1)<\/span> 元 <span class=\"m\">3\\cdot 2+(-1)\\cdot 5=1<\/span>。<\/li><\/ol><p>陷阱：<span class=\"m\">X\\ne Y<\/span>，左乘與右乘的結果一般不同；<span class=\"m\">AX=B<\/span> 兩邊<span class=\"circle\">同一側<\/span>乘 <span class=\"m\">A^{-1}<\/span>。<\/p>"},{"title":"例題 13　由多項式關係求反方陣","q":"<p>（挑戰）　<span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 3 &amp; 2\\end{bmatrix}<\/span>。(1) 證明 <span class=\"m\">A^2-4A+I=O<\/span>。(2) 以 (1) 求 <span class=\"m\">A^{-1}<\/span>。(3) 求 <span class=\"m\">A^2+A^{-2}<\/span> 與 <span class=\"m\">A^3+A^{-3}<\/span>。<\/p>","steps":["<span class=\"m\">a+d=4<\/span>，<span class=\"m\">\\det A=4-3=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-4A+I=O<\/span>。（直接驗算：<span class=\"m\">A^2=\\begin{bmatrix}7 &amp; 4\\\\ 12 &amp; 7\\end{bmatrix}=4A-I<\/span>。）","<span class=\"m\">A(4I-A)=4A-A^2=I<\/span>，且 <span class=\"m\">(4I-A)A=I<\/span>，故 <span class=\"m\">A^{-1}=4I-A=\\begin{bmatrix}2 &amp; -1\\\\ -3 &amp; 2\\end{bmatrix}<\/span>。","由 (2)，<span class=\"m\">A+A^{-1}=4I<\/span>。<span class=\"m\">A<\/span> 與 <span class=\"m\">A^{-1}<\/span> 可交換，<span class=\"m\">(A+A^{-1})^2=A^2+2I+A^{-2}<\/span>，故 <span class=\"m\">A^2+A^{-2}=16I-2I=14I<\/span>。","<span class=\"m\">(A+A^{-1})^3=A^3+3A+3A^{-1}+A^{-3}<\/span>，故 <span class=\"m\">A^3+A^{-3}=64I-3\\cdot 4I=52I<\/span>。"],"after":"<p>另解（直接計算）：<span class=\"m\">A^{-2}=(A^{-1})^2=\\begin{bmatrix}7 &amp; -4\\\\ -12 &amp; 7\\end{bmatrix}<\/span>，<span class=\"m\">A^2+A^{-2}=\\begin{bmatrix}14 &amp; 0\\\\ 0 &amp; 14\\end{bmatrix}<\/span>，相同。<\/p><p>陷阱：<span class=\"m\">A+A^{-1}=4I<\/span> 寫成 4；用乘法公式前須確認兩方陣可交換（此處 <span class=\"m\">AA^{-1}=A^{-1}A=I<\/span>）。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">a+d=4<\/span>，<span class=\"m\">\\det A=4-3=1<\/span>，由凱萊–哈密頓定理 <span class=\"m\">A^2-4A+I=O<\/span>。（直接驗算：<span class=\"m\">A^2=\\begin{bmatrix}7 &amp; 4\\\\ 12 &amp; 7\\end{bmatrix}=4A-I<\/span>。）<\/li><li><span class=\"m\">A(4I-A)=4A-A^2=I<\/span>，且 <span class=\"m\">(4I-A)A=I<\/span>，故 <span class=\"m\">A^{-1}=4I-A=\\begin{bmatrix}2 &amp; -1\\\\ -3 &amp; 2\\end{bmatrix}<\/span>。<\/li><li>由 (2)，<span class=\"m\">A+A^{-1}=4I<\/span>。<span class=\"m\">A<\/span> 與 <span class=\"m\">A^{-1}<\/span> 可交換，<span class=\"m\">(A+A^{-1})^2=A^2+2I+A^{-2}<\/span>，故 <span class=\"m\">A^2+A^{-2}=16I-2I=14I<\/span>。<\/li><li><span class=\"m\">(A+A^{-1})^3=A^3+3A+3A^{-1}+A^{-3}<\/span>，故 <span class=\"m\">A^3+A^{-3}=64I-3\\cdot 4I=52I<\/span>。<\/li><\/ol>\n<p>另解（直接計算）：<span class=\"m\">A^{-2}=(A^{-1})^2=\\begin{bmatrix}7 &amp; -4\\\\ -12 &amp; 7\\end{bmatrix}<\/span>，<span class=\"m\">A^2+A^{-2}=\\begin{bmatrix}14 &amp; 0\\\\ 0 &amp; 14\\end{bmatrix}<\/span>，相同。<\/p><p>陷阱：<span class=\"m\">A+A^{-1}=4I<\/span> 寫成 4；用乘法公式前須確認兩方陣可交換（此處 <span class=\"m\">AA^{-1}=A^{-1}A=I<\/span>）。<\/p>"},{"title":"例題 14　編碼與解碼","q":"<p>（應用）　以 <span class=\"m\">A=1,B=2,\\ldots,Z=26<\/span> 將英文字母轉成數字，每兩個字母組成行矩陣 <span class=\"m\">X<\/span>，以 <span class=\"m\">E=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 1\\end{bmatrix}<\/span> 左乘得 <span class=\"m\">Y=EX<\/span> 傳出。收到的數字依序為 27、14、48、28，求原文。<\/p>","steps":["<span class=\"m\">\\det E=1<\/span>，<span class=\"m\">E^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。","密文排成 <span class=\"m\">Y=\\begin{bmatrix}27 &amp; 48\\\\ 14 &amp; 28\\end{bmatrix}<\/span>（每行一組）。","<span class=\"m\">X=E^{-1}Y=\\begin{bmatrix}27-14 &amp; 48-28\\\\ -27+28 &amp; -48+56\\end{bmatrix}=\\begin{bmatrix}13 &amp; 20\\\\ 1 &amp; 8\\end{bmatrix}<\/span>。","13、1、20、8 對應 M、A、T、H，原文為 MATH。"],"after":"<p>陷阱：密文須依「每兩個一組成一行」排列；排成列再右乘 <span class=\"m\">E^{-1}<\/span> 會得到錯誤結果。<\/p>","sol":"<ol class=\"steps\"><li><span class=\"m\">\\det E=1<\/span>，<span class=\"m\">E^{-1}=\\begin{bmatrix}1 &amp; -1\\\\ -1 &amp; 2\\end{bmatrix}<\/span>。<\/li><li>密文排成 <span class=\"m\">Y=\\begin{bmatrix}27 &amp; 48\\\\ 14 &amp; 28\\end{bmatrix}<\/span>（每行一組）。<\/li><li><span class=\"m\">X=E^{-1}Y=\\begin{bmatrix}27-14 &amp; 48-28\\\\ -27+28 &amp; -48+56\\end{bmatrix}=\\begin{bmatrix}13 &amp; 20\\\\ 1 &amp; 8\\end{bmatrix}<\/span>。<\/li><li>13、1、20、8 對應 M、A、T、H，原文為 MATH。<\/li><\/ol><p>陷阱：密文須依「每兩個一組成一行」排列；排成列再右乘 <span class=\"m\">E^{-1}<\/span> 會得到錯誤結果。<\/p>"}],"mis":[{"bad":"<span class=\"m\">m\\times n<\/span> 矩陣有 <span class=\"m\">m<\/span> 行、<span class=\"m\">n<\/span> 列。","good":"<span class=\"m\">m\\times n<\/span> 矩陣有 <span class=\"m\">m<\/span> 列（橫）、<span class=\"m\">n<\/span> 行（直），先列後行。"},{"bad":"<span class=\"m\">AB<\/span> 與 <span class=\"m\">BA<\/span> 都有定義時，兩者相等。","good":"兩者可能階數不同；同階時一般也不相等。乘法不具交換律。"},{"bad":"<span class=\"m\">AB=O<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">B=O<\/span>。","good":"可能有零因子；只能推得 <span class=\"m\">\\det A\\cdot\\det B=0<\/span>。若 <span class=\"m\">A<\/span> 可逆才有 <span class=\"m\">B=O<\/span>。"},{"bad":"<span class=\"m\">AB=AC<\/span> 且 <span class=\"m\">A\\ne O<\/span>，則 <span class=\"m\">B=C<\/span>。","good":"須 <span class=\"m\">A<\/span> 可逆（<span class=\"m\">\\det A\\ne 0<\/span>）才能左乘 <span class=\"m\">A^{-1}<\/span> 消去。"},{"bad":"<span class=\"m\">(A+B)^2=A^2+2AB+B^2<\/span>，<span class=\"m\">(A+B)(A-B)=A^2-B^2<\/span>。","good":"一般為 <span class=\"m\">A^2+AB+BA+B^2<\/span> 與 <span class=\"m\">A^2-AB+BA-B^2<\/span>；<span class=\"m\">AB=BA<\/span> 時才化簡。"},{"bad":"<span class=\"m\">A^2=O<\/span>，則 <span class=\"m\">A=O<\/span>；<span class=\"m\">A^2=A<\/span>，則 <span class=\"m\">A=O<\/span> 或 <span class=\"m\">I<\/span>。","good":"<span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ 0 &amp; 0\\end{bmatrix}^2=O<\/span>，<span class=\"m\">\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}^2=\\begin{bmatrix}1 &amp; 0\\\\ 0 &amp; 0\\end{bmatrix}<\/span>，皆為反例。"},{"bad":"非零方陣都有反方陣。","good":"二階方陣可逆的條件是 <span class=\"m\">\\det A\\ne 0<\/span>，如 <span class=\"m\">\\begin{bmatrix}1 &amp; 2\\\\ 2 &amp; 4\\end{bmatrix}<\/span> 非零卻不可逆；非方陣沒有反方陣。"},{"bad":"<span class=\"m\">(AB)^{-1}=A^{-1}B^{-1}<\/span>。","good":"<span class=\"m\">(AB)^{-1}=B^{-1}A^{-1}<\/span>，順序相反。"},{"bad":"二階方陣 <span class=\"m\">\\det(2A)=2\\det A<\/span>。","good":"<span class=\"m\">\\det(2A)=2^2\\det A=4\\det A<\/span>，係數乘到每一列。"},{"bad":"<span class=\"m\">AX=B<\/span> 的解為 <span class=\"m\">X=BA^{-1}<\/span> 或 <span class=\"m\">X=\\dfrac{B}{A}<\/span>。","good":"兩邊左乘 <span class=\"m\">A^{-1}<\/span>：<span class=\"m\">X=A^{-1}B<\/span>；矩陣沒有除法。"},{"bad":"<span class=\"m\">AX-3X=(A-3)X<\/span>。","good":"<span class=\"m\">AX-3X=(A-3I)X<\/span>；方陣不能減去實數。"},{"bad":"<span class=\"m\">\\det(A+B)=\\det A+\\det B<\/span>。","good":"行列式只有乘法定理；例如 <span class=\"m\">\\det(I+I)=4\\ne 1+1<\/span>。"}],"check":["能說出 <span class=\"m\">m\\times n<\/span> 矩陣的列、行與 <span class=\"m\">(i,j)<\/span> 元的意義，判斷兩矩陣是否相等。","能做同階矩陣的加減與係數積，解只含線性運算的矩陣方程式。","能判斷乘積是否有定義並寫出其階數；能以「列乘行」計算乘積的任一元。","能說明資料表相乘時各元的意義，以及乘積「有定義但無意義」的情形。","能舉例說明乘法不具交換律、零因子、消去律失效，並正確展開 <span class=\"m\">(A+B)^2<\/span>。","能以對角、推移、<span class=\"m\">kI+N<\/span>、<span class=\"m\">A^2=kA<\/span>、週期型求 <span class=\"m\">A^n<\/span>；（進階）以凱萊–哈密頓定理降次。","能寫出二階反方陣公式，並以 <span class=\"m\">\\det A\\ne 0<\/span> 判斷可逆。","能運用 <span class=\"m\">(AB)^{-1}=B^{-1}A^{-1}<\/span>、<span class=\"m\">\\det(rA)=r^2\\det A<\/span>、<span class=\"m\">\\det(A^{-1})=\\frac{1}{\\det A}<\/span>。","能分辨 <span class=\"m\">AX=B<\/span> 與 <span class=\"m\">XA=B<\/span> 的解法，並以反方陣或克拉瑪公式解二元一次聯立。","能說明三階反方陣的存在條件與列運算求法的原理（進階），並知道電腦矩陣運算的函數與浮點誤差。"]},"M9":{"id":"M9","title":"平面上的線性變換","subject":"數學","src":"","secs":[{"t":"導言","h":"<p>本單元範圍：二階方陣所代表的平面線性變換，包括伸縮、鏡射、旋轉、推移、投影，合成變換，行列式的面積比與方向意義，反變換。先備：M8 矩陣乘法與二階反方陣（又稱逆矩陣）、M4 二階行列式、第三冊 A 三角函數的和角公式。<\/p>"},{"t":"課綱對照與考點","h":"<table class=\"t\"><thead><tr><th>課綱條目<\/th><th>學習內容<\/th><th>本單元小節<\/th><th>學測常見考法<\/th><\/tr><\/thead><tbody>\n<tr><td>F-11A-3<\/td><td>矩陣的應用：平面上的線性變換<\/td><td>一、線性變換與二階方陣<\/td><td>由兩點的像求矩陣；由矩陣求點的像與原像<\/td><\/tr>\n<tr><td>F-11A-3<\/td><td>伸縮、鏡射、旋轉、推移<\/td><td>二、三、四<\/td><td>辨認矩陣代表的變換；求對 <span class=\"m\">y=mx<\/span> 鏡射、旋轉 <span class=\"m\">\\theta<\/span> 後的坐標<\/td><\/tr>\n<tr><td>F-11A-3<\/td><td>投影（正射影）<\/td><td>四<\/td><td>投影矩陣不可逆、<span class=\"m\">P^2=P<\/span>；鏡射＝2 投影 − I<\/td><\/tr>\n<tr><td>A-11A-3（連結）<\/td><td>矩陣乘法<\/td><td>五、合成變換<\/td><td>合成順序（右邊先作用）；旋轉的乘冪<\/td><\/tr>\n<tr><td>G-11A-8（連結）<\/td><td>行列式<\/td><td>六、面積比與方向<\/td><td>面積比 <span class=\"m\">=|\\det A|<\/span>；<span class=\"m\">\\det A<\/span> 正負與繞行方向<\/td><\/tr>\n<tr><td>A-11A-3（連結）<\/td><td>反方陣<\/td><td>七、反變換與圖形的像<\/td><td>求直線、圓經變換後的方程式；由像求原像<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"exam\"><p>線性變換常與 M8 矩陣乘法合考：混合題常以「先作 <span class=\"m\">T_1<\/span> 再作 <span class=\"m\">T_2<\/span>」的情境要求寫出合成矩陣，再求面積或點列坐標。分科測驗另有與複數極式（數學甲）結合的題型，學測數 A 以二階方陣的計算與幾何意義為主。<\/p><\/div>"},{"t":"一、線性變換與二階方陣","h":"<div class=\"key\"><p><strong>先備回顧<\/strong><\/p><ul>\n<li>矩陣乘法：<span class=\"m\">\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\begin{bmatrix}x\\\\ y\\end{bmatrix}=\\begin{bmatrix}ax+by\\\\ cx+dy\\end{bmatrix}<\/span>。<\/li>\n<li>二階行列式：<span class=\"m\">\\det A=\\begin{vmatrix}a &amp; b\\\\ c &amp; d\\end{vmatrix}=ad-bc<\/span>。<\/li>\n<li><span class=\"m\">\\det A\\ne 0<\/span> 時，<span class=\"m\">A^{-1}=\\dfrac{1}{ad-bc}\\begin{bmatrix}d &amp; -b\\\\ -c &amp; a\\end{bmatrix}<\/span>。<\/li>\n<li>和角公式：<span class=\"m\">\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta<\/span>，<span class=\"m\">\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta<\/span>。<\/li>\n<\/ul><\/div>\n<h4>1. 定義<\/h4>\n<div class=\"note\"><p>點寫成<strong>行向量<\/strong>（直的），矩陣放在<strong>左邊<\/strong>。<\/p><p>課本記號 <span class=\"m\">T(x,y)<\/span> 與 <span class=\"m\">A\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/span> 同義。<\/p><\/div>\n<p><strong>定義<\/strong>　設 <span class=\"m\">a,b,c,d<\/span> 為實數。將平面上每一點 <span class=\"m\">P(x,y)<\/span> 對應到點 <span class=\"m\">P'(x',y')<\/span>，其中<\/p>\n<div class=\"formula\" data-t=\"線性變換\"><div class=\"mb\">\\begin{cases}x'=ax+by\\\\ y'=cx+dy\\end{cases}\\iff \\begin{bmatrix}x'\\\\ y'\\end{bmatrix}=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/div><p>這種對應稱為平面上的<strong>線性變換<\/strong>，記作 <span class=\"m\">T<\/span>；二階方陣 <span class=\"m\">A=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}<\/span> 稱為 <span class=\"m\">T<\/span> 的<strong>變換矩陣<\/strong>（簡稱矩陣）；<span class=\"m\">P'<\/span> 稱為 <span class=\"m\">P<\/span> 的<strong>像<\/strong>，<span class=\"m\">P<\/span> 稱為 <span class=\"m\">P'<\/span> 的<strong>原像<\/strong>。<\/p><\/div>\n<p>線性變換與二階方陣<span class=\"box\">一一對應<\/span>：給定矩陣即決定變換，給定變換（每一點的像）即決定矩陣。<span class=\"hand\">新坐標是舊坐標的一次式、無常數項<\/span><\/p>\n<div class=\"warn\"><p>注意：<span class=\"m\">x'=x+2,\\ y'=y<\/span>（平移）含常數項，<em>不是線性變換<\/em>，原點的像為 <span class=\"m\">(2,0)<\/span>。線性變換必把原點映到原點。<\/p><\/div>\n<h4>2. 矩陣的兩行＝兩個單位點的像<\/h4>\n<p>令 <span class=\"m\">\\vec{e_1}=(1,0)<\/span>、<span class=\"m\">\\vec{e_2}=(0,1)<\/span>，則<\/p>\n<div class=\"mb\">A\\begin{bmatrix}1\\\\ 0\\end{bmatrix}=\\begin{bmatrix}a\\\\ c\\end{bmatrix},\\qquad A\\begin{bmatrix}0\\\\ 1\\end{bmatrix}=\\begin{bmatrix}b\\\\ d\\end{bmatrix}<\/div>\n<div class=\"formula\" data-t=\"矩陣的行\"><div class=\"mb\">A=\\Big[\\ T(\\vec{e_1})\\ \\Big|\\ T(\\vec{e_2})\\ \\Big]<\/div><p>第一行是 <span class=\"m\">(1,0)<\/span> 的像，第二行是 <span class=\"m\">(0,1)<\/span> 的像。求變換矩陣時，先求兩個單位點的像，依序<span class=\"circle\">直著<\/span>填入。<\/p><\/div>\n<p>單位正方形（頂點 <span class=\"m\">O<\/span>、<span class=\"m\">(1,0)<\/span>、<span class=\"m\">(1,1)<\/span>、<span class=\"m\">(0,1)<\/span>）的像是以 <span class=\"m\">(a,c)<\/span>、<span class=\"m\">(b,d)<\/span> 為鄰邊的平行四邊形（<span class=\"m\">\\det A\\ne 0<\/span> 時）。圖 M9-1 為 <span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span> 的情形。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 560 250\" width=\"560\"><defs><marker id=\"M9-f1-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f1-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><marker id=\"M9-f1-m2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2e8b57\"/><\/marker><\/defs>\n<line x1=\"60\" y1=\"200\" x2=\"60\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"110\" y1=\"200\" x2=\"110\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"160\" y1=\"200\" x2=\"160\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"210\" y1=\"200\" x2=\"210\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"200\" x2=\"210\" y2=\"200\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"150\" x2=\"210\" y2=\"150\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"100\" x2=\"210\" y2=\"100\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"50\" x2=\"210\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"200\" x2=\"230\" y2=\"200\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f1-m0)\"/>\n<line x1=\"60\" y1=\"220\" x2=\"60\" y2=\"30\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f1-m0)\"/>\n<text x=\"226\" y=\"218\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"68\" y=\"38\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"46\" y=\"216\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"60,200 110,200 110,150 60,150\" fill=\"#cfe3f8\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<line x1=\"60\" y1=\"200\" x2=\"110\" y2=\"200\" stroke=\"#c2410c\" stroke-width=\"2.4\" marker-end=\"url(#M9-f1-m1)\"/>\n<line x1=\"60\" y1=\"200\" x2=\"60\" y2=\"150\" stroke=\"#2e8b57\" stroke-width=\"2.4\" marker-end=\"url(#M9-f1-m2)\"/>\n<text x=\"102\" y=\"218\" font-size=\"13\" fill=\"#c2410c\">(1,0)<\/text>\n<text x=\"16\" y=\"154\" font-size=\"13\" fill=\"#2e8b57\">(0,1)<\/text>\n<text x=\"255\" y=\"95\" font-size=\"18\" fill=\"#1f2a44\">A<\/text>\n<line x1=\"232\" y1=\"110\" x2=\"292\" y2=\"110\" stroke=\"#1f2a44\" stroke-width=\"1.6\" marker-end=\"url(#M9-f1-m0)\"/>\n<line x1=\"330\" y1=\"200\" x2=\"330\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"380\" y1=\"200\" x2=\"380\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"430\" y1=\"200\" x2=\"430\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"480\" y1=\"200\" x2=\"480\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"330\" y1=\"200\" x2=\"480\" y2=\"200\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"330\" y1=\"150\" x2=\"480\" y2=\"150\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"330\" y1=\"100\" x2=\"480\" y2=\"100\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"330\" y1=\"50\" x2=\"480\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"310\" y1=\"200\" x2=\"510\" y2=\"200\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f1-m0)\"/>\n<line x1=\"330\" y1=\"220\" x2=\"330\" y2=\"30\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f1-m0)\"/>\n<text x=\"506\" y=\"218\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"338\" y=\"38\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"316\" y=\"216\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polygon points=\"330,200 430,150 480,50 380,100\" fill=\"#fbdcbd\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<line x1=\"330\" y1=\"200\" x2=\"430\" y2=\"150\" stroke=\"#c2410c\" stroke-width=\"2.4\" marker-end=\"url(#M9-f1-m1)\"/>\n<line x1=\"330\" y1=\"200\" x2=\"380\" y2=\"100\" stroke=\"#2e8b57\" stroke-width=\"2.4\" marker-end=\"url(#M9-f1-m2)\"/>\n<text x=\"436\" y=\"160\" font-size=\"13\" fill=\"#c2410c\">(2,1)<\/text>\n<text x=\"336\" y=\"100\" font-size=\"13\" fill=\"#2e8b57\">(1,2)<\/text>\n<text x=\"385\" y=\"130\" font-size=\"13\" fill=\"#1f2a44\">面積 3<\/text>\n<\/svg><figcaption>圖 M9-1　單位正方形經 <span class=\"m\">A=\\begin{bmatrix}2 &amp; 1\\\\ 1 &amp; 2\\end{bmatrix}<\/span> 變成以 (2,1)、(1,2) 為鄰邊的平行四邊形<\/figcaption><\/figure>\n<h4>3. 線性性質<\/h4>\n<div class=\"key\"><p><strong>性質<\/strong>　設 <span class=\"m\">T<\/span> 為矩陣 <span class=\"m\">A<\/span> 所代表的線性變換，<span class=\"m\">\\vec{u},\\vec{v}<\/span> 為向量，<span class=\"m\">r,s<\/span> 為實數。<\/p><ol>\n<li><span class=\"m\">T(\\vec{0})=\\vec{0}<\/span>（原點不動）。<\/li>\n<li><span class=\"m\">T(\\vec{u}+\\vec{v})=T(\\vec{u})+T(\\vec{v})<\/span>（可加性）。<\/li>\n<li><span class=\"m\">T(r\\vec{u})=rT(\\vec{u})<\/span>（齊次性）。<\/li>\n<li>合併：<span class=\"box\"><span class=\"m\">T(r\\vec{u}+s\\vec{v})=rT(\\vec{u})+sT(\\vec{v})<\/span><\/span>。<\/li>\n<\/ol><\/div>\n<p>由性質 4 得到下列幾何推論（「線性」一詞的來源）：<\/p>\n<ul>\n<li>直線 <span class=\"m\">\\vec{p}+t\\vec{v}<\/span> 的像為 <span class=\"m\">T(\\vec{p})+tT(\\vec{v})<\/span>：當 <span class=\"m\">T(\\vec{v})\\ne\\vec{0}<\/span> 時為<strong>直線<\/strong>，當 <span class=\"m\">T(\\vec{v})=\\vec{0}<\/span> 時<em>退化為一點<\/em>。<\/li>\n<li>線段的像為線段（或一點），且<strong>分點比例不變<\/strong>：若 <span class=\"m\">M<\/span> 分 <span class=\"m\">\\overline{PQ}<\/span> 為 <span class=\"m\">m:n<\/span>，則 <span class=\"m\">T(M)<\/span> 分 <span class=\"m\">T(P)T(Q)<\/span> 為 <span class=\"m\">m:n<\/span>。特別地，中點映到中點、重心映到重心。<\/li>\n<li>平行直線的像仍平行（或重合、或皆退化為點）；平行四邊形的像為平行四邊形（可能退化）。<\/li>\n<li>長度、角度、面積<em>一般會改變<\/em>；正方形的像通常只是平行四邊形。<\/li>\n<\/ul>\n<div class=\"exam\"><p>學測多選題常列「線性變換必保持長度／垂直／面積」等選項作為誘答。必保持的只有：原點不動、直線性（或退化）、平行、分點比例。<\/p><\/div>\n<h4>4. 由兩點的像決定矩陣<\/h4>\n<p>若已知兩個<span class=\"circle\">不平行<\/span>的向量 <span class=\"m\">\\vec{u},\\vec{v}<\/span> 的像，則任一向量可寫成 <span class=\"m\">r\\vec{u}+s\\vec{v}<\/span>，其像由線性性質決定，故矩陣唯一。<\/p>\n<div class=\"formula\" data-t=\"兩點定矩陣\"><div class=\"mb\">A\\begin{bmatrix}u_1 &amp; v_1\\\\ u_2 &amp; v_2\\end{bmatrix}=\\begin{bmatrix}u_1' &amp; v_1'\\\\ u_2' &amp; v_2'\\end{bmatrix}\\ \\Longrightarrow\\ A=\\begin{bmatrix}u_1' &amp; v_1'\\\\ u_2' &amp; v_2'\\end{bmatrix}\\begin{bmatrix}u_1 &amp; v_1\\\\ u_2 &amp; v_2\\end{bmatrix}^{-1}<\/div><p><span class=\"m\">(u_1',u_2')<\/span>、<span class=\"m\">(v_1',v_2')<\/span> 分別為 <span class=\"m\">\\vec{u}<\/span>、<span class=\"m\">\\vec{v}<\/span> 的像；條件 <span class=\"m\">u_1v_2-u_2v_1\\ne 0<\/span>（兩向量不平行）。<\/p><\/div>\n<ol class=\"steps\"><li>把已知點寫成行，排成矩陣 <span class=\"m\">B<\/span>；對應的像排成 <span class=\"m\">C<\/span>（順序一致）。<\/li><li>由 <span class=\"m\">AB=C<\/span> 得 <span class=\"m\">A=CB^{-1}<\/span>（<em>右乘<\/em> <span class=\"m\">B^{-1}<\/span>，不可寫成 <span class=\"m\">B^{-1}C<\/span>）。<\/li><li>或改用線性組合：先把 <span class=\"m\">(1,0)<\/span>、<span class=\"m\">(0,1)<\/span> 寫成 <span class=\"m\">\\vec{u},\\vec{v}<\/span> 的組合，再求其像。<\/li><\/ol>\n<div class=\"warn\"><p>若 <span class=\"m\">\\vec{u}\\parallel\\vec{v}<\/span>，兩點的像<em>不足以決定矩陣<\/em>；若兩點的像又互相矛盾（如 <span class=\"m\">\\vec{v}=2\\vec{u}<\/span> 但 <span class=\"m\">T(\\vec{v})\\ne 2T(\\vec{u})<\/span>），則不存在這樣的線性變換。<\/p><\/div>\n<div class=\"tip\"><p>深究　線性變換的公理化定義（進階）<\/p>\n<p>大學線性代數把「線性」定義為性質 2、3：函數 <span class=\"m\">T:\\mathbb{R}^2\\to\\mathbb{R}^2<\/span> 滿足 <span class=\"m\">T(\\vec{u}+\\vec{v})=T(\\vec{u})+T(\\vec{v})<\/span> 與 <span class=\"m\">T(r\\vec{u})=rT(\\vec{u})<\/span>，即稱為線性變換。由此可證每個線性變換都有矩陣表示：<\/p>\n<div class=\"mb\">T(x,y)=T(x\\vec{e_1}+y\\vec{e_2})=xT(\\vec{e_1})+yT(\\vec{e_2})=x\\begin{bmatrix}a\\\\ c\\end{bmatrix}+y\\begin{bmatrix}b\\\\ d\\end{bmatrix}=\\begin{bmatrix}a &amp; b\\\\ c &amp; d\\end{bmatrix}\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/div>\n<p>所以「線性變換」與「乘上一個方陣」兩種說法等價。高中課程以矩陣形式定義，大學以公理定義，兩者描述同一類變換。平移 <span class=\"m\">\\vec{x}\\mapsto\\vec{x}+\\vec{b}<\/span> 與線性變換的合成 <span class=\"m\">\\vec{x}\\mapsto A\\vec{x}+\\vec{b}<\/span> 稱為<strong>仿射變換<\/strong>（進階），電腦繪圖以三階矩陣（齊次坐標）統一處理。<\/p><\/div>\n<div class=\"tip\"><p>補充　數學史<\/p><p>1844 年，德國數學家格拉斯曼（H. Grassmann）在《延伸論》中提出多維向量的運算；1844 年艾森斯坦（G. Eisenstein）以單一字母表示線性代換，並指出其乘法不具交換律；1850 年西爾維斯特（J. J. Sylvester）首先使用 matrix 一詞；1858 年凱萊（A. Cayley）發表〈矩陣理論的研究報告〉，定義矩陣的加法、乘法與反方陣，矩陣乘法的定義即來自線性變換的合成；1888 年皮亞諾（G. Peano）在《幾何計算》中首次給出（實數）向量空間的公理化定義，並定義線性運算子，說明取坐標後即以矩陣表示。<\/p><\/div>","sims":[["lt",{"presets":["id","shear","rot"],"preset":"shear"}]],"qs":["M9-01","M9-K03"]},{"t":"二、伸縮與鏡射","h":"<h4>1. 伸縮<\/h4>\n<div class=\"formula\" data-t=\"伸縮\"><div class=\"mb\">S=\\begin{bmatrix}h &amp; 0\\\\ 0 &amp; k\\end{bmatrix}:\\ (x,y)\\mapsto(hx,ky)\\qquad(h,k&gt;0)<\/div><p>沿 <span class=\"m\">x<\/span> 軸方向伸縮為 <span class=\"m\">h<\/span> 倍、沿 <span class=\"m\">y<\/span> 軸方向伸縮為 <span class=\"m\">k<\/span> 倍。<span class=\"m\">h=k<\/span> 時稱為<strong>以原點為中心的伸縮（位似）<\/strong>，矩陣為 <span class=\"m\">kI<\/span>。<\/p><\/div>\n<ul>\n<li><span class=\"m\">h&gt;1<\/span> 為拉長，<span class=\"m\">0&lt;h&lt;1<\/span> 為壓縮；<span class=\"m\">h=1<\/span> 表示該方向不變。<\/li>\n<li>面積變為 <span class=\"m\">hk<\/span> 倍；<span class=\"m\">\\det S=hk<\/span>。<\/li>\n<li>圓 <span class=\"m\">x^2+y^2=r^2<\/span> 經 <span class=\"m\">S<\/span> 變成橢圓 <span class=\"m\">\\dfrac{x^2}{(hr)^2}+\\dfrac{y^2}{(kr)^2}=1<\/span>（<span class=\"m\">h\\ne k<\/span> 時）。<span class=\"hand\">橢圓面積 πab 的由來<\/span><\/li>\n<\/ul>\n<figure class=\"fig\"><svg viewBox=\"0 0 600 210\" width=\"600\"><defs><marker id=\"M9-f2-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f2-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs>\n<line x1=\"98.4\" y1=\"105\" x2=\"507.2\" y2=\"105\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f2-m0)\"/>\n<line x1=\"300\" y1=\"197.4\" x2=\"300\" y2=\"7\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f2-m0)\"/>\n<text x=\"503.2\" y=\"123\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"308\" y=\"15\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"286\" y=\"121\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<polyline points=\"356,105 355.9,10  width=\"420\"><defs><marker id=\"M9-f4-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><\/defs>\n<line x1=\"62\" y1=\"240\" x2=\"392\" y2=\"240\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f4-m0)\"/>\n<line x1=\"150\" y1=\"273\" x2=\"150\" y2=\"25.5\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f4-m0)\"/>\n<text x=\"388\" y=\"258\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"158\" y=\"33.5\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"136\" y=\"256\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"102.4\" y1=\"267.5\" x2=\"359.6\" y2=\"119\" stroke=\"#7a5cc2\" stroke-width=\"1.6\"/>\n<text x=\"349.3\" y=\"121.3\" font-size=\"15\" fill=\"#7a5cc2\" font-style=\"italic\">L<\/text>\n<line x1=\"150\" y1=\"240\" x2=\"220.1\" y2=\"66.6\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<line x1=\"150\" y1=\"240\" x2=\"335.2\" y2=\"266\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<line x1=\"220.1\" y1=\"66.6\" x2=\"335.2\" y2=\"266\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"220.1\" cy=\"66.6\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"200.1\" y=\"56.6\" font-size=\"14\" fill=\"#2f6fb5\">P(x, y)<\/text>\n<circle cx=\"335.2\" cy=\"266\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"343.2\" y=\"270\" font-size=\"14\" fill=\"#d9772b\">P'(x', y')<\/text>\n<path d=\"M199.5,240 A49.5,49.5 0 0 0 192.9,215.2\" fill=\"none\" stroke=\"#7a5cc2\" stroke-width=\"1.4\"/>\n<text x=\"202.2\" y=\"227.9\" font-size=\"14\" fill=\"#7a5cc2\" font-style=\"italic\">θ<\/text>\n<path d=\"M221.4,198.8 A82.5,82.5 0 0 0 180.9,163.5\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<text x=\"188.2\" y=\"189.3\" font-size=\"12\" fill=\"#2f6fb5\">φ−θ<\/text>\n<path d=\"M253.5,254.5 A104.5,104.5 0 0 0 240.5,187.8\" fill=\"none\" stroke=\"#d9772b\" stroke-width=\"1.4\"/>\n<text x=\"260\" y=\"234.5\" font-size=\"13\" fill=\"#d9772b\">φ−θ<\/text>\n<\/svg><figcaption>圖 M9-4　P 對傾斜角 θ 的直線 L 鏡射，像 P' 的方向角為 2θ − φ（示意圖）<\/figcaption><\/figure>\n<div class=\"mb\">\\begin{aligned}x'&amp;=r\\cos(2\\theta-\\varphi)=\\cos2\\theta\\,(r\\cos\\varphi)+\\sin2\\theta\\,(r\\sin\\varphi)=x\\cos2\\theta+y\\sin2\\theta\\\\ y'&amp;=r\\sin(2\\theta-\\varphi)=\\sin2\\theta\\,(r\\cos\\varphi)-\\cos2\\theta\\,(r\\sin\\varphi)=x\\sin2\\theta-y\\cos2\\theta\\end{aligned}<\/div>\n<div class=\"formula\" data-t=\"對過原點直線的鏡射\"><div class=\"mb\">M_\\theta=\\begin{bmatrix}\\cos2\\theta &amp; \\sin2\\theta\\\\ \\sin2\\theta &amp; -\\cos2\\theta\\end{bmatrix},\\qquad L:\\ y=mx\\ \\Rightarrow\\ M=\\dfrac{1}{1+m^2}\\begin{bmatrix}1-m^2 &amp; 2m\\\\ 2m &amp; m^2-1\\end{bmatrix}<\/div><p><span class=\"m\">\\theta<\/span>：<span class=\"m\">L<\/span> 的傾斜角；<span class=\"m\">m=\\tan\\theta<\/span>。後式由 <span class=\"m\">\\cos2\\theta=\\dfrac{1-m^2}{1+m^2}<\/span>、<span class=\"m\">\\sin2\\theta=\\dfrac{2m}{1+m^2}<\/span> 得到。<\/p><\/div>\n<div class=\"mnem\"><p>鏡射矩陣：對角線 cos2θ、負 cos2θ；反對角線兩個 sin2θ；跡為 0、行列式為 −1<\/p><\/div>\n<ul>\n<li>檢驗：<span class=\"m\">\\theta=0<\/span> 得對 <span class=\"m\">x<\/span> 軸鏡射；<span class=\"m\">\\theta=45^\\circ<\/span> 得對 <span class=\"m\">y=x<\/span> 鏡射；<span class=\"m\">\\theta=90^\\circ<\/span> 得對 <span class=\"m\">y<\/span> 軸鏡射。<\/li>\n<li>鏡射矩陣滿足 <span class=\"m\">M^2=I<\/span>（鏡射兩次回到原處），故 <span class=\"box\"><span class=\"m\">M^{-1}=M<\/span><\/span>。<\/li>\n<li><span class=\"m\">\\det M_\\theta=-\\cos^22\\theta-\\sin^22\\theta=-1<\/span>。<\/li>\n<li>鏡射矩陣是對稱矩陣（<span class=\"m\">b=c<\/span>），且對角線和 <span class=\"m\">a+d=0<\/span>。<span class=\"hand blue\">檢查計算的快速方法<\/span><\/li>\n<\/ul>\n<div class=\"exam\"><p>學測求對 <span class=\"m\">y=mx<\/span> 的對稱點，可用公式，也可用「中點在 <span class=\"m\">L<\/span> 上、連線垂直 <span class=\"m\">L<\/span>」兩條件解聯立，或用投影：<span class=\"m\">P'=2Q-P<\/span>（<span class=\"m\">Q<\/span> 為 <span class=\"m\">P<\/span> 在 <span class=\"m\">L<\/span> 上的投影點）。三法互相驗算。<\/p><\/div>\n<div class=\"tip\"><p>深究　對不過原點直線的鏡射不是線性變換<\/p><p>對直線 <span class=\"m\">L:\\ y=x+1<\/span> 鏡射時，原點的像為 <span class=\"m\">(-1,1)\\ne(0,0)<\/span>，故不能以二階方陣表示。處理方式：先平移使 <span class=\"m\">L<\/span> 過原點，鏡射後再平移回來，即 <span class=\"m\">P'=M(P-C)+C<\/span>，<span class=\"m\">C<\/span> 為 <span class=\"m\">L<\/span> 上一點。旋轉中心不在原點時同理（見三、旋轉）。<\/p><\/div>","sims":[["lt",{"presets":["scale","refx","refyx"],"preset":"refx","title":"伸縮與鏡射"}]],"qs":["M9-09","M9-06","M9-32"]},{"t":"三、旋轉","h":"<h4>1. 旋轉矩陣的推導<\/h4>\n<p>以原點為中心，把每一點沿逆時針方向旋轉角 <span class=\"m\">\\theta<\/span> 的變換稱為<strong>旋轉 <span class=\"m\">\\theta<\/span><\/strong>。規定<span class=\"circle\">逆時針為正<\/span>，順時針旋轉 <span class=\"m\">\\theta<\/span> 即旋轉 <span class=\"m\">-\\theta<\/span>。<\/p>\n<p>設 <span class=\"m\">P(r\\cos\\varphi,r\\sin\\varphi)<\/span>，旋轉後 <span class=\"m\">P'(r\\cos(\\varphi+\\theta),r\\sin(\\varphi+\\theta))<\/span>，由和角公式：<\/p>\n<div class=\"mb\">\\begin{aligned}x'&amp;=r\\cos\\varphi\\cos\\theta-r\\sin\\varphi\\sin\\theta=x\\cos\\theta-y\\sin\\theta\\\\ y'&amp;=r\\sin\\varphi\\cos\\theta+r\\cos\\varphi\\sin\\theta=x\\sin\\theta+y\\cos\\theta\\end{aligned}<\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 290\" width=\"400\"><defs><marker id=\"M9-f5-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f5-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs>\n<line x1=\"50.4\" y1=\"250\" x2=\"386.8\" y2=\"250\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f5-m0)\"/>\n<line x1=\"120\" y1=\"273.2\" x2=\"120\" y2=\"23.8\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f5-m0)\"/>\n<text x=\"382.8\" y=\"268\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"128\" y=\"31.8\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"106\" y=\"266\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"120\" y1=\"250\" x2=\"299.9\" y2=\"184.5\" stroke=\"#2f6fb5\" stroke-width=\"1.8\"/>\n<line x1=\"120\" y1=\"250\" x2=\"200.9\" y2=\"76.5\" stroke=\"#d9772b\" stroke-width=\"1.8\"/>\n<circle cx=\"299.9\" cy=\"184.5\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"259.9\" y=\"206.5\" font-size=\"13\" fill=\"#2f6fb5\">P(r cos φ, r sin φ)<\/text>\n<circle cx=\"200.9\" cy=\"76.5\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"208.9\" y=\"72.5\" font-size=\"14\" fill=\"#d9772b\">P'<\/text>\n<path d=\"M178,250 A58,58 0 0 0 174.5,230.2\" fill=\"none\" stroke=\"#2f6fb5\" stroke-width=\"1.4\"/>\n<text x=\"180.9\" y=\"243\" font-size=\"14\" fill=\"#2f6fb5\" font-style=\"italic\">φ<\/text>\n<path d=\"M245.4,204.4 A133.4,133.4 0 0 0 176.4,129.1\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.4\" marker-end=\"url(#M9-f5-m1)\"/>\n<text x=\"225.7\" y=\"155\" font-size=\"14\" fill=\"#c2410c\" font-style=\"italic\">θ<\/text>\n<polyline points=\"311.3,256.7 311.4,254 311.4,251.3 311.4,248.6 311.4,245.9 311.3,243.2 311.2,240.5 311,237.8 310.8,235.1 310.6,232.4 310.3,229.7 310,227 309.7,224.4 309.3,221.7 308.9,219 308.4,216.4 307.9,213.7 307.4,211.1 306.8,208.4 306.2,205.8 305.6,203.2 304.9,200.5 304.2,197.9 303.4,195.3 302.6,192.8 301.8,190.2 301,187.6 300.1,185.1 299.1,182.6 298.2,180 297.1,177.5 296.1,175 295,172.6 293.9,170.1 292.8,167.7 291.6,165.2 290.4,162.8 289.1,160.4 287.9,158 286.5,155.7 285.2,153.3 283.8,151 282.4,148.7 281,146.4 279.5,144.2 278,141.9 276.4,139.7 274.9,137.5 273.3,135.3 271.6,133.2 270,131.1 268.3,129 266.5,126.9 264.8,124.8 263,122.8 261.2,120.8 259.4,118.8 257.5,116.9 255.6,114.9 253.7,113 251.8,111.2 249.8,109.3 247.8,107.5 245.8,105.7 243.7,104 241.6,102.2 239.5,100.5 237.4,98.8 235.3,97.2 233.1,95.6 230.9,94 228.7,92.5 226.5,90.9 224.2,89.5 221.9,88 219.6,86.6 217.3,85.2 215,83.8 212.6,82.5 210.3,81.2 207.9,80 205.5,78.7 203.1,77.6 200.6,76.4 198.2,75.3 195.7,74.2 193.2,73.1 190.7,72.1 188.2,71.2 185.6,70.2 183.1,69.3 180.5,68.4 178,67.6 175.4,66.8 172.8,66 170.2,65.3 167.6,64.6 165,64 162.4,63.3 159.7,62.8 157.1,62.2 154.4,61.7 151.8,61.3 149.1,60.8 146.4,60.4 143.7,60.1 141.1,59.8 138.4,59.5 135.7,59.2 133,59 130.3,58.9 127.6,58.8 124.9,58.7 122.2,58.6 119.5,58.6 116.8,58.6 114.1,58.7 111.4,58.8 108.7,58.9 106,59.1 103.3,59.3\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>\n<text x=\"154.8\" y=\"168.8\" font-size=\"14\" fill=\"#d9772b\" font-style=\"italic\">r<\/text>\n<\/svg><figcaption>圖 M9-5　P 繞原點逆時針旋轉 θ 到 P'，長度 r 不變、方向角由 φ 變為 φ + θ<\/figcaption><\/figure>\n<div class=\"formula\" data-t=\"旋轉矩陣\"><div class=\"mb\">R_\\theta=\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix}<\/div><p>以原點為中心逆時針旋轉 <span class=\"m\">\\theta<\/span>。第一行 <span class=\"m\">(\\cos\\theta,\\sin\\theta)<\/span> 是 <span class=\"m\">(1,0)<\/span> 的像，第二行 <span class=\"m\">(-\\sin\\theta,\\cos\\theta)<\/span> 是 <span class=\"m\">(0,1)<\/span> 的像。<\/p><\/div>\n<div class=\"mnem\"><p>旋轉：主對角兩個 cos，負號放在右上角（逆時針）<\/p><\/div>\n<p>另一推法：<span class=\"m\">(1,0)<\/span> 旋轉 <span class=\"m\">\\theta<\/span> 到 <span class=\"m\">(\\cos\\theta,\\sin\\theta)<\/span>，<span class=\"m\">(0,1)<\/span> 旋轉 <span class=\"m\">\\theta<\/span> 到 <span class=\"m\">(\\cos(90^\\circ+\\theta),\\sin(90^\\circ+\\theta))=(-\\sin\\theta,\\cos\\theta)<\/span>，依序填為兩行即得。<span class=\"hand\">兩個單位點的像最快<\/span><\/p>\n<table class=\"t\"><thead><tr><th>旋轉角<\/th><th>矩陣<\/th><th>旋轉角<\/th><th>矩陣<\/th><\/tr><\/thead><tbody>\n<tr><td><span class=\"m\">90^\\circ<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}0 &amp; -1\\\\ 1 &amp; 0\\end{bmatrix}<\/span><\/td><td><span class=\"m\">-90^\\circ<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}0 &amp; 1\\\\ -1 &amp; 0\\end{bmatrix}<\/span><\/td><\/tr>\n<tr><td><span class=\"m\">180^\\circ<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}-1 &amp; 0\\\\ 0 &amp; -1\\end{bmatrix}<\/span><\/td><td><span class=\"m\">60^\\circ<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}\\frac12 &amp; -\\frac{\\sqrt3}{2}\\\\ \\frac{\\sqrt3}{2} &amp; \\frac12\\end{bmatrix}<\/span><\/td><\/tr>\n<tr><td><span class=\"m\">45^\\circ<\/span><\/td><td><span class=\"m\">\\dfrac{\\sqrt2}{2}\\begin{bmatrix}1 &amp; -1\\\\ 1 &amp; 1\\end{bmatrix}<\/span><\/td><td><span class=\"m\">30^\\circ<\/span><\/td><td><span class=\"m\">\\begin{bmatrix}\\frac{\\sqrt3}{2} &amp; -\\frac12\\\\ \\frac12 &amp; \\frac{\\sqrt3}{2}\\end{bmatrix}<\/span><\/td><\/tr>\n<\/tbody><\/table>\n<h4>2. 旋轉的性質<\/h4>\n<div class=\"key\"><ol>\n<li><span class=\"m\">\\det R_\\theta=\\cos^2\\theta+\\sin^2\\theta=1<\/span>：面積不變、方向不變。<\/li>\n<li>長度、夾角都不變（保距變換）。<\/li>\n<li><span class=\"box\"><span class=\"m\">R_\\alpha R_\\beta=R_{\\alpha+\\beta}=R_\\beta R_\\alpha<\/span><\/span>：旋轉之間可交換。<\/li>\n<li><span class=\"m\">(R_\\theta)^n=R_{n\\theta}<\/span>；<span class=\"m\">R_\\theta^{-1}=R_{-\\theta}<\/span>。<\/li>\n<li><span class=\"m\">R_\\theta+R_{-\\theta}=2\\cos\\theta\\, I<\/span>。<\/li>\n<\/ol><\/div>\n<p>性質 3 由矩陣乘法與和角公式直接驗證：<\/p>\n<div class=\"mb\">R_\\alpha R_\\beta=\\begin{bmatrix}\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta &amp; -(\\cos\\alpha\\sin\\beta+\\sin\\alpha\\cos\\beta)\\\\ \\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta &amp; \\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta\\end{bmatrix}=R_{\\alpha+\\beta}<\/div>\n<h4>3. 形如 kR<sub>θ<\/sub> 的矩陣：旋轉伸縮<\/h4>\n<div class=\"formula\" data-t=\"旋轉伸縮\"><div class=\"mb\">\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}=r\\begin{bmatrix}\\cos\\theta &amp; -\\sin\\theta\\\\ \\sin\\theta &amp; \\cos\\theta\\end{bmatrix},\\quad r=\\sqrt{a^2+b^2},\\ \\cos\\theta=\\dfrac{a}{r},\\ \\sin\\theta=\\dfrac{b}{r}<\/div><p>先旋轉 <span class=\"m\">\\theta<\/span>、再以原點為中心伸縮 <span class=\"m\">r<\/span> 倍（兩者可交換）。行列式 <span class=\"m\">a^2+b^2=r^2<\/span>，面積變為 <span class=\"m\">r^2<\/span> 倍。<\/p><\/div>\n<p>辨認方式：<span class=\"ul\">主對角相等、反對角互為相反數<\/span>。例如 <span class=\"m\">\\begin{bmatrix}1 &amp; -\\sqrt3\\\\ \\sqrt3 &amp; 1\\end{bmatrix}=2R_{60^\\circ}<\/span>，其 <span class=\"m\">n<\/span> 次方為 <span class=\"m\">2^nR_{60^\\circ n}<\/span>。<\/p>\n<div class=\"exam\"><p>學測常見「求 <span class=\"m\">A^n<\/span>」：先把 <span class=\"m\">A<\/span> 寫成 <span class=\"m\">rR_\\theta<\/span>，再用 <span class=\"m\">A^n=r^nR_{n\\theta}<\/span>；角度化成 <span class=\"m\">0^\\circ<\/span> 至 <span class=\"m\">360^\\circ<\/span> 的同界角。<em>未先提出 <span class=\"m\">r<\/span> 就直接當作旋轉矩陣<\/em>是常見失分。<\/p><\/div>\n<h4>4. 旋轉中心不在原點<\/h4>\n<p>繞點 <span class=\"m\">C<\/span> 旋轉 <span class=\"m\">\\theta<\/span>：<span class=\"m\">P'=C+R_\\theta(P-C)<\/span>。先把 <span class=\"m\">C<\/span> 移到原點、旋轉、再移回。此變換一般<em>不是線性變換<\/em>（<span class=\"m\">C\\ne O<\/span> 時原點會移動）。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 260\" width=\"400\"><defs><marker id=\"M9-f16-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f16-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs>\n<line x1=\"60\" y1=\"220\" x2=\"60\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"100\" y1=\"220\" x2=\"100\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"140\" y1=\"220\" x2=\"140\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"180\" y1=\"220\" x2=\"180\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"220\" y1=\"220\" x2=\"220\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"260\" y1=\"220\" x2=\"260\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"300\" y1=\"220\" x2=\"300\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"340\" y1=\"220\" x2=\"340\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"220\" x2=\"340\" y2=\"220\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"180\" x2=\"340\" y2=\"180\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"140\" x2=\"340\" y2=\"140\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"100\" x2=\"340\" y2=\"100\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"60\" x2=\"340\" y2=\"60\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"20\" x2=\"340\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"220\" x2=\"360\" y2=\"220\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f16-m0)\"/>\n<line x1=\"60\" y1=\"240\" x2=\"60\" y2=\"20\" stroke=\"#1f2a44\" stroke-width=\"1.3\" marker-end=\"url(#M9-f16-m0)\"/>\n<text x=\"356\" y=\"238\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">x<\/text>\n<text x=\"68\" y=\"28\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">y<\/text>\n<text x=\"46\" y=\"236\" font-size=\"14\" fill=\"#1f2a44\" font-style=\"italic\">O<\/text>\n<line x1=\"140\" y1=\"180\" x2=\"300\" y2=\"140\" stroke=\"#2f6fb5\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<line x1=\"140\" y1=\"180\" x2=\"100\" y2=\"20\" stroke=\"#d9772b\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"140\" cy=\"180\" r=\"3.2\" fill=\"#c2410c\"/>\n<text x=\"130\" y=\"198\" font-size=\"14\" fill=\"#c2410c\">C(2,1)<\/text>\n<circle cx=\"300\" cy=\"140\" r=\"3.2\" fill=\"#2f6fb5\"/>\n<text x=\"306\" y=\"134\" font-size=\"14\" fill=\"#2f6fb5\">P(6,2)<\/text>\n<circle cx=\"100\" cy=\"20\" r=\"3.2\" fill=\"#d9772b\"/>\n<text x=\"108\" y=\"20\" font-size=\"14\" fill=\"#d9772b\">P'(1,5)<\/text>\n<polyline points=\"155.5,176.1 151.6,160.6 136.1,164.5\" fill=\"none\" stroke=\"#1f2a44\" stroke-width=\"1.1\"/>\n<path d=\"M186.6,168.4 A48,48 0 0 0 128.4,133.4\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.4\" marker-end=\"url(#M9-f16-m1)\"/>\n<\/svg><figcaption>圖 M9-6　P(6,2) 繞 C(2,1) 逆時針旋轉 90° 到 P'(1,5)：<span class=\"m\">\\overrightarrow{CP}=(4,1)\\mapsto(-1,4)<\/span><\/figcaption><\/figure>\n<div class=\"tip\"><p>深究　旋轉矩陣與複數乘法（數學甲銜接）<\/p><p>複數 <span class=\"m\">z=x+yi<\/span> 乘上 <span class=\"m\">w=a+bi<\/span> 得 <span class=\"m\">(ax-by)+(bx+ay)i<\/span>，以坐標寫為<\/p><div class=\"mb\">\\begin{bmatrix}x'\\\\ y'\\end{bmatrix}=\\begin{bmatrix}a &amp; -b\\\\ b &amp; a\\end{bmatrix}\\begin{bmatrix}x\\\\ y\\end{bmatrix}<\/div><p>故「乘上 <span class=\"m\">w=r(\\cos\\theta+i\\sin\\theta)<\/span>」就是旋轉 <span class=\"m\">\\theta<\/span> 再伸縮 <span class=\"m\">r<\/span> 倍，<span class=\"m\">R_\\alpha R_\\beta=R_{\\alpha+\\beta}<\/span> 對應複數極式的乘法規則與棣美弗定理。1833 年哈密頓（W. R. Hamilton）以實數序對表示複數，即此觀點。<\/p><\/div>","sims":[["lt",{"presets":["rot","id"],"preset":"rot","title":"旋轉矩陣"}]],"qs":["M9-10","M9-03","M9-02"]},{"t":"四、推移與投影","h":"<h4>1. 推移<\/h4>\n<p><strong>推移<\/strong>（shear；另有譯名「錯切」「剪切」，本書依臺灣高中教科書用「推移」）：每一點沿某一固定方向移動，移動量與該點到一條過原點定直線的有向距離成正比，定直線上的點不動。<\/p>\n<div class=\"formula\" data-t=\"推移\"><div class=\"mb\">\\text{沿 }x\\text{ 軸方向：}\\begin{bmatrix}1 &amp; k\\\\ 0 &amp; 1\\end{bmatrix}:(x,y)\\mapsto(x+ky,\\ y)\\qquad \\text{沿 }y\\text{ 軸方向：}\\begin{bmatrix}1 &amp; 0\\\\ k &amp; 1\\end{bmatrix}:(x,y)\\mapsto(x,\\ kx+y)<\/div><p>沿 <span class=\"m\">x<\/span> 軸方向的推移：每一點水平移動 <span class=\"m\">ky<\/span>，移動量與該點到 <span class=\"m\">x<\/span> 軸的有向距離成正比；<span class=\"m\">x<\/span> 軸上的點不動。<\/p><\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 460 210\" width=\"460\"><defs><marker id=\"M9-f6-m0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f2a44\"/><\/marker><marker id=\"M9-f6-m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c2410c\"/><\/marker><\/defs>\n<line x1=\"40\" y1=\"180\" x2=\"40\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<l
