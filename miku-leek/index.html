<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>甩蔥歌 / Leek Spin</title>
<style>
  :root{
    --bg:#071220; --panel:#0e2333; --ink:#e8fbf8; --dim:#7fb3b8;
    --teal:#48e2d4; --line:#1d4152;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:32px 20px;
    background:radial-gradient(120% 90% at 50% 0%,#123446 0%,var(--bg) 70%);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,"PingFang TC","Noto Sans TC",sans-serif;
  }
  h1{
    margin:0; font-size:clamp(28px,6vw,46px); letter-spacing:.16em;
    text-shadow:0 3px 0 var(--line);
  }
  h1 small{
    display:block; margin-top:8px; font-size:13px; letter-spacing:.42em;
    color:var(--teal); font-weight:600;
  }
  figure{margin:0; width:min(960px,100%)}
  video{
    width:100%; display:block; border-radius:14px; background:#000;
    border:2px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  figcaption{
    margin-top:12px; font-size:13px; line-height:1.7; color:var(--dim);
    text-align:center;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  a.btn{
    text-decoration:none; color:var(--ink); font-size:13px; letter-spacing:.08em;
    padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); transition:border-color .15s, transform .15s;
  }
  a.btn:hover{border-color:var(--teal); transform:translateY(-1px)}
  code{color:var(--teal); font-size:12px}
</style>
</head>
<body>
  <h1>甩蔥歌<small>LEEK SPIN</small></h1>

  <figure>
    <video src="miku-leek.mp4" controls loop autoplay muted playsinline
           poster="" aria-label="甩蔥動畫影片"></video>
    <figcaption>
      19.2 秒無縫循環 · 1280×720 · 30 fps · 內建 chiptune 波爾卡配樂<br>
      影格與音樂全部由 <code>render.py</code> 逐格算圖產生，沒有用任何現成素材。
    </figcaption>
  </figure>

  <div class="row">
    <a class="btn" href="miku-leek.mp4" download>下載 MP4</a>
    <a class="btn" href="miku-leek.gif" download>下載 GIF</a>
    <a class="btn" href="render.py">看產生器原始碼</a>
  </div>
</body>
</html>
